{n:"karaṇa-śaktiḥ svato 'nubhavāt",r:"ŚS 3.37",sk:"करणशक्तिः स्वतोऽनुभवात्",d:"The Power of Creation is Known from One's Own Experience — The power of creation (or doing) is (known) from one's own direct experience.",det:{skt:"करणशक्तिः स्वतोऽनुभवात्",tr:"The power of creation (or doing) is (known) from one's own direct experience.",c:"Kṣemarāja explains that this sūtra addresses an important epistemological question. How does the practitioner know that they have the capacity for cosmic creation described in 3.36? The answer: through their own direct experience. This is not a doctrine to be accepted on authority; it is a capacity that becomes evident in one's own experience as the path progresses.",ksm:"Kṣemarāja explains that this sūtra addresses an important epistemological question. How does the practitioner know that they have the capacity for cosmic creation described in 3.36? The answer: through their own direct experience. This is not a doctrine to be accepted on authority; it is a capacity that becomes evident in one's own experience as the path progresses. He emphasizes that this is consistent with the broader Kashmir Śaiva approach to knowledge. The supreme realizations of the path are not matters of doctrinal assent but of direct experiential recognition. The practitioner does not believe themselves to have certain capacities; they experience these capacities operating.",lkj:"Lakshmanjoo taught the importance of direct experience throughout his teaching career. He often urged students not to accept his teachings on his authority but to verify them in their own experience. He emphasized that this verification is not blind acceptance of whatever one experiences. It is the careful, sustained testing of teaching against experience, with the recognition that some experiences are genuine indicators and others are confused. Lakshmanjoo also noted that the discipline of testing teaching against experience is one of the most important practices on the path.",jds:"Singh provides important commentary on the epistemological significance of this sūtra. He notes that it places the Kashmir Śaiva path squarely on experiential foundations. Singh emphasizes that this is one of the distinctive features of Kashmir Śaivism among Indian non-dual traditions. Where some traditions place greater emphasis on scriptural authority or argumentative demonstration, Kashmir Śaivism emphasizes direct experiential recognition.",asu:"Adi Suyash treats this sūtra as providing essential epistemological grounding. The remarkable capacities described in the previous sūtras are not articles of faith; they are matters of direct experience. He emphasizes that this teaching gives the practitioner confidence to continue."}}
]},
{name:"Three Steps & Final Liberation",ref:"ŚS 3.38–3.45",color:C.rose,children:[
{n:"tri-padādy-anuprāṇanam",r:"ŚS 3.38",sk:"त्रिपदाद्यनुप्राणनम्",d:"There is Quickening Through the Three Steps — There is the quickening (animation) through the three steps (and what follows).",det:{skt:"त्रिपदाद्यनुप्राणनम्",tr:"There is the quickening (animation) through the three steps (and what follows).",c:"Kṣemarāja explains that this technically dense sūtra refers to the practice of maintaining the supreme awareness through 'three steps' or 'three stages.' The three traditionally refer to the three states of consciousness (waking, dreaming, deep sleep), and the practice involves sustaining the recognition of supreme awareness across all three.",ksm:"Kṣemarāja explains that this technically dense sūtra refers to the practice of maintaining the supreme awareness through 'three steps' or 'three stages.' The three traditionally refer to the three states of consciousness (waking, dreaming, deep sleep), and the practice involves sustaining the recognition of supreme awareness across all three. He emphasizes that this is the practical complement to 3.20 (pouring the Fourth into the three like oil). Where 3.20 named the principle, this sūtra describes the ongoing practice of maintaining the infusion across all states. Kṣemarāja further notes that the term anuprāṇana (quickening, animating) is precise.",lkj:"Lakshmanjoo taught this practice with great precision. He emphasized that the 'three steps' refer to specific stages of consciousness that the practitioner must learn to traverse with awareness intact. He often described the work as similar to learning to maintain attention across transitions in ordinary life. Just as one can learn to maintain attention across the transition between activities, one can learn to maintain awareness across the transitions between waking, dreaming, and deep sleep.",jds:"Singh provides important commentary on this technically difficult sūtra. He notes that the precise referent of 'the three' has been the subject of some scholarly debate, but the most accepted interpretation refers to the three states of consciousness. Singh emphasizes that this sūtra fits into the broader sequence of the chapter that addresses the integration of supreme awareness with the full range of ordinary experience.",asu:"Adi Suyash treats this sūtra as describing one of the most demanding practical accomplishments of the path. The supreme awareness, once recognized, must be continuously animated across all states of consciousness. He emphasizes that this work is gradual and cumulative. Progress in maintaining awareness across the states is one of the most reliable indicators of overall progress on the path."}},
{n:"citta-sthiti-vac-charīra-karaṇa-bāhyeṣu",r:"ŚS 3.39",sk:"चित्तस्थितिवच्छरीरकरणबाह्येषु",d:"Even in the External, the Inner Condition is Maintained — Just as (awareness exists) in the (inner) state of mind, so (it exists) in the body, the senses, and external objects.",det:{skt:"चित्तस्थितिवच्छरीरकरणबाह्येषु",tr:"Just as (awareness exists) in the (inner) state of mind, so (it exists) in the body, the senses, and external objects.",c:"Kṣemarāja explains that this sūtra extends the principle of awareness-continuity from the previous sūtra into a different dimension. Just as awareness is maintained across the three states (3.38), so it is to be maintained across the various levels of manifestation: the inner mind, the body, the senses, and the external objects of perception.",ksm:"Kṣemarāja explains that this sūtra extends the principle of awareness-continuity from the previous sūtra into a different dimension. Just as awareness is maintained across the three states (3.38), so it is to be maintained across the various levels of manifestation: the inner mind, the body, the senses, and the external objects of perception. He emphasizes that this is a comprehensive integration. The advanced practitioner does not maintain awareness only in inner contemplation while losing it in bodily activity or outer engagement. They maintain it across all levels of manifestation.",lkj:"Lakshmanjoo taught this integration with great practical emphasis. He observed that many practitioners maintain awareness during formal meditation but lose it the moment they engage the body or the external world. The sūtra calls for a more comprehensive integration. He often described the work of extending awareness systematically: from mind to body, from body to senses, from senses to external objects. With patient practice, the practitioner discovers that the same awareness operates at all these levels.",jds:"Singh provides important commentary on the comprehensive scope of this sūtra. He notes that the Sanskrit explicitly names four levels of manifestation: mind, body, senses, and external objects. The teaching is that awareness is to be maintained across all four. Singh emphasizes that this teaching is one of the most important practical instructions in the chapter. It directs the practitioner to a comprehensive integration rather than to a limited inner attainment.",asu:"Adi Suyash treats this sūtra as describing one of the most beautiful integrations of the path. The same awareness operates everywhere; the work is to recognize this everywhere. He emphasizes that this integration is the practical fulfillment of the non-dual teaching. Non-dualism is not a doctrine to be assented to but a recognition to be lived across all dimensions of experience."}},
{n:"abhilāṣād bahir-gatiḥ saṃvāhyasya",r:"ŚS 3.40",sk:"अभिलाषाद्बहिर्गतिः संवाह्यस्य",d:"Through Verbal Designation, the Outward Movement Continues — Through (compulsive) desire, the outward movement of the one to be borne (along) (continues).",det:{skt:"अभिलाषाद्बहिर्गतिः संवाह्यस्य",tr:"Through (compulsive) desire, the outward movement of the one to be borne (along) (continues).",c:"Kṣemarāja explains that this sūtra identifies the specific mechanism by which the unfreed practitioner continues to be 'borne along' in saṃsāra. The mechanism is abhilāṣa — compulsive desire, craving. So long as this craving operates, the practitioner is carried outward toward objects rather than resting in their own essential nature. He emphasizes that this teaching is diagnostic.",ksm:"Kṣemarāja explains that this sūtra identifies the specific mechanism by which the unfreed practitioner continues to be 'borne along' in saṃsāra. The mechanism is abhilāṣa — compulsive desire, craving. So long as this craving operates, the practitioner is carried outward toward objects rather than resting in their own essential nature. He emphasizes that this teaching is diagnostic. The practitioner who notices themselves being carried outward toward objects can identify the underlying cause: a particular craving is operative. By recognizing the craving, the practitioner can begin to address it.",lkj:"Lakshmanjoo taught the analysis of craving with great practical wisdom. He observed that practitioners often try to suppress their cravings or to fight against them, with limited success. The Kashmir Śaiva approach is different: examine craving, understand its structure, recognize that it operates from a false assumption. He often described the cravings as 'arrows pointing outward.' Each craving points to an object outside oneself that is supposed to provide what one lacks. The recognition that one lacks nothing — that one is already the supreme — gradually neutralizes the cravings.",jds:"Singh provides extensive commentary on this sūtra as part of the chapter's diagnostic apparatus. He notes that the sūtra identifies a specific mechanism (craving) and links it to a specific consequence (continued outward movement in saṃsāra). Singh emphasizes that this teaching is consistent with broader Indian analyses of bondage but is distinctively Kashmir Śaiva in its non-dual framing.",asu:"Adi Suyash treats this sūtra as one of the most psychologically acute in the chapter. It identifies, with precision, the specific mechanism by which ordinary human life continues to be a cycle of seeking outside oneself for what is already within. He emphasizes that this teaching is useful even for practitioners at early stages."}},
{n:"tad-ārūḍha-pramites tat-kṣayāj jīva-saṃkṣayaḥ",r:"ŚS 3.41",sk:"तदारूढप्रमितेस्तत्क्षयाज्जीवसंक्षयः",d:"When This Is Removed, There is Complete Destruction of the Limited Self — For one established in the supreme awareness, through the destruction of that (craving), there is the destruction of the limited self.",det:{skt:"तदारूढप्रमितेस्तत्क्षयाज्जीवसंक्षयः",tr:"For one established in the supreme awareness, through the destruction of that (craving), there is the destruction of the limited self.",c:"Kṣemarāja explains that this sūtra completes the diagnostic-prescriptive pair begun in 3.40. Where 3.40 identified craving as the mechanism by which bondage continues, 3.41 names the consequence of the destruction of that craving: the dissolution of the limited self.",ksm:"Kṣemarāja explains that this sūtra completes the diagnostic-prescriptive pair begun in 3.40. Where 3.40 identified craving as the mechanism by which bondage continues, 3.41 names the consequence of the destruction of that craving: the dissolution of the limited self. He emphasizes the specific condition: this destruction occurs 'for one established in the supreme awareness.' The destruction of craving by itself, without the corresponding supreme recognition, does not produce the dissolution of the limited self. Both are needed: the recognition and the destruction of craving that issues from it. Kṣemarāja further notes that the term saṃkṣaya (complete destruction) is precise.",lkj:"Lakshmanjoo spoke with great care about this sūtra. He observed that it describes the supreme attainment — the complete dissolution of the limited self — and that this attainment has been reached by realized practitioners throughout the centuries. He often emphasized the specific condition the sūtra names: this dissolution occurs only for one established in the supreme awareness. The destruction of craving alone, without supreme recognition, does not produce liberation; it produces only ascetic emptying. Lakshmanjoo also stressed that this attainment is not exotic or remote.",jds:"Singh provides extensive commentary on this climactic sūtra. He emphasizes that it states clearly what the chapter has been pointing toward: the complete dissolution of the limited self for the practitioner who is fully established in supreme recognition. Singh notes that the language of 'destruction of the limited self' has parallels in other Indian non-dual traditions but is distinctively Kashmir Śaiva in its emphasis on the survival of the supreme Self after this destruction.",asu:"Adi Suyash treats this sūtra as one of the climactic statements of the chapter. The supreme attainment is named clearly: complete dissolution of the limited self for the practitioner established in supreme recognition. He emphasizes that this attainment is what makes all the preparatory work worthwhile. The path is long and demanding, but its fruit is real and complete."}},
{n:"bhūta-kañcukī tadā vimukto bhūyaḥ pati-samaḥ paraḥ",r:"ŚS 3.42",sk:"भूतकञ्चुकी तदा विमुक्तो भूयः पतिसमः परः",d:"Then, the Sheath of Elements Is Cast Off and One Becomes Supreme Like the Lord — Then, (having been) clothed by the elemental sheath, (now) liberated, (one becomes) once again supreme, equal to the Lord (Śiva).",det:{skt:"भूतकञ्चुकी तदा विमुक्तो भूयः पतिसमः परः",tr:"Then, (having been) clothed by the elemental sheath, (now) liberated, (one becomes) once again supreme, equal to the Lord (Śiva).",c:"Kṣemarāja explains that this sūtra describes the practitioner's transformation through the path. They began as one 'clothed by the elemental sheath' — wrapped in the body and the elements that constitute embodied existence. Through the practices of the chapter, they have become liberated. Now, after liberation, they are 'once again' supreme, equal to the Lord.",ksm:"Kṣemarāja explains that this sūtra describes the practitioner's transformation through the path. They began as one 'clothed by the elemental sheath' — wrapped in the body and the elements that constitute embodied existence. Through the practices of the chapter, they have become liberated. Now, after liberation, they are 'once again' supreme, equal to the Lord. He emphasizes the 'once again' (bhūyaḥ). The practitioner has not become something they were not; they have recovered what they always were. The elemental sheath obscured their true nature; the practices have removed the obscuration; the original supremacy is again recognized.",lkj:"Lakshmanjoo spoke of this sūtra with great reverence. He emphasized that the transformation it describes is the goal of the entire path. The practitioner who began as one bound by the elements becomes, through faithful practice, equal to Śiva himself. He often noted that the term 'once again' is significant. This is not a transformation into something foreign but a recovery of one's original nature. The practitioner does not become Śiva; they recognize that they have always been Śiva. Lakshmanjoo also stressed that this attainment is recognizable and unmistakable.",jds:"Singh provides extensive commentary on this climactic sūtra. He emphasizes that it states with great clarity the supreme attainment of the path: the practitioner becomes equal to Śiva. Singh notes that this teaching is one of the most distinctive features of the Kashmir Śaiva tradition.",asu:"Adi Suyash treats this sūtra as the climactic statement of the practitioner's transformation. The journey is named: from elemental sheath to liberated supremacy. He emphasizes the realistic note: this transformation is presented as actually accomplished by faithful practitioners, not as a distant ideal. The text invites the reader to enter the lineage of those who have made this transformation."}},
{n:"naisargikaḥ prāṇa-sambandhaḥ",r:"ŚS 3.43",sk:"नैसर्गिकः प्राणसम्बन्धः",d:"The Connection with Prāṇa is Natural — The connection with prāṇa (the vital breath) is natural (inherent).",det:{skt:"नैसर्गिकः प्राणसम्बन्धः",tr:"The connection with prāṇa (the vital breath) is natural (inherent).",c:"Kṣemarāja explains that this sūtra returns to the theme of prāṇa (introduced in 3.22) and emphasizes that the connection between the practitioner and prāṇa is natural — not artificial, not a special yogic attainment, but inherent in embodied existence itself. He emphasizes the practical implication. Because the connection with prāṇa is natural, the practitioner can always access it.",ksm:"Kṣemarāja explains that this sūtra returns to the theme of prāṇa (introduced in 3.22) and emphasizes that the connection between the practitioner and prāṇa is natural — not artificial, not a special yogic attainment, but inherent in embodied existence itself. He emphasizes the practical implication. Because the connection with prāṇa is natural, the practitioner can always access it. They do not need special conditions or elaborate preparations; the connection is always available because it is constitutive of being embodied. Kṣemarāja further notes that this teaching introduces the final sequence of the chapter (3.43–3.45), which addresses the role of prāṇa in the final stages of the path.",lkj:"Lakshmanjoo taught the importance of prāṇa-practice throughout his teaching career. He emphasized that this sūtra establishes the foundational principle: every practitioner already has the connection with prāṇa that makes prāṇa-practice possible. He often described prāṇa-practice as 'finding what you already have.' The breath is already present; the prāṇa flowing through the breath is already present; the consciousness that experiences both is already present. The practice is the conscious recognition and development of what is already operative.",jds:"Singh provides scholarly commentary on this sūtra. He notes that it functions as a kind of preamble to the final sequence of the chapter, which addresses prāṇa in the final stages of the path. Singh emphasizes that the term naisargika (natural, inherent) is precise. The connection with prāṇa is not an attainment but a given; the practitioner's work is to recognize and engage this given, not to produce it.",asu:"Adi Suyash treats this sūtra as introducing the final practical sequence of the chapter. The connection with prāṇa is named as natural, establishing the foundation for the practices that follow. He emphasizes that this teaching is profoundly accessible. Every practitioner, regardless of their circumstances or attainments, can begin to work with what this sūtra describes."}},
{n:"nāsikāntar-madhya-saṃyamāt kim atra savya-apasavya-sauṣumneṣu",r:"ŚS 3.44",sk:"नासिकान्तर्मध्यसंयमात् किमत्र सव्यापसव्यसौषुम्नेषु",d:"What Else Remains in the Left, Right, and Central Channels? — From restraint within the middle of the nostril, what (more) remains here in the left, right, and central (suṣumnā) channels?",det:{skt:"नासिकान्तर्मध्यसंयमात् किमत्र सव्यापसव्यसौषुम्नेषु",tr:"From restraint within the middle of the nostril, what (more) remains here in the left, right, and central (suṣumnā) channels?",c:"Kṣemarāja explains that this technically complex sūtra describes a specific advanced practice involving the breath and the principal channels. The practitioner concentrates attention at a particular point within the nostril, which has the effect of unifying the breath-energies that ordinarily flow through the left channel (iḍā), the right channel (piṅgalā), and the central channel (suṣumnā).",ksm:"Kṣemarāja explains that this technically complex sūtra describes a specific advanced practice involving the breath and the principal channels. The practitioner concentrates attention at a particular point within the nostril, which has the effect of unifying the breath-energies that ordinarily flow through the left channel (iḍā), the right channel (piṅgalā), and the central channel (suṣumnā). He emphasizes that the sūtra's rhetorical question ('what more remains?') indicates that this single concentrated practice accomplishes what might otherwise require many separate practices addressing each of the channels individually. The unified attention does the work of unification.",lkj:"Lakshmanjoo taught the technical specifics of this practice to qualified students. He emphasized that the practice requires careful transmission; it cannot be learned adequately from text alone. He often described the general principle: the practitioner brings attention to a specific point within the nostril, which causes the breath-currents to unify around this point. With sustained practice, the unification of currents leads to unification of consciousness. Lakshmanjoo also warned against attempting elaborate breath-practices without proper guidance.",jds:"Singh provides extensive philological and historical commentary on this technically complex sūtra. He traces the doctrine of the three channels through earlier yogic literature and notes the specific Kashmir Śaiva formulation. Singh emphasizes that this is one of the most technically advanced sūtras in the text. Without engagement with the broader yogic tradition and qualified teaching, its full meaning may be inaccessible.",asu:"Adi Suyash treats this sūtra as part of the technically demanding final sequence of the chapter. He acknowledges that the specific practice it describes requires qualified transmission. He emphasizes, however, that the underlying principle — the integration of multiple practices through a single concentrated point of attention — is accessible even to practitioners who do not pursue the specific te…"}},
{n:"bhūyaḥ syāt pratimīlanam",r:"ŚS 3.45",sk:"भूयः स्यात्प्रतिमीलनम्",d:"Again, Closing the Eyes Should Occur — Again, the closing (and opening) (of the eyes — i.e., the alternation of inner and outer awareness) should occur.",det:{skt:"भूयः स्यात्प्रतिमीलनम्",tr:"Again, the closing (and opening) (of the eyes — i.e., the alternation of inner and outer awareness) should occur.",c:"Kṣemarāja explains that this concluding sūtra of the entire text describes the rhythm of the realized practitioner's life. The 'closing and opening' (pratimīlana) refers metaphorically to the alternation between two modes: turning inward to recognize the supreme awareness within, and turning outward to recognize the same supreme awareness in the world.",ksm:"Kṣemarāja explains that this concluding sūtra of the entire text describes the rhythm of the realized practitioner's life. The 'closing and opening' (pratimīlana) refers metaphorically to the alternation between two modes: turning inward to recognize the supreme awareness within, and turning outward to recognize the same supreme awareness in the world. He emphasizes that this alternation is the natural rhythm of the established realization. The practitioner does not finally settle into either inner contemplation or outer engagement; they continuously alternate between the two, finding the same supreme awareness in both.",lkj:"Lakshmanjoo spoke of this concluding sūtra with great feeling. He observed that it captures, in remarkably few words, the entire character of the realized life: an ongoing rhythm of inner and outer, continuously recognized, perpetually renewed. He often described this rhythm in his own experience and in the experience of his students. The realized practitioner does not retire from the world to a permanent inner contemplation; nor do they exhaust themselves in outer activity. They alternate between the two, finding the supreme in both.",jds:"Singh provides extensive commentary on this concluding sūtra. He emphasizes that the text's conclusion is significant: not with a triumphant declaration of attainment but with a gentle description of the ongoing rhythm of realized life. Singh notes that this conclusion is characteristic of the text's overall tone: realistic, practical, oriented to the actual living of the path rather than to abstract declaration of doctrine.",asu:"Adi Suyash treats this concluding sūtra as a perfect ending for the text. After 76 sūtras of varying detail and complexity, the text closes with a simple, beautiful image of the realized life as a continuous alternation between inner and outer recognition. He emphasizes that this conclusion is meant to be lived rather than merely understood."}}
]}
