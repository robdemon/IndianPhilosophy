{n:"moha-jayād anantābhogāt sahaja-vidyā-jayaḥ",r:"ŚS 3.7",sk:"मोहजयादनन्ताभोगात्सहजविद्याजयः",d:"Innate Wisdom Arises From the Conquest of Delusion — From the conquest of delusion, through (the access to) the infinite expanse, arises the triumph of innate wisdom.",det:{skt:"मोहजयादनन्ताभोगात्सहजविद्याजयः",tr:"From the conquest of delusion, through (the access to) the infinite expanse, arises the triumph of innate wisdom.",c:"Kṣemarāja explains this sūtra as the direct correction of any misreading of 3.6. Where 3.6 spoke of siddhis arising from the mere covering of delusion, this sūtra speaks of innate wisdom arising from the actual conquest of delusion. The two are distinct attainments: the first is preliminary and provisional, the second is genuine and stable. He emphasizes the term sahaja — innate, co-born.",ksm:"Kṣemarāja explains this sūtra as the direct correction of any misreading of 3.6. Where 3.6 spoke of siddhis arising from the mere covering of delusion, this sūtra speaks of innate wisdom arising from the actual conquest of delusion. The two are distinct attainments: the first is preliminary and provisional, the second is genuine and stable. He emphasizes the term sahaja — innate, co-born. The wisdom in question is not acquired from outside; it is the practitioner's own innate nature, finally recognized once the delusion that obscured it is conquered. The 'triumph' (jaya) is therefore not the conquest of something external but the unveiling of what was always present.",lkj:"Lakshmanjoo described moha-jaya as the moment when delusion is not merely held down but is actually dissolved. The practitioner who has attained this can no longer be deluded in the way they once could; the structure of delusion has been undone, not just temporarily covered. He emphasized that this attainment opens onto the experience of infinite expanse (anantābhoga). The practitioner discovers that consciousness is not a small flame within them but a vast ocean in which they have always been participating.",jds:"Singh provides extensive technical commentary on this sūtra. He emphasizes that it stands in deliberate contrast to 3.6, with the term jaya (conquest) doing the same work in both sūtras but with quite different qualifiers. In 3.6, what was 'conquered' was delusion in the limited sense of suppression; in 3.7, what is conquered is delusion in the full sense of dissolution. Singh notes that anantābhoga (infinite expanse) is one of the most evocative terms in the text.",asu:"Adi Suyash treats this sūtra as one of the most encouraging in the text. After the cautions and warnings, the text affirms clearly: yes, there is a real attainment available, and it is the recognition of one's own innate wisdom. This is what all the practice is for. He emphasizes that sahaja-vidyā is not exotic."}}
]},
{name:"The Three States Re-examined",ref:"ŚS 3.8–3.11",color:C.blue,children:[
{n:"jāgrad dvitīya-karaḥ",r:"ŚS 3.8",sk:"जाग्रद्द्वितीयकरः",d:"The Waking State is the Second Light — The waking state is the second illuminator (the second light after the supreme awareness).",det:{skt:"जाग्रद्द्वितीयकरः",tr:"The waking state is the second illuminator (the second light after the supreme awareness).",c:"Kṣemarāja explains that this brief sūtra has a profound implication. For the ordinary person, the waking state is the primary mode of experience — what they take to be 'real' as opposed to dream and deep sleep.",ksm:"Kṣemarāja explains that this brief sūtra has a profound implication. For the ordinary person, the waking state is the primary mode of experience — what they take to be 'real' as opposed to dream and deep sleep. For the practitioner who has attained sahaja-vidyā (3.7), the relationship is inverted: the supreme awareness is now the primary light, and the waking state is merely the 'second light' — illuminated by and dependent upon the supreme awareness. He emphasizes that this transformation does not abolish waking experience but radically reorients its meaning.",lkj:"Lakshmanjoo described the experience this sūtra points to as the recognition that waking life itself becomes secondary once the supreme awareness has been recognized. The ordinary person treats their waking experience as primary reality and consciousness as a faculty within it. The awakened person treats consciousness as primary reality and waking experience as a particular manifestation within it. He often used the analogy of a film projected on a screen. The ordinary viewer is absorbed in the film and forgets the screen.",jds:"Singh provides important philological discussion of the term dvitīya-karaḥ. The compound is open to several readings. He notes that the most common interpretation, supported by Kṣemarāja, takes karaḥ in the sense of 'ray' or 'light' (extended from its basic sense of 'doer, maker'). The waking state is then the 'second ray' or 'second light' of the supreme awareness.",asu:"Adi Suyash treats this sūtra as opening a new movement in the chapter. The first seven sūtras have brought the practitioner to the recognition of sahaja-vidyā; the chapter now begins to describe how this recognition transforms the practitioner's relationship to the various states of experience. He emphasizes that this is not abstract philosophy but lived phenomenology."}},
{n:"nartaka ātmā",r:"ŚS 3.9",sk:"नर्तक आत्मा",d:"The Self is the Dancer — The Self is the dancer.",det:{skt:"नर्तक आत्मा",tr:"The Self is the dancer.",c:"Kṣemarāja gives this sūtra one of the most beloved interpretations in the commentarial tradition. The Self, recognized in its supreme nature, is the dancer who takes on all the various roles of embodied experience. The body, the mind, the personality, the life-history — all are roles that the supreme Self plays for its own delight.",ksm:"Kṣemarāja gives this sūtra one of the most beloved interpretations in the commentarial tradition. The Self, recognized in its supreme nature, is the dancer who takes on all the various roles of embodied experience. The body, the mind, the personality, the life-history — all are roles that the supreme Self plays for its own delight. The various states (waking, dreaming, deep sleep), the various emotions, the various circumstances — all are choreographic movements within a single divine dance. He emphasizes that this is the natural perspective of the awakened practitioner.",lkj:"Lakshmanjoo loved this sūtra and returned to it often in his teachings. He emphasized that the dancer image captures something that more static images of awakening miss: the dynamic, playful, performative quality of the awakened life. The awakened person is not merely a witness; they are a participant, an actor, a dancer in the great dance of consciousness. He often described the awakened life as 'play' (līlā) — engagement with the world as a free creative act rather than as a compulsion.",jds:"Singh provides scholarly context for the dancer image in Indian thought. The image has deep roots in Śaiva theology, with Śiva worshipped as Naṭarāja from at least the early medieval period. The Kashmir Śaiva tradition takes up this image and gives it philosophical depth: the dancer is not merely a cosmic deity but the very nature of the awakened Self. Singh notes that this sūtra also has implications for the practitioner's understanding of their own life-circumstances.",asu:"Adi Suyash treats this sūtra as one of the most beautiful in the entire text. It captures, in just two Sanskrit words, the active, joyful, performative character of the awakened life. The Self is the dancer — and this single recognition transforms everything. He emphasizes that this is not a doctrine to be assented to but an experience to be entered into."}},
{n:"raṅgo 'ntarātmā",r:"ŚS 3.10",sk:"रङ्गोऽन्तरात्मा",d:"The Stage is the Inner Self — The stage (on which the dance is performed) is the inner self.",det:{skt:"रङ्गोऽन्तरात्मा",tr:"The stage (on which the dance is performed) is the inner self.",c:"Kṣemarāja extends the dancer-metaphor of 3.9. If the Self is the dancer, what is the stage on which the dance is performed? The answer: the inner self — the inner field of subjectivity that serves as the arena for all experience. The supreme Self dances on the stage of the inner self, taking on the various roles of embodied life. He emphasizes that this is a precise phenomenological observation.",ksm:"Kṣemarāja extends the dancer-metaphor of 3.9. If the Self is the dancer, what is the stage on which the dance is performed? The answer: the inner self — the inner field of subjectivity that serves as the arena for all experience. The supreme Self dances on the stage of the inner self, taking on the various roles of embodied life. He emphasizes that this is a precise phenomenological observation. When the practitioner attends to their own experience, they find that all experience occurs within a kind of inner space — the space of their own awareness. This inner space is the 'stage' on which the supreme Self performs the dance of life.",lkj:"Lakshmanjoo described the inner self as the spaciousness within which all inner experience occurs. Thoughts arise within it; emotions arise within it; impulses arise within it. The inner self is not any of these things but the space in which they all appear. He often invited his students to attend to this inner space directly, rather than to its contents. The contents are endlessly varied and shifting; the space is constant. By becoming familiar with the space, the practitioner finds something stable amid the flux of experience.",jds:"Singh provides extensive philological commentary on the term antarātman. He notes that the term has slightly different senses in different traditions of Indian thought. In Vedānta, it often refers to the witness-consciousness; in Yoga, to the inner agent; in Kashmir Śaivism, to the inner field of subjectivity as distinct from both the supreme and the limited. Singh emphasizes that this sūtra cannot be properly understood apart from 3.9.",asu:"Adi Suyash treats this sūtra as completing a poetic unit with 3.9. The dancer needs a stage; the supreme Self dances on the stage of the inner self. Together the two sūtras give a complete picture of the awakened phenomenology: an active dancer performing on a spacious stage, with all of embodied experience as the choreography. He emphasizes that this is not merely a poetic image."}},
{n:"prekṣakāṇi indriyāṇi",r:"ŚS 3.11",sk:"प्रेक्षकाणीन्द्रियाणि",d:"The Senses are the Spectators — The senses are the spectators.",det:{skt:"प्रेक्षकाणीन्द्रियाणि",tr:"The senses are the spectators.",c:"Kṣemarāja completes the triad of theatrical imagery begun in 3.9 and continued in 3.10. The Self is the dancer (3.9); the inner self is the stage (3.10); the senses are the spectators (3.11). The senses witness the great dance, watching what the supreme Self performs on the stage of the inner self. He emphasizes that this is a remarkable inversion of the ordinary understanding of the senses.",ksm:"Kṣemarāja completes the triad of theatrical imagery begun in 3.9 and continued in 3.10. The Self is the dancer (3.9); the inner self is the stage (3.10); the senses are the spectators (3.11). The senses witness the great dance, watching what the supreme Self performs on the stage of the inner self. He emphasizes that this is a remarkable inversion of the ordinary understanding of the senses. Ordinarily, the senses are taken to be tools by which the self gathers information about a separate external world. In this sūtra's vision, the senses are spectators within a unified dramatic performance — beholders of the dance that is being performed by their own deeper Self.",lkj:"Lakshmanjoo spoke beautifully of this triad of sūtras (3.9–3.11). He described the awakened life as a great cosmic theater in which the supreme Self performs the dance of embodied existence on the stage of inner awareness, with the senses as the spectators of the performance. He emphasized that this is not a metaphor in the loose sense. It is the actual phenomenology of awakened experience. The practitioner who has done the work of the previous sūtras experiences exactly this: themselves as dancer, the inner space as stage, the senses as audience.",jds:"Singh provides important philological commentary on the term prekṣakāṇi. The Sanskrit prekṣaka has the specific connotation of someone watching a dramatic performance — not merely someone observing in general, but specifically someone in the audience of a theatrical production. The choice of this term reinforces the theatrical imagery of the previous two sūtras. Singh notes that the three sūtras together (3.9–3.11) form a tightly unified poetic unit within the larger chapter.",asu:"Adi Suyash treats this sūtra as completing the dramatic imagery of the triad. The picture is now complete: dancer, stage, spectators. The awakened life is a great cosmic theater, and the practitioner participates in this theater not as a captive but as the master of the performance. He emphasizes that this imagery, taken seriously, can transform one's relationship to ordinary life."}}
]},
{name:"Path of Power, Posture & Freedom",ref:"ŚS 3.12–3.18",color:C.teal,children:[
{n:"dhī-vaśāt sattva-siddhiḥ",r:"ŚS 3.12",sk:"धीवशात् सत्त्वसिद्धिः",d:"By Power of Wisdom, the Pure Essence is Realized — By the power of (purified) wisdom, the pure essence is realized.",det:{skt:"धीवशात् सत्त्वसिद्धिः",tr:"By the power of (purified) wisdom, the pure essence is realized.",c:"Kṣemarāja explains this sūtra in connection with the doctrine of the buddhi (intellect) as the principal organ of self-recognition. The buddhi is the most refined of the inner instruments; when it is sufficiently purified, it can reflect the supreme awareness with great clarity. This reflection is sattva-siddhi — the realization of the pure essence.",ksm:"Kṣemarāja explains this sūtra in connection with the doctrine of the buddhi (intellect) as the principal organ of self-recognition. The buddhi is the most refined of the inner instruments; when it is sufficiently purified, it can reflect the supreme awareness with great clarity. This reflection is sattva-siddhi — the realization of the pure essence. He emphasizes that this realization is not a new attainment beyond the recognitions of the previous sūtras but their further refinement. As the buddhi is purified through sustained practice, its capacity to reflect the supreme becomes more and more clear, and the practitioner's recognition becomes more and more stable.",lkj:"Lakshmanjoo taught the importance of buddhi-purification with great emphasis. He observed that many practitioners cultivate impressive contemplative practices but neglect the parallel work of refining their thinking and clarifying their habitual mental tendencies. The result is uneven progress: moments of clarity in formal practice followed by reversion to confused thinking in daily life. He emphasized that the buddhi can be refined through specific work: through right reading, right thinking, right discrimination of values, right engagement with others.",jds:"Singh provides technical commentary on the terms dhī and sattva as they appear in this sūtra. He notes that dhī here refers specifically to the higher intellect, the contemplative discriminative faculty, as distinct from the more general manas (mind). The sattva that is realized is not merely the sattva-guṇa of Sāṃkhya but the pure essence of consciousness reflected in the purified intellect.",asu:"Adi Suyash treats this sūtra as identifying the essential link between contemplative practice and intellectual refinement. Neither is sufficient alone. The practitioner who cultivates only contemplative practice without refining their thinking will plateau; the practitioner who cultivates only intellectual sophistication without contemplative engagement will remain at the level of concepts."}},
{n:"siddhaḥ svatantra-bhāvaḥ",r:"ŚS 3.13",sk:"सिद्धः स्वतन्त्रभावः",d:"The Accomplished One is the State of Freedom — The accomplished one (the realized practitioner) is the state of (supreme) freedom.",det:{skt:"सिद्धः स्वतन्त्रभावः",tr:"The accomplished one (the realized practitioner) is the state of (supreme) freedom.",c:"Kṣemarāja describes the siddha as the practitioner who has realized the state of svātantrya — supreme freedom. This is not freedom in the negative sense (freedom from constraints) but in the positive sense (the unimpeded self-determining nature of consciousness itself). The siddha is one who has recognized themselves as this freedom.",ksm:"Kṣemarāja describes the siddha as the practitioner who has realized the state of svātantrya — supreme freedom. This is not freedom in the negative sense (freedom from constraints) but in the positive sense (the unimpeded self-determining nature of consciousness itself). The siddha is one who has recognized themselves as this freedom. He emphasizes that svātantrya is the very essence of the supreme awareness as described in 1.1 (caitanyam ātmā). The siddha is therefore not a special being beyond ordinary humans but an ordinary practitioner who has fully recognized what is already the case — that consciousness is intrinsically free. Kṣemarāja further notes that this state is not static.",lkj:"Lakshmanjoo described the siddha as one in whom svātantrya has become continuously present. The ordinary person experiences freedom only fitfully — in moments of joy, of love, of release. The siddha experiences freedom continuously, as the very texture of their being, regardless of external circumstance. He emphasized that this freedom is not a feeling that the siddha cultivates; it is the recognized nature of consciousness itself. The siddha has stopped maintaining the contraction that constitutes ordinary bondage and now rests in the natural openness of awareness.",jds:"Singh provides extensive philosophical commentary on svātantrya as the defining attribute of the supreme reality in Kashmir Śaivism. He emphasizes that this concept distinguishes the Kashmir Śaiva tradition from Advaita Vedānta, where the supreme is more often characterized in static terms (sat, cit, ānanda). The Kashmir Śaiva supreme is dynamically free — actively self-determining. Singh notes that this dynamic freedom is what the siddha realizes themselves as.",asu:"Adi Suyash treats this sūtra as one of the climactic moments of the chapter. After much description, prescription, and warning, the chapter now names plainly what the path is for: to become a siddha, to realize the state of supreme freedom. He emphasizes that this is not a remote ideal but the actual fruit of sincere practice."}},
{n:"yathā tatra tathā anyatra",r:"ŚS 3.14",sk:"यथा तत्र तथान्यत्र",d:"As There, So Elsewhere — As there, so elsewhere (the same power that operates within operates also without).",det:{skt:"यथा तत्र तथान्यत्र",tr:"As there, so elsewhere (the same power that operates within operates also without).",c:"Kṣemarāja gives this terse sūtra a profound interpretation. The recognized freedom of the siddha (3.13) operates not only in the inner sphere of contemplation but equally in the outer sphere of action. Just as one's consciousness is free 'there' (in inner awareness), so it is free 'elsewhere' (in the outer engagement with the world).",ksm:"Kṣemarāja gives this terse sūtra a profound interpretation. The recognized freedom of the siddha (3.13) operates not only in the inner sphere of contemplation but equally in the outer sphere of action. Just as one's consciousness is free 'there' (in inner awareness), so it is free 'elsewhere' (in the outer engagement with the world). The two are not different domains requiring different attainments; they are one consciousness operating in two modes. He emphasizes that this teaching dissolves a common misconception.",lkj:"Lakshmanjoo spoke memorably about this sūtra. He observed that many practitioners have impressive meditative experiences but then 'lose' them when they engage daily life. This sūtra describes the practitioner for whom this loss no longer occurs — for whom the inner state and the outer engagement are one continuous fabric. He emphasized that this continuity is not produced by effort. It cannot be maintained by trying to remember the meditative state during activity.",jds:"Singh provides important philological commentary on the structural simplicity of this sūtra. With just four words (and only two content-bearing words — yathā/tathā and tatra/anyatra), the sūtra makes a profound point: the equivalence of inner and outer at the level of consciousness. The brevity is itself part of the teaching: the equivalence is so basic that elaborate exposition would obscure it. Singh emphasizes that this sūtra is meant to be repeatedly returned to in contemplation.",asu:"Adi Suyash treats this sūtra as one of the most reassuring in the text. Many practitioners worry that their progress will be undermined by their inability to maintain inner recognition during outer engagement. The sūtra suggests that, ultimately, no such maintenance is required: inner and outer are one, and authentic recognition extends naturally across both."}},
{n:"bīja-avadhānam",r:"ŚS 3.15",sk:"बीजावधानम्",d:"Attention to the Seed — Attention to the seed (the source from which all arises).",det:{skt:"बीजावधानम्",tr:"Attention to the seed (the source from which all arises).",c:"Kṣemarāja explains that the 'seed' here is the source from which all manifestation arises — the supreme consciousness in its originating creative aspect. The practitioner is instructed to attend to this seed: to maintain awareness of the source from which experience continuously emerges rather than being lost in the various branches and fruits of manifestation.",ksm:"Kṣemarāja explains that the 'seed' here is the source from which all manifestation arises — the supreme consciousness in its originating creative aspect. The practitioner is instructed to attend to this seed: to maintain awareness of the source from which experience continuously emerges rather than being lost in the various branches and fruits of manifestation. He emphasizes that this is a specific contemplative discipline. Whenever something arises in experience — a thought, a feeling, a perception — the practitioner traces it back to its source rather than getting caught up in its content.",lkj:"Lakshmanjoo taught the practice of bīja-avadhāna with particular emphasis on its accessibility. The practice does not require special initiation or technique; it requires only the orientation of attention toward source rather than toward content. He often invited his students to practice this in real time. When a thought arises, ask: where did this come from? When an emotion arises, ask: what is the source of this? When a perception arises, ask: what is the awareness in which this is appearing? The questions are not for verbal answer; they are for orienting attention.",jds:"Singh provides extensive technical commentary on the term bīja and its many uses in Kashmir Śaiva texts. The term can refer to the supreme creative power of Śiva, to specific mantric seed-syllables (bīja-mantras), to the originating impulses of particular thoughts or actions, and to various other forms of generative source. Singh emphasizes that this sūtra is part of a sequence of practical instructions for the practitioner who has reached the level of the siddha.",asu:"Adi Suyash treats this sūtra as identifying a specific practice for the advanced practitioner. After the diagnostic and structural sūtras, after the theatrical imagery, after the naming of the siddha as the state of freedom, the chapter now provides specific practical instructions for maintaining and refining the realized state."}},
{n:"āsana-sthaḥ sukhaṃ hrade nimajjati",r:"ŚS 3.16",sk:"आसनस्थः सुखं ह्रदे निमज्जति",d:"Established in Posture, One Effortlessly Immerses in the Deep — Established in (proper) posture, one effortlessly immerses in the deep (lake of consciousness).",det:{skt:"आसनस्थः सुखं ह्रदे निमज्जति",tr:"Established in (proper) posture, one effortlessly immerses in the deep (lake of consciousness).",c:"Kṣemarāja explains that 'posture' (āsana) here is not merely the physical posture of seated meditation, though that is included. The deeper meaning is the established posture of awareness — the stable, settled orientation of consciousness that comes from sustained practice.",ksm:"Kṣemarāja explains that 'posture' (āsana) here is not merely the physical posture of seated meditation, though that is included. The deeper meaning is the established posture of awareness — the stable, settled orientation of consciousness that comes from sustained practice. When this posture is established, the practitioner effortlessly immerses in the great lake of consciousness that was named at the climax of the first chapter. He emphasizes that the term sukham (easily, effortlessly) is crucial. The practitioner does not need to strain or struggle to reach this immersion. Once the posture is established — once the supportive conditions are in place — the immersion occurs of itself.",lkj:"Lakshmanjoo described āsana with great practical wisdom. He observed that for most practitioners, the physical posture is the easiest entry point. A stable seated posture — comfortable but alert, neither slumped nor strained — creates the conditions in which the inner posture can stabilize. He often emphasized that this stabilization is not coercive. The practitioner does not force themselves into immersion; the immersion arises naturally when conditions are right. The work is the cultivation of conditions, not the production of the result.",jds:"Singh provides scholarly context for the doctrine of āsana in Indian contemplative traditions. He notes that the term has accumulated extensive technical meaning over centuries of yogic literature. The Kashmir Śaiva use is consistent with this broader heritage but is distinguished by its non-dual interpretation and its application to the supreme awareness. Singh emphasizes that the imagery of immersion in deep water is highly characteristic of the Kashmir Śaiva tradition.",asu:"Adi Suyash treats this sūtra as continuing the practical instructions for the advanced practitioner. After bīja-avadhāna (3.15), the chapter now describes how this attention leads, when properly established in posture, to effortless immersion in the depth of consciousness. He emphasizes that this is not exotic teaching. The path described here is accessible to any sincere practitioner."}},
{n:"sva-mātrā-nirmāṇam āpādayati",r:"ŚS 3.17",sk:"स्वमात्रानिर्माणमापादयति",d:"One Causes the Manifestation of One's Own Standard — One causes the manifestation of one's own (measure, standard, or world).",det:{skt:"स्वमात्रानिर्माणमापादयति",tr:"One causes the manifestation of one's own (measure, standard, or world).",c:"Kṣemarāja explains this sūtra as describing one of the most striking accomplishments of the advanced practitioner. Once immersion in the depth has been established (3.16), the practitioner discovers the power to manifest their own world — to cause the appearance of experiences that conform to their own intention.",ksm:"Kṣemarāja explains this sūtra as describing one of the most striking accomplishments of the advanced practitioner. Once immersion in the depth has been established (3.16), the practitioner discovers the power to manifest their own world — to cause the appearance of experiences that conform to their own intention. He emphasizes that this is not magical thinking but a recognition of how consciousness actually works at the highest levels. At the level of supreme awareness, consciousness is not the passive recipient of an externally-given world; consciousness is the source of the world. Kṣemarāja further notes that this teaching must be understood carefully.",lkj:"Lakshmanjoo spoke carefully about this sūtra. He acknowledged that the realized practitioner does participate in the manifestation of their own experience in a way that ordinary people do not. But he warned against any sensationalized understanding of this. The realized practitioner does not perform parlor tricks or manipulate external reality through willpower. He often described what this teaching actually looks like in practice. The realized practitioner finds that their life arranges itself in alignment with their deepest nature.",jds:"Singh provides cautious philological commentary on this sūtra. He emphasizes that the Sanskrit is carefully chosen to avoid any crude reading. The practitioner causes manifestation 'of one's own measure' — sva-mātrā — meaning manifestation that conforms to the practitioner's own nature, not to their arbitrary will. Singh notes that this sūtra has been the subject of significant interpretive debate.",asu:"Adi Suyash treats this sūtra as describing one of the more striking phenomena of the advanced path. The siddha experiences a profound alignment between their own being and their unfolding circumstances. This alignment is not coincidence; it is the recognition that consciousness participates in manifestation at depths that ordinary experience does not access."}},
{n:"vidyā-avināśe janma-vināśaḥ",r:"ŚS 3.18",sk:"विद्याविनाशे जन्मविनाशः",d:"While Knowledge Endures, Birth Does Not Cease — When (false) knowledge does not perish, birth (rebirth) does not perish either.",det:{skt:"विद्याविनाशे जन्मविनाशः",tr:"When (false) knowledge does not perish, birth (rebirth) does not perish either.",c:"Kṣemarāja explains that this sūtra carries multiple legitimate readings, all theologically significant. The most common interpretation is the inverse: while limited (false) knowledge is not destroyed, the cycle of rebirth is not destroyed. The practitioner remains caught in saṃsāra so long as the fundamental misidentification described in 3.1–3.2 is not dissolved.",ksm:"Kṣemarāja explains that this sūtra carries multiple legitimate readings, all theologically significant. The most common interpretation is the inverse: while limited (false) knowledge is not destroyed, the cycle of rebirth is not destroyed. The practitioner remains caught in saṃsāra so long as the fundamental misidentification described in 3.1–3.2 is not dissolved. An alternative reading takes vidyā in the supreme sense: when supreme wisdom is established and not destroyed, the cycle of rebirth is destroyed. This reading emphasizes the positive condition for liberation rather than the negative diagnosis of bondage.",lkj:"Lakshmanjoo spoke seriously about this sūtra. He observed that many practitioners hope that their practice will somehow short-circuit the cycle of rebirth without their having to do the actual work of dissolving misidentification. The sūtra warns against this hope: until the misidentification is genuinely dissolved, rebirth continues. He often emphasized that the practitioner should approach the path with full commitment rather than partial commitment. Partial commitment may produce partial fruits, but it does not produce the final fruit.",jds:"Singh provides detailed philological commentary on the multiple legitimate readings of this sūtra. He emphasizes that the Sanskrit deliberately allows several readings, all of which were known to the classical commentators. Singh notes that the sūtra serves an important function in the chapter's overall structure. After the encouraging descriptions of the previous sūtras, this sūtra returns the practitioner to sober realism: all this is conditional on the actual destruction of misidentification.",asu:"Adi Suyash treats this sūtra as serving the same corrective function in the third chapter as 2.10 served in the second. After encouraging descriptions of the awakened state, the text returns the practitioner to the actual condition for liberation: the destruction of misidentification. He emphasizes that this is not pessimistic."}}
]},
{name:"Mātṛkā's Bondage, Turya's Light",ref:"ŚS 3.19–3.22",color:C.coral,children:[
{n:"ka-vargādiṣu māheśvaryādyāḥ paśu-mātaraḥ",r:"ŚS 3.19",sk:"कवर्गादिषु माहेश्वर्याद्याः पशुमातरः",d:"The Goddess-Letters Beginning with Ka are the Mothers of Bondage — The (powers presiding over) the consonant-classes beginning with 'ka' (and headed by Māheśvarī) are the mothers of bound beings.",det:{skt:"कवर्गादिषु माहेश्वर्याद्याः पशुमातरः",tr:"The (powers presiding over) the consonant-classes beginning with 'ka' (and headed by Māheśvarī) are the mothers of bound beings.",c:"Kṣemarāja gives this technical sūtra extensive treatment. The Sanskrit consonants are traditionally arranged in five classes (vargas), each beginning with a specific consonant: ka-class, ca-class, ṭa-class, ta-class, pa-class. Over each class presides a particular goddess: Māheśvarī, Kaumārī, Vaiṣṇavī, Vārāhī, Aindrī, Cāmuṇḍā, and Mahālakṣmī.",ksm:"Kṣemarāja gives this technical sūtra extensive treatment. The Sanskrit consonants are traditionally arranged in five classes (vargas), each beginning with a specific consonant: ka-class, ca-class, ṭa-class, ta-class, pa-class. Over each class presides a particular goddess: Māheśvarī, Kaumārī, Vaiṣṇavī, Vārāhī, Aindrī, Cāmuṇḍā, and Mahālakṣmī. He explains that these goddesses — when their phonemic activity occurs without the practitioner's recognition — are precisely the 'mothers' of the bound being. The bound being is birthed and sustained by the unrecognized operation of the mātṛkā-cakra introduced in 1.4 and developed in 2.7.",lkj:"Lakshmanjoo taught this technical doctrine with patience. He emphasized that the goddess-names are not exotic decorations but precise identifications of forces that operate in every practitioner's experience. He often acknowledged that this teaching may seem foreign or excessively complex to modern practitioners. But he encouraged students to engage it patiently. Lakshmanjoo also stressed the practical implication: the practitioner who recognizes the operation of these powers can begin to relate to them consciously.",jds:"Singh provides extensive scholarly context for this sūtra. He traces the doctrine of the seven mother-goddesses through Tantric literature, showing how it functions both as theological reality and as technical apparatus for analyzing consciousness. Singh notes that this sūtra is among the most technically difficult in the Śiva Sūtras for the modern reader. Without engagement with the broader Tantric tradition, the references may seem opaque.",asu:"Adi Suyash treats this sūtra as one of the more technical moments in the chapter. He emphasizes that while the specific goddess-names may be unfamiliar to modern practitioners, the underlying teaching is universal: bondage operates through unconscious psychic-linguistic mechanisms, and recognition of these mechanisms is essential for liberation."}},
{n:"triṣu caturthaṃ taila-vad āsecyam",r:"ŚS 3.20",sk:"त्रिषु चतुर्थं तैलवदासेच्यम्",d:"The Fourth Should Pour Into the Three Like Oil — The Fourth (turya) should be poured into the three (states) like oil.",det:{skt:"त्रिषु चतुर्थं तैलवदासेच्यम्",tr:"The Fourth (turya) should be poured into the three (states) like oil.",c:"Kṣemarāja gives this sūtra a vivid practical interpretation. The Fourth (turya) — the supreme awareness — should be deliberately infused into the experience of the three states (waking, dreaming, deep sleep).",ksm:"Kṣemarāja gives this sūtra a vivid practical interpretation. The Fourth (turya) — the supreme awareness — should be deliberately infused into the experience of the three states (waking, dreaming, deep sleep). Just as oil, when poured, spreads through whatever it touches without losing its own character, so the Fourth should be brought into each of the three states until all three are pervaded by the Fourth's quality. He emphasizes the active character of this practice. The practitioner does not wait for the Fourth to appear spontaneously; they deliberately bring the recognition of the Fourth into each state. In the waking state: by attending to the awareness behind perception.",lkj:"Lakshmanjoo described this practice with particular clarity. He explained that the oil-metaphor is precise in another way: oil, when poured, gradually permeates rather than instantly soaking. Similarly, the infusion of the Fourth into the three states is gradual; it occurs through sustained practice over time rather than as a single act. He often emphasized the importance of working with all three states. Many practitioners attend carefully to waking-state meditation but neglect the practices for dream and deep sleep.",jds:"Singh provides extensive commentary on this sūtra, which he identifies as one of the most practically important in the third chapter. He emphasizes that the oil-metaphor is highly characteristic of Kashmir Śaiva imagery, capturing both the pervasiveness and the distinct character of the awareness being infused. Singh further notes that this sūtra echoes the analysis of the three states in the first chapter (1.7–1.11) but transforms it from diagnosis into prescription.",asu:"Adi Suyash treats this sūtra as one of the most beautiful and practical in the chapter. The oil-image is memorable and accurate. The practitioner is invited to take the awareness recognized in deep meditation and deliberately infuse it into all dimensions of experience. He emphasizes that this work, sustained over years, gradually transforms the practitioner's entire life."}},
{n:"magnaḥ sva-cittena praviśet",r:"ŚS 3.21",sk:"मग्नः स्वचित्तेन प्रविशेत्",d:"Submerged, One Should Enter with One's Own Mind — (Once) submerged (in the depth), one should enter (the supreme) with one's own mind.",det:{skt:"मग्नः स्वचित्तेन प्रविशेत्",tr:"(Once) submerged (in the depth), one should enter (the supreme) with one's own mind.",c:"Kṣemarāja explains that this sūtra prescribes the second stage of the immersion-practice begun in 3.16. There, the practitioner established themselves in posture and immersed in the depth. Here, having achieved that immersion, the practitioner is to take a further step: to enter the supreme with their own mind. He emphasizes the seeming paradox.",ksm:"Kṣemarāja explains that this sūtra prescribes the second stage of the immersion-practice begun in 3.16. There, the practitioner established themselves in posture and immersed in the depth. Here, having achieved that immersion, the practitioner is to take a further step: to enter the supreme with their own mind. He emphasizes the seeming paradox. The mind is precisely what was identified, in 3.1, as the source of bondage. How can the practitioner enter the supreme with the mind? Kṣemarāja's answer: by this stage of the path, the mind has been so thoroughly refined and purified that it can serve as the vehicle of entry rather than the obstacle to it.",lkj:"Lakshmanjoo described this practice as one of the most subtle and demanding on the path. The practitioner must have established the prior immersion in the depth; they must then have refined the mind sufficiently that it can serve as an instrument of further entry. He often described the entry itself as quiet and unspectacular. There is no dramatic experience of 'entering'; there is simply the deepening of the immersion already established. Lakshmanjoo also stressed that this sūtra reinforces the active character of the Kashmir Śaiva path. The practitioner is not passive at any stage.",jds:"Singh provides scholarly context for this sūtra. He notes that the doctrine of active entry into the supreme is one of the distinctive features of the Kashmir Śaiva tradition, differentiating it from traditions that emphasize pure surrender or pure receptivity. Singh emphasizes that this sūtra describes an advanced practice. It is not for the beginner who has not yet established immersion.",asu:"Adi Suyash treats this sūtra as describing an advanced practice that follows naturally from the immersion of 3.16. Having achieved the established immersion, the practitioner can now use their own refined mind to enter further into the supreme. He emphasizes that this sūtra preserves the dignity of the mind."}},
{n:"prāṇa-samācāre sama-darśanam",r:"ŚS 3.22",sk:"प्राणसमाचारे समदर्शनम्",d:"In the Course of Prāṇa, Equal Vision Arises — In the regulated course of prāṇa (vital energy), there arises equal vision (a unified seeing of all things).",det:{skt:"प्राणसमाचारे समदर्शनम्",tr:"In the regulated course of prāṇa (vital energy), there arises equal vision (a unified seeing of all things).",c:"Kṣemarāja explains that the practitioner who has properly regulated the flow of prāṇa attains 'equal vision' — the capacity to see all things, all beings, all experiences with the same fundamental recognition of their underlying unity. This is not the suppression of differences (which remain at their own level) but the recognition of the underlying sameness of consciousness in all of them.",ksm:"Kṣemarāja explains that the practitioner who has properly regulated the flow of prāṇa attains 'equal vision' — the capacity to see all things, all beings, all experiences with the same fundamental recognition of their underlying unity. This is not the suppression of differences (which remain at their own level) but the recognition of the underlying sameness of consciousness in all of them. He emphasizes that this attainment depends on actual prāṇic practice, not merely on philosophical understanding. The practitioner must have worked with the breath, with the subtle channels, with the energetic centers.",lkj:"Lakshmanjoo taught the practice of prāṇic regulation with great care. He emphasized that this is not merely breath-control in the limited sense; it is the comprehensive work of regulating one's entire energetic life so that the supreme can flow without obstruction. He often noted that the equal vision described in this sūtra is one of the most beautiful qualities of a realized being. Such a being is not blind to differences — they fully appreciate the unique qualities of each person and each circumstance — but the differences are appreciated within an underlying recognition of unity.",jds:"Singh provides extensive philological commentary on the term sama-darśanam. He notes that the term has different connotations in different Indian traditions — in some, emphasizing detachment; in others, emphasizing equanimity; in the Kashmir Śaiva use, emphasizing the recognition of underlying unity beneath manifest difference. Singh emphasizes that this sūtra is one of the sūtras that connects the Kashmir Śaiva path with the broader yogic tradition's emphasis on breath-work.",asu:"Adi Suyash treats this sūtra as describing one of the most beautiful qualities of the advanced practitioner. Equal vision is not indifference; it is the warm, inclusive recognition that all of experience is the play of one consciousness. He emphasizes that this vision is the natural fruit of integrated practice."}}
]},
{name:"Middle Path, Measure, Identity",ref:"ŚS 3.23–3.25",color:C.amber,children:[
{n:"madhye 'vara-prasavaḥ",r:"ŚS 3.23",sk:"मध्येऽवरप्रसवः",d:"In the Middle, There is Inferior Generation — In the middle (state between immersions), there is inferior generation (of mind-stuff).",det:{skt:"मध्येऽवरप्रसवः",tr:"In the middle (state between immersions), there is inferior generation (of mind-stuff).",c:"Kṣemarāja explains that even for the practitioner who has reached advanced stages, there are 'middle' periods between episodes of established immersion. In these middle periods, inferior cognitions — thoughts, distractions, lesser-quality mental activity — naturally arise. The sūtra acknowledges this as part of the path rather than as a sign of failure.",ksm:"Kṣemarāja explains that even for the practitioner who has reached advanced stages, there are 'middle' periods between episodes of established immersion. In these middle periods, inferior cognitions — thoughts, distractions, lesser-quality mental activity — naturally arise. The sūtra acknowledges this as part of the path rather than as a sign of failure. He emphasizes that this teaching is realistic. The practitioner is not expected to maintain continuous supreme immersion at all times until they have reached the very highest stages of attainment. Kṣemarāja further notes that this sūtra prepares the practitioner for the practices described in subsequent sūtras.",lkj:"Lakshmanjoo spoke memorably about this sūtra. He observed that many advanced practitioners experience these middle periods and mistake them for signs of regression. The sūtra reassures: this is part of the natural course of the path. He often described his own experience of working with these middle periods. The work is not to prevent them (which is impossible at most stages) but to recognize them clearly when they arise. Lakshmanjoo also emphasized that the sūtras that follow this one provide specific tools for working with these middle periods.",jds:"Singh provides important philological commentary on the term avara-prasava. The Sanskrit specifically connotes 'lower' or 'inferior' generation — generation of mental content that is of lesser quality than the supreme awareness. Singh notes that this sūtra introduces a practical theme that will run through the rest of the chapter.",asu:"Adi Suyash treats this sūtra as a moment of realistic compassion in the text. After describing many advanced attainments, the text acknowledges plainly: even at advanced stages, middle periods of inferior generation occur. He emphasizes that the sūtra also sets up the practical instructions that follow."}},
{n:"mātrā-sva-pratyaya-sandhāne naṣṭasya punar-utthānam",r:"ŚS 3.24",sk:"मात्रास्वप्रत्ययसन्धाने नष्टस्य पुनरुत्थानम्",d:"By Attending to One's Measure, the Lost is Recovered — Through the conjunction with one's own measured/standard awareness, what was lost arises again.",det:{skt:"मात्रास्वप्रत्ययसन्धाने नष्टस्य पुनरुत्थानम्",tr:"Through the conjunction with one's own measured/standard awareness, what was lost arises again.",c:"Kṣemarāja explains the practical response to the middle-period inferior generation diagnosed in 3.23. When the practitioner has lost contact with the supreme awareness, the recovery is accomplished through deliberate conjunction with their established meditative awareness — their own 'measure' or 'standard' that has been cultivated through prior practice.",ksm:"Kṣemarāja explains the practical response to the middle-period inferior generation diagnosed in 3.23. When the practitioner has lost contact with the supreme awareness, the recovery is accomplished through deliberate conjunction with their established meditative awareness — their own 'measure' or 'standard' that has been cultivated through prior practice. He emphasizes that this is a specific practical technique. The practitioner does not wait passively for supreme awareness to return; they actively reconnect with the specific quality of awareness that they have established through their practice.",lkj:"Lakshmanjoo taught this practical technique with great emphasis. He noted that practitioners often suffer when they feel they have lost their meditative achievement; they may feel that they have to start over. He often described the technique in detail. The practitioner is to remember the quality of their established meditative awareness — its tone, its texture, its felt sense. By bringing this quality back into the foreground of attention, the recognition is restored. Lakshmanjoo also emphasized that this technique is not magical. It does not produce instant restoration to peak states.",jds:"Singh provides important commentary on the relationship between this sūtra and the previous one. The two sūtras work as a pair: 3.23 diagnoses the middle-period loss, 3.24 prescribes the recovery technique. Singh emphasizes that the term mātrā in this context means specifically the standard or measure that the practitioner has personally established — not an external standard but one's own.",asu:"Adi Suyash treats this sūtra as one of the most practically useful in the chapter. After acknowledging that middle-period losses occur (3.23), the text immediately provides the technique for recovery (3.24). He emphasizes that this technique becomes increasingly available as the practitioner deepens."}},
{n:"śiva-tulyo jāyate",r:"ŚS 3.25",sk:"शिवतुल्यो जायते",d:"One Becomes Like Śiva — One becomes like Śiva (one becomes identical with Śiva).",det:{skt:"शिवतुल्यो जायते",tr:"One becomes like Śiva (one becomes identical with Śiva).",c:"Kṣemarāja explains that this brief sūtra states the culminating attainment of the entire path. Through sustained practice — through the establishment of immersion (3.16), the active entry with mind (3.21), the regulation of prāṇa (3.22), and the recovery techniques (3.24) — the practitioner becomes 'like Śiva.' He emphasizes that this becoming is not a transformation into something the practitione…",ksm:"Kṣemarāja explains that this brief sūtra states the culminating attainment of the entire path. Through sustained practice — through the establishment of immersion (3.16), the active entry with mind (3.21), the regulation of prāṇa (3.22), and the recovery techniques (3.24) — the practitioner becomes 'like Śiva.' He emphasizes that this becoming is not a transformation into something the practitioner is not. The practitioner does not literally become a deity remote from their own being. Rather, they realize that they have always been identical with Śiva. Kṣemarāja further notes that this realization is the practical culmination of the Āṇavopāya.",lkj:"Lakshmanjoo spoke of this sūtra with great reverence. He noted that it is the most direct statement in the text of the supreme attainment. He often emphasized that this attainment is not exotic or remote. It is the natural fruit of the methods described in this chapter, faithfully practiced over time. Lakshmanjoo also stressed the realistic implication. The realized practitioner does not float a foot above the ground or display supernatural powers as cosmic theater. They live recognizably human lives — but human lives suffused with the recognized identity with Śiva.",jds:"Singh provides extensive commentary on this sūtra as the climactic statement of the chapter. He emphasizes that the Sanskrit deliberately uses tulya (equal to, like) rather than abhinna (non-different). The choice is theologically significant. Singh notes that this preservation of functional distinction is characteristic of the Kashmir Śaiva tradition's careful handling of the identity question.",asu:"Adi Suyash treats this sūtra as the climax of the chapter. Everything that has come before has been preparation; everything that comes after will be elaboration. This sūtra states plainly: through this path, one becomes identical with Śiva. He emphasizes that this is real. The path is real, the methods work, the attainment is available."}}
]},
{name:"Embodied Discipline as Worship",ref:"ŚS 3.26–3.31",color:C.sage,children:[
{n:"śarīra-vṛttir vratam",r:"ŚS 3.26",sk:"शरीरवृत्तिर्व्रतम्",d:"Maintenance of the Body is the Vow — The maintenance of the body is the religious vow.",det:{skt:"शरीरवृत्तिर्व्रतम्",tr:"The maintenance of the body is the religious vow.",c:"Kṣemarāja explains this sūtra as part of a sequence (3.26–3.28) describing how the realized practitioner relates to ordinary activities. After becoming like Śiva (3.25), the practitioner does not retreat from ordinary life; they engage it in a transformed way.",ksm:"Kṣemarāja explains this sūtra as part of a sequence (3.26–3.28) describing how the realized practitioner relates to ordinary activities. After becoming like Śiva (3.25), the practitioner does not retreat from ordinary life; they engage it in a transformed way. The first item in this transformed engagement is the body itself: the very maintenance of the body — eating, sleeping, exercising, basic care — becomes the practitioner's religious vow. He emphasizes that this teaching is a radical re-interpretation of religious observance. Traditional vratas involve specific ritual disciplines: fasting, particular practices, special observances.",lkj:"Lakshmanjoo taught this sūtra with great warmth. He observed that many practitioners feel guilty about ordinary self-care, treating eating, exercising, and resting as compromises with spiritual ideals. The sūtra reverses this. He often noted that the realized practitioner cares for the body more carefully than the ordinary person, not less. The body is the dwelling of recognized consciousness; it deserves and receives proper care. Lakshmanjoo also stressed that this teaching does not endorse hedonism. Caring for the body is not the same as indulging the body.",jds:"Singh provides scholarly context for this remarkable sūtra. He emphasizes that the equation 'maintenance of body = religious vow' is one of the most distinctive teachings of the Kashmir Śaiva tradition. Singh notes that this sūtra is part of a triad (3.26–3.28) that re-interprets traditional religious categories.",asu:"Adi Suyash treats this sūtra as opening a new movement in the chapter. After the climactic realization of identity with Śiva (3.25), the text now describes how this realization expresses itself in ordinary life. He emphasizes that this teaching dissolves the religious-secular distinction at its root."}},
{n:"kathā japaḥ",r:"ŚS 3.27",sk:"कथा जपः",d:"Conversation is Mantra Recitation — (One's) conversation is (one's) japa (mantric recitation).",det:{skt:"कथा जपः",tr:"(One's) conversation is (one's) japa (mantric recitation).",c:"Kṣemarāja continues the re-interpretation of religious categories begun in 3.26. Where traditional japa involves specific ritual recitation of mantras, the realized practitioner's ordinary conversation has become japa. Every word they speak is, in the deeper sense, mantra. He emphasizes that this is not metaphor.",ksm:"Kṣemarāja continues the re-interpretation of religious categories begun in 3.26. Where traditional japa involves specific ritual recitation of mantras, the realized practitioner's ordinary conversation has become japa. Every word they speak is, in the deeper sense, mantra. He emphasizes that this is not metaphor. The realized practitioner who has awakened to the mātṛkā-cakra (2.7) experiences every word as the play of goddess-energies, every sound as the manifestation of the supreme. Kṣemarāja further notes that this teaching expresses one of the most beautiful aspects of the Kashmir Śaiva non-dual orientation. There is no need to retreat to a separate space for mantric practice.",lkj:"Lakshmanjoo spoke beautifully of this sūtra. He observed that the realized practitioner cannot help but engage every conversation as devotional practice. There is no separate spiritual mode and ordinary mode. He often noted that this teaching has obvious practical implications for how the practitioner relates to harsh speech, gossip, deceptive speech. Such speech would be incompatible with the recognition the sūtra describes. Lakshmanjoo also stressed that this teaching does not require solemnity in conversation.",jds:"Singh provides important commentary on this sūtra as the second member of the triad (3.26–3.28). Where 3.26 identified body-maintenance with vrata, this sūtra identifies conversation with japa. Singh emphasizes that this teaching has been recognized as revolutionary by readers across centuries.",asu:"Adi Suyash treats this sūtra as one of the most encouraging in the chapter. The practitioner who fears that they do not have time for sufficient japa is reassured: their conversation is itself japa. He emphasizes that this teaching also raises the bar for speech. If every conversation is japa, then careless speech is careless japa."}},
{n:"dānam ātma-jñānam",r:"ŚS 3.28",sk:"दानमात्मज्ञानम्",d:"Giving is Self-Knowledge — Giving is (the practitioner's) self-knowledge.",det:{skt:"दानमात्मज्ञानम्",tr:"Giving is (the practitioner's) self-knowledge.",c:"Kṣemarāja completes the triad (3.26–3.28) with this beautiful sūtra. Where body-maintenance is vrata (3.26) and conversation is japa (3.27), the act of giving is self-knowledge (ātma-jñāna). The traditional religious category of giving is reinterpreted: the realized practitioner gives not as a separate religious act but as the natural expression of their recognized identity with all.",ksm:"Kṣemarāja completes the triad (3.26–3.28) with this beautiful sūtra. Where body-maintenance is vrata (3.26) and conversation is japa (3.27), the act of giving is self-knowledge (ātma-jñāna). The traditional religious category of giving is reinterpreted: the realized practitioner gives not as a separate religious act but as the natural expression of their recognized identity with all. He emphasizes that the practitioner who has recognized themselves as the supreme Self has thereby recognized themselves as identical with all beings. Giving to another is therefore not a transfer from one party to another but a movement within the unified field of one's own being.",lkj:"Lakshmanjoo spoke movingly about this sūtra. He observed that the practitioner who has truly realized their identity with all beings gives spontaneously and joyfully. The act of giving requires no overcoming of selfishness because there is no separate self to be selfish. He often described the qualities of the genuinely realized practitioner: a quality of openness, a natural generosity, a lack of grasping. These qualities are not cultivated separately; they are the natural fruits of recognition. Lakshmanjoo also stressed that this teaching does not abolish discernment in giving.",jds:"Singh provides extensive commentary on this sūtra as the conclusion of the triad. He emphasizes that the triad as a whole accomplishes a profound transformation: traditional religious categories (vow, mantra recitation, giving) are revealed as identical with ordinary activities (body maintenance, conversation, generosity). Singh notes that this transformation is one of the most distinctive features of the Kashmir Śaiva path.",asu:"Adi Suyash treats this sūtra as completing the triad with beautiful symmetry. Body care is the vow; speech is mantra; giving is self-knowledge. The three together cover the basic dimensions of ordinary life: bodily, verbal, social. He emphasizes that the triad is meant to be lived, not merely understood."}},
{n:"yo 'vipastho jña-hetuś ca",r:"ŚS 3.29",sk:"योऽविपस्थो ज्ञाहेतुश्च",d:"He Who is Established (in the Self) is the Cause of Knowledge — He who is established (in the supreme Self) becomes the cause of knowledge (in others).",det:{skt:"योऽविपस्थो ज्ञाहेतुश्च",tr:"He who is established (in the supreme Self) becomes the cause of knowledge (in others).",c:"Kṣemarāja explains that this sūtra describes one of the most beautiful aspects of the realized practitioner: their function as a cause of knowledge in others. The practitioner who is firmly established in the supreme Self becomes, by their very presence, a doorway through which others can also access this recognition.",ksm:"Kṣemarāja explains that this sūtra describes one of the most beautiful aspects of the realized practitioner: their function as a cause of knowledge in others. The practitioner who is firmly established in the supreme Self becomes, by their very presence, a doorway through which others can also access this recognition. He emphasizes that this function is not performed deliberately as a teaching activity (though it may also be expressed in formal teaching). It operates simply by the practitioner's being. Their established recognition radiates outward and awakens corresponding recognition in those who are ready.",lkj:"Lakshmanjoo, who himself functioned as such a cause of knowledge for many students, spoke of this sūtra with characteristic humility. He emphasized that this is not a function the practitioner takes on by their own will; it is simply what happens when recognition has become established. He often described his own teacher, Swami Ram, in these terms. Ram did not seek students or set himself up as a teacher; his established recognition simply drew receptive students to him, and his presence awakened corresponding recognition in them.",jds:"Singh provides important philological commentary on the term avipastha. The Sanskrit is complex; he traces several legitimate interpretations and notes that the underlying meaning in all of them is 'established in the protective/sovereign Self.' Singh emphasizes that this sūtra describes one of the most important functions of the realized practitioner in the lineage tradition. The tradition continues across centuries through this function.",asu:"Adi Suyash treats this sūtra as describing the natural function of the realized practitioner in the world. They do not seek to become teachers, but they naturally become sources of awakening for those who encounter them with receptivity. He emphasizes that this function is sacred and should not be exploited. The genuine cause-of-knowledge holds this function with great care and humility."}},
{n:"sva-śakti-pracayo 'sya viśvam",r:"ŚS 3.30",sk:"स्वशक्तिप्रचयोऽस्य विश्वम्",d:"The Universe is the Expansion of His Own Power — The universe is the expansion of his (the realized practitioner's) own power.",det:{skt:"स्वशक्तिप्रचयोऽस्य विश्वम्",tr:"The universe is the expansion of his (the realized practitioner's) own power.",c:"Kṣemarāja explains that this sūtra describes the cosmic recognition of the realized practitioner. Having become like Śiva (3.25), having taken on the natural functions of body-care as vow (3.26), conversation as japa (3.27), and giving as self-knowledge (3.28), and having become a cause of knowledge in others (3.29), the practitioner now recognizes the entire universe as the expansion of their own…",ksm:"Kṣemarāja explains that this sūtra describes the cosmic recognition of the realized practitioner. Having become like Śiva (3.25), having taken on the natural functions of body-care as vow (3.26), conversation as japa (3.27), and giving as self-knowledge (3.28), and having become a cause of knowledge in others (3.29), the practitioner now recognizes the entire universe as the expansion of their own power. He emphasizes that this is the supreme recognition. The universe is not external to the realized practitioner; it is their own śakti unfolding into manifestation.",lkj:"Lakshmanjoo spoke of this sūtra as describing one of the most profound recognitions on the path. He emphasized that this is not a feeling of grandiosity but a sober recognition of the actual structure of reality. He often noted that this recognition completely transforms the practitioner's relationship to circumstance. Suffering still occurs in the realized practitioner's life, but it occurs within the recognized field of their own power rather than as an external imposition. Lakshmanjoo also stressed that this recognition is the doorway to genuine compassion.",jds:"Singh provides extensive philosophical commentary on this culminating sūtra. He notes that the teaching here is consistent with the broader Kashmir Śaiva doctrine of svātantrya — the supreme freedom of consciousness that expresses itself as the universe. Singh emphasizes that this sūtra serves as a kind of summit in the chapter. The first 29 sūtras have led the practitioner from the diagnostic opening through the systematic methods to the supreme realization of identity with Śiva.",asu:"Adi Suyash treats this sūtra as one of the climactic recognitions of the text. He emphasizes that this recognition is not the start of a new exploration but the natural fruit of the entire path. He notes that this recognition has profound practical implications."}},
{n:"sthiti-layau",r:"ŚS 3.31",sk:"स्थितिलयौ",d:"Both Maintenance and Dissolution (Are His) — (He is also the cause of) maintenance and dissolution.",det:{skt:"स्थितिलयौ",tr:"(He is also the cause of) maintenance and dissolution.",c:"Kṣemarāja explains that this sūtra completes the cosmic functions of the realized practitioner. In 3.30, the universe was described as the expansion of the practitioner's own power — corresponding to the cosmic act of creation (sṛṣṭi). Now the practitioner is also identified as the cause of maintenance (sthiti) and dissolution (laya) — the second and third cosmic acts.",ksm:"Kṣemarāja explains that this sūtra completes the cosmic functions of the realized practitioner. In 3.30, the universe was described as the expansion of the practitioner's own power — corresponding to the cosmic act of creation (sṛṣṭi). Now the practitioner is also identified as the cause of maintenance (sthiti) and dissolution (laya) — the second and third cosmic acts. He emphasizes that the realized practitioner participates in all three of these cosmic acts. They are not a passive observer of creation, maintenance, and dissolution; they are the very consciousness in whom these acts occur.",lkj:"Lakshmanjoo spoke of this sūtra as completing the cosmic dimension of the realized practitioner's life. The practitioner does not merely participate in creation; they participate in all the cosmic functions. He often noted that this recognition transforms the practitioner's relationship to impermanence. Where the ordinary person clings to maintenance and fears dissolution, the realized practitioner recognizes both as their own power's natural expressions. Lakshmanjoo also stressed that this teaching does not abolish loss.",jds:"Singh provides important commentary on the dual case (layau) in the Sanskrit. The dual indicates that maintenance and dissolution are being considered as a pair — completing, with the creation implied in 3.30, the triad of fundamental cosmic acts. Singh notes that this sūtra extends the cosmic identification of the realized practitioner without dramatic elaboration. The brevity is characteristic of the text: the implications are vast, but the statement itself is brief.",asu:"Adi Suyash treats this sūtra as continuing the description of the cosmic dimensions of the realized practitioner's life. Where 3.30 named creation, 3.31 names maintenance and dissolution. He emphasizes that the recognition this teaching describes is profoundly liberating. The practitioner is freed from the universal human anxiety about loss and change."}}
]},
{name:"Witnessing in Activity",ref:"ŚS 3.32–3.37",color:C.green,children:[
{n:"tat-pravṛttāv apy anirāsaḥ saṃvettṛ-bhāvāt",r:"ŚS 3.32",sk:"तत्प्रवृत्तावप्यनिरासः संवेत्तृभावात्",d:"Even in Activity, There is No Cessation Because of His Witnessing Nature — Even in (such cosmic) activity, there is no cessation (of the realized state) because of (his nature as) the supreme witness.",det:{skt:"तत्प्रवृत्तावप्यनिरासः संवेत्तृभावात्",tr:"Even in (such cosmic) activity, there is no cessation (of the realized state) because of (his nature as) the supreme witness.",c:"Kṣemarāja explains the philosophical importance of this sūtra. One might worry that the realized practitioner's participation in cosmic activity (creation, maintenance, dissolution) would somehow undermine or interrupt their realized state.",ksm:"Kṣemarāja explains the philosophical importance of this sūtra. One might worry that the realized practitioner's participation in cosmic activity (creation, maintenance, dissolution) would somehow undermine or interrupt their realized state. The sūtra reassures: even in the midst of such cosmic activity, the realized state is not interrupted, because the practitioner's nature is fundamentally that of the supreme witness. He emphasizes that the supreme witness (saṃvettṛ) is not a passive observer but the very awareness in which all activity occurs.",lkj:"Lakshmanjoo taught this sūtra with great practical emphasis. He observed that many practitioners worry that active engagement with the world will somehow undermine their meditative attainments. The sūtra reassures: the realized state is not delicate; it is the very fabric of awareness, and activity occurs within it without disturbing it. He often described how the realized practitioner can engage fully in complex worldly activities — running organizations, raising families, navigating difficulties — without losing the underlying recognition.",jds:"Singh provides extensive commentary on this sūtra as part of the climactic sequence of the chapter. He emphasizes that the sūtra answers an objection that might be raised against the cosmic identifications of the previous sūtras: would not the realized practitioner be disturbed by their participation in cosmic activity? The sūtra resolves this concern.",asu:"Adi Suyash treats this sūtra as one of the most important practical assurances in the text. The practitioner is told plainly: do not worry that engaging in cosmic activity will undermine your realization. The realization is not delicate; it is the very witness-nature of awareness. He emphasizes that this teaching is profoundly liberating."}},
{n:"sukha-asukhayor bahir-mananam",r:"ŚS 3.33",sk:"सुखासुखयोर्बहिर्मननम्",d:"Pleasure and Pain Are External (Considerations) — Pleasure and pain are external (considerations) — (to be thought of as external rather than as one's own).",det:{skt:"सुखासुखयोर्बहिर्मननम्",tr:"Pleasure and pain are external (considerations) — (to be thought of as external rather than as one's own).",c:"Kṣemarāja explains that this sūtra prescribes a specific contemplative orientation for the realized practitioner. Pleasure and pain — the most basic structure of conditioned experience — are to be regarded as external to one's true Self. They occur in experience but do not belong to the supreme awareness that is the realized practitioner's true identity.",ksm:"Kṣemarāja explains that this sūtra prescribes a specific contemplative orientation for the realized practitioner. Pleasure and pain — the most basic structure of conditioned experience — are to be regarded as external to one's true Self. They occur in experience but do not belong to the supreme awareness that is the realized practitioner's true identity. He emphasizes that this is not denial of feeling or anaesthesia. The realized practitioner still experiences pleasure and pain; they are not numb.",lkj:"Lakshmanjoo taught this sūtra with characteristic practical wisdom. He observed that most spiritual paths address pleasure and pain by trying to reduce or eliminate them. The Kashmir Śaiva path takes a different approach: pleasure and pain are not to be eliminated but to be repositioned in one's understanding. He often described what this repositioning looks like in practice. The realized practitioner enjoys what is enjoyable; they dislike what is unpleasant. But neither response defines them.",jds:"Singh provides extensive commentary on this sūtra as one of the most psychologically important in the text. He emphasizes that the teaching is not Stoic suppression but a precise repositioning of pleasure and pain within the practitioner's self-understanding. Singh notes that this teaching has parallels in other non-dual traditions but is distinctively Kashmir Śaiva in its emphasis on the experiential dimension.",asu:"Adi Suyash treats this sūtra as one of the most useful practical teachings in the chapter. The practitioner is given a specific orientation that can be applied directly: regard pleasure and pain as external rather than as one's own essential identity. He emphasizes that this orientation can be practiced even before full realization."}},
{n:"tad-vimuktas tu kevalī",r:"ŚS 3.34",sk:"तद्विमुक्तस्तु केवली",d:"One Freed (from these Externals) is the Solitary One — But one who is freed from these (externals of pleasure and pain) is the Solitary One (kevalin).",det:{skt:"तद्विमुक्तस्तु केवली",tr:"But one who is freed from these (externals of pleasure and pain) is the Solitary One (kevalin).",c:"Kṣemarāja explains that the practitioner who has genuinely succeeded in regarding pleasure and pain as external (3.33) is called the kevalin — the Solitary One. The term derives from kaivalya, the supreme isolation or uniqueness that is the goal of certain yogic traditions.",ksm:"Kṣemarāja explains that the practitioner who has genuinely succeeded in regarding pleasure and pain as external (3.33) is called the kevalin — the Solitary One. The term derives from kaivalya, the supreme isolation or uniqueness that is the goal of certain yogic traditions. He emphasizes that the Kashmir Śaiva use of kevalin differs subtly from its use in classical Sāṃkhya-Yoga, where it refers to the absolute isolation of the puruṣa from prakṛti. In Kashmir Śaivism, the kevalin is the one who has attained perfect identification with the supreme — not isolated from the world but uniquely established in the supreme consciousness that pervades all.",lkj:"Lakshmanjoo described the kevalin with characteristic clarity. He emphasized that the term refers to a particular quality of the realized practitioner: a quality of standing alone in their essential nature, not dependent on the structures that bind ordinary people. He often noted that this quality is recognizable. The kevalin moves through the world with a kind of completeness that the ordinary person does not have. They are not lonely (loneliness implies missing connection), but they are uniquely whole within themselves.",jds:"Singh provides extensive philological commentary on the term kevalin, tracing its use through classical Sāṃkhya-Yoga and into the Kashmir Śaiva tradition. He emphasizes that while the term is shared across traditions, its meaning is subtly different in each. Singh notes that this sūtra describes one of the practical fruits of the previous sūtra's prescription. The practitioner who has succeeded in repositioning pleasure and pain naturally becomes the kevalin.",asu:"Adi Suyash treats this sūtra as describing one of the most distinctive qualities of the realized practitioner. The kevalin is uniquely themselves — neither defined by external circumstances nor dependent on external validation. He emphasizes that this state is the natural fruit of the practice prescribed in 3.33."}},
{n:"moha-pratisaṃhatas tu karmātmā",r:"ŚS 3.35",sk:"मोहप्रतिसंहतस्तु कर्मात्मा",d:"But One Whose Nature is Action is Bound by Delusion — But one whose nature is (compulsive) action is bound up with delusion.",det:{skt:"मोहप्रतिसंहतस्तु कर्मात्मा",tr:"But one whose nature is (compulsive) action is bound up with delusion.",c:"Kṣemarāja explains that this sūtra provides the contrast to 3.34. Where the kevalin is freed from the binding structures of pleasure and pain, the karmātmā — the one whose nature is bound up with action — is intertwined with delusion. The two states are mutually exclusive.",ksm:"Kṣemarāja explains that this sūtra provides the contrast to 3.34. Where the kevalin is freed from the binding structures of pleasure and pain, the karmātmā — the one whose nature is bound up with action — is intertwined with delusion. The two states are mutually exclusive. He emphasizes that the 'action' referred to here is specifically compulsive action — action driven by the misidentification of self with circumstance. Not all action is binding; the realized practitioner also acts. But their action arises from recognition rather than from compulsion. Kṣemarāja further notes that the diagnostic value of this sūtra.",lkj:"Lakshmanjoo taught this sūtra with great practical emphasis. He observed that the work of the path is largely the work of gradually transforming compulsive action into free action. He often described how the practitioner can begin this work even at early stages. By bringing attention to one's actions — even simple ones like eating, walking, speaking — one can begin to discriminate between the compulsive and the free. Lakshmanjoo also stressed that this is gradual work. No practitioner suddenly transitions from completely compulsive to completely free.",jds:"Singh provides important philological commentary on the term pratisaṃhata, which connotes being closely bound together or intertwined. The karmātmā is not merely affected by delusion but intertwined with it; the two are inseparable. Singh notes that this sūtra's contrast with 3.34 is structurally important. Together they establish the bipolar distinction that runs through the chapter: kevalin versus karmātmā, freed versus bound, recognition versus delusion.",asu:"Adi Suyash treats this sūtra as serving an important diagnostic function. Together with 3.34, it establishes the contrast that helps the practitioner locate themselves on the path. He emphasizes that this is not meant to be discouraging for those who find themselves still on the karmātmā side. Recognition that one is still bound by compulsive action is itself the first step toward becoming free."}},
{n:"bheda-tiraskāre sargāntara-karma",r:"ŚS 3.36",sk:"भेदतिरस्कारे सर्गान्तरकर्म",d:"When Difference Vanishes, Creating Another World Becomes Possible — When the (sense of) difference is removed, the action of (creating) another world becomes (the practitioner's).",det:{skt:"भेदतिरस्कारे सर्गान्तरकर्म",tr:"When the (sense of) difference is removed, the action of (creating) another world becomes (the practitioner's).",c:"Kṣemarāja explains that this sūtra describes another remarkable capacity of the practitioner who has progressed sufficiently. When the sense of difference between self and others, between consciousness and content, between subject and object has been removed, the practitioner gains the capacity to bring forth 'another world' — a new manifestation arising from their own power.",ksm:"Kṣemarāja explains that this sūtra describes another remarkable capacity of the practitioner who has progressed sufficiently. When the sense of difference between self and others, between consciousness and content, between subject and object has been removed, the practitioner gains the capacity to bring forth 'another world' — a new manifestation arising from their own power. He emphasizes that this teaching is the continuation of 3.30 (the universe is the expansion of his own power). Where 3.30 stated the general principle, this sūtra describes its specific application: with the removal of difference, the practitioner can actually participate in cosmic creation.",lkj:"Lakshmanjoo spoke carefully about this sūtra. He acknowledged that it describes a real capacity but warned against any naive understanding. The practitioner does not become a sorcerer manipulating physical reality through willpower. He often described what this capacity actually looks like in practice. The realized practitioner can shape their experiential world in ways that ordinary people cannot — bringing forth circumstances that align with their being, drawing collaborators who support their work, generating beauty and meaning in their environment.",jds:"Singh provides extensive philological commentary on this technically complex sūtra. He emphasizes that the Sanskrit is carefully chosen to convey both the reality of the capacity and its specific character — a capacity for participating in cosmic creation rather than for ego-driven manipulation. Singh notes that this sūtra has been the subject of significant interpretive debate. Some have read it in dramatic supernatural terms; others have read it in more measured contemplative terms.",asu:"Adi Suyash treats this sūtra as continuing the description of the cosmic dimensions of the realized practitioner's life. With the dissolution of difference, the practitioner participates in cosmic creation. He emphasizes that this teaching is meant to inspire rather than to be exploited."}},
