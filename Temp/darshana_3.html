{tab:"Kena, Kaṭha, Īśā, Śveta",title:"Kena, Kaṭha, Īśā, and Śvetāśvatara Upaniṣads",sub:"Middle Upaniṣads — the paradox of knowing brahman, Yama's teaching on the self, the first verse of the Upaniṣads, and theistic Vedānta",
legend:[{c:C.amber,t:"Śaṅkara·Advaita"},{c:C.teal,t:"Rāmānuja·Viśiṣṭādvaita"},{c:C.blue,t:"Madhva·Dvaita"},{c:C.purple,t:"Core Teaching"}],
branches:[
{name:"Kena Upaniṣad",ref:"Sāmaveda · 4 adhyāyas",color:C.amber,children:[
{n:"By whom is the mind directed? — The paradox of brahman-knowledge",r:"KenaU 1.1–2.4",d:"That which is not thought by the mind but by which, they say, the mind thinks — know that alone as brahman",
det:{skt:"यन्मनसा न मनुते येनाहुर्मनो मतम् — तदेव ब्रह्म त्वं विद्धि",
tr:"That which is not thought by the mind, but by which, they say, the mind thinks — know that alone as brahman.",
c:"The Kena's opening question is the most paradoxical in all the Upaniṣads: 'By whom willed does the mind fall upon its objects? By whom directed does the first breath arise? By whom willed do men utter speech?' Each answer names something finer than the previous, until the text arrives at brahman — which is not grasped by the eye, not known by the mind, not attained by speech, but which is precisely that by which seeing, knowing, and speaking are possible. This is the 'unknown knower' paradox: brahman cannot be an object of knowledge because it is the ground of all knowing.",
shk:"Śaṅkara: 'yad manasā na manute' (not thought by the mind) does not mean that brahman is unknown — it means that brahman cannot be an object (viṣaya) of the mind the way any other known thing is an object. Brahman is the self (sva-svarūpa) of the knowing mind — the seer cannot be seen, the knower cannot be known, except as itself. The method: kena-jijñāsā — asking 'by whom?' recursively, until arriving at the one that asks without being able to be asked about.",
rmj:"Rāmānuja: brahman/Īśvara is indeed not grasped by the ordinary mind — not because Īśvara lacks qualities or is purely formless, but because Īśvara's infinite qualities transcend the finite mind's capacity. Devotional experience (bhakti prapatti) provides a mode of knowing Īśvara that transcends ordinary cognition without eliminating the distinction between the knower and the known.",
mdv:"Madhva: Viṣṇu is not grasped by the ordinary mind — only by the mind purified through devotion and by Viṣṇu's own grace (prasāda). The paradox of the Kena points to Viṣṇu's transcendence of all ordinary epistemic categories while remaining concretely knowable through bhakti."}},
{n:"Yakṣa Story — Brahman's power defeats the gods",r:"KenaU 3–4",d:"The gods are humbled when they cannot identify the brahman-yakṣa; Uma reveals: it is brahman",
det:{skt:"उमा हैमवती — तद्ब्रह्मेति होवाच — ब्रह्मणो वा एतद्विजये महीयध्वम्",
tr:"Umā Haimavatī said: 'That is brahman — in brahman's victory you were celebrating.'",
c:"After a cosmic victory, the gods (Agni, Vāyu, Indra) feel pride — they attribute the victory to themselves. A yakṣa (mysterious being) appears, which none of the gods can identify. Agni tries to burn a blade of grass placed before it — cannot. Vāyu tries to blow it away — cannot. Indra approaches — the yakṣa vanishes. Uma (the goddess, identified with brahman-śakti or with brahma-vidyā) appears and reveals: the mysterious power was brahman — the gods' victory was brahman's victory, not theirs.",
shk:"Śaṅkara: the story illustrates the paradox of the previous section: brahman cannot be grasped or demonstrated by any finite power (fire, wind, even the chief of the gods). Yet when the gods abandon their pride and seek knowledge, brahman is revealed — through Uma (identified with the tradition of brahman-knowledge itself). Liberation requires the dissolution of the pride that appropriates brahman's power as one's own.",
rmj:"Rāmānuja: Uma is the divine śakti of Īśvara — Lakṣmī, the consort and inseparable power of Viṣṇu. The story teaches that knowledge of Īśvara comes through Īśvara's śakti (grace mediated by Lakṣmī), not through the gods' own power. This is Rāmānuja's basis for prapatti (surrender to Lakṣmī-Nārāyaṇa as the means to liberation).",
mdv:"Madhva: Uma is Lakṣmī — Viṣṇu's śakti and the mediator of brahman-knowledge. The story teaches that even the great gods (Agni, Vāyu, Indra) are entirely dependent on Viṣṇu's power. The victory belongs to Viṣṇu (brahman), not to the gods — a foundational statement of Dvaita's hierarchy of realities."}}
]},
{name:"Kaṭha Upaniṣad",ref:"Kṛṣṇa Yajurveda · 2 adhyāyas",color:C.teal,children:[
{n:"Nachiketas and Yama — The Teaching on the Self",r:"KaṭhU 1.2.18–1.2.25",d:"The self is not born, does not die; it was not, will not be; it is unborn, eternal, ancient, not killed when the body is killed",
det:{skt:"न जायते म्रियते वा विपश्चित् — नायं हन्ति न हन्यते",
tr:"The wise self is not born, nor does it die. It is not that it will be or was. It is unborn, eternal, ancient — it is not killed when the body is killed.",
c:"Nachiketas chooses the third boon from Yama (the god of death): the knowledge of what happens after death. Yama first offers wealth, pleasure, and power — all refused. Then Yama teaches: the self (ātman) is neither born nor dies; it is eternal, unchanging, ancient. It does not kill and is not killed. Smaller than the smallest, greater than the greatest, it is hidden in the heart — known by the grace of the creator (not by mere effort or ritual). Only the self can know the self.",
shk:"Śaṅkara: this passage is the definitive Upaniṣadic statement of the ātman's absolute transcendence of birth and death. The 'wise self' (kavir maniṣī paribhūḥ svayambhūḥ) — the knowing, all-pervading, self-existent — is brahman itself. Liberation = direct knowledge of this teaching as one's own nature (sāhanta-pratyaya — the immediate sense 'I am this eternal reality').",
rmj:"Rāmānuja: the ātman described is the individual jīva, which is indeed eternal and unborn — it does not die with the body but continues. However, the jīva is not identical with brahman/Īśvara — it is a mode of Īśvara, eternally dependent on him. The jīva's eternity is derived from Īśvara, not inherent in isolation.",
mdv:"Madhva: the ātman is the individual jīva — eternal, distinct from the body, distinct from Viṣṇu. The jīva's eternality is Viṣṇu's gift — the jīva exists by Viṣṇu's constant sustaining act. The passage describes the jīva's dignity and eternal nature, not its identity with Viṣṇu."}},
{n:"Mahāvākya Context — Aṅguṣṭha-Mātra Puruṣa",r:"KaṭhU 2.1.12",d:"The self is the size of a thumb — the inner self in the heart of all beings",
det:{skt:"अङ्गुष्ठमात्रः पुरुषो मध्य आत्मनि तिष्ठति",tr:"A person the size of a thumb stands in the middle of the self.",
c:"The famous 'thumb-sized person' (aṅguṣṭha-mātra puruṣa) located in the heart is one of the Upaniṣads' most discussed images. It seems to describe the ātman as located in the heart and of a specific size — apparently contradicting the other descriptions of ātman as all-pervading and formless. Various reconciliations: the 'size of a thumb' refers to the heart-space (dahara ākāśa); the 'person' in the heart is the reflected consciousness (chidābhāsa) not the absolute ātman; the description is for meditation purposes (upāsanā), not an ontological statement.",
shk:"Śaṅkara: the thumb-sized person is a meditation support (pratīkopāsanā) — a way of focusing the mind on the ātman's presence in the heart. The true ātman is neither small nor large, neither located nor unlocated — all spatial qualifications are superimposed. The meditation on the heart-point is valuable as a preliminary practice that concentrates the mind before the final recognition of ātman as spaceless, sizeless awareness.",
rmj:"Rāmānuja: the thumb-sized person is Īśvara dwelling in the individual's heart — a real, personal presence of the infinite God within the finite jīva. This is the antaryāmin teaching: Īśvara, the inner controller, dwells in the heart of every being and is the true 'person' there. The jīva's heart is Īśvara's dwelling place — a deeply intimate relationship that is the foundation of bhakti.",
mdv:"Madhva: the thumb-sized person is Viṣṇu (or his form Aniruddha) dwelling in the heart of every jīva as the inner controller. The jīva-body is Viṣṇu's dwelling; Viṣṇu does not become small — his form appears thumb-sized relative to the heart-space while remaining infinite in his own nature."}}
]},
{name:"Īśā Upaniṣad",ref:"Śukla Yajurveda · 18 verses",color:C.blue,children:[
{n:"Īśāvāsyam Idaṃ Sarvam — The First Verse",r:"ĪśāU 1",d:"All this — whatever moves in this moving world — is clothed (enveloped) by the Lord",
det:{skt:"ईशावास्यमिदं सर्वं यत्किञ्च जगत्यां जगत् — तेन त्यक्तेन भुञ्जीथाः",
tr:"All this — whatever moves in this moving world — is enveloped by the Lord. Enjoy by renouncing; do not covet anyone's wealth.",
c:"The Īśā Upaniṣad opens with one of the most concentrated statements in Indian spiritual literature: the entire moving world (jagat) is pervaded (enveloped, clothed) by the Lord (Īśā). Therefore the proper attitude toward the world is <em>tena tyaktena bhuñjīthāḥ</em> — 'enjoy by renouncing' — taking what is given without grasping, using the world without appropriating it. The second line adds: 'do not covet anyone's wealth.' The double implication: the world belongs to the Lord, not to us; and the one who knows this lives in the world fully but without ownership.",
shk:"Śaṅkara: 'Īśā' (the Lord) refers to the supreme brahman as it appears when considered as the ruler/controller of the world. 'Enveloped by the Lord' means that brahman is the substratum of all — the world is brahman plus nāmarūpa (name-and-form superimposition). The verse is for the person who still perceives the world as real — they are to engage with it as brahman's domain, not as their own. For the jñānī who has realised brahman directly, the question of 'possessing' or 'renouncing' the world no longer arises.",
rmj:"Rāmānuja: 'Īśā' is Īśvara — the personal God, Viṣṇu — who pervades (vāsayati) the entire world because the world is his body. The verse teaches the proper devotional attitude: recognising that all belongs to Īśvara, the devotee accepts what is given as Īśvara's prasāda (grace-gift) and does not covet what belongs to others. This is the foundation of Rāmānuja's ethics of prasādabhojanam (eating what is given as grace).",
mdv:"Madhva: 'Īśā' is Viṣṇu — the supreme Lord who pervades the world and controls it from within. Everything in the world belongs to Viṣṇu; human beings are trustees (not owners) of the world's goods. The verse prescribes a life of dedicated service (sevā) — using the world's gifts in Viṣṇu's service, not hoarding them."}},
{n:"Avidyā and Vidyā — Both Must Be Known",r:"ĪśāU 9–11",d:"Those who worship avidyā enter blinding darkness; those who worship vidyā enter even greater darkness — both must be known together",
det:{skt:"अन्धं तमः प्रविशन्ति येऽविद्यामुपासते — ततो भूय इव ते तमो य उ विद्यायां रताः",
tr:"Those who worship avidyā enter blinding darkness — those who are devoted to vidyā enter even greater darkness.",
c:"One of the most paradoxical passages in the Upaniṣads, and the most debated: those who practise avidyā (usually rendered as ritual action, the karma-kāṇḍa) fall into one darkness; those who practise vidyā (usually rendered as meditation, upāsanā, or jñāna) fall into an even greater darkness. The key: both alone are insufficient. Only one who knows both avidyā AND vidyā and knows how they relate — crosses death through avidyā and attains immortality through vidyā.",
shk:"Śaṅkara: 'avidyā' here means karma (ritual action) — which is 'not-knowledge' in the sense of not being brahma-jñāna. 'Vidyā' means upāsanā (meditation on saguna brahman). Both alone are insufficient: karma alone leads only to rebirth in other realms (heavenly but not liberated); saguna upāsanā alone produces only a refined spiritual state without direct liberation. The combination: use karma to purify the mind; use upāsanā to cultivate the mind; then move to nirguna jñāna — liberation. However, Śaṅkara maintains that karma and jñāna cannot be practised simultaneously for the same purpose — they are ultimately sequential.",
rmj:"Rāmānuja: 'avidyā' means bhakti-devoid ritual action; 'vidyā' means upāsanā of Īśvara. The verse teaches the harmony of karma and jñāna-bhakti: ritual action (karma) performed as worship of Īśvara (integrated with bhakti) is not a mere path to heavenly birth but a path to Īśvara's proximity. The 'even greater darkness' of vidyā alone refers to dry philosophical knowledge divorced from devotional practice — which produces pride rather than liberation.",
mdv:"Madhva: 'avidyā' means ritual action not dedicated to Viṣṇu; 'vidyā' means philosophical knowledge about Viṣṇu without genuine bhakti. The verse condemns both as insufficient. What is required: both karma and jñāna fully integrated with bhakti-to-Viṣṇu. This is Madhva's complete path: jñāna-karma-bhakti as a triad."}}
]},
{name:"Śvetāśvatara Upaniṣad",ref:"Kṛṣṇa Yajurveda · 6 adhyāyas",color:C.green,children:[
{n:"Eko Devaḥ — One God in All Beings",r:"ŚvetU 6.11",d:"One God, hidden in all beings, all-pervading, the inner self of all, the witness",
det:{skt:"एको देवः सर्वभूतेषु गूढः — सर्वव्यापी सर्वभूतान्तरात्मा — कर्माध्यक्षः सर्वभूताधिवासः — साक्षी चेता केवलो निर्गुणश्च",
tr:"One God, hidden in all beings, all-pervading, the inner self of all beings, the overseer of all actions, the dweller in all beings, the witness, the conscious one, the absolute (kevala), and without qualities (nirguṇa).",
c:"The Śvetāśvatara Upaniṣad is the most theistic of the principal Upaniṣads and provides the foundational text for Śaiva Vedānta. The verse combines apparently contradictory attributes: nirguṇa (without qualities — the Advaita position) and yet the personal overseer of all actions, the witness, the conscious one (attributes that imply a qualified, personal God). This combination makes the Śvetāśvatara the primary battleground for the three Vedāntic schools.",
shk:"Śaṅkara: 'nirguṇa' is the primary characteristic — brahman has no guṇas (qualities) in the ontological sense of having accidental properties. The other descriptions (overseer, witness, conscious) are upādhi-relative (relative to the limiting adjuncts of individual beings). As the all-pervading substratum of all beings, brahman appears as their 'inner self' and 'overseer' — but these are phenomenal designations, not ultimate characterisations of nirguṇa brahman.",
rmj:"Rāmānuja: 'nirguṇa' means 'free from defects and limitations' (nirgata-heya-guṇa), not 'without positive qualities.' Īśvara is nirguṇa in the sense of being without any limiting, defective qualities — but he is infinitely qualified with positive attributes (omniscience, omnipotence, infinite bliss, etc.). The verse is a direct description of Īśvara's real nature as the antaryāmin-overseer of all beings.",
mdv:"Madhva: the verse is a direct description of Viṣṇu's nature and his relation to the world. 'Nirguṇa' means free from the guṇas of prakṛti (sattva, rajas, tamas) — not free from positive divine attributes. Viṣṇu's positive qualities (jñāna, bala, aiśvarya, śakti, vīrya, tejas) are infinite and eternal. The Śvetāśvatara is the Vedantic text most supportive of Madhva's theistic Dvaita."}},
{n:"Rudra Invocations — God as Creator, Preserver, Destroyer",r:"ŚvetU 3.1–3.8",d:"Thou art woman, thou art man; thou art youth and maiden; thou art the dark-blue bird, the green-eyed with red eyes",
det:{skt:"त्वं स्त्री त्वं पुमान् असि — त्वं कुमार उत वा कुमारी — त्वं नीलः पतङ्गो हरितो लोहिताक्षः",
tr:"You are woman, you are man; you are youth and maiden; you are the dark-blue butterfly, the green parrot with red eyes.",
c:"One of the most celebrated passages in the Śvetāśvatara: the entire variety of existence — all genders, ages, creatures, colours, forms — is identified as the manifestation of the one God (Rudra/Śiva in context, brahman in the Vedāntic reading). Every being is a face of the one divine reality. The specificity is striking: not abstract unity but the concrete multiplicity of a blue butterfly, a green parrot with red eyes, a season, a tree.",
shk:"Śaṅkara: the verse teaches the Upaniṣadic method of seeing brahman in all forms — not as a metaphor but as a real recognition. Since brahman is the one substance underlying all appearances, every appearance is, in essence, brahman. The diversity of forms is the play of māyā (creative power) on the one substratum.",
rmj:"Rāmānuja: the verse teaches that Īśvara pervades all beings as their inner self and takes all forms as his body. 'You are woman, you are man' means 'you are the inner self of all women and men.' The divine presence in all beings makes the world a sacred domain — every creature is, in Viśiṣṭādvaita terms, a 'body of Īśvara.'",
mdv:"Madhva: Viṣṇu pervades all beings as their inner controller (antaryāmin) — he is not identical with them but present within them, sustaining them at every moment. 'You are woman, you are man' means 'you dwell within woman and man as their sustaining self.' The diversity of beings is real; Viṣṇu's presence in all of them is also real."}}
]}
]},

{tab:"Sāmaveda Upaniṣads",title:"Sāmaveda Upaniṣads (Selected)",sub:"Kena, Chāndogya (covered above) + Kena variants and additional Sāmavedic texts",
legend:[{c:C.amber,t:"Śaṅkara"},{c:C.teal,t:"Rāmānuja"},{c:C.blue,t:"Madhva"},{c:C.purple,t:"Core Teaching"}],
branches:[
{name:"Jāminīya Upaniṣad Brāhmaṇa",ref:"Sāmaveda · Jaiminīya tradition",color:C.purple,children:[
{n:"The Breath as the Eternal — Prāṇa-Brahman Teaching",r:"JUB",d:"Prāṇa is brahman — through prāṇa all beings are connected to the cosmic self",
det:{c:"The Jāminīya Upaniṣad Brāhmaṇa is one of the oldest and most archaic Upaniṣadic texts. Its central teaching: prāṇa (the cosmic life-force) is brahman. All beings breathe; their breathing is an expression of the one cosmic prāṇa that pervades and sustains the entire universe. The transition from the Brāhmaṇa-level equation 'prāṇa = breath = life = sun = brahman' to the Upaniṣadic recognition of prāṇa as pure consciousness (cit-prāṇa) is visible within this text.",
shk:"Śaṅkara: the prāṇa-brahman identification is a saguna upāsanā — meditating on the cosmic breath as brahman prepares the mind for the recognition that brahman is also the witness of all breath — the pure consciousness that neither breathes nor is breathed.",
rmj:"Rāmānuja: the prāṇa of all beings is sustained by Īśvara's prāṇa — the cosmic life-force is Īśvara's expression within the world. Meditation on prāṇa-as-brahman is a meditation on Īśvara's pervading presence within all living things.",
mdv:"Madhva: prāṇa is a manifestation of Viṣṇu's śakti within the biological world. Meditating on prāṇa leads to the recognition of Viṣṇu as the source of all life-force."}}
]},
{name:"Mahānārāyaṇa Upaniṣad",ref:"Kṛṣṇa Yajurveda / Atharvaveda · Nārāyaṇa stotras",color:C.teal,children:[
{n:"Nārāyaṇa as Para-Brahman — The Supreme",r:"MahāNāU",d:"Nārāyaṇa is the highest brahman, the paramātman, the supreme goal",
det:{skt:"नारायण परो ब्रह्म — तत्त्वं नारायणः परः",tr:"Nārāyaṇa is the highest brahman — that reality is Nārāyaṇa, the supreme.",
c:"The Mahānārāyaṇa Upaniṣad is one of the most important texts for Vaiṣṇava Vedānta. It identifies Nārāyaṇa (Viṣṇu) explicitly as para-brahman — the highest reality — and as the creator, sustainer, and destroyer of the universe. It contains the famous Puruṣa Sūkta (from the Ṛgveda) and elaborates the cosmic body of Nārāyaṇa. The Śrī Sūkta (hymn to Lakṣmī) is often attached to this Upaniṣad.",
shk:"Śaṅkara: Nārāyaṇa is brahman in his personal, saguna form — a legitimate upāsanā object for those not yet ready for the nirguna brahman teaching. The Mahānārāyaṇa is primarily a ritual text with Vedāntic overlay; its philosophical weight is secondary to the direct mahāvākya-bearing Upaniṣads.",
rmj:"Rāmānuja: the Mahānārāyaṇa is a primary scriptural authority for Viśiṣṭādvaita. 'Nārāyaṇa is para-brahman' is not a saguna approximation but a direct ontological statement: Nārāyaṇa-Viṣṇu IS brahman — the personal, qualified, supremely blissful reality. Liberation is the jīva's eternal presence in Vaikuṇṭha in the proximity of Nārāyaṇa.",
mdv:"Madhva: the Mahānārāyaṇa is one of the definitive scriptural sources for Dvaita Vedānta. 'Nārāyaṇa is para-brahman' is taken at face value: Viṣṇu/Nārāyaṇa is the supreme independent reality, the creator and sustainer of all, and the goal of liberation. Madhva cites this Upaniṣad extensively in establishing Viṣṇu's supremacy over all other deities."}}
]}
]},

{tab:"Atharvaveda Upaniṣads",title:"Atharvaveda Upaniṣads (Selected)",sub:"Muṇḍaka, Māṇḍūkya (covered) + Praśna, Atharvāṅgiras texts, Gopālatāpanī, Rāmatāpanī",
legend:[{c:C.amber,t:"Śaṅkara"},{c:C.teal,t:"Rāmānuja"},{c:C.blue,t:"Madhva"},{c:C.purple,t:"Core Teaching"}],
branches:[
{name:"Praśna Upaniṣad",ref:"Atharvaveda · 6 praśnas",color:C.amber,children:[
{n:"Six Questions — Prajāpati's Cosmic Duality and Prāṇa",r:"PraśnaU 1–6",d:"Six disciples, six questions: creation, cosmic prāṇa, superimpositions on prāṇa, the sixteen parts, Oṃkāra, and the supreme person",
det:{skt:"कस्माद्वा इमानि भूतानि जायन्ते — प्राणो वा एष यः सर्वभूतानि भजति",
tr:"From what do these beings arise? Prāṇa verily is this — the one that divides among all beings.",
c:"Six students approach the sage Pippalāda with one question each: (1) Kabaṇḍhin asks about creation — Pippalāda teaches the cosmic duality of rayi (food/matter) and prāṇa (life-force) as prakṛti and puruṣa. (2) Bhārgava asks: 'Which deities support the creature?' — answer: prāṇa, who is the chief, supported by speech, eye, ear, and mind. (3) Kausalya asks about prāṇa's origin and how it enters the body — taught as the fundamental life-force that divides into five (prāṇa, apāna, vyāna, samāna, udāna). (4) Sauryāyaṇi asks who sleeps and who wakes — the mind (manas) sleeps but prāṇa watches. (5) Śaibya asks about the sixteen parts of the self — brahman is the ocean into which the sixteen rivers flow. (6) Sukeśā asks about the supreme person revealed by Hiraṇyanābha — Pippalāda teaches about the sixteen-part puruṣa in the body.",
shk:"Śaṅkara: the Praśna's six-question structure is a pedagogical ascent from the grossest (creation, matter) to the subtlest (the supreme person in the body = ātman = brahman). Prāṇa as the chief of the faculties is a saguna upāsanā — a meditation on brahman in its life-force aspect. The sixth question's 'supreme person' is brahman itself.",
rmj:"Rāmānuja: the six questions trace the path from material existence to the supreme Īśvara. Prāṇa as the chief of faculties is Īśvara's instrument within the body — the life-force that Īśvara sustains and directs. The 'supreme person' of the sixth question is Īśvara, the paramātman who dwells in the heart.",
mdv:"Madhva: the Praśna teaches the hierarchy of dependence: all the faculties depend on prāṇa, prāṇa depends on the jīva, the jīva depends on Viṣṇu. The 'supreme person' (paramapuruṣa) of the sixth question is Viṣṇu."}}
]},
{name:"Gopālatāpanī Upaniṣad",ref:"Atharvaveda · Kṛṣṇa-Vaiṣṇava",color:C.blue,children:[
{n:"Gopāla-Kṛṣṇa as Para-Brahman",r:"GopālaTāpU",d:"Kṛṣṇa (Gopāla) is brahman — the supreme reality playing among the gopis",
det:{skt:"गोपालो देवकीपुत्रः — कृष्णो ब्रह्म सनातनम्",tr:"Gopāla, the son of Devakī — Kṛṣṇa is eternal brahman.",
c:"The Gopālatāpanī is the primary scriptural authority for the Gauḍīya Vaiṣṇava tradition (Caitanya school). It explicitly identifies Kṛṣṇa (the cowherd-avatar) as the supreme brahman — not merely an avatar of Viṣṇu but the original Person (ādipuruṣa) of whom all other divine forms are manifestations. The text includes initiatory mantras for Kṛṣṇa worship and meditations on his form.",
shk:"Śaṅkara: the Gopālatāpanī is a minor Upaniṣad; its equation of Kṛṣṇa with brahman is a saguna upāsanā — meditating on Kṛṣṇa as the form of brahman. The ultimate reality is nirguna brahman, of which Kṛṣṇa's form is one manifestation.",
rmj:"Rāmānuja: Kṛṣṇa is an avatar of Nārāyaṇa-Viṣṇu — a full, genuine manifestation of the supreme Īśvara in human form. Meditating on Kṛṣṇa is meditating on Īśvara. However, for Rāmānuja, Kṛṣṇa's supremacy is as an avatar, not as the original form of which all other forms are manifestations.",
mdv:"Madhva: Kṛṣṇa is Viṣṇu himself — the same supreme independent reality in a particular historical manifestation. The Gopālatāpanī is valid scripture; its teaching is consistent with Dvaita's identification of Viṣṇu as para-brahman."}},
{n:"Rāmatāpanī Upaniṣad — Rāma as Para-Brahman",r:"RāmaTāpU",d:"Rāma is brahman — the supreme consciousness manifest as the ideal king",
det:{skt:"राम एव परं ब्रह्म — राम एव परो हरिः",tr:"Rāma alone is para-brahman — Rāma alone is the supreme Hari.",
c:"The Rāmatāpanī (Pūrvā and Uttarā Tāpanīya) is one of the important Vaiṣṇava Upaniṣads of the Rāma tradition. It identifies Rāma (the hero of the Rāmāyaṇa) as para-brahman — not merely an avatar but the supreme reality in human form. It contains the Rāma-tāraka mantra and elaborate meditations on Rāma's form.",
shk:"Śaṅkara: Rāma as brahman is a valid upāsanā — brahman is without form in its ultimate nature but appears in this divine form for the devotee's benefit and liberation.",
rmj:"Rāmānuja: Rāma is an avatar of Nārāyaṇa — the supreme Īśvara in human form. Worship of Rāma is worship of Īśvara. The Rāmatāpanī confirms the salvific power of Rāma-bhakti.",
mdv:"Madhva: Rāma is Viṣṇu manifested in human form for specific cosmic purposes. The identification 'Rāma = para-brahman' is correct — as Viṣṇu's avatar, Rāma shares Viṣṇu's divine nature."}}
]}
]},

{tab:"Yoga & All 108 Upaniṣads",title:"Yoga Upaniṣads and Complete 108 Upaniṣad Catalogue",sub:"All 108 canonical Upaniṣads — classified and annotated",
intro:"The Muktikā Upaniṣad (1.30–39) lists 108 Upaniṣads as the complete canon. They are classified by Veda (10 Ṛgvedic, 16 Śāmavedic, 19 Śuklayajurvedic, 32 Kṛṣṇayajurvedic, and 31 Atharvavedic) and by type (Vedānta, Yoga, Śaiva, Vaiṣṇava, etc.).",
legend:[{c:C.amber,t:"Ṛgveda"},{c:C.teal,t:"Sāmaveda"},{c:C.blue,t:"Yajurveda"},{c:C.purple,t:"Atharvaveda"},{c:C.green,t:"Liberation/Yoga"}],
branches:[
{name:"Ṛgvedic Upaniṣads (10)",ref:"Ṛgveda tradition",color:C.amber,children:[
{n:"Ṛgvedic Upaniṣads — All Ten",r:"Ṛgveda",d:"Aitareya, Kaṭhāvalī, Bahvṛca, Mukhya, Saubhāgyalakṣmī, Ākṣamālika, Ātmabodha, Tripurā, Nādabindu, Mudgala",det:{c:"The ten Ṛgvedic Upaniṣads: (1) <em>Aitareya</em> — principal, containing the mahāvākya 'prajñānam brahma'; discusses creation, the cosmic self, and self-knowledge. (2) <em>Kaṭhāvalī</em> — also called Kaṭha Śruti; concerning the nature of the self. (3) <em>Bahvṛca</em> — identifies the ultimate reality as the śakti (power) of brahman, with a Śākta orientation. (4) <em>Mukhya</em> — the 'Principal' Upaniṣad; meditation on prāṇa and the five fires. (5) <em>Saubhāgyalakṣmī</em> — Śrīvidyā Upaniṣad; concerning the śrīvidyā mantra and Lakṣmī worship. (6) <em>Ākṣamālika</em> — concerning rudrakṣa beads and their significance. (7) <em>Ātmabodha</em> — attributed to Śaṅkara; teaches self-knowledge and the Advaita path. (8) <em>Tripurā</em> — Śākta text; the supreme goddess as para-brahman. (9) <em>Nādabindu</em> — Yoga Upaniṣad; on nāda (inner sound) as the means to brahman. (10) <em>Mudgala</em> — concerning the Mudgala sage's teaching on brahman.",shk:"Śaṅkara wrote a primary bhāṣya on the Aitareya Upaniṣad (among the ten principal ones). The other Ṛgvedic Upaniṣads are later compositions; Śaṅkara's Advaita framework reads all of them as pointing to nirguna brahman.",rmj:"Rāmānuja's tradition (Śrī Vaiṣṇavism) gives primary authority to the Mahānārāyaṇa and Śvetāśvatara; the Ṛgvedic minor Upaniṣads are read through the lens of Viśiṣṭādvaita.",mdv:"Madhva's tradition focuses on Vaiṣṇava texts; the Bahvṛca and Ātmabodha are read as ultimately pointing to Viṣṇu as para-brahman."}}
]},
{name:"Sāmavedic Upaniṣads (16)",ref:"Sāmaveda tradition",color:C.teal,children:[
{n:"Sāmavedic Upaniṣads — All Sixteen",r:"Sāmaveda",d:"Chāndogya, Kena (covered), Āruṇeya, Jābāla, Vajrasūchi, Mahad, Sāvitrī, Avadhūta, Gāruḍa, Maitreya, Saṃnyāsa, Kuṇḍika, Maitrayaṇīya, Vajrasūcī (Atharvaveda variant), Mano-jñāna, Saurapurāṇa",det:{c:"Principal Sāmavedic Upaniṣads beyond Chāndogya and Kena: (1) <em>Āruṇeya</em> — on renunciation; describes the paramahaṃsa saṃnyāsī's life. (2) <em>Jābāla</em> — on the holy site of Avimukta (Varanasi) and the taraka-mantra recited at the ear of the dying. (3) <em>Vajrasūchi</em> — a social-critical text arguing that true Brahminhood is defined by knowledge and conduct, not by birth. (4) <em>Maitreya</em> — on renunciation, the four āśramas, and the paramahaṃsa's state. (5) <em>Saṃnyāsa</em> — a comprehensive account of the vows and practices of the renunciant. (6) <em>Maitrayaṇīya</em> (Maitrī) — one of the most philosophically rich minor Upaniṣads; describes the three guṇas, the soul's captivity, and liberation through knowledge of the wheel of brahman. (7) <em>Kuṇḍika</em> — concerning the marks (daṇḍa, kamaṇḍalu) of the renunciant.",shk:"The Maitrāyaṇī/Maitrayaṇīya Upaniṣad is particularly important for Śaṅkara: it explicitly describes the soul's entanglement in the guṇas (in Sāṃkhya-Yoga language) and the path to liberation through knowledge of brahman. Its three-guṇa language anticipates the Bhagavad Gītā's framework.",rmj:"The Jābāla Upaniṣad's teaching on Varanasi (Kāśī) as the special site of Śiva's grace-giving at death (tāraka-brahma teaching) is important for Viśiṣṭādvaita — Rāmānuja's tradition accepts that Śiva himself (as a dependent manifestation of Īśvara/Nārāyaṇa) gives liberation to those who die in Kāśī.",mdv:"Madhva: the Vajrasūchi's critique of birth-based Brahminhood is read as pointing to the true criterion of knowledge — knowledge of Viṣṇu's supremacy and devotion to him."}}
]},
{name:"Yajurvedic Upaniṣads (51)",ref:"Śukla and Kṛṣṇa Yajurveda · 19+32 texts",color:C.blue,children:[
{n:"Śukla Yajurvedic (19) — Including Bṛhadāraṇyaka, Īśā, Jābāla",r:"Śukla YV",d:"19 Upaniṣads including the two most principal",det:{c:"The 19 Śukla Yajurvedic Upaniṣads: Bṛhadāraṇyaka (principal), Īśā (principal), Jābāla (on the sacred marks of renunciation), Haṃsa (on the swan/haṃsa as the cosmic self), Paramahaṃsa (on the liberated renunciant's life), Subāla (on the nature of the 24 tattvas in Vedāntic frame), Māntrikā (on mantra and brahman), Niralamba (on the support-less brahman — nirālamba = without support/object), Trisikhibrāhmaṇa (on yoga of the three peaks/nādis), Maṇḍalabrāhmaṇa (on the five kośas and the wheel of brahman), Adhyātma (on the inner meaning of Vedic symbols), Muktika (which lists all 108 Upaniṣads!), Paiṅgala (on the Sāṃkhya-Vedānta integrated path), Bhikṣuka (on the renunciant's begging), Turīyātīta (on the state beyond turīya), Adhyātma-Rāmāyaṇa Upaniṣad, Sarasvatīrahasya, Śāṭyāyanīya, and the Bṛhajjābāla.",shk:"The Muktika Upaniṣad (Śukla Yajurvedic) is Śaṅkara tradition's canonical list of 108 Upaniṣads — it specifically says that reciting all 108 with the Māṇḍūkya alone is sufficient for liberation, and that the Māṇḍūkya with Gauḍapāda's Kārikā is sufficient without the others for the qualified student.",rmj:"Rāmānuja's tradition gives greatest weight to the Bṛhadāraṇyaka and Chāndogya as the two main authorities. The Muktika's list is accepted as the canonical 108.",mdv:"Madhva accepts the 108-Upaniṣad canon; he wrote commentaries on several Kṛṣṇa Yajurvedic ones."}},
{n:"Kṛṣṇa Yajurvedic (32) — Including Taittirīya, Kaṭha, Śvetāśvatara",r:"Kṛṣṇa YV",d:"32 Upaniṣads — the richest tradition including major principal texts",det:{c:"The 32 Kṛṣṇa Yajurvedic Upaniṣads include all the most important after Bṛhadāraṇyaka and Chāndogya: Taittirīya (principal), Kaṭha (principal), Śvetāśvatara (principal), Mahānārāyaṇa (principal for Vaiṣṇavas), and many more: Kṛṣṇa (on Kṛṣṇa as brahman), Yoga-Tattva (on yoga metaphysics), Dhyānabindu (on meditation and nāda), Brahmavidyā (on the various methods of brahman-knowledge), Yoga-Kuṇḍalī (on kuṇḍalinī yoga), Sāṃkha (a Sāṃkhya-Vedānta synthesis), Śārīraka (on the embodied self), Yoga-Śikhā (on the crown of yoga), Garbha (on the embryo's self-knowledge), Nārayaṇa (on Nārāyaṇa's supremacy), Amṛtabindu (on the point of immortality in meditation), Amṛtanāda (on the sound of immortality), Kaivalya (on liberation through Śiva-brahman), Kālāgnirudra (on Śiva as the destroyer of time), Kāṭhaka-Śikṣā, Ṣaṭcakra-Nirūpaṇa (on the six cakras), Brahma (on brahman's nature), Śarabhā (on the fierce Śarabha form of Śiva), Skanda (on the Skanda teaching to Śiva), and others.",shk:"Śaṅkara wrote commentaries on the Taittirīya, Kaṭha, and Śvetāśvatara. The Kaivalya Upaniṣad's identification of Śiva with brahman is read by Śaṅkara as pointing to nirguna brahman appearing in Śiva's form.",rmj:"Rāmānuja's primary engagement is with Taittirīya and Śvetāśvatara — both extensively quoted in the Śrī-Bhāṣya.",mdv:"Madhva commented on the Taittirīya (Prameya-Dīpikā on the TaittU), Kaṭha, and Śvetāśvatara, establishing their Dvaita interpretations."}}
]},
{name:"Atharvavedic Upaniṣads (31)",ref:"Atharvaveda tradition",color:C.purple,children:[
{n:"Atharvavedic (31) — Muṇḍaka, Māṇḍūkya, Praśna + Major Others",r:"Atharvaveda",d:"31 texts including Muṇḍaka, Māṇḍūkya, Praśna (all principal) + Gopālatāpanī, Rāmatāpanī, Paraśurāmatāpanī, Tripura",det:{c:"The 31 Atharvavedic Upaniṣads: Muṇḍaka (principal), Māṇḍūkya (principal), Praśna (principal), Gopālatāpanī (Kṛṣṇa = brahman), Rāmatāpanī (Rāma = brahman), Śrī (Lakṣmī as para-śakti), Paraśurāmatāpanī, Hayagrīva (Viṣṇu's horse-headed form), Dattātreya (Dattātreya as the Advaita avadhūta), Garuḍa (the eagle-vehicle of Viṣṇu), Kali-Santaraṇa (on the Hare Kṛṣṇa mantra for the Kali age — fundamental for Gauḍīya Vaiṣṇavism), Nārada-Parivrājaka (on renunciation), Bhikṣuka (on the mendicant), Śāṇḍilya (on dhyāna — meditation — as the highest path), Maṇḍūkī (on the self in suṣupti), Śarabha (on Śiva's Śarabha form), Tripurātāpanī (Śākta-Vedānta), Devī (the Goddess as para-brahman), Sītā (Sītā = para-śakti), Annapūrṇā (the Goddess as the sustainer), Bhavanopaniṣad (Śrīvidyā), Kali-Santaraṇa, and others.",shk:"Śaṅkara commented on Muṇḍaka, Māṇḍūkya (with Gauḍapāda's Kārikā), and Praśna. The Māṇḍūkya-Gauḍapāda-Kārikā is arguably the most important Advaita text — it establishes the ajātivāda (doctrine of non-origination) that Śaṅkara refines into his māyā-vivartavāda.",rmj:"The Gopālatāpanī and Rāmatāpanī are important for Rāmānuja's followers — they establish Kṛṣṇa and Rāma as full manifestations of the supreme Nārāyaṇa.",mdv:"The Kali-Santaraṇa Upaniṣad is especially important for the Gauḍīya Vaiṣṇava school (Madhva's tradition as extended by Caitanya) — it gives explicit scriptural authority to the Hare Kṛṣṇa mahāmantra."}}
]},
{name:"Yoga Upaniṣads — The 20 Yoga Texts",ref:"Various Vedas — Yoga tradition",color:C.green,children:[
{n:"Twenty Yoga Upaniṣads",r:"Various",d:"Darśana, Haṃsa, Amṛtabindu, Amṛtanāda, Dhyānabindu, Brahmabindu, Nādabindu, Yoga-Tattva, Yoga-Kuṇḍalī, Yoga-Śikhā, Maṇḍalabrāhmaṇa, Trisikhibrāhmaṇa, Varāha, Śāṇḍilya, Pāśupata, Kṣurika, Tejobindu, Yoga-Cūḍāmaṇi, Sarvopaniṣattat, Ātmopaniṣad",
det:{c:"The twenty Yoga Upaniṣads form a coherent yogic sub-tradition within the larger Upaniṣadic canon. Their key themes: (1) <em>Nāda</em> (inner sound): Nādabindu, Amṛtanāda, Dhyānabindu — on ascending stages of yogic sound (from gross instruments to the inner thunder and bells, to the cosmic silence beyond all sound). (2) <em>Bindu</em> (the drop/point): Amṛtabindu, Brahmabindu, Trisikhibrāhmaṇa — on the bindu (point of consciousness) as the gateway between individual and cosmic consciousness. (3) <em>Kuṇḍalinī</em>: Yoga-Kuṇḍalī, Yoga-Śikhā — on the serpent power at the base of the spine and its ascent through the cakras. (4) <em>Haṃsa</em>: on the haṃsa (the self as the cosmic swan who discriminates between milk and water = consciousness and matter). (5) <em>Pañcakośa</em>: Varāha, Maṇḍalabrāhmaṇa — elaborating the five-sheath model within a yogic practice framework. (6) <em>Praṇava</em>: all the Yoga Upaniṣads return repeatedly to Oṃ-meditation as the central practice.",
shk:"Śaṅkara's tradition: the Yoga Upaniṣads represent legitimate paths of purification and preparation — the yogic practices (prāṇāyāma, nāda, kuṇḍalinī) are effective means for purifying the citta and making it fit for the highest knowledge. But they are not themselves liberation — only jñāna (direct non-dual knowledge) produces liberation.",
rmj:"Rāmānuja: the yoga practices described in these Upaniṣads are forms of upāsanā — they purify the antaḥkaraṇa and make possible the direct meditation on Īśvara (brahma-sākṣātkāra). The nāda-brahma teaching (brahman as inner sound) is a valid upāsanā of Īśvara in his sonic aspect.",
mdv:"Madhva: the Yoga Upaniṣads describe methods for purifying the mind and preparing it for direct devotion to Viṣṇu. The nāda, bindu, and kuṇḍalinī practices are legitimate preliminary practices; their fruits are dedicated to Viṣṇu's worship. The ultimate liberation is Viṣṇu's grace, not the yogic practice itself."}}
]}
]}
];

// VEDAS — The Four Saṃhitās
// Reference: Vedic Heritage Portal (vedicheritage.gov.in), Ministry of Culture, GoI

//   Sāmaveda (Kauthuma, Jaiminīya, Rāṇāyanīya), Atharvaveda (Śaunaka, Paippalāda).
