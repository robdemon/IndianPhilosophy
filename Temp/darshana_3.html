{n:"jāgrat-svapna-suṣupta-bhede turyābhoga-sambhavaḥ",r:"ŚS 1.7",sk:"जाग्रत्स्वप्नसुषुप्तभेदे तुर्याभोगसम्भवः",d:"The Fourth State in the Three — Even in the differentiation of waking, dreaming, and deep sleep, there arises the experience of the Fourth.",det:{skt:"जाग्रत्स्वप्नसुषुप्तभेदे तुर्याभोगसम्भवः",tr:"Even in the differentiation of waking, dreaming, and deep sleep, there arises the experience of the Fourth.",c:"Kṣemarāja gives this sūtra detailed psychological analysis. The three ordinary states — waking, dreaming, deep sleep — are the universal scaffolding of human experience. The Fourth (turya or turīya) is not a fourth state alongside them but the underlying awareness that knows all three. The sūtra asserts that this Fourth can be directly experienced 'amid' (bhede) the three, not only after them.",ksm:"Kṣemarāja gives this sūtra detailed psychological analysis. The three ordinary states — waking, dreaming, deep sleep — are the universal scaffolding of human experience. The Fourth (turya or turīya) is not a fourth state alongside them but the underlying awareness that knows all three. The sūtra asserts that this Fourth can be directly experienced 'amid' (bhede) the three, not only after them. He emphasizes ābhoga — the 'full unfolding' or 'expansive enjoyment' of the Fourth. The Fourth is not a thin or attenuated awareness but a rich, full, blissful presence that, once recognized, suffuses every moment of ordinary experience with its quality.",lkj:"Lakshmanjoo offers an intensely practical commentary on this sūtra. He says that the Fourth can be glimpsed in the transitional moments between the three ordinary states — the instant of falling asleep, the instant of waking, the moment when a dream ends and another begins. By attending closely to these transitions, the practitioner can recognize the silent, watching awareness that is always present.",jds:"Singh provides extensive commentary tracing the relationship between this Śaiva account of turya and the Vedāntic account in the Māṇḍūkya Upaniṣad. He notes that the Śaiva account is more dynamic: turya is not a quiescent witness but an active, blissful awareness whose recognition transforms the very experience of the three states.",asu:"Adi Suyash treats this sūtra as a doorway into direct contemplative inquiry. He invites the reader to observe, in their own experience, the continuity that persists across the three states. That continuity is not a thing among other things; it is the very awareness in which everything appears."}},
{n:"jñānaṃ jāgrat",r:"ŚS 1.8",sk:"ज्ञानं जाग्रत्",d:"Waking is Knowledge — Waking is (characterized by external) knowledge.",det:{skt:"ज्ञानं जाग्रत्",tr:"Waking is (characterized by external) knowledge.",c:"Kṣemarāja explains that the waking state is defined by jñāna in the sense of objective cognition: the mind operates through the senses, contacting external objects, generating perceptions, and constructing a stable world. This is the most extroverted of the three states, and the one most thoroughly structured by subject-object duality.",ksm:"Kṣemarāja explains that the waking state is defined by jñāna in the sense of objective cognition: the mind operates through the senses, contacting external objects, generating perceptions, and constructing a stable world. This is the most extroverted of the three states, and the one most thoroughly structured by subject-object duality. He notes that, paradoxically, this very dualistic structure is what makes waking the most accessible state for spiritual practice. It is in the midst of objective cognition that the practitioner can most readily test the recognition that the apparent object is in fact a modulation of one's own awareness.",lkj:"Lakshmanjoo emphasizes that 'knowledge' in this sūtra refers specifically to that mode of cognition in which the knower is implicitly separated from the known. In the waking state, this structure is most pronounced. Practice begins by softening that very separation, even while remaining fully awake.",jds:"Singh provides linguistic precision: jñāna in this context means specifically pramāṇa-jñāna — knowledge produced by the standard means of valid cognition (perception, inference, etc.). This sets up a contrast with the more inward forms of knowing characteristic of dream and deep sleep.",asu:"Adi Suyash treats this sūtra as a simple definitional moment. Knowing this clearly is the first step toward recognizing the same awareness operating in dream and deep sleep, where the modes of cognition appear quite different."}},
{n:"svapno vikalpāḥ",r:"ŚS 1.9",sk:"स्वप्नो विकल्पाः",d:"Dream is Mental Constructs — Dream is (characterized by) mental constructs.",det:{skt:"स्वप्नो विकल्पाः",tr:"Dream is (characterized by) mental constructs.",c:"Kṣemarāja explains that the dream state is structured not by external perception but by vikalpa — the mind's own constructive activity. In dream, the mind creates a complete world out of its own resources, populated with apparent objects and apparent selves, all of which dissolve upon waking.",ksm:"Kṣemarāja explains that the dream state is structured not by external perception but by vikalpa — the mind's own constructive activity. In dream, the mind creates a complete world out of its own resources, populated with apparent objects and apparent selves, all of which dissolve upon waking. The implicit lesson, he notes, is that the waking world is also, in a deeper sense, a kind of vikalpa — a more stable and shared construction, but a construction nonetheless. Recognizing this is a key step in the practitioner's progress.",lkj:"Lakshmanjoo describes dream as the state in which the mind plays freely with its own images. The yogic possibility, he teaches, is to maintain awareness within dream — to know one is dreaming while dreaming. This 'lucid dream' state is, on his account, a powerful contemplative laboratory.",jds:"Singh discusses the technical sense of vikalpa in Kashmir Śaiva texts: it refers to any cognition that has a determinate structure ('this is such and such'), as opposed to nirvikalpa — non-conceptual, immediate awareness. Dream is paradigmatically vikalpa; the goal of practice is to glimpse nirvikalpa even in the midst of vikalpa-activity.",asu:"Adi Suyash uses this sūtra to invite the reader to observe their own mental activity. How much of what we call 'reality' is in fact a stream of vikalpa? Becoming honest about this is the beginning of contemplative seriousness."}},
{n:"aviveko māyā sauṣuptam",r:"ŚS 1.10",sk:"अविवेको माया सौषुप्तम्",d:"Deep Sleep is Māyā, the Indiscrimination — Deep sleep, which is non-discrimination, is māyā.",det:{skt:"अविवेको माया सौषुप्तम्",tr:"Deep sleep, which is non-discrimination, is māyā.",c:"Kṣemarāja explains that deep sleep, while peaceful, is not the goal. It is a state of pure non-discrimination — but not the supreme non-discrimination that comes from recognizing the unity of all things. Rather, it is the non-discrimination of obscuration: nothing is distinguished because awareness has been temporarily withdrawn.",ksm:"Kṣemarāja explains that deep sleep, while peaceful, is not the goal. It is a state of pure non-discrimination — but not the supreme non-discrimination that comes from recognizing the unity of all things. Rather, it is the non-discrimination of obscuration: nothing is distinguished because awareness has been temporarily withdrawn. This is precisely the operation of māyā: the cosmic power that obscures distinctions and unities alike. Deep sleep, on this analysis, is a microcosm of māyā — and recognizing this is essential to understanding the structure of bondage.",lkj:"Lakshmanjoo emphasizes the difference between sauṣupti (deep sleep) and samādhi. Both are states of apparent silence. But in sauṣupti, the silence is the silence of unconsciousness; in samādhi, the silence is the silence of intensified, undivided consciousness. The yogi must learn to distinguish these two infallibly.",jds:"Singh emphasizes that the equation 'sauṣupta = māyā' is a major statement of Kashmir Śaiva soteriology. It rules out the path of seeking liberation through quietude, withdrawal, or unconsciousness. Liberation is not the cessation of awareness but the recognition of awareness's true nature.",asu:"Adi Suyash uses this sūtra to caution against confusing rest with realization. Deep sleep restores the body and quiets the mind, but it does not advance the practitioner toward recognition. The contemplative task is to find awareness even when there is nothing in particular to be aware of."}},
{n:"tritaya-bhoktā vīreśaḥ",r:"ŚS 1.11",sk:"त्रितयभोक्ता वीरेशः",d:"The Experiencer of the Three is the Lord of Heroes — The one who experiences (and masters) the three (states) is the Lord of Heroes.",det:{skt:"त्रितयभोक्ता वीरेशः",tr:"The one who experiences (and masters) the three (states) is the Lord of Heroes.",c:"Kṣemarāja explains that the 'Lord of Heroes' (Vīreśa or Vīranātha) is an epithet of Bhairava as the master of the senses and faculties, considered as 'heroes' (vīras) of the inner contest. The practitioner who has so thoroughly experienced and recognized the three states that they no longer dominate has become this Lord of Heroes.",ksm:"Kṣemarāja explains that the 'Lord of Heroes' (Vīreśa or Vīranātha) is an epithet of Bhairava as the master of the senses and faculties, considered as 'heroes' (vīras) of the inner contest. The practitioner who has so thoroughly experienced and recognized the three states that they no longer dominate has become this Lord of Heroes. Importantly, this is not the dissolution or suppression of the three states. The Lord of Heroes does not avoid waking, dreaming, or sleeping; he experiences each fully, but as the unbroken Fourth experiencing itself in three modulations.",lkj:"Lakshmanjoo explains that the Vīreśa is the practitioner in whom the senses (the inner heroes) operate under the direct sovereignty of awakened awareness. The senses are not suppressed or denied; they are commanded. They operate as instruments of the Self rather than as masters of the self.",jds:"Singh notes that this sūtra represents a high yogic attainment — the establishment of unbroken awareness across all three states. He emphasizes that the Sanskrit is carefully chosen: the practitioner does not merely witness the three states but 'enjoys' them (bhoktā), implying full participation in their content while remaining established in awareness.",asu:"Adi Suyash treats this sūtra as the climactic recognition that the three states are not three separate territories but three modes of one awareness. The practitioner who fully realizes this becomes the Vīreśa — not a remote, exalted figure, but anyone in whom this recognition is steady."}}
]},
{name:"Yogic Wonder, Will & Contemplation",ref:"ŚS 1.12–1.16",color:C.teal,children:[
{n:"vismayo yoga-bhūmikāḥ",r:"ŚS 1.12",sk:"विस्मयो योगभूमिकाः",d:"Wonder is the Stages of Yoga — Wonder (or astonishment) characterizes the stages of yoga.",det:{skt:"विस्मयो योगभूमिकाः",tr:"Wonder (or astonishment) characterizes the stages of yoga.",c:"Kṣemarāja gives this sūtra a beautiful interpretation: at every stage of the yogic path, the practitioner is overtaken by wonder. The stages of yoga are not characterized by mechanical attainment of techniques but by a recurring astonishment at the revealing of one's own nature. He emphasizes that vismaya here is not the wonder of the ordinary mind encountering something strange.",ksm:"Kṣemarāja gives this sūtra a beautiful interpretation: at every stage of the yogic path, the practitioner is overtaken by wonder. The stages of yoga are not characterized by mechanical attainment of techniques but by a recurring astonishment at the revealing of one's own nature. He emphasizes that vismaya here is not the wonder of the ordinary mind encountering something strange. It is the deeper wonder of consciousness recognizing itself, the self-astonishment of awareness discovering that it is the very thing it has been seeking.",lkj:"Lakshmanjoo emphasizes that the genuine yogī is recognizable not by serious austerity but by a quality of unsuppressible wonder. The world becomes, for such a person, perpetually astonishing — because every appearance is recognized as the play of the supreme consciousness.",jds:"Singh notes that this sūtra has been variously translated. He renders it as 'The stages of yoga are wondrous,' but acknowledges that the deeper meaning is that wonder itself is the characteristic experience of those stages. The Sanskrit allows both readings, and Kashmir Śaiva tradition embraces both.",asu:"Adi Suyash treats this sūtra as a practical compass for the practitioner. Has wonder remained alive in one's practice? Has the freshness of recognition been maintained, or has it hardened into routine? The presence or absence of vismaya is a reliable indicator of whether one is on the path or merely going through the motions."}},
{n:"icchā-śaktir umā kumārī",r:"ŚS 1.13",sk:"इच्छाशक्तिरुमा कुमारी",d:"The Power of Will is the Maiden Umā — The Power of Will is the Maiden Umā.",det:{skt:"इच्छाशक्तिरुमा कुमारी",tr:"The Power of Will is the Maiden Umā.",c:"Kṣemarāja identifies the icchā-śakti — the power of will — as the first of the three primary powers of Śiva (icchā, jñāna, kriyā: will, knowledge, action). She is called Umā because she is the consort and inseparable companion of Śiva, and Kumārī (maiden) because she is unstained by any object — she is pure intentionality, prior to all particular objects of intention.",ksm:"Kṣemarāja identifies the icchā-śakti — the power of will — as the first of the three primary powers of Śiva (icchā, jñāna, kriyā: will, knowledge, action). She is called Umā because she is the consort and inseparable companion of Śiva, and Kumārī (maiden) because she is unstained by any object — she is pure intentionality, prior to all particular objects of intention. He emphasizes that for the practitioner, recognizing the power of will as Umā is a profound shift: every act of willing, every motivation, every smallest preference is recognized as a manifestation of the goddess herself.",lkj:"Lakshmanjoo, in his recorded teachings, dwells lovingly on this sūtra. He explains that Umā represents the power of willing that does not arise from need or lack. The ordinary person's will arises from incompleteness; the goddess's will arises from fullness. To recognize one's own will as fundamentally the goddess's will is a profound liberation.",jds:"Singh provides extensive commentary on the goddess Umā in the Kashmir Śaiva pantheon. He notes that the parallel identification — icchā = Umā = Parā — is found across multiple Trika texts and represents a major theological position: that the primary divine attribute is not knowledge or action but will.",asu:"Adi Suyash treats this sūtra as an invitation to direct contemplation of will. What is willing, considered in itself, before any particular object of will? That self-existing power, prior to all particulars, is what the tradition calls Umā Kumārī — and recognizing it is recognizing the goddess."}},
{n:"dṛśyaṃ śarīram",r:"ŚS 1.14",sk:"दृश्यं शरीरम्",d:"The Visible is the Body — All that is seen (perceptible) is the body.",det:{skt:"दृश्यं शरीरम्",tr:"All that is seen (perceptible) is the body.",c:"Kṣemarāja explains this sūtra with great clarity: for the practitioner who has recognized the Self as universal consciousness, the entire perceived universe is 'body' — that is, the manifest form of the Self. Just as one's physical body is one's own and is moved by one's own will, so the entire perceptual field is the body of universal consciousness, moved by its own will.",ksm:"Kṣemarāja explains this sūtra with great clarity: for the practitioner who has recognized the Self as universal consciousness, the entire perceived universe is 'body' — that is, the manifest form of the Self. Just as one's physical body is one's own and is moved by one's own will, so the entire perceptual field is the body of universal consciousness, moved by its own will. This is not pantheism in any naive sense. The point is that the strict boundary between 'inner self' and 'outer world' dissolves in genuine recognition. What had appeared as 'other' is recognized as continuous with 'me.'",lkj:"Lakshmanjoo teaches that this sūtra has both a contemplative meaning and a yogic-energetic meaning. Contemplatively: everything I perceive is part of my own larger body of awareness. Energetically: in advanced yogic states, the boundaries of the physical body actually become fluid, and the practitioner experiences sensation throughout the entire perceptual field as if it were their own flesh.",jds:"Singh emphasizes that this sūtra represents a crucial yogic attainment — vyāpti, pervasion. The practitioner is no longer cramped into a small bodily location but recognizes themselves as pervading the entire perceptual horizon.",asu:"Adi Suyash treats this sūtra as a meditation instruction. The practitioner is invited to consider, while looking at any object: 'This too is my body.' The exercise sounds simple but, taken seriously, dissolves the ordinary sense of being a small self confronting a vast world."}},
{n:"hṛdaye citta-saṅghaṭṭād dṛśya-svāpa-darśanam",r:"ŚS 1.15",sk:"हृदये चित्तसङ्घट्टाद् दृश्यस्वापदर्शनम्",d:"By Fusing the Mind with the Heart, Perception is Transformed — By fusion of the mind with the Heart, there arises the vision of the perceptible and the void (as their true nature).",det:{skt:"हृदये चित्तसङ्घट्टाद् दृश्यस्वापदर्शनम्",tr:"By fusion of the mind with the Heart, there arises the vision of the perceptible and the void (as their true nature).",c:"Kṣemarāja explains that the 'Heart' here is not the cardiac organ but the very center of consciousness, called hṛdaya in the technical Trika vocabulary. The practice indicated is the fusion of mental activity (citta) with this central awareness.",ksm:"Kṣemarāja explains that the 'Heart' here is not the cardiac organ but the very center of consciousness, called hṛdaya in the technical Trika vocabulary. The practice indicated is the fusion of mental activity (citta) with this central awareness. When mind and Heart are truly fused — when thinking and being become a single act — the practitioner sees through both the apparent solidity of objects and the apparent emptiness of the void. Both perception and its absence are revealed as modulations of the same underlying awareness. This is a major contemplative breakthrough, well beyond the ordinary stages.",lkj:"Lakshmanjoo speaks of the saṅghaṭṭa — the intense striking-together of mind and Heart — as the moment when the two are no longer two. He emphasizes that this is not a gradual blending but a sudden, almost violent unification, after which the ordinary structure of perception is transformed.",jds:"Singh provides multiple readings: 'By the fusion of mind with the Heart, there is the vision of the perceptible as identical with the void,' or 'there is vision of the perceptible and of the void [as the same Awareness].' He notes that the Sanskrit allows both, and that both point to the same realization.",asu:"Adi Suyash treats this sūtra as a description of an advanced contemplative state. He emphasizes that the work indicated is not effortful concentration but a settling — a return of attention from its outward wandering back to the central source from which it always already arises."}},
{n:"śuddha-tattva-sandhānād vā apaśu-śaktiḥ",r:"ŚS 1.16",sk:"शुद्धतत्त्वसन्धानाद्वापशुशक्तिः",d:"Or, Through Contemplation of the Pure Principle — Or, through contemplation of the Pure Principle, (one attains) the power that is no longer that of the bound being.",det:{skt:"शुद्धतत्त्वसन्धानाद्वापशुशक्तिः",tr:"Or, through contemplation of the Pure Principle, (one attains) the power that is no longer that of the bound being.",c:"Kṣemarāja explains that the 'Pure Principle' (śuddha-tattva) is Śiva-tattva — the supreme, undifferentiated awareness that lies above and beyond all the limited principles (tattvas) of māyā. Through sustained contemplation of this Pure Principle, the practitioner transcends the state of paśu (the bound, animal-like soul) and accesses the power proper to a free being.",ksm:"Kṣemarāja explains that the 'Pure Principle' (śuddha-tattva) is Śiva-tattva — the supreme, undifferentiated awareness that lies above and beyond all the limited principles (tattvas) of māyā. Through sustained contemplation of this Pure Principle, the practitioner transcends the state of paśu (the bound, animal-like soul) and accesses the power proper to a free being. The 'or' (vā) is important: this is offered as an alternative method to those described earlier, indicating that the path is flexible and that practitioners may approach the goal through any of several legitimate routes.",lkj:"Lakshmanjoo, true to his oral teaching style, makes this sūtra vivid: 'You are not an animal! You have been thinking you are an animal — limited, fearful, struggling for survival. Recognize the Pure Principle, and that whole structure of being-an-animal collapses.' The śakti that arises is the divine power of the free being.",jds:"Singh provides technical exposition of śuddha-tattva: in the Kashmir Śaiva tattva-system, the 'pure principles' (śuddhādhvan) are the five highest tattvas — Śiva, Śakti, Sadāśiva, Īśvara, and Śuddha-vidyā — which lie above māyā. Sustained contemplation on any of these, or on their common essence, is the path indicated here.",asu:"Adi Suyash treats this sūtra as offering reassurance: there is more than one way. If the direct, sudden upsurge (sūtra 5) does not arise, the practitioner can take the more gradual route of sustained contemplation on what is pure and ultimate. The same goal is reached by either path."}}
]},
{name:"Self-Knowledge & Bliss",ref:"ŚS 1.17–1.18",color:C.green,children:[
{n:"vitarka ātma-jñānam",r:"ŚS 1.17",sk:"वितर्क आत्मज्ञानम्",d:"Reflective Inquiry is Self-Knowledge — Reflective inquiry (vitarka) is knowledge of the Self.",det:{skt:"वितर्क आत्मज्ञानम्",tr:"Reflective inquiry (vitarka) is knowledge of the Self.",c:"Kṣemarāja explains that vitarka here is not ordinary reasoning or logical analysis, but a deep contemplative reflection in which the practitioner inquires directly into the nature of the Self. This inquiry is not discursive — it does not proceed by words and arguments — but rather is a sustained, alert attention to the Self-revealing nature of awareness.",ksm:"Kṣemarāja explains that vitarka here is not ordinary reasoning or logical analysis, but a deep contemplative reflection in which the practitioner inquires directly into the nature of the Self. This inquiry is not discursive — it does not proceed by words and arguments — but rather is a sustained, alert attention to the Self-revealing nature of awareness. When such vitarka is sustained, the Self reveals itself. This is not knowledge 'about' the Self (which would be limited knowledge of the kind described in sūtra 2); it is the Self's direct knowing of itself.",lkj:"Lakshmanjoo teaches that vitarka is the practice of holding awareness gently and persistently on the question 'Who am I?' or 'What is this awareness?' — not as an intellectual puzzle but as an open, alert turning of attention. Sustained, this practice ripens into direct ātma-jñāna.",jds:"Singh notes the technical sense of vitarka in the Kashmir Śaiva tradition and contrasts it with its usage in Patañjali's Yoga Sūtras. In Patañjali, vitarka is the first level of samādhi, accompanied by gross verbal elaboration. In the Kashmir Śaiva tradition, vitarka is the wordless reflective inquiry that directly reveals the Self.",asu:"Adi Suyash treats this sūtra as a practical instruction. The practitioner is to engage in regular, sustained reflective inquiry into their own nature. Such inquiry, faithfully maintained, eventually becomes self-revealing — the inquiry itself becomes the answer."}},
{n:"lokānandaḥ samādhi-sukham",r:"ŚS 1.18",sk:"लोकानन्दः समाधिसुखम्",d:"The Bliss of the World is the Joy of Samādhi — The bliss of the world (or: the bliss of beings) is the joy of samādhi.",det:{skt:"लोकानन्दः समाधिसुखम्",tr:"The bliss of the world (or: the bliss of beings) is the joy of samādhi.",c:"Kṣemarāja interprets this sūtra in a remarkable way: for the awakened practitioner, even the ordinary joy of ordinary beings — the bliss of food, of beauty, of company — is recognized as the joy of samādhi. There is no separate, otherworldly bliss that the practitioner must seek apart from worldly experience.",ksm:"Kṣemarāja interprets this sūtra in a remarkable way: for the awakened practitioner, even the ordinary joy of ordinary beings — the bliss of food, of beauty, of company — is recognized as the joy of samādhi. There is no separate, otherworldly bliss that the practitioner must seek apart from worldly experience. This is the supreme non-dual recognition: the joy of the world and the joy of samādhi are not two. The practitioner who has truly realized this experiences ordinary life as continuously suffused with the joy of absorption.",lkj:"Lakshmanjoo speaks with feeling about this sūtra. The yogī, he says, does not retreat from worldly joy; the yogī's joy in the world becomes deeper, because every ordinary pleasure is now recognized as a wave on the ocean of supreme bliss. There is no division between the secular and the sacred for one who has realized this.",jds:"Singh emphasizes the philosophical significance: this sūtra rules out any ascetic dualism between world and spirit. The two are recognized as one, and the joy proper to each is recognized as one joy.",asu:"Adi Suyash treats this sūtra as a corrective to the assumption that spiritual joy must be separate from worldly joy. In genuine recognition, the apparent separation between the two dissolves. Ordinary delight is sacred delight in disguise."}}
]},
{name:"Powers & Mantric Mastery",ref:"ŚS 1.19–1.22",color:C.amber,children:[
{n:"śakti-sandhāne śarīrotpattiḥ",r:"ŚS 1.19",sk:"शक्तिसन्धाने शरीरोत्पत्तिः",d:"Union of Powers Produces the Body — Through the union of powers, the (yogic) body arises.",det:{skt:"शक्तिसन्धाने शरीरोत्पत्तिः",tr:"Through the union of powers, the (yogic) body arises.",c:"Kṣemarāja explains that this sūtra refers to advanced yogic experience in which the practitioner, through the unified concentration of various powers, generates a subtle body capable of accessing experiences and abilities (siddhis) unavailable to the ordinary physical body. This is not understood as supernatural but as the natural consequence of yogic integration.",ksm:"Kṣemarāja explains that this sūtra refers to advanced yogic experience in which the practitioner, through the unified concentration of various powers, generates a subtle body capable of accessing experiences and abilities (siddhis) unavailable to the ordinary physical body. This is not understood as supernatural but as the natural consequence of yogic integration. The 'body' here is the body proper to the realized yogī — a body in which all the powers of consciousness are operating in coordinated unity rather than in scattered conflict.",lkj:"Lakshmanjoo describes this sūtra as referring to a tangible attainment: when the practitioner has successfully unified the various powers (the senses, the breath, the mind, the heart), they experience a kind of luminous body — radiant, integrated, alive with subtle energy. This is recognized in the Kashmir Śaiva tradition as a definite stage of practice.",jds:"Singh provides extensive context, noting that this sūtra is part of a tradition of esoteric yogic anatomy in which various bodies (sthūla, sūkṣma, kāraṇa) are distinguished and the formation of subtle bodies through advanced practice is a recognized phenomenon.",asu:"Adi Suyash treats this sūtra as describing a recognizable milestone on the path. When practice has matured to the point where the various powers of awareness work together in unity, the practitioner experiences a distinct shift in their embodied experience — a sense of integration, radiance, and aliveness that was previously absent."}},
{n:"bhūta-sandhāna-bhūta-pṛthaktva-viśva-saṅghaṭṭāḥ",r:"ŚS 1.20",sk:"भूतसन्धानभूतपृथक्त्वविश्वसङ्घट्टाः",d:"The Triple Action on the Elements — (Other yogic powers include) the conjunction of elements, the separation of elements, and the unification of all things.",det:{skt:"भूतसन्धानभूतपृथक्त्वविश्वसङ्घट्टाः",tr:"(Other yogic powers include) the conjunction of elements, the separation of elements, and the unification of all things.",c:"Kṣemarāja explains that this sūtra catalogs three further yogic powers that arise when the practitioner has integrated the powers described in sūtra 19. These are: (1) the ability to bring together what is separate (bhūta-sandhāna), (2) the ability to distinguish and separate what is mixed (bhūta-pṛthaktva), and (3) the capacity for comprehensive unification of the totality (viśva-saṅghaṭṭa).",ksm:"Kṣemarāja explains that this sūtra catalogs three further yogic powers that arise when the practitioner has integrated the powers described in sūtra 19. These are: (1) the ability to bring together what is separate (bhūta-sandhāna), (2) the ability to distinguish and separate what is mixed (bhūta-pṛthaktva), and (3) the capacity for comprehensive unification of the totality (viśva-saṅghaṭṭa). These powers are not pursued for their own sake; they are signs that practice has reached a certain depth. The mature practitioner will neither cling to such powers nor disdain them, but recognize them as natural consequences of progress.",lkj:"Lakshmanjoo describes these powers in vivid terms: the yogī can bring together what was scattered, distinguish what was confused, and see the unity of all that exists. These are real capacities, recognized in the tradition, but the genuine practitioner does not display or exploit them.",jds:"Singh provides extensive technical exposition of these three powers and their place in the broader Trika system. He notes that they constitute a recognizable yogic taxonomy with parallels in other tantric traditions.",asu:"Adi Suyash treats this sūtra as descriptive rather than prescriptive: it tells the practitioner what kinds of capacities will emerge as practice matures. He cautions, however, that pursuing these capacities directly is a distraction; they should be allowed to arise as fruits of more fundamental practice."}},
{n:"śuddha-vidyodayāc cakreśatva-siddhiḥ",r:"ŚS 1.21",sk:"शुद्धविद्योदयाच्चक्रेशत्वसिद्धिः",d:"Through Pure Wisdom, Mastery of the Wheel — From the arising of pure wisdom, there is the attainment of lordship over the wheel (of powers).",det:{skt:"शुद्धविद्योदयाच्चक्रेशत्वसिद्धिः",tr:"From the arising of pure wisdom, there is the attainment of lordship over the wheel (of powers).",c:"Kṣemarāja explains that 'pure wisdom' (śuddha-vidyā) is the level of consciousness at which the supreme awareness is recognized as the unitary source of all manifestation. When this recognition arises, the practitioner attains 'lordship over the wheel' — mastery over the entire system of energies that constitute their experience. This is not domination in any worldly sense.",ksm:"Kṣemarāja explains that 'pure wisdom' (śuddha-vidyā) is the level of consciousness at which the supreme awareness is recognized as the unitary source of all manifestation. When this recognition arises, the practitioner attains 'lordship over the wheel' — mastery over the entire system of energies that constitute their experience. This is not domination in any worldly sense. It is the recognition that all the powers that had seemed to dominate the practitioner are in fact expressions of their own supreme awareness. With this recognition, the relationship reverses: what had been master becomes servant, or rather, recognized as the practitioner's own play.",lkj:"Lakshmanjoo teaches that the rise of śuddha-vidyā is unmistakable when it occurs. There is a sense of unprecedented clarity, freedom, and command — not arrogant command, but the natural sovereignty of awareness in its own domain. From this point, the practitioner relates to their own powers as a king to subjects, not as a slave to masters.",jds:"Singh provides detailed technical exposition of śuddha-vidyā in the Trika tattva-system. He emphasizes that this is the practitioner's actual experiential transition into the realm of the pure (śuddhādhvan), not merely an intellectual recognition.",asu:"Adi Suyash treats this sūtra as a description of a definite milestone. The arising of pure wisdom is recognizable; the lordship over the wheel that follows is tangible. The practitioner is no longer the victim of their own moods, drives, and patterns but their owner and integrator."}},
{n:"mahā-hradānusandhānān mantra-vīryānubhavaḥ",r:"ŚS 1.22",sk:"महाह्रदानुसन्धानान्मन्त्रवीर्यानुभवः",d:"Contemplation of the Great Lake Yields the Power of Mantra — From sustained contemplation of the Great Lake, there is direct experience of the potency of mantra.",det:{skt:"महाह्रदानुसन्धानान्मन्त्रवीर्यानुभवः",tr:"From sustained contemplation of the Great Lake, there is direct experience of the potency of mantra.",c:"Kṣemarāja concludes the first chapter with this culminating sūtra. The 'Great Lake' is a metaphor for the supreme consciousness — vast, deep, still, yet alive with infinite ripples. Sustained contemplation of this supreme reality reveals what makes mantra effective: not the mere sound, but the consciousness-potency (mantra-vīrya) that is identical with the practitioner's own awareness.",ksm:"Kṣemarāja concludes the first chapter with this culminating sūtra. The 'Great Lake' is a metaphor for the supreme consciousness — vast, deep, still, yet alive with infinite ripples. Sustained contemplation of this supreme reality reveals what makes mantra effective: not the mere sound, but the consciousness-potency (mantra-vīrya) that is identical with the practitioner's own awareness. This sūtra serves as a hinge to the second chapter, which explores śāktopāya — the path that operates through mantra and the powers of consciousness. The first chapter ends by pointing to what makes that next path possible: direct experiential recognition of the source of all mantric potency.",lkj:"Lakshmanjoo speaks lovingly of the 'Great Lake' (mahā-hrada) as the supreme depth of consciousness — silent, vast, fertile with all potential. To rest one's attention in that depth is to bathe in the source. From such bathing, every mantra one subsequently utters arises charged with the lake's own potency. He often emphasizes that this is the actual significance of mantra practice — not the production of effects through sound-manipulation, but the recognition of one's own depth as the very source from which sound-manipulation derives whatever efficacy it has.",jds:"Singh provides extensive scholarly treatment of mantra-vīrya as a technical term in Kashmir Śaiva mantra theory. The vīrya is not a magical attribute of certain sounds but the underlying consciousness that gives those sounds their potency. This consciousness is what the practitioner accesses through anusandhāna of the Great Lake.",asu:"Adi Suyash treats this final sūtra of the first chapter as the doorway to the second. The first chapter has set up everything: the nature of the Self, the structure of bondage, the methods of recognition, and finally — here — the source of mantric power. With this recognition in place, the practitioner is ready to engage the path of śāktopāya, which is the work of the second chapter."}}
]}
]},
{tab:"Śāktopāya",title:"Section Two — Śāktopāya",sub:"ŚS 2.1–2.10 · The Path of Energy · 10 Sūtras",
intro:"Section Two presents the Śāktopāya — the path of energy. Here the mind itself is mantra, the body is offering, and knowledge is food. Through sustained effort, contact with the guru, and awakening to the wheel of phonematic powers (mātṛkā), the limited subject is transformed into the awakened state where the very fabric of language becomes a vehicle of recognition.",
legend:[{c:C.purple,t:"Foundations"},{c:C.coral,t:"Upsurge / Turya"},{c:C.blue,t:"States of Consciousness"},{c:C.teal,t:"Practice"},{c:C.green,t:"Realization"},{c:C.amber,t:"Powers"},{c:C.sage,t:"Discipline"},{c:C.rose,t:"Liberation"}],
branches:[
{name:"Mantra & Effort",ref:"ŚS 2.1–2.3",color:C.purple,children:[
{n:"cittaṃ mantraḥ",r:"ŚS 2.1",sk:"चित्तं मन्त्रः",d:"The Mind is Mantra — The mind is mantra.",det:{skt:"चित्तं मन्त्रः",tr:"The mind is mantra.",c:"Kṣemarāja opens the second chapter by inverting the ordinary understanding of mantra. The popular conception treats mantra as a sound to be recited, with the mind as its mere mouthpiece. The sūtra reverses this: the mind itself, when turned in a particular way toward the supreme reality, is mantra.",ksm:"Kṣemarāja opens the second chapter by inverting the ordinary understanding of mantra. The popular conception treats mantra as a sound to be recited, with the mind as its mere mouthpiece. The sūtra reverses this: the mind itself, when turned in a particular way toward the supreme reality, is mantra. There is no external sacred formula that operates upon a separate ordinary mind; the mind's own activity, when properly oriented, is the sacred formula. He unpacks the etymology of mantra in his characteristic style: man- denotes thinking or pondering (manana), and -tra denotes protection (trāṇa).",lkj:"Lakshmanjoo, in his recorded teachings on the second chapter, opens by emphasizing that this sūtra is not metaphorical. It is the literal statement of what mantra is. The mind, when it has become saturated with the recognition of its true nature, is itself the mantra. The recitation of a sound-formula is a temporary aid; the real practice is the recognition. He often illustrated this teaching by pointing to moments of intense, undivided attention — in love, in art, in concentration — when the mind becomes a single focused beam.",jds:"Singh's translation 'The mind is the mantra' is accompanied by extensive philological notes tracing the technical sense of mantra in the Kashmir Śaiva texts. He distinguishes three levels of mantra: the gross sound (vaikharī), the subtle inner utterance (madhyamā), and the supreme silent vibration (parā-vāc). The sūtra refers especially to the highest level: the mind as the supreme silent vibration of pure I-consciousness. He notes that this sūtra also functions polemically.",asu:"Adi Suyash treats this opening of the second chapter as a doorway into a different mode of practice from that described in chapter one. Where the Śāmbhavopāya works through direct recognition, the Śāktopāya works through the engagement of the mind's own powers. The first such power is the recognition that the mind, properly understood, is itself the sacred formula."}},
{n:"prayatnaḥ sādhakaḥ",r:"ŚS 2.2",sk:"प्रयत्नः साधकः",d:"Persistent Effort Brings Attainment — Persistent effort is what makes (mantra) effective (and brings the practitioner to fulfillment).",det:{skt:"प्रयत्नः साधकः",tr:"Persistent effort is what makes (mantra) effective (and brings the practitioner to fulfillment).",c:"Kṣemarāja clarifies what kind of 'effort' is meant. The Sanskrit prayatna does not refer to strained, anxious, dualistic exertion — that kind of effort, by treating the goal as separate from the seeker, only reinforces bondage. The effort intended is the natural unfolding of the intention to know, the spontaneous engagement of consciousness with itself.",ksm:"Kṣemarāja clarifies what kind of 'effort' is meant. The Sanskrit prayatna does not refer to strained, anxious, dualistic exertion — that kind of effort, by treating the goal as separate from the seeker, only reinforces bondage. The effort intended is the natural unfolding of the intention to know, the spontaneous engagement of consciousness with itself. He explains that such effort is itself efficacious (sādhaka): it brings the practitioner into identity with the deity of the mantra, the consciousness that the mantra is meant to invoke. In other words, the effort and the attainment are not two separate things; the proper kind of effort is already a partial form of the attainment.",lkj:"Lakshmanjoo distinguishes carefully between strained effort and natural effort. Strained effort — the kind that arises from grasping or fear — keeps the practitioner trapped in duality. Natural effort — the kind that arises from love of the practice and recognition of its value — is what this sūtra calls prayatna. He often emphasized that the genuine practitioner is recognized not by the intensity of their strain but by the steadiness of their attention.",jds:"Singh provides extensive philological treatment of prayatna in the Kashmir Śaiva texts. He notes that the term carries connotations of both effort and result: it implies the kind of effort that, by its very nature, accomplishes its end. This is distinct from effort that may or may not succeed; the prayatna of this sūtra is intrinsically efficacious because it is the natural movement of consciousness toward self-recognition.",asu:"Adi Suyash treats this sūtra as a corrective to two opposite errors. One error is the assumption that practice is impossible because the goal is already present (a misreading of non-dual teachings). The other error is the assumption that practice is grim labor against an indifferent goal (a misreading of effort)."}},
{n:"vidyā-śarīra-sattā mantra-rahasyam",r:"ŚS 2.3",sk:"विद्याशरीरसत्ता मन्त्ररहस्यम्",d:"The Secret of Mantra is the Being of the Body of Knowledge — The luminous Being whose body is the supreme Knowledge — that is the secret of mantra.",det:{skt:"विद्याशरीरसत्ता मन्त्ररहस्यम्",tr:"The luminous Being whose body is the supreme Knowledge — that is the secret of mantra.",c:"Kṣemarāja gives this sūtra extensive technical treatment because it states the core of Kashmir Śaiva mantra-theory. The 'body of vidyā' is the luminous body of all words, all sounds, all phonemic vibrations — the entire mātṛkā-cakra introduced in sūtra 1.4.",ksm:"Kṣemarāja gives this sūtra extensive technical treatment because it states the core of Kashmir Śaiva mantra-theory. The 'body of vidyā' is the luminous body of all words, all sounds, all phonemic vibrations — the entire mātṛkā-cakra introduced in sūtra 1.4. The 'beingness' or 'luminous existence' (sattā) of this body of wisdom is the supreme I-consciousness itself: the throbbing sphurattā of Śakti, which is non-different from Śiva. He explains that this is the rahasya — the secret — of mantra. Without recognition of this luminous beingness, mantras are mere syllables. With recognition, every syllable is alive with the supreme.",lkj:"Lakshmanjoo, in his oral teaching style, expresses this sūtra as the recognition that mantra has an inner life. The outer form of mantra is the sound; the inner life of mantra is the consciousness-recognition that the sound is meant to awaken. The 'body of wisdom' is the inner life; its 'beingness' is the very pulse of recognition. He often emphasized that the practitioner who has tasted this inner life never returns to thinking of mantra as mere sound. Every recitation is now experienced as a participation in the supreme throbbing consciousness.",jds:"Singh provides a meticulous philological analysis of this sūtra, noting that each Sanskrit term has multiple registers of meaning that the commentary tradition exploits. Vidyā-śarīra can mean 'the body whose substance is wisdom,' or 'the body that is the seat of wisdom,' or 'the embodied form of the goddess Vidyā.' Sattā can mean 'existence,' 'beingness,' or 'the luminous presence of pure I-consciousness.' All these meanings operate simultaneously.",asu:"Adi Suyash treats this sūtra as the heart of the second chapter. Having established that the mind is mantra (sūtra 1) and that persistent effort is the means (sūtra 2), the text now reveals what the practice is really about: the recognition of one's own consciousness as the luminous presence that mantra embodies. He emphasizes that the term 'secret' here is precise."}}
]},
{name:"Māyā & Spontaneous Wisdom",ref:"ŚS 2.4–2.5",color:C.blue,children:[
{n:"garbhe citta-vikāso 'viśiṣṭa-vidyā-svapnaḥ",r:"ŚS 2.4",sk:"गर्भे चित्तविकासोऽविशिष्टविद्यास्वप्नः",d:"The Expansion of Mind in the Womb of Māyā — The expansion of the mind in the womb (of māyā) is the dream of undistinguished knowledge.",det:{skt:"गर्भे चित्तविकासोऽविशिष्टविद्यास्वप्नः",tr:"The expansion of the mind in the womb (of māyā) is the dream of undistinguished knowledge.",c:"Kṣemarāja explains that this sūtra describes a particular trap on the spiritual path. As practitioners develop, their minds genuinely do expand — they acquire more knowledge, more refined experiences, perhaps even certain powers (siddhis). But all this expansion, if it occurs within the 'womb' of māyā (within the limited framework of subject-object duality), is itself a kind of dream.",ksm:"Kṣemarāja explains that this sūtra describes a particular trap on the spiritual path. As practitioners develop, their minds genuinely do expand — they acquire more knowledge, more refined experiences, perhaps even certain powers (siddhis). But all this expansion, if it occurs within the 'womb' of māyā (within the limited framework of subject-object duality), is itself a kind of dream. The Sanskrit term aviśiṣṭa is key: 'undistinguished,' meaning that the practitioner has not yet distinguished the supreme vidyā (the non-dual recognition) from this ordinary expansion of knowledge.",lkj:"Lakshmanjoo speaks pointedly about this sūtra. He says that many practitioners, after years of practice, develop a satisfying inner life — perhaps they have meditative experiences, refined emotions, intellectual clarity, a sense of being 'on the path.' But all this, he warns, can still be within the womb of māyā. The genuine awakening is something else entirely. He often used the analogy of a lucid dream: in a lucid dream, the dreamer knows they are dreaming and can manipulate the dream-content, but they are still asleep.",jds:"Singh provides important context on the Sanskrit textual tradition. Bhāskara's reading is slightly different from Kṣemarāja's: where Kṣemarāja reads aviśiṣṭa ('undistinguished'), Bhāskara reads viśiṣṭo avidyā ('a distinguished form of ignorance'). The two readings reach the same essential point — that what appears as spiritual advancement within the framework of duality remains a form of dream-cognition. Singh emphasizes that this sūtra is one of the most psychologically acute in the text.",asu:"Adi Suyash treats this sūtra as a sober reality-check after the inspiring teachings of the first three sūtras. Yes, the mind is mantra; yes, effort is efficacious; yes, the secret of mantra is the luminous beingness of consciousness."}},
{n:"vidyā-samutthāne svābhāvike khecarī śivāvasthā",r:"ŚS 2.5",sk:"विद्यासमुत्थाने स्वाभाविके खेचरी शिवावस्था",d:"The Spontaneous Arising of Wisdom — the Śiva State — Upon the spontaneous arising of (supreme) wisdom, there is the khecarī (movement in the sky of consciousness) — the state of Śiva.",det:{skt:"विद्यासमुत्थाने स्वाभाविके खेचरी शिवावस्था",tr:"Upon the spontaneous arising of (supreme) wisdom, there is the khecarī (movement in the sky of consciousness) — the state of Śiva.",c:"Kṣemarāja explains that this sūtra describes the genuine awakening, in contrast to the dream of the previous sūtra. The supreme vidyā arises 'spontaneously' (svābhāvike) — not through contrived effort but through the natural unfolding of one's own essence-nature when the conditions are right. This arising is not produced; it is recognized.",ksm:"Kṣemarāja explains that this sūtra describes the genuine awakening, in contrast to the dream of the previous sūtra. The supreme vidyā arises 'spontaneously' (svābhāvike) — not through contrived effort but through the natural unfolding of one's own essence-nature when the conditions are right. This arising is not produced; it is recognized. When such recognition arises, the practitioner enters the state called khecarī — the movement in the sky of consciousness. The Sanskrit kha means both 'space' and 'consciousness'; khecarī is the goddess-mudrā that signifies free movement in the unlimited space of awareness, no longer confined to the cramped quarters of the limited self.",lkj:"Lakshmanjoo describes this sūtra as marking the culmination of the Śāktopāya path. After persistent effort with proper recognition of the secret of mantra, after vigilance against the dream of false attainment, the genuine awakening arises spontaneously. The practitioner cannot summon it, but the practitioner's preparation makes it possible. He emphasizes that 'spontaneous' does not mean 'random.' The arising is responsive to the practitioner's depth of practice and preparation.",jds:"Singh provides extensive technical treatment of khecarī mudrā as it appears in the Kashmir Śaiva tradition. He distinguishes it from the haṭha-yogic khecarī mudrā (the physical practice of turning the tongue backward to seal the upper palate) and from various tantric khecarī practices. The khecarī of this sūtra is the supreme state of consciousness, of which the various physical and tantric khecarīs are partial or preparatory expressions.",asu:"Adi Suyash treats this sūtra as the climactic recognition that the entire path has been pointing toward. The supreme vidyā arises; the practitioner moves in the sky of consciousness; the state of Śiva is realized as one's own nature. All this happens spontaneously when the preparation is sufficient."}}
]},
{name:"Guru, Mātṛkā & Inner Sacrifice",ref:"ŚS 2.6–2.10",color:C.green,children:[
{n:"gurur upāyaḥ",r:"ŚS 2.6",sk:"गुरुरुपायः",d:"The Guru is the Means — The Guru is the means.",det:{skt:"गुरुरुपायः",tr:"The Guru is the means.",c:"Kṣemarāja explains that this sūtra is among the most important in the entire text. After the description of the supreme khecarī state in the previous sūtra, the practitioner might ask: 'How is such a state attained?' The text answers in three words: the Guru is the means. He clarifies that 'Guru' here is not merely the external human teacher, though that meaning is included.",ksm:"Kṣemarāja explains that this sūtra is among the most important in the entire text. After the description of the supreme khecarī state in the previous sūtra, the practitioner might ask: 'How is such a state attained?' The text answers in three words: the Guru is the means. He clarifies that 'Guru' here is not merely the external human teacher, though that meaning is included. The Guru is, more fundamentally, the supreme grace of Śiva himself — the divine power that descends upon the practitioner and accomplishes what no human effort could accomplish.",lkj:"Lakshmanjoo, himself the last great living master of the Kashmir Śaiva lineage, spoke about this sūtra with particular weight. He emphasized that the Guru is not a person in the ordinary sense but a function — the function of awakened consciousness transmitting itself. This function can operate through many different forms, but it must operate; without it, no realization occurs. He often described his own relationship to his guru, Swami Ram, as the most important fact of his life.",jds:"Singh provides important historical and philological context. The doctrine of the Guru in Kashmir Śaivism is more emphatic than in some other traditions. Where Advaita Vedānta, for instance, allows for the possibility of self-realization through study alone, the Kashmir Śaiva tradition insists on the necessity of grace transmitted through a Guru. He notes that the brevity of the sūtra (just three words in Sanskrit) is itself significant.",asu:"Adi Suyash treats this sūtra as essential rather than ornamental. The path described in the Śiva Sūtras cannot be walked alone; it requires the relationship to a Guru in some form. This is not a cultural artifact of medieval Kashmir but a structural feature of the path itself."}},
{n:"mātṛkā-cakra-sambodhaḥ",r:"ŚS 2.7",sk:"मातृकाचक्रसम्बोधः",d:"Awakening to the Wheel of Mātṛkā — (There is) full awakening to the Wheel of the Mātṛkā (the matrix of phonemes).",det:{skt:"मातृकाचक्रसम्बोधः",tr:"(There is) full awakening to the Wheel of the Mātṛkā (the matrix of phonemes).",c:"Kṣemarāja gives this sūtra one of his most extensive treatments because it concerns the central Kashmir Śaiva doctrine of mātṛkā. The 'wheel of the Mātṛkā' is the entire system of fifty phonemes — every vowel and consonant of the Sanskrit alphabet — considered not merely as linguistic units but as living goddess-energies that generate all of cognitive experience.",ksm:"Kṣemarāja gives this sūtra one of his most extensive treatments because it concerns the central Kashmir Śaiva doctrine of mātṛkā. The 'wheel of the Mātṛkā' is the entire system of fifty phonemes — every vowel and consonant of the Sanskrit alphabet — considered not merely as linguistic units but as living goddess-energies that generate all of cognitive experience. He explains that ordinary people are dominated by the mātṛkā without being aware of it. Every thought we think is structured by language; every emotion has phonemic substrate; every perception is woven from word-traces. We live in a world made of mātṛkā, but we do not see this.",lkj:"Lakshmanjoo taught the doctrine of mātṛkā with great care, often spending entire teaching sessions on the significance of single phonemes. He explained that the practitioner who has fully awakened to the mātṛkā-cakra hears every sound — not just mantric sounds but all sounds — as the play of the goddess-energies. He often emphasized that this awakening is not exotic or distant. Every time we speak, every time we listen, every time we think, the mātṛkā is operating. The awakening is to what is already happening, not to some hidden mystical realm.",jds:"Singh provides extensive scholarly treatment of mātṛkā in the Kashmir Śaiva tradition. He traces the doctrine through the Mālinīvijaya, the Parā-trīśikā, and the Tantrāloka, showing how it functions as a central organizing principle of the entire system. He notes that the doctrine has both phonological and theological dimensions: it is at once a sophisticated theory of how phonemes generate meaning, and a theology of the goddesses who are the personifications of these generative powers.",asu:"Adi Suyash treats this sūtra as the doorway into one of the most distinctive teachings of the Kashmir Śaiva tradition. The mātṛkā doctrine is what most fundamentally distinguishes this tradition from other contemplative paths."}},
{n:"śarīraṃ haviḥ",r:"ŚS 2.8",sk:"शरीरं हविः",d:"The Body is the Offering — The body is the (sacrificial) offering.",det:{skt:"शरीरं हविः",tr:"The body is the (sacrificial) offering.",c:"Kṣemarāja gives this brief sūtra a profound interpretation. The Vedic ritual tradition offers grains, ghee, and other substances into the sacrificial fire; these are the haviḥ. The Śiva Sūtras radically internalize this practice: the body itself — and by extension, the entire perceptible field — becomes the offering, given over to the fire of recognized consciousness.",ksm:"Kṣemarāja gives this brief sūtra a profound interpretation. The Vedic ritual tradition offers grains, ghee, and other substances into the sacrificial fire; these are the haviḥ. The Śiva Sūtras radically internalize this practice: the body itself — and by extension, the entire perceptible field — becomes the offering, given over to the fire of recognized consciousness. He explains that this is not metaphor in the loose sense. It is the actual reorientation of one's relationship to embodiment. The body is no longer hoarded as 'my possession' or anxiously maintained as 'my identity.' It is offered up — surrendered, released — to the consciousness that is its true substance and source.",lkj:"Lakshmanjoo speaks of this sūtra as describing a particular contemplative orientation toward the body. The practitioner does not despise the body (as some ascetic traditions do) and does not idolize it (as some hedonistic cultures do). The body is offered — held lightly, given over to the supreme — and through this offering it is transformed. He often described the practitioner who has realized this teaching as carrying themselves differently in the world. There is less grasping, less defensiveness, less obsession with bodily preservation.",jds:"Singh provides historical context on the internalization of sacrifice (antar-yāga) in the Tantric traditions. This movement, beginning before the Common Era and reaching full development in texts like the Śiva Sūtras, fundamentally reoriented Indian religious life from external ritual performance to inner contemplative engagement. He notes that the sūtra's brevity is characteristic of its style: just two words, but containing a complete reorientation of religious practice.",asu:"Adi Suyash treats this sūtra as a powerful contemplative practice in itself. The practitioner is invited to consider, at moments throughout the day, what it would mean to truly offer the body — to release the grip of ownership, to surrender the project of maintenance, to give over what has always been holding on. He emphasizes that this offering is not a one-time event but an ongoing orientation."}},
{n:"jñānam annam",r:"ŚS 2.9",sk:"ज्ञानमन्नम्",d:"Knowledge is the Food — Knowledge is the food (of the practitioner).",det:{skt:"ज्ञानमन्नम्",tr:"Knowledge is the food (of the practitioner).",c:"Kṣemarāja explains that this brief sūtra continues the sacrificial imagery of the previous one. If the body is the offering, then the supreme knowledge is the food — both the food offered into the fire and the food on which the practitioner truly lives.",ksm:"Kṣemarāja explains that this brief sūtra continues the sacrificial imagery of the previous one. If the body is the offering, then the supreme knowledge is the food — both the food offered into the fire and the food on which the practitioner truly lives. The ordinary food that nourishes the body sustains a limited life; the supreme knowledge that nourishes the recognition sustains the unlimited life of the awakened being. He further notes a double sense: jñāna is both what the awakened practitioner eats and what is eaten in the sacrificial fire of recognition.",lkj:"Lakshmanjoo describes this sūtra in vivid terms. The genuine yogī, he says, is hungry for knowledge in the way ordinary people are hungry for food. The hunger is real, the satisfaction is real, the nourishment is real. And the practitioner who has tasted this nourishment finds ordinary food less compelling — not because it is rejected but because it has been surpassed in significance. He often emphasized that this hunger for knowledge is not intellectual curiosity. It is the deep, persistent longing for the recognition of one's own true nature.",jds:"Singh provides scholarly context for this sūtra, tracing the food-knowledge equation through earlier Indian thought. The Upaniṣads (especially the Taittirīya) develop the doctrine of food (anna) as the most accessible level of Brahman; the Kashmir Śaiva tradition takes up this doctrine and refines it.",asu:"Adi Suyash treats this sūtra as identifying the actual subsistence of the awakened life. We all know what sustains the body — food, water, rest. The sūtra identifies what sustains the awakened being: the continuous nourishment of supreme knowledge, available in every moment of recognition. He emphasizes that this nourishment is renewable and inexhaustible."}},
{n:"vidyā-saṃhāre tad-uttha-svapna-darśanam",r:"ŚS 2.10",sk:"विद्यासंहारे तदुत्थस्वप्नदर्शनम्",d:"When Wisdom Dissolves, Dream-Visions Arise From Its Residue — When (supreme) wisdom dissolves, there is the vision of the dream that arises from its residue.",det:{skt:"विद्यासंहारे तदुत्थस्वप्नदर्शनम्",tr:"When (supreme) wisdom dissolves, there is the vision of the dream that arises from its residue.",c:"Kṣemarāja concludes the second chapter with this sobering sūtra. Having described the supreme recognition (sūtra 5), the role of the Guru (sūtra 6), the awakening to the mātṛkā-wheel (sūtra 7), and the nourishment of the awakened life (sūtras 8–9), the text now warns of what happens when the supreme wisdom dissolves or is allowed to subside.",ksm:"Kṣemarāja concludes the second chapter with this sobering sūtra. Having described the supreme recognition (sūtra 5), the role of the Guru (sūtra 6), the awakening to the mātṛkā-wheel (sūtra 7), and the nourishment of the awakened life (sūtras 8–9), the text now warns of what happens when the supreme wisdom dissolves or is allowed to subside. He explains that when vidyā is dissolved — when the practitioner loses contact with the supreme recognition — the world of dream-visions reappears. This is not the ordinary dream-state of sleep but the cognitive 'dream' of ordinary dualistic experience: the appearance of a world of separate objects confronting a separate self.",lkj:"Lakshmanjoo spoke pointedly about this sūtra. He observed that many practitioners, after a powerful spiritual experience, mistakenly conclude that they have finished. The sūtra is a clear warning: even after tasting the supreme, the residues of one's prior bondage can reassert themselves and pull the practitioner back into ordinary cognition. He often described his own experience of working with students who had had genuine awakening experiences but then, over months or years, gradually returned to ordinary patterns.",jds:"Singh provides important philological detail. The compound tad-uttha is precise: 'arising from that.' What arises from that? From the dissolution of vidyā, the dream-visions arise. This is not random regression but the structural consequence of allowing the supreme recognition to subside. He emphasizes that this sūtra is one of the most psychologically realistic in the text.",asu:"Adi Suyash treats this sūtra as the realistic conclusion of the second chapter. The chapter has described the Śāktopāya path in some detail — the mantra-nature of the mind, the necessity of effort, the secret of mantra, the warning against subtle attainment, the spontaneous arising of supreme wisdom, the role of the Guru, the awakening to mātṛkā, the body as offering, knowledge as food."}}
]}
]},
{tab:"Āṇavopāya",title:"Section Three — Āṇavopāya",sub:"ŚS 3.1–3.45 · The Path of the Limited Individual · 45 Sūtras",
intro:"Section Three develops the Āṇavopāya — the path of the limited individual through breath, body, posture, and concentration. The longest section (45 sūtras) re-examines the three states of consciousness, teaches turya's saturating presence ('like oil'), and culminates in the final liberation: the casting-off of the elemental sheath and the realization that prāṇa, channels, and the ordinary cycle of eye-opening and eye-closing are themselves the play of Śiva.",
legend:[{c:C.purple,t:"Foundations"},{c:C.coral,t:"Upsurge / Turya"},{c:C.blue,t:"States of Consciousness"},{c:C.teal,t:"Practice"},{c:C.green,t:"Realization"},{c:C.amber,t:"Powers"},{c:C.sage,t:"Discipline"},{c:C.rose,t:"Liberation"}],
branches:[
{name:"Limited Self, Māyā & Emergence of Power",ref:"ŚS 3.1–3.7",color:C.purple,children:[
{n:"ātmā cittam",r:"ŚS 3.1",sk:"आत्मा चित्तम्",d:"The (Limited) Self is the Mind — The (limited) self is the mind.",det:{skt:"आत्मा चित्तम्",tr:"The (limited) self is the mind.",c:"Kṣemarāja opens the third chapter by inverting the opening sūtra of the first chapter. There, caitanyam ātmā declared that consciousness — supreme awareness — is the Self. Here, ātmā cittam declares that for the limited individual, the 'self' is identified with the mind.",ksm:"Kṣemarāja opens the third chapter by inverting the opening sūtra of the first chapter. There, caitanyam ātmā declared that consciousness — supreme awareness — is the Self. Here, ātmā cittam declares that for the limited individual, the 'self' is identified with the mind. This is precisely the predicament of the aṇu, the bound being: they take their self to be the mind rather than the supreme awareness in which the mind arises. He explains that this opening of the third chapter is diagnostic: it tells the practitioner exactly where they are. They are not yet in the state of recognizing themselves as supreme consciousness; they are still operating under the assumption that they are the mind.",lkj:"Lakshmanjoo, in his oral teachings on the third chapter, emphasized that this sūtra is the most realistic possible opening for most practitioners. We do, in fact, take ourselves to be our minds. When we say 'I think,' we mean both 'thinking is happening' and 'I am the one thinking.' This implicit identification is the very condition the third chapter addresses. He often pointed out that this identification is so deep and so habitual that most people never even notice it.",jds:"Singh's translation 'The self is mind' is supported by extensive philological notes establishing that ātmā here means the limited individual self (aṇu, jīva), not the supreme Self. He emphasizes the deliberate echo of the first sūtra of the text: where the first sūtra equated the (supreme) Self with consciousness, the present sūtra equates the (limited) self with mind. The structural parallelism is intentional and pedagogically significant.",asu:"Adi Suyash treats this opening sūtra as profoundly compassionate. The text could have continued in the lofty register of the first two chapters, addressing only those of highest receptivity. Instead, it turns explicitly toward the rest of us — those who still take ourselves to be our minds — and begins a long, patient, detailed exposition of how we, too, can walk this path."}},
{n:"jñānaṃ bandhaḥ",r:"ŚS 3.2",sk:"ज्ञानं बन्धः",d:"Knowledge (of This Limited Self) is Bondage — Knowledge (of such a limited self as ultimate) is bondage.",det:{skt:"ज्ञानं बन्धः",tr:"Knowledge (of such a limited self as ultimate) is bondage.",c:"Kṣemarāja explains that this sūtra is the direct continuation of 3.1. The identification of the self with the mind (3.1) is itself, when treated as final knowledge, the very structure of bondage. To know oneself only as the mind is to be bound to the mind's limitations: its time-boundedness, its content-dependence, its constant fluctuation.",ksm:"Kṣemarāja explains that this sūtra is the direct continuation of 3.1. The identification of the self with the mind (3.1) is itself, when treated as final knowledge, the very structure of bondage. To know oneself only as the mind is to be bound to the mind's limitations: its time-boundedness, its content-dependence, its constant fluctuation. He notes the deliberate echo of sūtra 1.2 (jñānaṃ bandhaḥ), which used the same Sanskrit words. In the context of the first chapter, that sūtra referred to limited dualistic cognition in general. In the context of the third chapter, the same words refer specifically to the limited self-knowledge that comes with identifying as mind.",lkj:"Lakshmanjoo spoke with great clarity about this sūtra. He observed that most people walk around assuming that being one's mind is just what it is to be a person. They do not see this assumption as bondage; they see it as simple reality. The first work of practice is to begin to see that this assumption is itself the bondage, that there is a much vaster reality available, and that the methods of the path can disclose it. He often used a memorable image: the bound being is like a king who has forgotten his kingdom and lives as a beggar.",jds:"Singh provides important philological commentary on the recurrence of jñānaṃ bandhaḥ in the text. The same phrase appears at 1.2 and 3.2. In 1.2, the context emphasizes the dualistic structure of ordinary cognition. In 3.2, the context emphasizes the self-misidentification that constitutes the bondage of the aṇu. The Sanskrit is identical; the contextual deepening is significant. Singh emphasizes that this sūtra is essentially the second installment of the diagnostic frame begun in 3.1.",asu:"Adi Suyash treats this sūtra as the completion of the framing that began in 3.1. Together, the two sūtras say: you take yourself to be your mind, and this identification is what binds you. With this acknowledgment in place, the chapter can move to its constructive work — the methods that lead from this bound condition toward freedom."}},
{n:"kalādīnāṃ tattvānām aviveko māyā",r:"ŚS 3.3",sk:"कलादीनां तत्त्वानामविवेको माया",d:"Māyā is Non-Discrimination of the Tattvas from Kalā Downward — Māyā is the non-discrimination of the principles (tattvas) beginning with kalā.",det:{skt:"कलादीनां तत्त्वानामविवेको माया",tr:"Māyā is the non-discrimination of the principles (tattvas) beginning with kalā.",c:"Kṣemarāja provides extensive technical exposition here. The 36-tattva system of Kashmir Śaivism orders the principles of reality from supreme Śiva (tattva 1) through pure principles (śuddha-tattvas, 1–5), māyā (tattva 6), the five kañcukas including kalā (tattvas 7–11), down through puruṣa, prakṛti, the senses, the elements, and finally pṛthvī (earth, tattva 36).",ksm:"Kṣemarāja provides extensive technical exposition here. The 36-tattva system of Kashmir Śaivism orders the principles of reality from supreme Śiva (tattva 1) through pure principles (śuddha-tattvas, 1–5), māyā (tattva 6), the five kañcukas including kalā (tattvas 7–11), down through puruṣa, prakṛti, the senses, the elements, and finally pṛthvī (earth, tattva 36). The bondage of the aṇu involves a particular kind of non-discrimination: failing to see clearly the difference between the supreme Self and each of the lower tattvas. He explains that this non-discrimination is precisely māyā in its operative form.",lkj:"Lakshmanjoo taught the doctrine of the tattvas systematically and patiently to his students. He emphasized that this knowledge is not merely theoretical but practical: the practitioner who clearly understands the tattvas knows where they are at any given moment of experience, and knows what work is needed to move toward greater recognition. He often emphasized that māyā is not an enemy to be defeated but a power to be seen through. The non-discrimination that constitutes māyā is dispelled by clear seeing, not by hostility.",jds:"Singh provides essential technical apparatus on the tattva system. He notes that the 36-tattva scheme of Kashmir Śaivism is more elaborate than the 25-tattva scheme of classical Sāṃkhya, adding the five kañcukas and the five supreme principles above māyā. The added principles allow Kashmir Śaivism to account for both the supreme reality and the structure of finite experience within a single coherent framework.",asu:"Adi Suyash treats this sūtra as opening the door to one of the most distinctive teachings of the Kashmir Śaiva path. The tattva-system provides a precise map of experience that allows the practitioner to locate themselves accurately at any moment. He emphasizes that engagement with this map is not academic."}},
{n:"śarīre saṃhāraḥ kalānām",r:"ŚS 3.4",sk:"शरीरे संहारः कलानाम्",d:"Dissolution of the Constituents (Kalā) in the Body — (One should practice) the dissolution of the constituents in the body.",det:{skt:"शरीरे संहारः कलानाम्",tr:"(One should practice) the dissolution of the constituents in the body.",c:"Kṣemarāja begins here the description of specific yogic practices that constitute the work of the Āṇavopāya. The first such practice is the contemplative dissolution of the constituent principles (kalās) within the body. The practitioner systematically traces each element of bodily experience back to its source, dissolving the identification with the constituent in the process.",ksm:"Kṣemarāja begins here the description of specific yogic practices that constitute the work of the Āṇavopāya. The first such practice is the contemplative dissolution of the constituent principles (kalās) within the body. The practitioner systematically traces each element of bodily experience back to its source, dissolving the identification with the constituent in the process. He explains that this practice can be performed in various ways. One traditional approach proceeds from gross to subtle: dissolving earth into water, water into fire, fire into air, air into ether, ether into mind, mind into intellect, intellect into ego, ego into pure I-consciousness.",lkj:"Lakshmanjoo taught the practice of dissolution (laya) with characteristic depth and patience. He emphasized that this is one of the most powerful practices available to the Āṇavopāya practitioner, but it must be performed correctly. The practitioner must not merely visualize the dissolution; they must engage it with the totality of their attention, allowing the dissolution to be experiential rather than merely conceptual. He often described variations of the practice.",jds:"Singh provides scholarly context for the practice of dissolution as it appears in Kashmir Śaiva texts. He distinguishes the various forms of laya practiced in different lineages and emphasizes that all of them share the same underlying principle: the contemplative tracing of constituent experience back to its source. Singh notes that this practice has deep roots in earlier Indian traditions — in classical Yoga, in Tantric ritual, in certain Upaniṣadic teachings.",asu:"Adi Suyash treats this sūtra as introducing the first concrete practice of the Āṇavopāya. After two diagnostic sūtras (3.1–3.2) and one structural sūtra (3.3), the chapter now begins to offer specific methods. The first method is the contemplative dissolution of the constituents in the body. He emphasizes that this practice is accessible to any sincere practitioner."}},
{n:"nāḍī-saṃhāra-bhūta-jaya-bhūta-kaivalya-bhūta-pṛthaktvāni",r:"ŚS 3.5",sk:"नाडीसंहारभूतजयभूतकैवल्यभूतपृथक्त्वानि",d:"Withdrawal of Channels, Conquest and Separation of Elements — Withdrawal of the channels, conquest of the elements, isolation of the elements, and separation of/from the elements.",det:{skt:"नाडीसंहारभूतजयभूतकैवल्यभूतपृथक्त्वानि",tr:"Withdrawal of the channels, conquest of the elements, isolation of the elements, and separation of/from the elements.",c:"Kṣemarāja explains that this sūtra catalogs the progression of yogic practices that arise as the dissolution-practice of 3.4 matures. The first step is the withdrawal of energy from the peripheral channels into the central channel (suṣumnā); this is the foundation of all higher yogic experience.",ksm:"Kṣemarāja explains that this sūtra catalogs the progression of yogic practices that arise as the dissolution-practice of 3.4 matures. The first step is the withdrawal of energy from the peripheral channels into the central channel (suṣumnā); this is the foundation of all higher yogic experience. Once this is established, the practitioner gains conquest over the elements — sovereignty over their operations. Beyond this, the elements are recognized as isolated from the experiencer. Finally, the experiencer is recognized as separate from the elements entirely.",lkj:"Lakshmanjoo taught these practices with great care. He emphasized that each stage must be accomplished before the next can be authentically attempted. Practitioners who try to skip ahead — particularly into the higher stages of bhūta-kaivalya and bhūta-pṛthaktva — without first establishing the foundations in nāḍī-saṃhāra and bhūta-jaya often experience destabilization rather than progress. He often emphasized the difference between conquest (jaya) and suppression. Bhūta-jaya is not the suppression of elemental experience but its recognition as the operation of conscious power.",jds:"Singh provides extensive philological and historical commentary. He notes that this sūtra is one of the densest in the Śiva Sūtras, packing four major yogic accomplishments into a single compound. The dense composition is characteristic of the sūtra style: the brevity is meant to provoke meditation on each constituent term.",asu:"Adi Suyash treats this sūtra as continuing the systematic exposition of practices begun in 3.4. Where 3.4 named the principle (dissolution of constituents in the body), 3.5 names the stages of progression that this dissolution-practice traverses. He emphasizes that the practitioner who engages this progression seriously will recognize each stage from their own experience as they encounter it."}},
{n:"mohāvaraṇāt siddhiḥ",r:"ŚS 3.6",sk:"मोहावरणात्सिद्धिः",d:"Powers Arise From the Veiling of Delusion — Yogic power arises from the veiling (suppression) of delusion. — OR — Yogic power arises [merely] because of the covering of delusion.",det:{skt:"मोहावरणात्सिद्धिः",tr:"Yogic power arises from the veiling (suppression) of delusion. — OR — Yogic power arises [merely] because of the covering of delusion.",c:"Kṣemarāja gives this sūtra a cautionary reading. Yogic powers (siddhis) do indeed arise from the practitioner's success in covering or veiling delusion — but this 'covering' is precisely not the same as the 'destruction' of delusion. Powers can arise when delusion is merely suppressed without being seen through.",ksm:"Kṣemarāja gives this sūtra a cautionary reading. Yogic powers (siddhis) do indeed arise from the practitioner's success in covering or veiling delusion — but this 'covering' is precisely not the same as the 'destruction' of delusion. Powers can arise when delusion is merely suppressed without being seen through. In this case, the powers come and the delusion remains, hidden but intact, awaiting only the right conditions to reassert itself. He emphasizes that this is one of the most dangerous moments on the path. The practitioner experiences impressive powers and may believe they have advanced further than they have.",lkj:"Lakshmanjoo spoke with characteristic clarity about siddhis. He acknowledged their reality — the tradition does not deny that yogic powers arise — but warned against their seductive quality. The practitioner who attains powers feels validated, special, advanced. This feeling itself is delusion, more refined than the gross delusion that has been suppressed but still essentially delusion. He often pointed out that the genuinely advanced practitioner is recognizable not by the powers they display but by the qualities they embody: humility, freedom from grasping, lightness, presence.",jds:"Singh provides extensive philological commentary on the term āvaraṇa (covering) in this sūtra. The Sanskrit allows the reading 'from the covering of delusion' (the practitioner covering or restraining delusion through practice) as well as 'from the covering by delusion' (the practitioner being still covered by delusion despite the powers). Both readings are theologically significant. Singh notes that the sūtra essentially sets up its successor (3.7).",asu:"Adi Suyash treats this sūtra as one of the most psychologically acute in the text. It identifies a real danger: that the practitioner, gaining genuine powers through genuine practice, will mistake the powers for the goal and stop short of the actual liberation that the practice is meant to facilitate. He emphasizes that the sūtra is not anti-power."}},
