builders.samkhya=function(){
const secs=[
{tab:"Introduction & Suffering",title:"Introduction — Three Kinds of Suffering",sub:"Kārikā 1–2 · Purpose and the three-fold suffering",
intro:"Īśvarakṛṣṇa begins with an existential observation rather than an abstract proposition: all living beings are motivated by the desire to overcome the three-fold suffering. The Vedic ritual means are insufficient; the Sāṃkhya investigation of the principles (tattvas) of existence is the sovereign remedy. This pragmatic motivation distinguishes Sāṃkhya from mere speculative philosophy — it is a science of liberation.",
legend:[{c:C.coral,t:"Suffering/Purpose"},{c:C.purple,t:"Metaphysics"},{c:C.teal,t:"Prakṛti/Guṇas"},{c:C.blue,t:"Puruṣa/Consciousness"},{c:C.green,t:"Liberation"},{c:C.amber,t:"25 Tattvas"}],
branches:[
{name:"Three-fold Suffering — Motivation for Sāṃkhya",ref:"SK 1",color:C.coral,children:[
{n:"Duḥkha-traya-abhighātāt jijñāsā",r:"SK 1",d:"From the assault of the three-fold suffering, the inquiry arises",
det:{skt:"दुःखत्रयाभिघाताज्जिज्ञासा तदपघाताके हेतौ",tr:"From the assault of the three-fold suffering, the desire to know (arises as to) the means of its removal.",
c:"The three modes of suffering: <em>ādhyātmika</em> — suffering arising from within oneself (physical disease, mental affliction, ignorance); <em>ādhibhautika</em> — suffering from other beings (enemies, animals, insects); <em>ādhidaivika</em> — suffering from supernatural forces (weather, celestial events, fate). These three constitute the complete field of all possible suffering.",
ex:"Ādhyātmika: the depression that descends without external cause; ādhibhautika: the injury caused by a fall or a bite; ādhidaivika: the drought that ruins the harvest. Each category has its mundane level (vyāvahārika) and its subtle metaphysical level.",
gp:"Gauḍapāda: the three-fold suffering is beginningless (anādi) and all-pervasive. The inquiry into its removal is itself the beginning of liberation — not because the question dissolves suffering immediately, but because it orients the mind correctly for the first time.",
tk:"Vācaspati Miśra (Tattvakaumudī): the word 'assault' (abhighāta) implies that suffering is not merely present but actively attacks — it is aggressive, relentless, and thorough. The jijñāsā (desire to know) is the natural counter-response of an intelligence that can reflect on its own condition.",
mat:"Māṭhara: the worldly (laukika) response to suffering is to pursue pleasure and avoid pain. The Vedic (vaidika) response is sacrificial ritual. But both are insufficient. Only the Sāṃkhya tattva-jñāna strikes at the metaphysical root."}},
{n:"Vedic means insufficient — investigation of the tattvas is the remedy",r:"SK 1–2",d:"Why ritual cannot remove suffering — and why tattva-jñāna can",
det:{skt:"दृष्टवदानुश्रविकः स विशेषः फलवत्त्वात्",tr:"The revealed (Vedic) means, like the perceived (worldly) means, is impure, perishable, and disproportionate.",
c:"The Vedic means (yajna, ritual) is rejected not as invalid but as insufficient for the purpose: (1) it is impure (aśuddha) — ritual action can generate negative side-effects (ritual impurities, the harm of the sacrificed animal); (2) it is perishable (kṣayiṣṇu) — the heavenly fruits of sacrifice are temporally bounded; (3) it is disproportionate (atiśaya) — the great suffering of saṃsāra requires a more radical remedy than a proportionate pleasure-generation. <em>Tattva-jñāna</em> — knowledge of the 25 principles of existence — is the adequate means because it removes suffering not by generating a counteracting pleasure but by uprooting the ignorance (avidyā) that causes suffering.",
gp:"Gauḍapāda: the Vedic means is like treating a symptom while the disease continues. The fruit of sacrifice (svarga) is itself within saṃsāra — bounded, impermanent, and followed by return to lower states. Tattva-jñāna is the only means that is utterly final (atyanta).",
tk:"Vācaspati Miśra: 'atyantato duḥkha-nivṛtti' — the complete and final cessation of suffering — cannot be achieved by any positive production (whether pleasure or heaven) but only by the removal of the root cause. The root cause is confusion about what one is (puruṣa-prakṛti-viveka-abhāva)."}}
]},
{name:"Twenty-Five Tattvas — The Cosmic Map",ref:"SK 3",color:C.amber,children:[
{n:"Mūla-Prakṛti — Root Nature",r:"SK 3",d:"Prakṛti is uncaused; the seven beginning with mahat are both caused and causing; the sixteen are only effects; the puruṣa is neither",
det:{skt:"मूलप्रकृतिरविकृतिर्महदाद्याः प्रकृतिविकृतयः सप्त। षोडशकस्तु विकारो न प्रकृतिर्न विकृतिः पुरुषः॥",tr:"Mūla-prakṛti (root nature) is uncaused. The seven beginning with mahat are both modifications and causes. The sixteen are only modifications. Puruṣa is neither cause nor modification.",
c:"The 25 tattvas: (1) Mūla-prakṛti — the root matter, eternal, uncaused, the ground of all phenomenal existence; (2–8) Seven that are both caused and causing: Mahat/Buddhi (cosmic intelligence), Ahaṃkāra (I-making principle), and the five Tanmātras (subtle elements: śabda, sparśa, rūpa, rasa, gandha — sound-essence, touch-essence, form-essence, taste-essence, smell-essence); (9–24) Sixteen effects only: the five Mahābhūtas (gross elements: ākāśa, vāyu, agni, jala, pṛthivī), the five Jñānendriyās (sense-organs: śrotra, tvak, cakṣu, rasanā, ghrāṇa), the five Karmendriyās (action-organs: vāk, pāṇi, pāda, pāyu, upastha), and Manas (the coordinating sense-mind); (25) Puruṣa — pure consciousness, neither cause nor modification, eternally free and distinct from all the above.",
gp:"Gauḍapāda: The 25-tattva scheme is Sāṃkhya's master-key. Understanding the causal relationships between the tattvas reveals that all phenomenal existence is modifications of one root substance (prakṛti), while consciousness (puruṣa) stands entirely outside this chain — always already free.",
tk:"Vācaspati Miśra: The distinction between 'caused and causing' (vikṛti-prakṛti), 'only caused' (kevala-vikṛti), and 'neither' (neither caused nor causing) maps onto the ontological structure of the universe. This tripartite division is Sāṃkhya's unique contribution to Indian ontology.",
mat:"Māṭhara: The numerical precision (25 tattvas, not 24 or 26) is Sāṃkhya's claim to exhaustiveness — it is not a provisional scheme but a complete account of all possible modes of existence, both material and conscious."}}
]}
]},
{tab:"Three Means of Valid Knowledge",title:"Pramāṇas — Valid Means of Knowledge",sub:"Kārikā 4–6 · Perception, Inference, Testimony",
intro:"Before describing the metaphysical entities, Īśvarakṛṣṇa establishes the epistemological foundation: three and only three means of valid knowledge (pramāṇas). This grounds the Sāṃkhya system in a rigorous theory of knowledge and allows it to distinguish what can be known from what must remain unknown.",
legend:[{c:C.blue,t:"Pramāṇa Theory"},{c:C.purple,t:"Metaphysics"},{c:C.teal,t:"Application"}],
branches:[
{name:"Three Pramāṇas",ref:"SK 4–6",color:C.blue,children:[
{n:"Dṛṣṭam — Pratyakṣa (Direct Perception)",r:"SK 4",d:"Direct perception (pratyakṣa) is the first means of valid knowledge",
det:{skt:"दृष्टमनुमानमाप्तवचनं च सर्वप्रमाणसिद्धत्वात्।",tr:"Perception, inference, and reliable testimony are the (three) valid means of knowledge, established because all knowledge is of these kinds.",
c:"<em>Pratyakṣa</em> in Sāṃkhya: direct sensory contact of the sense-organ with its specific object, yielding determinate cognition (niścaya) of the object's specific qualities. Each sense-organ (indriya) has one specific type of object (viṣaya): ear-organ → sound; skin-organ → touch; eye → form/colour; tongue → taste; nose → smell. Pratyakṣa is the most immediate and foundational pramāṇa.",
gp:"Gauḍapāda: pratyakṣa operates through the specific sense-organ connecting with its specific object. The mind (manas) coordinates the sensory input and presents it to buddhi, which determines (adhyavasāya) what has been perceived. The entire process requires the presence of puruṣa's consciousness to illuminate it.",
tk:"Vācaspati Miśra: Sāṃkhya's pratyakṣa theory differs from Nyāya: the sense-organ contact (sannikarṣa) is not between consciousness and object but between the physical sense-organ and the physical object. Consciousness merely illuminates the result."}},
{n:"Anumāna — Inference",r:"SK 5",d:"Inference (anumāna) is the second means — from marks to what is marked",
det:{skt:"अनुमानं त्रिविधं व्याप्तिपूर्वकं तर्कः।",tr:"Inference is of three kinds and is preceded by universal concomitance (vyāpti).",
c:"Three types of anumāna: (1) <em>Pūrvavat</em> — inference from cause to effect (seeing rain-clouds, inferring rain); (2) <em>Śeṣavat</em> — inference from effect to cause (seeing a flooded river, inferring heavy rain upstream); (3) <em>Sāmānyatodṛṣṭa</em> — inference by general observation (inferring the motions of celestial bodies from what we see of them, though we cannot directly perceive the cause of their motion). Anumāna is grounded in vyāpti — the invariable concomitance between the inferential sign (liṅga) and the inferred fact (liṅgin).",
gp:"Gauḍapāda: the existence of puruṣa, the guṇas, and mūla-prakṛti cannot be known by direct perception — they are established by sāmānyatodṛṣṭa anumāna, the type of inference that goes beyond what any sense-organ can directly grasp.",
tk:"Vācaspati Miśra: Sāṃkhya's use of anumāna is not only logical — it is also the method of meditative discernment (viveka) in which the practitioner gradually distinguishes between the witnessing puruṣa and the witnessed modifications of citta."}},
{n:"Āptavacana — Reliable Testimony",r:"SK 6",d:"Reliable testimony (āptavacana) is the third means — the valid speech of a trustworthy person",
det:{skt:"आप्तश्रुतिरागमः।",tr:"The verbal testimony (āgama) of reliable persons is āptavacana.",
c:"<em>Āptavacana</em> (sometimes called āgama or śabda) is the verbal testimony of those who have directly known a truth and communicate it truthfully. In Sāṃkhya, the primary āptavacana is the Veda understood as the accumulated testimony of sages who have directly known the distinction between puruṣa and prakṛti. But the validity of the Veda is not assumed on authority alone — it is confirmed by its internal consistency, its correspondence with inference, and its agreement with the experience of realized beings.",
gp:"Gauḍapāda: Kapila, the founder of Sāṃkhya, is himself the supreme āpta — a realized sage who has directly known the 25 tattvas through viveka. The Sāṃkhyakārikā stands as valid āptavacana insofar as it accurately transmits Kapila's realized knowledge.",
tk:"Vācaspati Miśra: āptavacana is the only pramāṇa for supra-sensible realities (like the guṇas, puruṣa, or liberation) that cannot be inferred without a prior verbal framework. The Vedas provide this framework for Sāṃkhya, while the Sāṃkhya system in turn provides the rational confirmation."}}
]}
]},
{tab:"Mūla-Prakṛti & Guṇas",title:"Mūla-Prakṛti and the Three Guṇas",sub:"Kārikā 10–16 · The root matter and its three constituents",
intro:"The theory of guṇas is Sāṃkhya's most original and influential contribution to Indian thought. Mūla-prakṛti — the primordial matter — is constituted of three guṇas (constituents, strands, qualities) that are never found separately: sattva, rajas, and tamas. All of phenomenal existence is their interplay. The guṇas are established by inference from the character of their products.",
legend:[{c:C.amber,t:"Sattva"},{c:C.coral,t:"Rajas"},{c:C.gray,t:"Tamas"},{c:C.purple,t:"Prakṛti"},{c:C.green,t:"Liberation"}],
branches:[
{name:"Three Guṇas — Existence of Prakṛti",ref:"SK 10–12",color:C.purple,children:[
{n:"Sattva-Rajas-Tamas",r:"SK 12–13",d:"The three guṇas: pleasure/lightness, pain/activity, delusion/heaviness",
det:{skt:"प्रीत्यप्रीतिविषादात्मकाः प्रकाशप्रवृत्तिनियमार्थाः।",tr:"(The guṇas are) of the nature of pleasure, pain, and delusion; they serve the purposes of illumination, activity, and restraint.",
c:"Three pairs of characterizations: By their subjective-experiential nature: <em>Sattva</em> (pleasure, prīti — brightness, harmony, contentment); <em>Rajas</em> (pain, aprīti — activity, agitation, striving); <em>Tamas</em> (delusion/heaviness, viṣāda — obscuration, inertia, torpor). By their cosmic function: Sattva illuminates (prakāśa); Rajas activates (pravṛtti); Tamas restrains/obstructs (niyama). These are not three separate substances but three aspects of every prakṛti-modification — like the three strands of a rope that are always twisted together.",
gp:"Gauḍapāda: the guṇas are inferred from the character of their products. Every experienced object shows the character of the guṇas: a burning desire (rajas), a delusion (tamas), a moment of clarity (sattva). The inference moves from the specific character of effects back to the guṇas as their ground.",
tk:"Vācaspati Miśra: the three guṇas constitute all of prakṛti including the mind (citta/buddhi) — the mind itself is a modification of prakṛti and therefore made of guṇas. When sattva predominates in the mind, the mind illuminates clearly; when rajas predominates, the mind is agitated; when tamas predominates, the mind is dull and confused.",
mat:"Māṭhara: the guṇas are constantly changing their relative dominance (parispanda — pulsation). Liberation (kaivalya) occurs when the guṇas, having served puruṣa's experience and liberation, return to a state of equilibrium in mūla-prakṛti."}},
{n:"Characteristics and Mutual Support of Guṇas",r:"SK 11",d:"The guṇas are of opposite character yet support each other like a lamp",
det:{skt:"परस्पराभिभवाश्रयजननमिथुनवृत्तयश्च गुणाः।",tr:"The guṇas act by mutual suppression, support, production, and conjunction.",
c:"The relationship among the guṇas is complex: they <em>suppress</em> each other (when rajas increases, tamas and sattva decrease), they <em>support</em> each other (all three must be present in every modification), they <em>produce</em> each other (rajas agitates sattva into illumination; tamas grounds rajas into form), and they <em>conjoin</em> (they never appear separately). Īśvarakṛṣṇa uses the analogy of a lamp: the wick (tamas), oil (rajas), and flame (sattva) are mutually different in character but all serve together to produce illumination. Similarly the three guṇas, each playing its part, together produce the entire range of conscious experience.",
gp:"Gauḍapāda: the mutual suppression (paraspara-abhibhava) of guṇas is the engine of cosmic evolution. When tamas was dominant in the primordial state (pralaya), the equilibrium was broken by rajas, triggering the evolution of mahat/buddhi from mūla-prakṛti.",
tk:"Vācaspati Miśra: 'mithuna-vṛtti' — acting in pairs — means that the guṇas always work in pairs even in their opposition. This prevents any guṇa from achieving total dominance and dissolving the system into a single state — which would be either pure unconsciousness (pure tamas) or pure formlessness (pure sattva)."}}
]},
{name:"Evolution of the Tattvas",ref:"SK 17–40",color:C.amber,children:[
{n:"Mahat — Cosmic Buddhi",r:"SK 22",d:"The first evolute of mūla-prakṛti — cosmic intelligence",
det:{skt:"अध्यवसायो बुद्धिः।",tr:"Buddhi is determination (adhyavasāya).",
c:"<em>Mahat</em> (the great one) or <em>Buddhi</em> (intelligence) is the first and largest evolute of mūla-prakṛti — in the individual it is the intellect or the discriminating faculty. Its defining function is <em>adhyavasāya</em> — the decisive, determining cognition: 'This is so.' It is sattvic in its pure form (illuminating, transparent); rajasic and tamasic in its impure manifestations. The 'sattvic' qualities of buddhi are: dharma (virtue), jñāna (knowledge), vairāgya (dispassion), aiśvarya (mastery); the 'tamasic' qualities are: adharma, ajñāna, avairāgya, anaśvarya.",
gp:"Gauḍapāda: Buddhi is close to puruṣa in the chain of evolution — it is the finest, most transparent of all prakṛti-products. In its pure, sattvic state it reflects puruṣa's consciousness so accurately that the distinction between them seems to collapse — and this apparent collapse is the root of avidyā.",
tk:"Vācaspati Miśra: The individual buddhi (the person's intelligence) is the same in kind as the cosmic mahat but smaller in scale. In Sāṃkhya, there is no sharp division between individual and cosmic: the individual's evolution mirrors the cosmic evolution. Liberation is the buddhi becoming so refined that puruṣa's distinctness from it becomes directly evident.",
mat:"Māṭhara: The eight forms of buddhi (four sattvic, four tamasic) correspond to four paths to liberation (through dharma, knowledge, dispassion, mastery) and four paths to deeper bondage (through adharma, ignorance, passion, and impotence). The correct application of buddhi's sattvic qualities constitutes Sāṃkhya spiritual practice."}},
{n:"Ahaṃkāra — I-Making Principle",r:"SK 24",d:"The second evolute — the principle of individuation and ego",
det:{skt:"अभिमानोऽहङ्कारः।",tr:"Ahaṃkāra is self-attribution (abhimāna).",
c:"<em>Ahaṃkāra</em> — literally 'I-maker' — is the principle of individuation. Its function is abhimāna — the primal 'I am this' that takes the raw determinacy of buddhi and fixes it into a specific individual perspective: 'I am this body; I am this experiencer.' Ahaṃkāra is the cosmic principle through which mūla-prakṛti's potential for individuation becomes actualized. It evolves from buddhi and in turn gives rise to manas, the ten indriyas, and the five tanmātras.",
gp:"Gauḍapāda: ahaṃkāra is the pivot of the entire cosmic evolution — the point at which the impersonal becomes personal, the cosmic becomes individual. Liberation requires not the destruction of ahaṃkāra but the recognition that it is a modification of prakṛti, not the self (puruṣa).",
tk:"Vācaspati Miśra: Ahaṃkāra has three forms corresponding to the guṇas: (1) Vaikārika (sattvic ahaṃkāra) — from which manas and the sense-organs are born; (2) Taijasa (rajasic ahaṃkāra) — the activating force that enables both the sattvic and tamasic forms to evolve their products; (3) Bhūtādi (tamasic ahaṃkāra) — from which the five tanmātras are born.",
mat:"Māṭhara: The word abhimāna (self-attribution) is precise: ahaṃkāra does not create individuation ex nihilo but attributes the modifications of buddhi and the external world to a 'self.' It is the error of saying 'my experience' rather than simply 'experience.'"}}
]},
{name:"Puruṣa — The Witness Consciousness",ref:"SK 17–21",color:C.blue,children:[
{n:"Existence of Puruṣa — Five Arguments",r:"SK 17",d:"Puruṣa exists because: aggregates are for another, there must be a witness, there must be a user, there is desire for liberation, there is absence of guṇas",
det:{skt:"सङ्घातपरार्थत्वात्त्रिगुणादिविपर्ययादधिष्ठानात्। पुरुषोऽस्ति भोक्तृभावात्कैवल्यार्थं प्रवृत्तेश्च॥",tr:"Puruṣa exists because: aggregates are for another (purpose), because (something exists) contrary to the three guṇas, because there must be a supervisor, because there is an experiencer, and because there is striving for liberation.",
c:"Five arguments for the existence of puruṣa (pure consciousness distinct from prakṛti): (1) <em>Saṅghāta-parārthatva</em>: all composite things (saṅghāta) exist for another's purpose. The body-mind complex, being a composite and being for something else's purpose, must have that something else — the puruṣa — as its purpose-holder. (2) <em>Triguṇādi-viparyaya</em>: something must exist that is contrary to the guṇas (not composed of sattva-rajas-tamas) — this is puruṣa. (3) <em>Adhiṣṭhāna</em>: there must be a supervisor/witness who observes the mind's workings. (4) <em>Bhoktṛ-bhāva</em>: there must be an experiencer, distinct from the experienced. (5) <em>Kaivalyārtha-pravṛtti</em>: the very striving for liberation implies an entity that strives — and that entity cannot itself be a product of prakṛti (since prakṛti has no motive to liberate itself from itself).",
gp:"Gauḍapāda: the five arguments are mutually reinforcing and together constitute an ironclad case for the existence of puruṣa. The most powerful for practical purposes is the third: one cannot explain the fact of witnessing (the experience of being aware of one's own thoughts) without positing a witness distinct from the thoughts.",
tk:"Vācaspati Miśra: the argument from the purposiveness of composite things (saṅghāta-parārthatva) is an application of the general principle that tools are always for a user. The eye is for the seer, not for itself; the mind is for the puruṣa, not for itself — even though the mind appears to be 'doing the seeing' in ordinary experience.",
mat:"Māṭhara: the argument from kaivalya-pravṛtti — striving for liberation — is the most practically relevant. The student reading this text is implicitly already positing a puruṣa in themselves — the very desire for liberation is its evidence."}},
{n:"Puruṣa is Many, Not One",r:"SK 18",d:"The puruṣas are many, distinct for each being",
det:{skt:"जन्ममरणकरणानां प्रतिनियमादयुगपत्प्रवृत्तेश्च।",tr:"Because of the individuality of birth, death, and faculties; because of non-simultaneous activity; and because of difference of disposition — the multiplicity of puruṣas is established.",
c:"Against monism and idealism, Sāṃkhya maintains that puruṣas are many — one for each individual being. Three arguments: (1) Birth and death happen at different times for different individuals — if there were only one consciousness, it would either be always being born or never being born; (2) The sense-organs of different beings do not function simultaneously — if consciousness were one, blindness in one person would make all persons blind; (3) The three-fold qualities (sattva, rajas, tamas predominance) differ between individuals — if consciousness were one, all individuals would have the same character.",
gp:"Gauḍapāda: the multiplicity of puruṣas is Sāṃkhya's strongest divergence from both Buddhist idealism (which holds consciousness to be a single stream) and Advaita Vedānta (which holds ātman to be one and universal). For Sāṃkhya, liberation is not the merger of individual puruṣas into one universal consciousness, but the isolated (kevala) standing of each puruṣa in its own distinctness from prakṛti.",
tk:"Vācaspati Miśra: the 'many puruṣas' doctrine does not imply that the puruṣas are qualitatively different — each is pure, unchanging, contentless consciousness. Their 'manyness' is not a difference in quality but a difference in positional relationship to different prakṛti-streams (different bodies and minds)."}},
{n:"Characteristics of Puruṣa",r:"SK 19–20",d:"Puruṣa is witness, solitary, indifferent, spectator, inactive",
det:{skt:"तस्माच्च विपर्यासात्सिद्धं साक्षित्वमस्य पुरुषस्य।",tr:"Therefore, from the inversion (of prakṛti's characteristics), the witness-nature and other characteristics of puruṣa are established.",
c:"Puruṣa is defined through an inversion of prakṛti's characteristics: Prakṛti is active — puruṣa is inactive (akartā). Prakṛti is constituted of guṇas — puruṣa is free of guṇas (nirguṇa). Prakṛti is the field of experience — puruṣa is the experiencer (bhoktā). Prakṛti is subject to modification — puruṣa is unchanging (kūṭastha). Prakṛti is non-conscious — puruṣa is conscious (cetana). Key characteristics: <em>sākṣi</em> (witness), <em>kaivalya</em> (solitary, self-sufficient), <em>mādhyastha</em> (indifferent, standing in the middle), <em>draṣṭā</em> (spectator), <em>akartā</em> (non-doer).",
gp:"Gauḍapāda: puruṣa as sākṣi (witness) is the foundational insight. To witness is neither to do nor to suffer — the witness sees but is not changed by what it sees. This is puruṣa's eternal condition: it has always only witnessed, never done, never suffered.",
tk:"Vācaspati Miśra: mādhyastha (indifference, standing in the middle) does not mean unconcern in the ethical sense — it means that puruṣa's nature is not altered by anything it witnesses, as a mirror is not altered by the images it reflects.",
mat:"Māṭhara: the non-doer (akartā) nature of puruṣa is the key to liberation: if puruṣa has never actually done anything (since all action is the guṇas acting on the guṇas), then puruṣa has never created any karma. Liberation is simply the recognition of what was always the case."}}
]}
]},
{tab:"Relation of Puruṣa & Prakṛti",title:"The Relation of Puruṣa and Prakṛti",sub:"Kārikā 17–21 · Proximity, reflection, and the dance of the two",
intro:"The most philosophically subtle part of the Sāṃkhya system: how can puruṣa (pure, inactive consciousness) and prakṛti (active, unconscious matter) be related without either one being reduced to the other? Sāṃkhya's answer is proximity (sannidhi) and mutual service — a non-causal relation of functional interdependence.",
legend:[{c:C.blue,t:"Puruṣa"},{c:C.purple,t:"Prakṛti"},{c:C.teal,t:"Relation"},{c:C.green,t:"Liberation"}],
branches:[
{name:"Proximity and Mutual Service",ref:"SK 17–21",color:C.teal,children:[
{n:"The Dance Analogy — Prakṛti Serves Puruṣa",r:"SK 56–60",d:"Prakṛti dances before the spectator-puruṣa; having been seen, she retires",
det:{skt:"पुरुषस्य दर्शनार्थं कैवल्यार्थं तथा प्रधानस्य।",tr:"For the seeing (experience) of puruṣa and for the purpose of isolation (kaivalya), the association of the two is (formed).",
c:"The most celebrated image in Sāṃkhya literature: Prakṛti is compared to a dancer (nartakī) who performs before the spectator-puruṣa. Having displayed herself completely — showing all of her 25 tattvas in their full range of manifestation — she stops, ashamed and self-aware, and withdraws. Puruṣa, having seen everything, has no further need of her and abides in its own nature (kaivalya). The other classical analogy: the lame man (puruṣa) and the blind woman (prakṛti) — neither can accomplish their goals alone; together, the lame man sees and directs while the blind woman carries and acts. When they reach the destination (liberation), they part ways.",
gp:"Gauḍapāda: the lame-blind analogy beautifully captures the two phases of the puruṣa-prakṛti relation: (1) The period of bondage — when the two are 'together' and prakṛti serves puruṣa's experience and eventual liberation. (2) The moment of liberation — when prakṛti's service has been completed and the two are no longer in functional contact.",
tk:"Vācaspati Miśra: the dancer analogy captures an asymmetry that is crucial for the Sāṃkhya theory of liberation: it is prakṛti that 'withdraws' — not puruṣa that 'escapes.' Puruṣa was never actually bound; prakṛti's withdrawal is the formal recognition of this fact.",
mat:"Māṭhara: the word 'ashamed' (lajjā) in the dancer analogy is philosophically charged: prakṛti, having been fully seen by the discriminating puruṣa, can no longer maintain the illusion that she is the self. The exposure of prakṛti's full nature (through the 25-tattva analysis) is itself the mechanism of liberation."}},
{n:"Liberation — Kaivalya as Isolation",r:"SK 62–69",d:"When discrimination arises, prakṛti ceases; kaivalya of the puruṣa is achieved",
det:{skt:"प्राप्ते शरीरभेदे चरितार्थत्वात्प्रधाननिवृत्तिः। एकस्तु मुक्त एव क्षेत्रज्ञः।",tr:"When the body dissolves, prakṛti having accomplished its purpose ceases. The knower of the field (puruṣa) alone is liberated — having already (always) been free.",
c:"Kaivalya (isolation, aloneness) is not a new state produced for puruṣa but the recognition of puruṣa's eternal condition. The key phrase is 'having already always been free' — puruṣa was never actually in bondage; what occurred was only the appearance of bondage (an appearance arising from the prakṛti-side, not from the puruṣa-side). Liberation is therefore not a transformation of puruṣa but a transformation of the knowledge-condition in prakṛti (specifically in buddhi): when buddhi achieves the discriminative knowledge (viveka-jñāna), it recognizes its own distinctness from puruṣa — and this recognition simultaneously constitutes the liberation of puruṣa from the appearance of involvement.",
gp:"Gauḍapāda: since puruṣa was never actually bound, the question 'how does it become free?' is misconceived. The correct question is: 'how does the appearance of bondage cease?' And the answer is: through viveka-jñāna arising in buddhi — which is a transformation entirely on the prakṛti-side.",
tk:"Vācaspati Miśra: the paradox of liberation in Sāṃkhya — that the liberated puruṣa was never bound and liberation is entirely a change in buddhi's recognition — is elegantly resolved by the concept of pratiprasava (return): the guṇas, having accomplished their purpose (puruṣa's liberation), return to their state of equilibrium in mūla-prakṛti. This is not destruction of prakṛti but its retirement from active engagement.",
mat:"Māṭhara: the Sāṃkhya path to liberation is therefore entirely cognitive: there is no physical austerity, no ritual, no devotion required in principle (though these may support the process). What is required is only jñāna — the direct, non-inferential knowing of the puruṣa-prakṛti distinction (viveka-khyāti) — and the vairāgya (dispassion) that dissolves the false identification. This cognitive path is why Sāṃkhya calls itself jñāna-yoga par excellence."}}
]}
]},
{tab:"The Subtle Body & Samsara",title:"The Subtle Body and Transmigration",sub:"Kārikā 39–56 · Liṅga-śarīra and the mechanism of saṃsāra",
intro:"Sāṃkhya offers a sophisticated account of how consciousness appears to transmigrate across births without puruṣa actually moving. The liṅga-śarīra (subtle body) — consisting of the 18 subtle elements: buddhi, ahaṃkāra, manas, the five tanmātras, and the ten indriyas — carries the dispositional residues (vāsanās) from life to life, receiving successive gross physical bodies like a player taking different costumes.",
legend:[{c:C.gray,t:"Subtle Body"},{c:C.amber,t:"Tanmātras"},{c:C.red,t:"Dispositions"},{c:C.green,t:"Liberation"}],
branches:[
{name:"Liṅga-Śarīra — The Subtle Body",ref:"SK 40–42",color:C.gray,children:[
{n:"The 18-element Subtle Body",r:"SK 40",d:"The subtle body — 18 elements — transmigrates carrying the dispositions",
det:{skt:"पूर्वोत्पन्नमसक्तं नियतं महदादिसूक्ष्मपर्यन्तम्।",tr:"(The subtle body) arising first, unattached, constant, comprising (the elements) from mahat down to the subtle elements.",
c:"The liṅga-śarīra (subtle body, also called sūkṣma-śarīra) consists of 18 principles: buddhi (1), ahaṃkāra (1), manas (1), the five jñānendriyās (5), the five karmendriyās (5), and the five tanmātras (5). This subtle body arises first (before the gross physical body) in each life, is unattached (asaktam — not fixed to any one gross body), and is constant (niyata — persisting through all transmigrations as the carrier of dispositional impressions). It functions like a painter's template — receiving successive physical embodiments as a painter applies colour to a pre-existing sketch.",
gp:"Gauḍapāda: the subtle body is the vehicle of puruṣa's apparent transmigration. Since puruṣa itself is unchanging and unmoving, what 'moves' from life to life is the subtle body — with its store of dispositional impressions (bhāvanās) — which, animated by proximity to puruṣa, takes on new gross bodies.",
tk:"Vācaspati Miśra: the subtle body is the metaphysical explanation for why skills, knowledge, and tendencies acquired in one life appear spontaneously in another. The child prodigy's musicianship or the saint's spontaneous compassion — these are the dispositional impressions (vāsanās) stored in the subtle body from prior lives.",
mat:"Māṭhara: liberation (kaivalya) is the dissolution of the subtle body — specifically the dissolution of the false identification of puruṣa with the subtle body. What remains is puruṣa in its own nature, without the subtle body's mediating confusion."}}
]},
{name:"Eight Natural Dispositions — Bhāvas",ref:"SK 43–51",color:C.red,children:[
{n:"The Eight Bhāvas — Dispositional Orientations",r:"SK 43",d:"Virtue, knowledge, dispassion, mastery — and their opposites — are the eight dispositions of the buddhi",
det:{skt:"धर्मेण गमनमूर्ध्वं गमनमधस्ताद्भवत्यधर्मेण।",tr:"By virtue (dharma) one goes upward; by non-virtue (adharma) downward.",
c:"The eight bhāvas (dispositions, orientations of buddhi) are divided into the four 'bright' (sattvic) dispositions — dharma (virtue), jñāna (knowledge), vairāgya (dispassion), aiśvarya (mastery/power) — and four 'dark' (tamasic) dispositions — adharma (non-virtue), ajñāna (ignorance), avairāgya (passion), anaśvarya (impotence). These dispositions are not produced by external fate but by the choices of buddhi in each life — they determine the direction of the subtle body's next incarnation (upward to higher realms, lateral to human existence, or downward to lower forms of life).",
gp:"Gauḍapāda: the four sattvic bhāvas together constitute the complete path to liberation in Sāṃkhya: dharma provides the ethical foundation, jñāna provides the discriminative insight, vairāgya withdraws the guṇas' grip, and aiśvarya (mastery over all states) is the consequence of the other three. These four are cultivated systematically in the Sāṃkhya path.",
tk:"Vācaspati Miśra: 'going upward' through dharma refers not only to heavenly births but to the upward evolution of the subtle body's dispositional character — each virtuous action deposits a bhāva-impression in buddhi that makes the next moment of discrimination easier. Liberation is thus not a single event but a gradual refinement of buddhi's dispositional character until viveka-khyāti arises spontaneously."}}
]}
]}
];
buildSubNav(secs,'samkhya',renderSection);
};

builders.nyaya=function(){
const secs=[
{tab:"Adhyāya 1 — Padārthas & Pramāṇas",title:"Adhyāya 1 — Sixteen Padārthas and the Pramāṇas",sub:"NS 1.1.1–1.2.20 · Categories of inquiry and valid means of knowledge",
intro:"Gautama opens with a statement of sixteen padārthas (categories of inquiry) whose examination leads to liberation. He then analyses the four pramāṇas — pratyakṣa, anumāna, upamāna, and śabda — establishing Nyāya's epistemology on precise definitions. This chapter is the foundation of the entire analytical method.",
legend:[{c:C.blue,t:"Pramāṇa Theory"},{c:C.purple,t:"Metaphysics"},{c:C.teal,t:"Syllogism/Anumāna"},{c:C.amber,t:"Padārthas"},{c:C.green,t:"Liberation"},{c:C.red,t:"Fallacies"}],
branches:[
{name:"Sixteen Padārthas — Categories of Inquiry",ref:"NS 1.1.1",color:C.amber,children:[
{n:"Pramāṇa, Prameya, Saṃśaya… through Apavarga",r:"1.1.1",d:"The sixteen categories whose examination leads to liberation",
det:{skt:"प्रमाणप्रमेयसंशयप्रयोजनदृष्टान्तसिद्धान्तावयवतर्कनिर्णयवादजल्पवितण्डाहेत्वाभासच्छलजातिनिग्रहस्थानानां तत्त्वज्ञानान्निःश्रेयसाधिगमः",
tr:"From the true knowledge of pramāṇa, prameya, saṃśaya, prayojana, dṛṣṭānta, siddhānta, avayava, tarka, nirṇaya, vāda, jalpa, vitaṇḍā, hetvābhāsa, chala, jāti, and nigrahasthāna — supreme good (niḥśreyasa) is attained.",
c:"The sixteen padārthas constitute the complete analytical toolkit of Nyāya: (1) <em>Pramāṇa</em> — valid means of knowledge (the 'how' of knowing); (2) <em>Prameya</em> — valid object of knowledge (the 'what' known); (3) <em>Saṃśaya</em> — doubt; (4) <em>Prayojana</em> — purpose/motivation; (5) <em>Dṛṣṭānta</em> — illustrative example; (6) <em>Siddhānta</em> — established doctrine; (7) <em>Avayava</em> — members of the syllogism; (8) <em>Tarka</em> — hypothetical reasoning; (9) <em>Nirṇaya</em> — definitive conclusion; (10) <em>Vāda</em> — honest debate; (11) <em>Jalpa</em> — disputatious argument; (12) <em>Vitaṇḍā</em> — destructive debate; (13) <em>Hetvābhāsa</em> — fallacious reasoning; (14) <em>Chala</em> — quibble; (15) <em>Jāti</em> — futile rejoinder; (16) <em>Nigrahasthāna</em> — clincher/point of defeat.",
vts:"Vātsyāyana: liberation (niḥśreyasa) is achieved through knowledge (tattvajñāna) of these sixteen, not through ritual or devotion. The logical structure of the path: wrong knowledge → suffering; right knowledge of the sixteen padārthas → dissolution of wrong knowledge → cessation of suffering → liberation.",
udd:"Uddyotakara: the sixteen padārthas are not arbitrary but exhaustive — they cover the complete epistemological, ontological, and dialectical terrain of philosophical investigation. Any meaningful philosophical claim must be analysable in terms of these sixteen.",
vmt:"Vācaspati Miśra: the path from the sixteen padārthas to liberation is mediated by right understanding of prameya (the twelve objects of valid knowledge, 1.1.9 ff.) — especially the knowledge of the self (ātman) as distinct from the body, senses, and mind.",
uda:"Udayana: tattvajñāna of these sixteen — especially the knowledge of the ātman and its relation to God (Īśvara) — is the direct cause of liberation. Without theistic understanding, the Nyāya knowledge-programme remains incomplete."}}
]},
{name:"Four Pramāṇas — Valid Means of Knowledge",ref:"NS 1.1.3–1.1.8",color:C.blue,children:[
{n:"Pratyakṣa — Direct Perception",r:"1.1.4",d:"Perception arises from sense-object contact and is non-errant, definite, and not derived from words",
det:{skt:"इन्द्रियार्थसन्निकर्षोत्पन्नं ज्ञानमव्यपदेश्यमव्यभिचारि व्यवसायात्मकं प्रत्यक्षम्",
tr:"Perception (pratyakṣa) is knowledge produced by sense-object contact — non-verbal, non-errant, and definitive.",
c:"Nyāya's definition of perception has four components: (1) <em>Indriyārtha-sannikarṣa</em> — produced by the contact between a sense-organ and its object; (2) <em>Avyapadeśya</em> — non-verbal (not derived from or through language); (3) <em>Avyabhicāri</em> — non-errant (not leading to false knowledge — hallucinations are thus excluded); (4) <em>Vyavasāyātmaka</em> — definitive (determinate — a clear 'this is so,' not a mere indistinct sensing). Two stages: nirvikalpaka (indeterminate, bare contact without conceptualisation) and savikalpaka (determinate, with identification, qualification, and naming).",
vts:"Vātsyāyana: the six types of sense-object contact (sannikarṣa): (1) conjunction (saṃyoga) — eye-and-pot contact; (2) inherence in the conjoined (saṃyukta-samavāya) — eye perceives the colour inhering in the pot; (3) inherence in what is inherent in the conjoined (saṃyukta-samaveta-samavāya) — eye perceives the universal 'potness' inhering in the colour inherent in the pot; (4) inherence (samavāya) — ear perceives sound which inheres in the air-molecules (not conjoined but inherent); (5) inherence in the inherent (samaveta-samavāya) — ear perceives the universal 'soundness' inhering in the particular sound; (6) visheshanatā (qualification) — the mind perceives absence (abhāva) through the non-contact of an expected object.",
udd:"Uddyotakara: the avyabhicāri (non-errant) requirement excludes all illusory perceptions (shell-appearing-as-silver, mirage-water). These are vyabhicāri (errant) because the knowledge they produce contradicts later veridical knowledge. True pratyakṣa is always later confirmed, never contradicted.",
rgh:"Raghunātha Śiromaṇi: the definition must exclude yogic and supernatural perception (yogaja-pratyakṣa, divya-pratyakṣa). Raghunātha argues that these still qualify since they too arise from a form of 'sense-object contact' — the yogin's purified inner sense-organ contacting subtle objects directly."}},
{n:"Anumāna — Inference",r:"1.1.5",d:"Inference is knowledge preceded by perception — from mark to what is marked",
det:{skt:"अथ तत्पूर्वकं त्रिविधमनुमानम्",
tr:"Now, inference is of three kinds, preceded by that (perception).",
c:"Anumāna (inference) is knowledge of the unperceived from the perceived, through an invariable concomitance (vyāpti). Three types: (1) <em>Pūrvavat</em> — from cause to effect (seeing dark clouds, inferring rain); (2) <em>Śeṣavat</em> — from effect to cause (seeing a swollen river, inferring heavy rain upstream); (3) <em>Sāmānyatodṛṣṭa</em> — from general observation of invariable concomitance (inferring motion where there is change of position, even for celestial bodies whose motion we cannot observe directly). Inference requires the five-membered syllogism (avayava) for formal expression.",
vts:"Vātsyāyana: the 'preceding perception' (tat-pūrvaka) is essential — inference always proceeds from something observed to something unobserved. Without the prior perception of smoke and its invariable concomitance with fire, we cannot infer fire from smoke. Pure a priori reasoning without perceptual grounding is not valid anumāna.",
udd:"Uddyotakara develops the theory of vyāpti (universal concomitance) extensively: vyāpti is not mere constant conjunction (which could be coincidental) but a necessary, exception-free relationship between the inferential sign (hetu) and the inferred property (sādhya). Establishing vyāpti requires both positive instances (sapakṣa) and absence of negative instances (vipakṣa).",
vmt:"Vācaspati Miśra: the three types of inference correspond to three types of causal reasoning. Sāmānyatodṛṣṭa is the most philosophically powerful — it is the type used to infer the existence of God (Īśvara), the self (ātman), and the universal (sāmānya) — entities not accessible to direct sense-perception.",
uda:"Udayana's Nyāyakusumāñjali uses elaborate anumāna to establish the existence of God. The most famous: from the existence of the earth and other aggregated objects (which are effects), inference to an omniscient intelligent cause (Īśvara) who designed and assembled them — an anticipation of the 'argument from design.'"}},
{n:"Upamāna — Comparison/Analogy",r:"1.1.6",d:"Upamāna is knowledge of an object from its similarity to a known object",
det:{skt:"प्रसिद्धसाधर्म्याद्साध्यसाधनमुपमानम्",
tr:"Upamāna is the means of knowing (an object) from its similarity to a well-known (object).",
c:"<em>Upamāna</em> is the unique Nyāya pramāṇa that neither Sāṃkhya nor Yoga accepts as separate. The standard example: a city-dweller who has never seen a gavaya (wild cow) is told 'a gavaya is like a cow.' Later, in the forest, they see an animal like a cow and recognise it as 'a gavaya.' The knowledge 'this is a gavaya' is produced not by direct perception (they did not know the gavaya before) nor by inference (there is no logical sign), but by the memory of the comparison combined with the new perception. This is upamāna.",
vts:"Vātsyāyana: upamāna produces knowledge of the name-object relation (saṃjñā-saṃjñi-sambandha) — specifically, knowledge that the word 'gavaya' designates this type of animal. It is thus primarily a linguistic pramāṇa, filling the gap between general verbal knowledge and specific object-recognition.",
udd:"Uddyotakara: upamāna is irreducible to inference because the knowledge produced ('this is a gavaya') is not the result of a logical chain but of a direct recognition of similarity mediated by memory of the comparison. It is a distinct cognitive act.",
vis:"Viśvanātha: upamāna is practically important in areas where direct observation is impossible and inference is unavailable — especially in recognising organisms, places, and cultural practices described in texts. It is the pramāṇa of recognition-by-description."}},
{n:"Śabda — Verbal Testimony",r:"1.1.7",d:"Śabda is the instructive assertion of a reliable person",
det:{skt:"आप्तोपदेशः शब्दः",
tr:"Śabda (verbal testimony) is the instruction of a trustworthy person (āpta).",
c:"<em>Śabda</em> (also called āgama or āptavacana) is valid knowledge derived from the spoken or written words of a reliable person (āpta). An āpta is one who has (1) directly known the truth they are reporting, (2) desires to communicate it accurately, and (3) has the capacity to do so correctly. Śabda covers both laukika (worldly, e.g., a doctor's instruction) and vaidika (Vedic, e.g., 'the fire sacrifice leads to heaven') testimony. The Veda is accepted as śabda-pramāṇa in Nyāya, but — unlike Mīmāṃsā — Nyāya argues that the Veda's authority derives from its being the testimony of Īśvara (God), not from its being self-authorising.",
vts:"Vātsyāyana: the division of śabda into two: (1) dṛṣṭārtha — testimony about observable things (e.g., 'there is a cow there' said by a reliable witness); (2) adṛṣṭārtha — testimony about unobservable things (e.g., Vedic statements about dharma and the self). Both are valid if the speaker is truly an āpta.",
udd:"Uddyotakara: the key requirement is āptatva (trustworthiness). This requires absence of defects in knowledge (jñāna), motivation (icchā), and expression (prayatna). A doctor who knows the patient's condition, genuinely wants them cured, and expresses the diagnosis accurately is an āpta for medical śabda.",
uda:"Udayana: the Nyāya argument for the Veda's authority through Īśvara's authorship is a major contribution. If the Veda were eternal and authorless (as Mīmāṃsā holds), its authority would be ungrounded. Grounding it in Īśvara's omniscient authorship gives it a rationalist justification — the Veda is reliable because its author is supremely reliable."}}
]},
{name:"Five-Membered Syllogism — Avayava",ref:"NS 1.1.32–1.1.39",color:C.teal,children:[
{n:"Pratijñā — The Thesis",r:"1.1.33",d:"The proposition to be proved",
det:{skt:"साध्यनिर्देशः प्रतिज्ञा",tr:"The statement of what is to be established is the pratijñā.",
c:"<em>Pratijñā</em> is the proposition to be proved: 'The hill has fire.' It states the subject (pakṣa: the hill) and the property to be proved (sādhya: fire). It must be a genuine claim — not something already known or self-evident — and must be falsifiable in principle.",
vts:"Vātsyāyana: the pratijñā must state something genuinely uncertain for the interlocutor. If the sādhya is already accepted or if it is analytically entailed by the subject, the pratijñā is unnecessary — it degenerates into tautology or dogmatic assertion, not argument.",
udd:"The pratijñā is the starting point of the syllogism and must remain unchanged throughout the inference. Changing the sādhya partway through the argument (shifting the goal-post) is a fallacy of abandonment (pratijñāhāni)."}},
{n:"Hetu — The Reason",r:"1.1.34",d:"The reason or evidence for the thesis",
det:{skt:"उदाहरणसाधर्म्याद्साध्यसाधनं हेतुः",
tr:"The reason (hetu) establishes the sādhya through its similarity to the example.",
c:"<em>Hetu</em> is the reason or evidence: 'Because there is smoke.' The hetu is the middle term connecting the subject (pakṣa) to the predicate (sādhya). For a hetu to be valid it must possess five characteristics: (1) pakṣadharmatā — it must genuinely belong to the subject; (2) sapakṣe sattvam — it must be present in similar cases (where the sādhya is known to be present); (3) vipakṣe'sattvam — it must be absent in dissimilar cases; (4) abādhita-viṣayatva — it must not be contradicted by other pramāṇas; (5) asatpratipakṣatva — it must not have a counter-reason of equal strength.",
vts:"Vātsyāyana: the hetu must have vyāpti (invariable concomitance) with the sādhya. This vyāpti must be established by prior perception — not just by the cases listed in the example (dṛṣṭānta) but by a wider empirical observation of the smoke-fire relation across many instances.",
udd:"Uddyotakara's five-characteristic theory of the valid hetu is one of Nyāya's most rigorous contributions. It precisely distinguishes valid from invalid reasons and provides the diagnostic for all five types of hetvābhāsa (fallacious reasons)."}},
{n:"Udāharaṇa — The Example",r:"1.1.35",d:"The universal illustration supporting the invariable concomitance",
det:{skt:"साधर्म्याद्वैधर्म्याद्वा तदर्थोदाहरणम्",
tr:"The example (udāharaṇa) establishes the connection (between reason and sādhya) through similarity or dissimilarity.",
c:"<em>Udāharaṇa</em> is the illustrative example that supports the vyāpti: 'Wherever there is smoke there is fire, as in a kitchen.' The positive example (sāpakṣa) shows a case where both smoke and fire are present together. The negative example (vipakṣa) shows a case where fire is absent, confirming smoke's absence: 'Where there is no fire, there is no smoke, as in a lake.' The example functions as the evidential grounding for the universal claim embedded in the hetu.",
vts:"Vātsyāyana: one well-chosen positive example is sufficient to establish the vyāpti for the purposes of a formal argument, provided both interlocutors accept the example as a genuine instance of the universal relationship. Multiple examples add rhetorical force but not additional logical necessity.",
udd:"Uddyotakara argues that the example is not merely rhetorical but epistemically essential: without an anchor in a perceived particular case, the universal claim of the vyāpti floats free of experience and cannot be justified. The example is the perceptual grounding of the otherwise abstract vyāpti."}},
{n:"Upanaya and Nigamana — Application and Conclusion",r:"1.1.36–1.1.39",d:"The application of the universal to the particular, and the restatement of the proved thesis",
det:{skt:"व्याप्त्युपसंहारः उपनयः। हेतूदाहरणाभ्यामर्थावधारणं निगमनम्",
tr:"The upanaya is the subsumption under the universal. The nigamana is the conclusion arrived at through the reason and example.",
c:"<em>Upanaya</em> (application): 'The hill is similarly smoke-possessing (as the kitchen)' — applying the universal to the specific case. <em>Nigamana</em> (conclusion): 'Therefore the hill has fire' — restating the pratijñā as now established by the hetu and its grounding. The five-membered syllogism in full: (1) Pratijñā: 'The hill has fire'; (2) Hetu: 'Because it has smoke'; (3) Udāharaṇa: 'Wherever there is smoke there is fire, as in a kitchen'; (4) Upanaya: 'The hill is likewise smoke-possessing'; (5) Nigamana: 'Therefore the hill has fire.' This is the pañcāvayava anumāna — the five-limbed inference unique to Nyāya, contrasted with the three-membered syllogism of Aristotle and the two-membered form accepted by Dignāga.",
vts:"Vātsyāyana: the five-membered form is not logically redundant. Each member serves a distinct communicative and epistemic function. The western three-membered syllogism omits the udāharaṇa and upanaya, which provide the empirical grounding that connects the abstract syllogism to observed reality.",
vis:"Viśvanātha: the nigamana is not mere repetition of the pratijñā but the pratijñā now established — it carries the force of a demonstrated truth rather than a mere claim. The transformation from 'I claim X' to 'X has been proved' is the epistemic work done by the syllogism as a whole."}}
]}
]},
{tab:"Adhyāya 2 — Fallacies & Debate",title:"Adhyāya 2 — Hetvābhāsa, Chala, Jāti, and Debate",sub:"NS 1.2.1–5.2 · Fallacious reasoning, quibbles, futile rejoinders, points of defeat",
intro:"The second half of the Nyāya Sūtras is a detailed manual of philosophical debate — both proper and improper. Gautama analyses the five types of fallacious reasons (hetvābhāsa), three types of quibble (chala), twenty-four types of futile rejoinder (jāti), and twenty-two points of defeat (nigrahasthāna). This analytical toolkit enables precise diagnosis of where and how arguments fail.",
legend:[{c:C.red,t:"Fallacies"},{c:C.coral,t:"Quibbles"},{c:C.gray,t:"Futile Rejoinders"},{c:C.teal,t:"Valid Debate"}],
branches:[
{name:"Five Hetvābhāsas — Fallacious Reasons",ref:"NS 1.2.4–1.2.9",color:C.red,children:[
{n:"Savyabhicāra — The Erratic Reason",r:"1.2.5",d:"A hetu that is present in cases where the sādhya is absent",
det:{skt:"अनैकान्तिकोऽसद्धेतुः",tr:"The non-exclusive (reason) is a false hetu.",
c:"<em>Savyabhicāra</em> (also called anaikāntika — non-exclusive): a hetu that 'wanders' — it is found both in cases where the sādhya is present and in cases where it is absent. Example: 'Sound is non-eternal because it is knowable.' But 'knowable' is also present in the case of the eternal self (ātman) — so 'knowable' wanders between eternal and non-eternal things, and cannot validly establish non-eternality.",
vts:"Vātsyāyana: this is the most common fallacy in philosophical debate. A wandering hetu proves nothing because it does not uniquely track the sādhya. The diagnosis: if there are known cases where hetu H is present but sādhya S is absent, H is savyabhicāra with respect to S.",
udd:"Uddyotakara distinguishes three subtypes: (1) sādhāraṇa (common) — the hetu is too broad, present even in the pakṣa's opposite; (2) asādhāraṇa (exclusive) — the hetu is so narrow it is present only in the pakṣa but has no sapakṣa to ground a vyāpti; (3) anupasaṃhāri — the hetu claims a universal scope that allows no vipakṣa (e.g., 'everything is knowable') — impossible to refute but also impossible to establish."}},
{n:"Viruddha — The Contradictory Reason",r:"1.2.6",d:"A hetu that proves the opposite of what is intended",
det:{skt:"साध्यविपरीतसाधनो विरुद्धः",tr:"The contradictory (hetu) establishes the opposite of the sādhya.",
c:"<em>Viruddha</em>: a reason that backfires — it proves the negation of what was intended. Example: 'Sound is eternal because it is produced.' But 'produced' is invariably concomitant with non-eternality (everything produced is non-eternal). So 'produced' proves sound is non-eternal — the opposite of the intended conclusion.",
vts:"Vātsyāyana: the viruddha hetu is a sign of profound confusion about the relationship between the hetu and the sādhya. It shows that the arguer has chosen a hetu that has vyāpti with the sādhya's contradictory, not with the sādhya itself — a fundamental misunderstanding of the subject-matter.",
vis:"Viśvanātha: the viruddha is especially instructive because it reveals the exact logical structure of why the original thesis is false. Identifying a viruddha is therefore both a dialectical victory and an epistemological advance."}},
{n:"Prakaraṇasama, Sādhyasama, Kālātīta",r:"1.2.7–1.2.9",d:"The question-begging, unestablished, and time-contradicted fallacies",
det:{c:"(3) <em>Prakaraṇasama</em> (question-begging): a hetu that is as much in need of proof as the sādhya — it proves nothing because it is itself the very point under dispute. Example: trying to prove that sound is eternal using the hetu 'because it is different from non-eternal things' — but this is precisely what needs to be proved. (4) <em>Sādhyasama</em> (unestablished reason): a hetu that has no established relationship to the sādhya and no known examples — a pure assertion. (5) <em>Kālātīta</em> (time-contradicted): a hetu whose relation to the sādhya holds only at a different time than the one under discussion. Example: inferring that a tree is on fire now because we saw smoke from it yesterday.",
vts:"Vātsyāyana: prakaraṇasama is particularly insidious in philosophical debates because its circularity may not be immediately apparent. The diagnostic: if accepting the hetu already commits one to accepting the sādhya (or its equivalent), the inference is prakaraṇasama.",
udd:"Kālātīta is important in scientific and legal reasoning: the evidence must be temporally relevant to the claim. Past co-occurrence does not establish present co-occurrence unless the vyāpti is established as timeless."}}
]},
{name:"Three Chalas — Quibbles",ref:"NS 1.2.10–1.2.14",color:C.coral,children:[
{n:"Vākchala, Sāmānyachala, Upacārachala",r:"1.2.10–1.2.14",d:"Three forms of quibble — exploiting verbal ambiguity, generality, or figurative language",
det:{c:"<em>Chala</em> is a false objection that exploits ambiguity rather than addressing the actual argument. Three types: (1) <em>Vākchala</em> (verbal quibble): exploiting the ambiguity of a word to misrepresent the thesis. Classic example: 'This man is nava-kambala (possessing a new blanket).' Reply: 'No, he only has nine blankets (nava also = nine).' The reply exploits lexical ambiguity, not a genuine error in the thesis. (2) <em>Sāmānyachala</em> (generality quibble): extending a particular statement to an unintended general level. 'The Brahmin is learned' → objection: 'Not all Brahmins are learned.' The original statement was particular; the objection treats it as universal. (3) <em>Upacārachala</em> (metaphor quibble): taking a figurative expression literally. 'The scaffolding has labourers (i.e., is being worked on by labourers)' → objection: 'Scaffolding cannot have labourers — labourers are not properties of wood.'",
vts:"Vātsyāyana: chala is not honest debate — it is an attempt to win by exploiting linguistic rather than logical vulnerabilities. Recognising chala is essential for a debater; naming it explicitly is a valid response ('this is vākchala, not a genuine objection').",
udd:"Uddyotakara: the philosophical importance of the chala analysis goes beyond debate-tactics. It highlights the ways in which natural language's ambiguity, polysemy, and metaphoricity can generate false philosophical problems — what appear to be deep ontological puzzles are sometimes just cases of unnoticed chala."}}
]}
]},
{tab:"Adhyāya 3-4 — Self, God, Atoms",title:"Adhyāya 3–4 — Self, God, Liberation, and Atomic Theory",sub:"NS 3.1–4.2 · Arguments for the ātman, Īśvara, and the Vaiśeṣika-Nyāya atomic cosmology",
intro:"Books 3 and 4 address the prameyas (objects of valid knowledge) in depth — especially the self (ātman), liberation (apavarga), God (Īśvara), and the material world. This is where Nyāya's metaphysics interlocks with Vaiśeṣika ontology and where the famous Nyāya arguments for God's existence are elaborated.",
legend:[{c:C.blue,t:"Ātman/Self"},{c:C.green,t:"Liberation"},{c:C.amber,t:"God/Īśvara"},{c:C.purple,t:"Cosmology"}],
branches:[
{name:"Arguments for the Ātman",ref:"NS 3.1.1–3.1.26",color:C.blue,children:[
{n:"Ātman is distinct from the body and senses",r:"3.1.1",d:"The self (ātman) is not the body, senses, or mind — it is the unified experiencer",
det:{skt:"शरीरेन्द्रियमनोऽर्थेभ्यो विलक्षणः",tr:"(The ātman is) distinct from body, senses, mind, and objects.",
c:"Nyāya's argument for the ātman proceeds through elimination and through the analysis of experience. The ātman is not the body (the body is observed as an object; the self is the observer), not the senses (the senses are instruments; the self uses them), not the mind (manas is the internal organ; the self employs it), and not any of the objects of experience. The positive characterisation: the ātman is the subject of desire, aversion, effort, pleasure, pain, and cognition — the unified 'I' that persists through the changes of all these states.",
vts:"Vātsyāyana's argument: when we say 'I see with this eye, I hear with this ear' — the 'I' that uses both is distinct from either organ. If the ātman were simply the totality of the sense-organs, we could not have the unified experience of 'I see and I hear' — for seeing and hearing are two separate sense-organs. The unity of 'I' requires a distinct unifying subject.",
udd:"Uddyotakara: the ātman's distinctness from the body is proved by the phenomenon of 'body-recognition': 'my body' implies a possessor distinct from the possessed. No body part says 'my body' — only the ātman says 'my body.'",
uda:"Udayana: the most powerful proof of the ātman is the continuity of personal identity through time. The person who remembers a childhood experience is not just causally connected to the child — they literally are that child. This identity-through-time (pratyabhijñā) requires an unchanging underlying subject — the ātman."}},
{n:"Liberation — Apavarga as Absolute Cessation",r:"1.1.22",d:"Liberation is the absolute cessation of all pain — not a positive bliss-state",
det:{skt:"दुःखजन्मप्रवृत्तिदोषमिथ्याज्ञानानामुत्तरोत्तरापाये तदनन्तरापायादपवर्गः",
tr:"Liberation (apavarga) comes from the successive removal of false knowledge, defects, activity, birth, and pain — each prior removal causing the subsequent one.",
c:"Nyāya's account of liberation is notably austere: apavarga is not positive bliss or spiritual ecstasy but the <em>absolute cessation of pain</em> (duḥkha-atyanta-nivṛtti). The chain of causation runs backwards: false knowledge (mithyājñāna) → defects/afflictions (doṣa: rāga, dveṣa, moha) → purposive activity (pravṛtti) → birth (janma) → pain (duḥkha). Remove mithyājñāna through tattvajñāna, and the chain collapses: no mithyājñāna → no doṣa → no pravṛtti → no birth → no pain. The liberated ātman is not in bliss but simply free from all pain and all cognitive content.",
vts:"Vātsyāyana: apavarga involves the cessation of all qualities of the ātman — not just pain but also pleasure, cognition, memory, and even the sense of 'I'. The liberated ātman is like a stone — not in the trivial sense of being inert, but in the sense of being free from all experiential content. This is a controversial position that Nyāya-Vaiśeṣika defends against the Mīmāṃsā view (liberation as eternal bliss) and the Vedānta view (liberation as the self's realisation of its own nature as ānanda).",
uda:"Udayana: this 'stone-liberation' critique misses the point. The liberated ātman is not like a stone because the stone never had experience to be freed from. The liberated ātman has permanently transcended the conditions that make suffering possible — an achievement, not a deprivation."}}
]},
{name:"Nyāya Arguments for God — Īśvara-Siddhi",ref:"Nyāyakusumāñjali",color:C.amber,children:[
{n:"Arguments from Effects — Kāryānumāna",r:"Nyāyakusumāñjali 5",d:"From the existence of the world as a composite effect, inference to an intelligent omniscient creator",
det:{skt:"कार्यात् कर्तृसाधनम् — जगत् सकर्तृकं कार्यत्वात् घटवत्",
tr:"From effects, establishing an agent: 'The world has a maker, because it is an effect, like a pot.'",
c:"Udayana's five major arguments for the existence of Īśvara: (1) <em>Kāryānumāna</em> (from effects): the world is a composite effect (kārya); every composite effect requires an intelligent maker; therefore the world requires an intelligent omniscient maker — Īśvara. (2) <em>Āyojanānumāna</em> (from combination): atoms cannot combine on their own (they have no consciousness or will); their initial combination must be directed by an omniscient agent. (3) <em>Dhṛtyanumāna</em> (from support): the world is sustained in its ordered existence — this sustained order requires an ever-present, omnipotent sustainer. (4) <em>Padasāmarthyānumāna</em> (from the power of words): the perfect correlation between words and their meanings must have been established by an omniscient being at the beginning of creation. (5) <em>Pratītyānumāna</em> (from authoritative belief): the universal human recognition of Īśvara as the supreme reality — across different cultures and traditions — is best explained by Īśvara's actual existence.",
uda:"Udayana's refutation of atheist objections is the most systematic theistic argument in classical Indian philosophy. The main objections he addresses: (i) If Īśvara is the cause, who caused Īśvara? — Answer: Īśvara is self-existent (svayambhū), an uncaused cause, unlike the world which is an aggregate of dependent parts. (ii) If Īśvara is omnipotent, why does evil exist? — Answer: evil is the product of individual karma; Īśvara operates within the framework of karma, not in spite of it.",
vmt:"Vācaspati Miśra on the kāryānumāna: the argument is valid only if the world is genuinely composite (sāvayava) and genuinely an effect (kārya). Both must be established. The world is composite (it is made of atoms arranged in patterns); it is an effect (it began, it will end — it is not eternal). These two premises together entail the need for a creator."}}
]}
]},
{tab:"Adhyāya 5 — Synthesis",title:"Adhyāya 5 — Synthesis and Jāti",sub:"NS 5.1–5.2 · Twenty-four futile rejoinders and defeat in debate",
intro:"The fifth Adhyāya completes Nyāya's theory of debate by cataloguing the twenty-four jātis (futile rejoinders) — spurious objections that seem sophisticated but commit subtle errors — and the twenty-two nigrahasthānas (points of defeat), providing a complete framework for adjudicating philosophical dispute.",
legend:[{c:C.gray,t:"Jāti/Futile"},{c:C.red,t:"Nigrahasthāna"},{c:C.teal,t:"Valid Debate"}],
branches:[
{name:"Jāti — Futile Rejoinders",ref:"NS 5.1",color:C.gray,children:[
{n:"Twenty-Four Types of Futile Rejoinder",r:"5.1.1–5.1.41",d:"Rejoinders that appear to refute but do not genuinely counter the argument",
det:{c:"<em>Jāti</em> (futile rejoinder) is a response that appears to refute an argument but actually fails to do so. Gautama lists 24 types. Key examples: (1) <em>Sādharmyasama</em>: the opponent concedes the similarity between hetu and sādhya but denies the inference — 'Your example of fire and smoke also shows that the hill doesn't have fire, since sometimes hills have smoke from mist.' (Fails: it confuses genuine similarity with spurious similarity.) (2) <em>Vaidharmyasama</em>: objecting to the inference by pointing to disanalogies between the example and the pakṣa — but disanalogies that are irrelevant to the vyāpti. (3) <em>Utkarṣasama</em>: claiming the opposite conclusion follows with equal force. These are 'sama' (equal) in name only — they do not actually produce equal logical force but merely create an appearance of parity.",
vts:"Vātsyāyana: the purpose of the jāti catalogue is not to teach how to use futile rejoinders but to enable debaters to identify and name them, thereby dismissing them without lengthy counter-argument. Naming the jāti type is itself a valid dialectical move: 'This is sādharmyasama — it does not constitute a genuine objection.'",
udd:"Uddyotakara: many of the twenty-four jātis correspond to actual fallacies that untrained debaters commit in good faith, not just rhetorical tricks used in bad faith. The philosophical value of the jāti analysis is therefore diagnostic: it helps both debaters and audiences to understand why certain apparently forceful objections fail."}}
]},
{name:"Nigrahasthāna — Points of Defeat",ref:"NS 5.2",color:C.red,children:[
{n:"Twenty-Two Defeat Conditions",r:"5.2.1–5.2.25",d:"The specific conditions under which a debater is formally defeated",
det:{c:"<em>Nigrahasthāna</em> (point of defeat, clincher): a condition arising in debate that constitutes the formal defeat of one of the parties. Twenty-two conditions are listed. Key examples: (1) <em>Pratijñāhāni</em> — abandoning one's original thesis midway; (2) <em>Pratijñāntara</em> — shifting to a different thesis without acknowledgement; (3) <em>Pratijñāvirodha</em> — contradicting one's own thesis; (4) <em>Pratyavaskandana</em> — evading the issue by switching to an irrelevant topic; (5) <em>Matānujñā</em> — inadvertently conceding the opponent's thesis; (6) <em>Vikṣepa</em> — throwing the issue into confusion rather than meeting the argument; (7) <em>Apasiddhānta</em> — arguing against an accepted doctrine of one's own school; (8) <em>Niruttara</em> — being simply unable to respond.",
vts:"Vātsyāyana: the nigrahasthāna list presupposes that debate has a public adjudicator (sabhāpati) who recognises the conditions and announces defeat. Without this institutional framework, the list is merely academic. The Nyāya tradition thus presupposed a specific institutional context — the royal or public debate — in which these rules were enforceable.",
udd:"Uddyotakara: nigrahasthānas apply symmetrically — both the proponent (vādin) and the respondent (prativādin) can commit them. The system is neutral between positions: what matters is logical rigour, not which side holds which metaphysical view.",
uda:"Udayana: the nigrahasthāna framework is the foundation of academic philosophical disputation (śāstrārtha). Its importance lies in creating a domain of rational discourse that is governed by rules rather than social status or rhetorical skill — a genuine rationalist achievement of the Indian philosophical tradition."}}
]}
]}
];
