builders.vaisheshika=function(){
document.getElementById('vaisheshika').innerHTML =
  `<div class="view-bar" role="tablist" aria-label="Vaisheshika view">
     <button id="vaisheshika-view-map" class="active" onclick="switchVaisesikaView('map')">Map</button>
     <button id="vaisheshika-view-sutra" onclick="switchVaisesikaView('sutra')">Sutra</button>
   </div>
   <div id="vaisheshika-map"></div>
   <div id="vaisheshika-sutra" hidden></div>`;
const secs=[
{tab:"Six Padārthas",title:"Six Padārthas — Categories of Reality",sub:"VS 1.1–1.2 · The six ontological categories",
intro:"Vaiśeṣika's fundamental claim is that everything that exists can be classified under six (later seven) padārthas: dravya (substance), guṇa (quality), karma (motion), sāmānya (universal), viśeṣa (particular), and samavāya (inherence). This ontological scheme is at once a classification of all existing things and a theory of the kinds of properties and relations that bind them.",
legend:[{c:C.amber,t:"Dravya/Substance"},{c:C.teal,t:"Guṇa/Quality"},{c:C.coral,t:"Karma/Motion"},{c:C.blue,t:"Universals"},{c:C.purple,t:"Particulars"},{c:C.green,t:"Inherence"}],
branches:[
{name:"Dravya — Nine Substances",ref:"VS 1.1.4–1.1.7",color:C.amber,children:[
{n:"Nine Dravyas",r:"VS 1.1.5",d:"Earth, water, fire, air, ether, time, space, self, mind — the nine substances",
det:{skt:"पृथिव्यापस्तेजो वायुराकाशं कालो दिगात्मा मन इति द्रव्याणि",
tr:"Earth (pṛthivī), water (āpas), fire (tejas), air (vāyu), ether (ākāśa), time (kāla), space/direction (diś), self (ātman), and mind (manas) — these are the nine substances.",
c:"The nine dravyas are the ultimate subjects of all real properties. Key distinctions: The first four (earth through air) are composed of atoms and are the building blocks of the material world. Ether (ākāśa), time (kāla), and space/direction (diś) are non-atomic, omnipresent, and eternal — they are the media within which material events occur. The self (ātman) is eternal, omnipresent (in the individual sense — all-pervading to the extent of its body-field), and the locus of consciousness. Manas (mind) is atomic — one per individual — and is the internal sense-organ that coordinates sense-perception and self-awareness.",
prs:"Praśastapāda: the nine substances are not merely a list but a structured hierarchy. The four material substances (earth through air) are subject to creation and destruction; ether, time, and space are uncreated and indestructible (nitya); the self is uncreated, indestructible, and conscious; manas is uncreated in its atomic form but produced in its functional form.",
uda:"Udayana: the inclusion of time (kāla) and space (diś) as substances is Vaiśeṣika's most original ontological contribution. Time is not a property of events (as the Buddhists hold) but the substance in which events are located — the medium of succession. Space is not a property of objects but the substance in which objects have directional relations."}},
{n:"Pṛthivī — Earth",r:"VS 2.1.1",d:"Earth has the quality of smell as its distinctive characteristic",
det:{skt:"गन्धवती पृथिवी",tr:"Earth (pṛthivī) is that which possesses smell (gandha).",
c:"Each of the four material substances is defined by its <em>viśeṣa guṇa</em> (distinctive quality): earth — smell; water — taste; fire — colour/form; air — touch. These distinctive qualities are what make the substances qualitatively distinct from one another despite all being material. Additionally: earth also has taste, colour, touch, and sound; water has taste, colour, and touch but not smell; fire has colour and touch but not taste or smell; air has touch only.",
prs:"Praśastapāda: the viśeṣa guṇa is the identifying criterion for each substance, but it does not exhaust the substance's qualities. Earth is defined by smell but it also possesses all four tangible qualities because it is the densest and most complex of the four elements.",
uda:"Udayana: the four material substances are atomic at their finest level. The paramāṇus (atoms) of earth, water, fire, and air are eternal, indivisible, and individually imperceptible — they only become perceptible when combined into dyads (dyaṇukas) and triads (tryaṇukas) and larger aggregates."}}
]},
{name:"Guṇa — Twenty-Four Qualities",ref:"VS 1.1.6",color:C.teal,children:[
{n:"The Twenty-Four Guṇas",r:"VS 1.1.6",d:"Twenty-four qualities — from rūpa to saṃskāra",
det:{skt:"रूपरसगन्धस्पर्शसंख्यापरिमाणपृथक्त्वसंयोगविभागपरत्वापरत्वगुरुत्वद्रवत्वस्नेहशब्दबुद्धिसुखदुःखेच्छाद्वेषप्रयत्नधर्माधर्मसंस्काराश्च",
tr:"Colour, taste, smell, touch, number, magnitude, separateness, conjunction, disjunction, priority, posteriority, weight, fluidity, viscosity, sound, cognition, pleasure, pain, desire, aversion, effort, virtue, vice, and latent impression — these are the twenty-four guṇas.",
c:"The twenty-four guṇas are properties that inhere in substances but cannot themselves be properties of other properties (no second-order properties in Vaiśeṣika). Key distinctions: Sensory qualities (rūpa through sound) inhere in material substances. Mental qualities (cognition through effort) inhere only in the ātman and/or manas. Moral qualities (dharma, adharma) inhere in the ātman. Saṃskāra (latent impression) inheres in the ātman and in material substances.",
prs:"Praśastapāda: guṇas are ontologically dependent on dravyas — they cannot exist without inhering in some substance. But they are distinct from the substance: the pot is not its redness; the redness is a distinct entity inhering in the pot through the relation of samavāya (inherence).",
uda:"Udayana: the inclusion of dharma and adharma as guṇas (not just ethical categories) is Vaiśeṣika's moral realism. Virtue and vice are real, objective properties that attach to the ātman through moral actions — they are what determine the quality of future births and ultimately the possibility of liberation."}}
]},
{name:"Karma — Five Motions",ref:"VS 1.1.7",color:C.coral,children:[
{n:"Five Karmas — Actions/Motions",r:"VS 1.1.7",d:"Upward, downward, contracting, expanding, and going — five types of motion",
det:{skt:"उत्क्षेपणमवक्षेपणमाकुञ्चनं प्रसारणं गमनमिति कर्माणि",
tr:"Throwing upward, throwing downward, contracting, expanding, and moving — these are the five karmas.",
c:"<em>Karma</em> in Vaiśeṣika means physical motion — not moral action. The five types are: (1) Utkṣepaṇa — upward movement (throwing up, rising); (2) Avakṣepaṇa — downward movement (falling, sinking); (3) Ākuñcana — contraction (muscle contraction, withdrawal); (4) Prasāraṇa — expansion (spreading, opening); (5) Gamana — generic locomotion (going in any direction). Karma is an episodic category — it exists only for the duration of the movement and does not persist.",
prs:"Praśastapāda: karma is the cause of conjunction (saṃyoga) and disjunction (vibhāga) between substances. The motion of the pot-making wheel causes the clay to conjoin in new ways — karma is therefore the proximate cause of all material change.",
uda:"Udayana: karma is distinct from the force (vega) that produces it. The arrow in flight has karma (the motion); it also has vega (the saṃskāra of force impressed by the bowstring). The vega sustains the karma across time until the arrow reaches its target."}}
]},
{name:"Sāmānya, Viśeṣa, Samavāya — The Binding Categories",ref:"VS 1.2.3–1.2.18",color:C.blue,children:[
{n:"Sāmānya — Universals",r:"VS 1.2.3",d:"Universals are eternal, one, and inhere in many particulars",
det:{skt:"सत्तासामान्यविशेषाः",tr:"Being (sattā), universal (sāmānya), and particular (viśeṣa) are (the remaining categories).",
c:"<em>Sāmānya</em> (universal) is an eternal, one, and objectively real entity that inheres in multiple particular instances simultaneously. The universal 'cow-ness' (gotva) inheres in every particular cow, making them all cows. The universal 'being' (sattā) inheres in all substances, qualities, and motions — it is the most general universal. Vaiśeṣika's realism about universals is its response to the Buddhist nominalist position that only particulars exist.",
prs:"Praśastapāda: universals are perceived directly — when we see a cow and know 'this is a cow,' we are perceiving not just the particular cow but also the universal cowness that inheres in it and in all cows. The universal is grasped through a distinct cognitive act (vyāpti-jñāna) triggered by the perception of the particular.",
uda:"Udayana: universals are not mental constructs (as the Buddhists hold) but objective features of reality. Evidence: different people perceive the same object as 'a cow' without prior communication — this intersubjective agreement is best explained by a real universal cowness that is the same in all these perceptions."}},
{n:"Viśeṣa — Ultimate Particulars",r:"VS 1.2.6",d:"Viśeṣas are eternal distinguishers of eternal atoms and substances",
det:{skt:"अन्त्यविशेषाः",tr:"The ultimate particulars (antyaviśeṣas) are the distinguishers of the eternal (atoms etc.).",
c:"<em>Viśeṣa</em> (ultimate particular) is the category that gives Vaiśeṣika its name. The problem: if two atoms of earth are qualitatively identical (both atoms, both earth-atoms, both possessing smell, etc.), what makes them two and not one? Universals cannot distinguish them; qualities are the same; substances are the same. Vaiśeṣika posits irreducible ultimate particulars (antyaviśeṣas) that are the ultimate basis of the numerical distinctness of atoms. Viśeṣas are eternal (they inhere only in eternal entities — atoms and eternals), uncaused, and directly perceived by yogis.",
prs:"Praśastapāda: the viśeṣas are the most radical assertion of Vaiśeṣika realism — the positing of irreducible bare particulars (haecceities) as real entities. Without viśeṣas, the system cannot explain why two otherwise identical atoms are two.",
uda:"Udayana: the viśeṣa concept anticipates the modern metaphysical debate between bundle theory (all properties are universals; particularity is their combination) and substratum theory (there is a bare particular beneath all properties). Vaiśeṣika effectively posits both — the dravya as substratum and the antyaviśeṣa as the individuator."}},
{n:"Samavāya — The Relation of Inherence",r:"VS 7.2.26",d:"Samavāya is the eternal, non-separable binding relation between substances and their properties",
det:{skt:"इह इति यतः कार्यकारणयोः स तु सम्बन्धविशेषः समवायः",
tr:"Samavāya is the special relation of 'here in this' — the inseparable relation between cause and effect (and between substance and quality, universal and particular, etc.).",
c:"<em>Samavāya</em> (inherence) is the most philosophically contested Vaiśeṣika category. It is the relation by which a quality inheres in a substance, a universal inheres in its instances, a part inheres in the whole, and a motion inheres in the moving substance. Samavāya is: (1) one (there is only one samavāya relation, not many); (2) eternal (it does not come and go); (3) non-separable (anapāyin — what is related by samavāya cannot be separated while maintaining that relation). Example: redness is in the rose by samavāya — not merely near it, or touching it, but genuinely internally related to it.",
prs:"Praśastapāda: samavāya is different from saṃyoga (conjunction), which is an accidental, separable contact between two substances. The book on the table is related by saṃyoga; the table's brownness is related to the table by samavāya. Removing the book leaves both book and table intact; removing the brownness from the table destroys either the brownness or the table's identity as this brown table.",
uda:"Udayana: samavāya is one of the most contested categories in Indian philosophy. Buddhist critics argue that it is superfluous — the 'in-here' relation can be explained without positing a further relation called 'inherence' (this leads to an infinite regress: if samavāya relates S and Q, what relates samavāya to S? Answer: samavāya is self-linking — it relates itself to what it relates.). Udayana defends this self-linking character of samavāya as a unique, fundamental metaphysical primitive."}}
]}
]},
{tab:"Atomic Theory & Causation",title:"Atomic Theory and the Doctrine of Causation",sub:"VS 2.1.1–4.1.14 · Paramāṇu theory and the asatkāryavāda",
intro:"Vaiśeṣika's atomic theory is one of the earliest and most developed atomic theories in world philosophy. Atoms (paramāṇus) are eternal, indivisible, and imperceptible — the ultimate constituents of material reality. Their combination (through God's will) produces the perceivable world. Vaiśeṣika holds the asatkāryavāda (the doctrine that the effect is not pre-existent in the cause) — directly opposing Sāṃkhya's satkāryavāda.",
legend:[{c:C.purple,t:"Atomism"},{c:C.amber,t:"Causation"},{c:C.blue,t:"God/Īśvara"},{c:C.green,t:"Liberation"}],
branches:[
{name:"Paramāṇu — Atomic Theory",ref:"VS 4.1.1–4.1.14",color:C.purple,children:[
{n:"Paramāṇu — The Atom",r:"VS 4.1.1",d:"The atom is eternal, partless, invisible, the ultimate cause of all material existence",
det:{skt:"नित्यं परमाणु",tr:"The atom is eternal (nitya).",
c:"The Vaiśeṣika atom (paramāṇu) is: (1) <em>Nitya</em> (eternal) — uncaused, indestructible; (2) <em>Niravaayava</em> (partless) — having no spatial parts; (3) <em>Adṛśya</em> (imperceptible) — too small for any sense to detect; (4) <em>Sarvajanana</em> (generator of all things) — all perceptible material objects are composed of atoms. Four types of atoms (corresponding to the four material substances): earth-atoms, water-atoms, fire-atoms, air-atoms. Each type of atom has the qualities of its respective element — earth-atoms have smell, water-atoms have taste, etc.",
prs:"Praśastapāda: atoms are beginninglessly moving (spanda-śīla) — they have an intrinsic vibrating motion (parispanda). At pralaya (cosmic dissolution), all compound objects dissolve back into atoms — the atoms themselves never dissolve. At the next sarga (creation), atoms recombine under the directive will of Īśvara.",
uda:"Udayana: atoms must be eternal and partless because they are the final terminus of analysis. If atoms had parts, those parts would be prior to them — and we would need to explain those parts' ultimate constituents. The regress terminates only with eternal, indivisible atoms. This is a classic reductio argument for atomism."}},
{n:"Dyaṇuka and Tryaṇuka — Combination",r:"VS 4.1.4–4.1.8",d:"Two atoms produce a dyad; three dyads produce a triad — the first perceivable entity",
det:{c:"The process of atomic combination: (1) Two atoms (paramāṇus) combine to form a dyad (dvyaṇuka or dvyaṇu). A dyad has magnitude (parimāṇa) greater than an atom but is itself imperceptible — it is an intermediate ontological stage. (2) Three dyads combine to form a triad (tryaṇuka). The triad is the smallest perceivable entity — the threshold of perceptibility. (3) Larger aggregates (from four dyads up) produce the perceivable world of everyday objects.",
prs:"Praśastapāda: the movement from two atoms to a dyad is not a mere addition of atoms but the creation of a genuinely new entity with properties the atoms lack individually (like magnitude). This is Vaiśeṣika's asatkāryavāda in action: the effect (dyad) is a genuinely new existence, not pre-existent in the causes.",
uda:"Udayana: the dyad is the most philosophically interesting of the three stages. It has magnitude but is imperceptible — suggesting that magnitude is not sufficient for perceptibility. Perceptibility requires a threshold of magnitude that only the triad reaches. This distinction between 'having magnitude' and 'being perceptible' is an important ontological refinement."}}
]},
{name:"Asatkāryavāda — Effect is New",ref:"VS 5.1.1–5.2.26",color:C.amber,children:[
{n:"Asatkāryavāda vs Satkāryavāda",r:"VS 5.2.1",d:"Vaiśeṣika holds that the effect does not pre-exist in the cause — it is a genuinely new entity",
det:{c:"The central dispute in Indian philosophy of causation: <em>Satkāryavāda</em> (Sāṃkhya): the effect pre-exists in the cause in an unmanifest (avyakta) form; production is merely manifestation of what was already there. <em>Asatkāryavāda</em> (Vaiśeṣika-Nyāya): the effect is a genuinely new entity, not previously existing in the cause; production is genuine origination. Arguments for asatkāryavāda: (1) We observe that the pot is a new entity with properties (hollow, able to hold water) that the clay lacks — if the pot pre-existed in the clay, we should observe these properties before the pot is made. (2) The very concept of 'production' requires that what is produced was not there before — otherwise what is being 'produced'?",
prs:"Praśastapāda: samavāyikāraṇa (the inherence cause) is what Vaiśeṣika uses to explain causation. The clay is the inherence-cause (samavāyikāraṇa) of the pot — the pot, when produced, inheres in the clay (the clay becomes the substrate of the pot). The potter's hands and wheel are the non-inherence causes (asamavāyikāraṇa and nimittakāraṇa). This three-cause analysis (inherence, non-inherence, efficient) is Vaiśeṣika's distinctive contribution to causal theory.",
uda:"Udayana: asatkāryavāda is supported by everyday observation and by the success of productive action. If the effect pre-existed in the cause (satkāryavāda), the potter's effort would be pointless — you cannot 'make' what already exists. The fact that productive effort genuinely changes the world — that the pot did not exist before and now exists — is the commonsense evidence for asatkāryavāda."}}
]}
]},
{tab:"Praśastapāda's System",title:"Praśastapāda's Padārthadharmasaṃgraha",sub:"c. 600 CE · The systematic elaboration and synthesis of Vaiśeṣika",
intro:"Praśastapāda's Padārthadharmasaṃgraha (Summary of the Properties of the Categories) is not a commentary on the Vaiśeṣika Sūtras but an independent systematic treatise that became the standard exposition of the school. It elaborates the six padārthas with extraordinary precision, adds significant new doctrines, and integrates theology (Īśvara as the cause of atomic combination) into the system.",
legend:[{c:C.amber,t:"Categories"},{c:C.blue,t:"Theology"},{c:C.purple,t:"Cosmology"},{c:C.green,t:"Liberation"}],
branches:[
{name:"Praśastapāda on Creation and God",ref:"Padārthadharmasaṃgraha",color:C.blue,children:[
{n:"Īśvara as the Director of Atomic Combination",r:"PDhS",d:"God directs the combination of atoms at creation and their dissolution at pralaya",
det:{c:"Praśastapāda's major theological addition to Vaiśeṣika: atoms cannot combine on their own (they have no intelligence or will). Their initial combination at sarga (creation) must be directed by an omniscient, omnipotent agent — Īśvara. Īśvara uses dharma (the accumulated merit of past cycles of beings) as the instrumental cause and his own will as the efficient cause to direct atoms into their initial combinations, creating the material world.",
prs:"Praśastapāda: Īśvara is not the material cause of the world — atoms are. Īśvara is the intelligent efficient cause (nimittakāraṇa) — the designer and director, not the substance. This preserves the ātman-prakṛti dualism while adding a theistic dimension: Īśvara, the eternal and liberated puruṣa (analogous to Patañjali's Yoga Sūtras 1.24), directs the material world for the benefit of individual ātmans.",
uda:"Udayana's Kiraṇāvalī develops this further: Īśvara must be omniscient to know the accumulated dharma and adharma of all past ātmans and to direct atomic combinations precisely so that each ātman gets the experiences its karma merits. Omniscience is not a luxury but a functional requirement of the creator."}}
]},
{name:"Liberation in Vaiśeṣika",ref:"PDhS on Mokṣa",color:C.green,children:[
{n:"Mokṣa — Liberation as Cessation of All Qualities",r:"PDhS",d:"Liberation is the state where the ātman is free of all guṇas including cognition",
det:{c:"Vaiśeṣika's account of liberation parallels Nyāya's: mokṣa is the complete cessation of the ātman's connection with manas, the senses, and the body — and consequently the cessation of all cognition, pleasure, pain, desire, aversion, and effort. The liberated ātman has no remaining guṇas except existence (sattā). This is sometimes called the 'stone-liberation' critique: critics object that a consciousness without any cognitive content is indistinguishable from a stone. Vaiśeṣika responds that the ātman's nature is not consciousness (as Vedānta holds) but a substance that can possess consciousness as a quality — and the liberated ātman simply no longer possesses that quality.",
prs:"Praśastapāda: liberation is achieved through tattvajñāna — the direct knowledge of the ātman as distinct from the body, senses, and mind. This knowledge, combined with the cessation of adharma (moral merit) and dharma (moral demerit), allows the ātman's manas-connection to dissolve. Without manas, no further experience arises; the ātman rests alone in its own substance.",
uda:"Udayana: the apparent emptiness of Vaiśeṣika liberation is actually a profound state: the ātman, no longer conditioned by any of prakṛti's modifications, simply is what it essentially is — a pure substance without accidental properties. This is the most radical fulfillment of the principle that every substance is ultimately what it is by itself, not by its properties."}}
]}
]}

builders.mimamsa=function(){
const secs=[
{tab:"Adhyāya 1 — Dharma & Authority",title:"Adhyāya 1 — The Nature of Dharma and Vedic Authority",sub:"MS 1.1.1–1.1.32 · What is dharma? What makes the Veda valid?",
intro:"Jaimini opens with the most fundamental question in Mīmāṃsā: what is dharma, and how can we know it? His answer — dharma is the prescriptive content of Vedic injunctions, known exclusively through those injunctions — immediately raises the question of the Veda's authority. The Veda cannot derive its authority from God (as Nyāya holds) because there is no God in Mīmāṃsā's ontology; it cannot derive authority from the tradition's acceptance of it (circular). Jaimini's solution: the Veda is eternal, authorless, and self-validating — its authority is intrinsic.",
legend:[{c:C.amber,t:"Dharma/Duty"},{c:C.blue,t:"Vedic Authority"},{c:C.teal,t:"Injunctions"},{c:C.purple,t:"Epistemology"},{c:C.coral,t:"Ritual"},{c:C.green,t:"Soteria"}],
branches:[
{name:"Definition of Dharma",ref:"MS 1.1.1–1.1.5",color:C.amber,children:[
{n:"Athāto dharmajijñāsā",r:"1.1.1",d:"Now, therefore, the desire to know dharma",
det:{skt:"अथातो धर्मजिज्ञासा",tr:"Now, therefore, (begins) the desire to know dharma.",
c:"The opening sūtra (parallel to Patañjali's 'atha yogānuśāsanam' and Bādarāyaṇa's 'athāto brahmajijñāsā') announces a formal inquiry. <em>Atha</em> implies prior preparation: the student has mastered the Vedas and their auxiliaries (vedāṅgas) and is now ready for the higher-order inquiry into the nature and scope of dharma. <em>Dharma</em> is the subject of inquiry — not God, not the self, not consciousness, but the normative content of Vedic injunctions: what ought to be done.",
sbt:"Śabara's Bhāṣya: 'atha' (now) marks the beginning of a new, formal inquiry following the mastery of preliminary knowledge. The jijñāsā (desire to know) is not mere curiosity but a motivated inquiry with liberation as its ultimate purpose — understanding dharma fully leads to its proper performance, which leads to the highest good.",
kum:"Kumārila Bhaṭṭa: the priority of dharma-inquiry over brahma-inquiry (Vedānta's project) is Mīmāṃsā's foundational claim. The Vedic injunctions (vidhis) are the primary content of the Veda; the Upaniṣads' philosophical statements are auxiliary — they serve to motivate the performance of injunctions by revealing the nature of the self that performs them."}},
{n:"Codanālakṣaṇo'rtho dharmaḥ",r:"1.1.2",d:"Dharma is that which is indicated by a Vedic injunction as the thing to be accomplished",
det:{skt:"चोदनालक्षणोऽर्थो धर्मः",tr:"Dharma is the thing (artha) whose characteristic mark is a Vedic injunction (codanā).",
c:"The formal definition of dharma: dharma is whatever is prescribed (coditā — marked out, enjoined) by a Vedic injunction. This definition is at once epistemological and ontological: epistemologically, the Veda is the only means of knowing dharma (it cannot be perceived or inferred); ontologically, dharma is constituted by the prescriptive content of Vedic injunctions — it is not an independent moral fact that the Veda merely describes. Dharma = 'what the Veda prescribes' — not 'what is independently good, which the Veda happens to report.'",
sbt:"Śabara: the word <em>codanā</em> specifically means an injunctive verbal form in the Veda — not a descriptive statement (arthavāda) or a name (nāmadheya) or an explanatory passage. The injunction 'one desiring heaven should sacrifice with the Agniṣṭoma' is a codanā; the explanation 'Indra killed Vṛtra with the vajra' is arthavāda (subsidiary discourse supporting the injunction).",
kum:"Kumārila: dharma is known only through Vedic injunctions because it concerns supersensible actions and their supersensible results (like the heavenly fruit of sacrifice). No perception, inference, or comparison can access these — the Veda is the unique epistemic pathway to dharmic knowledge.",
prb:"Prabhākara: the definition is precise. 'Thing' (artha) indicates that dharma is not just a relation but an objective state of affairs — the performance of the prescribed action. 'Characteristic mark is a Vedic injunction' (codanālakṣaṇa) indicates that the Vedic injunction is both the means of knowing dharma and what makes dharma dharma — there is no dharma independent of the Vedic prescription."}},
{n:"Svataḥ prāmāṇya — Intrinsic Validity of the Veda",r:"1.1.2–1.1.5",d:"The Veda is self-validating — its authority is intrinsic, not derived from any external source",
det:{c:"Mīmāṃsā's most controversial and most influential epistemological doctrine: <em>svataḥ prāmāṇyavāda</em> — the theory of intrinsic validity. Every cognition, including every Vedic statement, is inherently valid until and unless specifically contradicted. Validity does not need to be established from outside; it is the default. Invalidity (aprāmāṇya) must be established from outside — by a contradicting cognition or by the discovery of defects in the knowing instrument. Applied to the Veda: the Veda is valid because no defeater has ever been found for any of its injunctions. Its validity is intrinsic and eternal.",
sbt:"Śabara: the Veda is apauruṣeya (authorless) and nitya (eternal). Because it was not composed by any person, it cannot have the defects of human knowledge (error, bias, memory failure, deception). Its validity is therefore underwritten by the absence of the causes of invalidity — not by positive external certification.",
kum:"Kumārila's detailed elaboration in the Ślokavārttika: cognitions are self-illuminating (svayamprakāśa) with respect to their content; they are not self-illuminating with respect to their validity. Validity is established by the absence of defeaters — which in ordinary cognitions must be verified but in the Veda requires no verification since the Veda, being eternal and authorless, can have no defeaters in principle.",
prb:"Prabhākara's variant: svataḥ prāmāṇya means that cognitions do not require external validation of their validity — their validity is assumed from the moment of their occurrence. This is not uncritical dogmatism but rational default trust: in the absence of specific reason to distrust a cognition, we proceed as if it is valid. The burden of proof lies always with those who claim invalidity."}}
]},
{name:"The Veda — Nitya and Apauruṣeya",ref:"MS 1.1.5–1.1.32",color:C.blue,children:[
{n:"Eternality of the Veda — Nityatva",r:"1.1.18–1.1.32",d:"The Veda is eternal because its words bear an eternal, uncaused relation to their meanings",
det:{skt:"औत्पत्तिकस्तु शब्दस्यार्थेन सम्बन्धः",tr:"But the relation of the (Vedic) word to its meaning is natural/original (autpattika) — (not made by convention).",
c:"Mīmāṃsā's most contested linguistic claim: the word-meaning relation is not conventional (āupādhika) — not established by any speaker's act of naming — but natural and eternal (autpattika, āmnāya — received from the beginning). This 'natural' relation means: the phoneme 'g-o' has always and necessarily referred to the category of cows, not because anyone decided so, but because this is simply how language is. The implication: if the word-meaning relation is eternal, the Vedic sentences that express eternal injunctions are themselves not produced by any author — they are eternal expressions of eternal meanings.",
sbt:"Śabara: the eternality of the word-meaning relation is established by the fact that we learn words and their meanings by hearing — not by witnessing an original act of naming. Children learn language by hearing it used; this suggests that the relation precedes any particular use and any particular user.",
kum:"Kumārila: the phoneme (varṇa) is the primary carrier of meaning, not the physical sound-token (nāda). Phonemes are eternal types — the abstract phoneme 'k' that is 'manifested' (abhivyakta) by any particular utterance of 'k'. Because phoneme-types are eternal, the words composed of them are eternal, and the Vedic sentences composed of these words are eternal.",
prb:"Prabhākara: adds that the eternality of the phoneme is confirmed by the phenomenon of recognition (pratyabhijñā). When I hear the word 'cow' spoken by different people at different times, I recognise it as the same word — not just a similar one. Recognition of identity requires an eternal, numerically identical object of recognition — the eternal phoneme-type."}}
]}
]},
{tab:"Adhyāya 2-3 — Injunctions",title:"Adhyāya 2–3 — Types of Vedic Injunctions",sub:"MS 2.1–3.8 · Vidhi, Niyama, Parisaṃkhyā — The taxonomy of Vedic prescription",
intro:"Mīmāṃsā develops an elaborate taxonomy of Vedic injunctions (vidhis) to handle the apparent contradictions and redundancies in the vast Vedic corpus. Understanding which type of injunction a given Vedic statement is determines how it functions normatively — whether it prescribes a new action, restricts alternatives, or excludes options.",
legend:[{c:C.coral,t:"Vidhi Types"},{c:C.teal,t:"Qualifications"},{c:C.amber,t:"Sacrifice"},{c:C.blue,t:"Hermeneutics"}],
branches:[
{name:"Four Types of Vidhi",ref:"MS 2.1.1–2.1.18",color:C.coral,children:[
{n:"Utpattividhi, Viniyogavidhi, Prayogavidhi, Adhikāravidhi",r:"MS 2.1.1–2.1.18",d:"Four types of Vedic injunction: originating, applying, procedural, qualifying",
det:{c:"Mīmāṃsā recognises four types of prescriptive injunction: (1) <em>Utpattividhi</em> (originating injunction): the primary injunction that prescribes a new action entirely — e.g., 'One desiring heaven should sacrifice with the Agniṣṭoma.' This creates an entirely new obligatory action where none was previously known. (2) <em>Viniyogavidhi</em> (applicatory injunction): prescribes which subsidiary element belongs to which main rite — e.g., 'One should use this mantra in this ritual context.' (3) <em>Prayogavidhi</em> (procedural injunction): specifies the sequence in which actions within a ritual are to be performed. (4) <em>Adhikāravidhi</em> (qualificatory injunction): specifies who is qualified (adhikārin) to perform a given rite — e.g., 'The Brahmin who desires heaven should sacrifice' qualifies Brahmins with the desire for heaven as the proper performers.",
sbt:"Śabara: the distinction between utpattividhi and viniyogavidhi is crucial because it determines whether a given element of the ritual is independently prescribed or merely subordinate to a main prescription. Getting this wrong leads to either under-performance (omitting an independently required element) or over-performance (treating a viniyoga as an independent utpatti).",
kum:"Kumārila: the adhikāravidhi is the basis of Mīmāṃsā's social philosophy. Not all persons are qualified for all rites — the Vedic qualification (adhikāra) system specifies the competencies required for each category of ritual. This is not mere social hierarchy (as critics claim) but a functional assignment: different rites require different types of qualification (desire for a specific result, membership in a specific social category, ritual purity, etc.)."}},
{n:"Arthavāda — Subsidiary Explanatory Passages",r:"MS 1.2.1–1.2.18",d:"Arthavāda passages are not injunctions — they are supportive commentary that motivates the injunctions",
det:{skt:"विधिना त्वेकवाक्यत्वादर्थवादस्तदाश्रितः",tr:"Because of unity of sentence with the injunction, the arthavāda is dependent on it.",
c:"<em>Arthavāda</em> is a major category of Vedic text distinct from injunctions. These are passages that praise an action ('By this sacrifice, Indra obtained the sovereignty of heaven'), condemn an alternative ('He who does not sacrifice falls into the abyss'), or explain the background ('Prajāpati offered this sacrifice at the beginning of creation'). They are not themselves injunctions — they do not prescribe anything independently. They function to motivate the performance of the injunctions by providing reasons, praise, and warnings.",
sbt:"Śabara: arthavāda passages are not false (the Vedic statements are not incorrect) but they are not literally accurate descriptions of events either. They are 'true' in the sense that they correctly characterise the normative status of actions — praising what is good (prescribed), condemning what is bad (prohibited). They are rhetorical support for the injunctions, not independent factual claims.",
kum:"Kumārila: arthavāda's complex relationship to injunctions is Mīmāṃsā's answer to the apparent contradiction between Vedic narratives (describing events in the past, e.g., 'Indra killed Vṛtra') and Vedic injunctions (prescribing future actions). The narratives are in the service of the prescriptions — they motivate rather than inform.",
prb:"Prabhākara: arthavāda is an independent species of valid Vedic cognition — it produces what Prabhākara calls 'codanā-janya-jñāna' (cognition born from prescriptive force). Even arthavāda passages, properly understood, carry a kind of prescriptive meaning — the praise of an action is equivalent to a weak prescription of it."}}
]},
{name:"Adhikāra — Qualification for Ritual",ref:"MS 6.1.1–6.1.38",color:C.amber,children:[
{n:"Three Conditions of Adhikāra",r:"MS 6.1.1",d:"Desire for the result, capacity, and scriptural prescription — the three conditions for ritual qualification",
det:{c:"To be a valid performer (adhikārin) of a Vedic rite, a person must meet three conditions: (1) <em>Phale abhilāṣa</em> — genuine desire for the specific result of the rite (e.g., genuine desire for heaven motivates the Agniṣṭoma). (2) <em>Sāmarthya</em> — practical capacity to perform the rite (physical, financial, ritual — the rite's requirements are met). (3) <em>Vidhisambandhana</em> — being mentioned in the prescriptive injunction either explicitly or by inference.",
sbt:"Śabara: the first condition (desire for the result) is the most important. The Vedic injunctions are hypothetical imperatives: 'If you desire X, you should do Y.' A person who does not desire heaven is not obligated by the Agniṣṭoma injunction. But the nityakarmas (daily obligatory rites like the morning prayer) are categorical: they are prescribed regardless of specific result-desires.",
kum:"Kumārila: the adhikāra framework explains why Mīmāṃsā is not moral absolutism — it is a sophisticated system of conditional obligations. The categoricality of nityakarmas arises not from an independent moral fact but from the structure of the injunction: the prescription's domain includes all who belong to a certain social-ritual category (like 'all Brahmins')."}},
{n:"Nityakarma, Naimittika, Kāmya — Obligatory, Occasional, Optional Rites",r:"MS",d:"Three categories of Vedic action by obligatory force",
det:{c:"(1) <em>Nityakarma</em> (obligatory, daily rites): rites that are absolutely required regardless of specific desire for their result — e.g., the Sandhyāvandana (daily prayers), the Agnihotra (daily fire offering). Non-performance of nityakarmas generates sin (adharma); performance generates no merit (dharma) beyond the avoidance of sin. (2) <em>Naimittika</em> (occasional, circumstantial rites): rites prescribed for specific occasions (birth, marriage, death, eclipses) — their performance is obligatory when the occasion arises. (3) <em>Kāmya</em> (optional, desire-based rites): rites performed only when a person desires a specific result (the Agniṣṭoma for heaven, the Putrakāmeṣṭi for a son). Non-performance of kāmya rites generates no sin — only the sacrifice of the desired result.",
sbt:"Śabara: the tripartite distinction is fundamental to practical Mīmāṃsā (the branch concerned with telling people what they must, may, and need not do). The nityakarma-adharma connection is Mīmāṃsā's version of moral necessity: certain actions are necessary not because of their results but because omitting them produces a deficit in one's ritual standing.",
kum:"Kumārila: the kāmya rites are prescribed by hypothetical imperatives (if...then) but their prescriptions are nonetheless genuinely Vedic and genuinely obligatory for those who fit the conditions. The conditionality does not make the obligation fictional or merely advisory — it makes it appropriately conditional."}}
]}
]},
{tab:"Adhyāya 6-7 — Śabdanaya",title:"Adhyāya 6–7 — Theory of Meaning and Sentence-Understanding",sub:"MS 6.1 · How Vedic sentences generate dharmic knowledge",
intro:"The core of Mīmāṃsā's philosophy of language: how do Vedic sentences communicate prescriptive content? The theory of how words generate sentence-meaning (akhyāti or anyathākhyāti, the nature of error) and the debate between Kumārila and Prabhākara on sentence-meaning are among the most sophisticated contributions to Indian philosophy of language.",
legend:[{c:C.blue,t:"Philosophy of Language"},{c:C.purple,t:"Semantics"},{c:C.teal,t:"Pramāṇa Theory"},{c:C.amber,t:"Error Theory"}],
branches:[
{name:"Theory of Error — Khyātivāda",ref:"Ślokavārttika",color:C.purple,children:[
{n:"Anyathākhyāti — Kumārila's Theory of Error",r:"Ślokavārttika",d:"Error is the misapprehension of one real thing as another real thing — a relational mistake, not a creation of the unreal",
det:{c:"The debate on the nature of perceptual error is one of classical Indian philosophy's most refined. The problem: in the classic case of 'shell appearing as silver,' what exactly goes wrong? Three theories: (1) Buddhist asatkhyāti (apprehension of the non-existent): the silver that appears is unreal, a product of pure mental construction. (2) Advaita Vedānta anirvacanīyakhyāti (apprehension of the indescribable): the apparent silver is neither real (it is contradicted by the correcting cognition) nor unreal (it appears). (3) Nyāya-Vaiśeṣika anyathākhyāti (misapprehension): the silver seen in the shell is real silver — but it is seen in the wrong place. The error consists in a relational mistake, not in seeing something unreal. Kumārila endorses anyathākhyāti: the illusory silver is real silver (elsewhere, perhaps in one's memory), being misattributed to the shell by a defective cognitive process.",
sbt:"Śabara's foundational analysis: error is a real cognitive event — it is not the mere absence of correct cognition. This has implications for svataḥ prāmāṇya: errors are valid cognitions with respect to their content but are rendered invalid by external contradiction. The silver-cognition is valid in itself; its invalidity is established by the subsequent 'this is shell' cognition.",
kum:"Kumārila's Anyathākhyāti has a subtle implication for Mīmāṃsā's theory of Vedic validity: the Vedic cognitions (produced by eternal, authorless injunctions) can have no external contradicting cognition — their invalidity cannot be established by any means. Their validity, being intrinsic and unchallenged, is therefore permanent. Svataḥ prāmāṇya + anyathākhyāti together form an unassailable defence of Vedic authority."}}
]},
{name:"Word-Meaning and Sentence-Meaning",ref:"Ślokavārttika & Bṛhatī",color:C.blue,children:[
{n:"Śabdanityatva — Eternality of the Phoneme",r:"Ślokavārttika",d:"The phoneme-type is eternal — individual utterances only manifest it, not create it",
det:{c:"Mīmāṃsā's claim: the Vedic word (śabda) is eternal (nitya). What is 'eternal' here? Not the physical sound-token (nāda) — which is obviously impermanent — but the phoneme-type (varṇa) — the abstract, repeatable entity 'the sound k,' 'the sound a,' etc. These phoneme-types are eternal, not produced by anyone, and their combinations into words and sentences are therefore also eternal. This is the basis of the Veda's apauruṣeyatva: since the Vedic words are eternal and not produced by anyone, the Veda as a collection of these eternal words is itself eternal and without author.",
sbt:"Śabara's argument for the eternality of the phoneme: when different people utter the word 'cow' (go), we hear it as the same word — not because they are producing identical sound-waves but because they are 'manifesting' the same eternal phoneme-type. The phoneme-type 'g' is one and eternal; individual utterances only manifest it, they do not create it.",
kum:"Kumārila against the Buddhist theory of the phoneme as momentary: if each utterance of 'g' produced a numerically distinct, momentary phoneme-token, then the different utterances of 'go' would be different words — communication would be impossible. The fact that communication succeeds across different speakers and times proves the existence of an eternal, repeatable phoneme-type.",
prb:"Prabhākara's variant: the eternality of the phoneme is established not just by the recurrence-argument but by the nature of recognition (pratyabhijñā). When I hear the same sentence again, I recognise it as the same sentence — not as a qualitatively similar but numerically distinct sequence. Recognition of identity (not merely similarity) requires an eternal identical entity to be recognised."}},
{n:"Abhihitānvaya vs Ānvitābhidhāna",r:"Ślokavārttika / Bṛhatī",d:"How does the unified sentence-meaning arise from individual word-meanings?",
det:{c:"Two competing theories of sentence-meaning: (1) Kumārila's <em>Abhihitānvaya</em> (combination of individually expressed meanings): the individual words express their meanings separately, and the sentence-meaning is then grasped as a combination of these separately expressed meanings. The unity of the sentence-meaning is produced by a secondary mental act of combination (anvaya). (2) Prabhākara's <em>Ānvitābhidhāna</em> (expression of meanings in their relation): words directly express their meanings-as-already-related — the individual word 'bring' does not mean 'bring' in isolation but 'bring-as-related-to-an-object.' The relation is primary, not secondary.",
sbt:"Śabara's foundational analysis: the sentence-meaning is the unified action-complex expressed by the main verb — the action (kriyā), its agent (kartā), its object (karma), and the qualifications of each. The injunctive Vedic sentence expresses a unified complex of obligation — not a sum of separate word-meanings.",
kum:"Kumārila: the primary carrier of meaning is the word (pada); the sentence-meaning is derived from the individual word-meanings through the operation of three factors — ākāṅkṣā (mutual expectation of words for completion), yogyatā (semantic compatibility), and āsatti (proximity/contiguity). Only when these three conditions are satisfied does the sentence generate a unified cognition.",
prb:"Prabhākara: word-meanings are always relational — a word never expresses an isolated meaning but always a meaning-as-related-to-others. This is more consistent with the actual experience of understanding sentences, where we do not first grasp isolated meanings and then combine them but grasp the relational structure directly. Prabhākara's position anticipates structural linguistics' emphasis on the primacy of syntactic relations over isolated lexical meanings."}}
]}
]}
];

builders.vedanta=function(){
const secs=[
// ───────────────────────────────────────────────────────────────────
// TAB 1 — PRINCIPAL UPANIṢADS (Mukhya 10+3)

{tab:"Ten Principal Upaniṣads",title:"The Ten Principal Upaniṣads — Daśopaniṣad",sub:"The mukhya Upaniṣads commented upon by all three ācāryas",
intro:"Śaṅkara wrote bhāṣyas on ten Upaniṣads (with Nṛsiṃhapūrvatāpanīya and Māṇḍūkya-Kārikā sometimes added, giving 12–13). These are the foundational texts of all Vedāntic schools. Rāmānuja's Śrī-Bhāṣya on the Brahmasūtras extensively quotes and interprets the key passages of these Upaniṣads. Madhva wrote separate commentaries (bhāṣyas) on all ten plus several minor ones.",
legend:[{c:C.amber,t:"Śaṅkara·Advaita"},{c:C.teal,t:"Rāmānuja·Viśiṣṭādvaita"},{c:C.blue,t:"Madhva·Dvaita"},{c:C.purple,t:"Core Teaching"},{c:C.green,t:"Mahāvākya"}],
branches:[
{name:"Bṛhadāraṇyaka Upaniṣad",ref:"Śukla Yajurveda · Śatapatha Brāhmaṇa · 6 adhyāyas",color:C.amber,children:[
{n:"Aśvamedha Brāhmaṇa — The Horse Sacrifice Cosmogony",r:"BAU 1.1",d:"The horse sacrifice as cosmic symbol — the head is the dawn, the eye is the sun",
det:{skt:"उषा वा अश्वस्य मेध्यस्य शिरः। सूर्यश्चक्षुः।",tr:"The dawn indeed is the head of the sacrificial horse; the sun is its eye.",
c:"The Bṛhadāraṇyaka opens with an audacious move: it identifies every part of the sacrificial horse with a corresponding cosmic element, and then identifies the cosmic whole with brahman. This is the Upaniṣadic method of bandhu (binding, equivalence) — perceiving the identity of the ritual with the cosmos and the cosmos with consciousness.",
shk:"Śaṅkara: this opening section establishes that the entire manifest cosmos is to be understood as an expression of the one brahman. The horse-cosmos identification is not mythology but upāsanā (meditation instruction) — the practitioner is to meditate on the sacrifice as the cosmos and thereby transcend both. The purpose is to prepare the mind for the mahāvākya teaching that follows.",
rmj:"Rāmānuja: the horse-cosmos identification illustrates the Viśiṣṭādvaita principle that the world is the body (śarīra) of brahman/Īśvara. Just as the horse's parts are unified by one life, the cosmic parts are unified by the one Īśvara who is their inner self (antaryāmin).",
mdv:"Madhva: the identification is devotional, not ontological. The horse represents the manifest world which is entirely distinct from and dependent on Viṣṇu (= brahman). Meditating on this identity awakens devotion to the Lord who pervades and transcends his creation."}},
{n:"Ajātaśatru-Gārgya Dialogue — Meditation on Brahman",r:"BAU 2.1",d:"Gārgya's failed meditations and Ajātaśatru's teaching of the self as the inner witness of sleep",
det:{skt:"ब्रह्म वा अहमस्मीति — एष ते आत्मा सर्वान्तर इति",tr:"'I am brahman' — 'This is your self, the inner controller of all.'",
c:"Gārgya lists sixteen meditations (on the person in the sun, moon, lightning, etc.) — each rejected by the Kṣatriya king Ajātaśatru as incomplete because they identify brahman with a specific quality or object. Ajātaśatru then teaches the supreme teaching: the self in deep sleep — the prajñā (luminous awareness) that underlies all states — is the true brahman.",
shk:"Śaṅkara: this dialogue is a demonstration of adhikāra-parīkṣā — the teacher testing whether the student's meditation is based on a genuine understanding of the non-dual brahman or on partial, object-based meditation. Ajātaśatru's correction points to the self as pure, witnessing consciousness — not an object of meditation but the meditation itself.",
rmj:"Rāmānuja: the sixteen meditations are valid upāsanās of Īśvara in his various cosmic manifestations. Ajātaśatru's teaching adds the key insight: Īśvara is also the self of all individuals — the inner controller (antaryāmin). This is the foundation of Rāmānuja's śarīra-śarīrin (body-soul) relation between Īśvara and the world.",
mdv:"Madhva: the 'self within' (antaryāmin) is Viṣṇu — the supreme independent reality distinct from both the individual self (jīva) and the world. The deep sleep state (suṣupti) is not a state of brahman-experience but a state in which Viṣṇu's sustaining presence alone remains, all individual activity having been withdrawn."}},
{n:"Yājñavalkya-Maitreyī Dialogue — Ātman as the Essence of Love",r:"BAU 2.4 / 4.5",d:"Everything is dear not for its own sake but for the sake of the self",
det:{skt:"न वा अरे पत्युः कामाय पतिः प्रियो भवति, आत्मनस्तु कामाय पतिः प्रियो भवति",tr:"The husband is not dear for the sake of the husband; rather the husband is dear for the sake of the self.",
c:"Yājñavalkya, about to leave for a life of renunciation, divides his property between his two wives. Maitreyī asks whether wealth without the knowledge of immortality is worthwhile — a question that opens the dialogue to the deepest teaching. The sūtra (verse) that follows is one of the most cited in all of Vedānta: everything dear — husband, wife, children, wealth, gods, worlds — is dear not for its own sake but for the sake of the ātman. The ātman is the ultimate ground of all love.",
shk:"Śaṅkara: this passage reveals that the deepest motive of all human love is the ātman itself. We love objects because we unconsciously identify them with the ātman (brahman). When the ātman is known directly, the need to seek it through objects dissolves — not because love ends but because it finds its true object and rests there. The mahāvākya 'aham brahmāsmi' (I am brahman) is the direct expression of this realisation.",
rmj:"Rāmānuja: the passage teaches that Īśvara (as ātman-of-all) is the ultimate ground of all love. When we love any finite being, we are — without knowing it — reaching toward the infinite Īśvara who is the inner self of that being. Devotion (bhakti) is the conscious form of this natural movement of love toward its ultimate source.",
mdv:"Madhva: the ātman referred to is not one's personal self but the paramātman (Viṣṇu) who is the ātman of all. All love is ultimately love for Viṣṇu — who is independently real, supremely blissful, and the source of all joy. Liberation consists in consciously directing this love to its true object."}},
{n:"Yājñavalkya-Janaka Dialogue — Five Fires, Rebirth, and Liberation",r:"BAU 6.2",d:"The five fire doctrine (pañcāgnividyā) — the path of the gods and the path of the ancestors",
det:{skt:"देवयानः पितृयाण इति — तद्य इत्थं विदुः...अमृतत्वमश्नुते",tr:"The path of the gods and the path of the ancestors — those who know thus... they attain immortality.",
c:"The pañcāgnividyā (five fire teaching): the cosmos is a series of five 'fires' in which offerings are made and from which things emerge. The five fires are: heaven (sun as fire, faith as fuel, soma as offering, rain emerges); cloud (air/space as fire, rain as offering, food emerges); earth (fire/year as fire, food as offering, sperm emerges); man (fire as fire, sperm as offering, the embryo emerges); woman (fire as fire, the child emerges). After death: the person follows either the devayāna (path of the gods → non-return → liberation) or the pitṛyāna (path of the ancestors → moon → return to earth → rebirth). Only those who know the pañcāgnividyā and cultivate brahman attain the devayāna.",
shk:"Śaṅkara: the devayāna and pitṛyāna are described for those who have realised brahman with qualities (saguna brahman) and those who have accumulated merit through ritual. The supreme teaching is that direct knowledge of nirguna brahman (brahman without qualities) transcends both paths — the jñānī does not travel any path after death but simply dissolves into brahman immediately at death.",
rmj:"Rāmānuja: the devayāna is the path of those who have practised upāsanā of Īśvara (saguna brahman) with full knowledge. They travel to Brahmaloka (the abode of Brahmā/Hiraṇyagarbha) and from there attain liberation at the end of the cosmic cycle. The pitṛyāna is the path of those whose merit was accumulated through ritual only, without knowledge.",
mdv:"Madhva: the devayāna is the path of Viṣṇu-devotees who attain Vaikuṇṭha — the eternal abode of Viṣṇu — from which there is no return (no rebirth). The pitṛyāna is for those devoted to the ancestors — they attain the intermediate realm and eventually return. Liberation is exclusively Viṣṇu's grace."}},
{n:"Yājñavalkya at Janaka's Court — Supreme Self (paramātman)",r:"BAU 4.3–4.4",d:"The self in the three states — waking, dream, and deep sleep — and the fourth (turīya)",
det:{skt:"अत्रैव समृद्धो भवति। आत्मानमेव लोकमुपास्स्व।",tr:"In this alone is the self complete. Meditate on the self as the world.",
c:"Yājñavalkya's teaching to King Janaka in the lengthy court dialogue traces the self through its three states of experience: (1) In waking (jāgrat), the self takes the material body as its field and experiences external objects through the senses. (2) In dream (svapna), the self creates its own luminous world from the impressions of waking experience — demonstrating the self's creative power. (3) In deep sleep (suṣupti), the self rests in the pericardium, dissolved into prāṇa, free from all experience — 'as a child might sleep, or a great king, or a great brahmin, transcending good and evil, all the worlds.' The fourth state (implied but not named in BAU — named turīya in the Māṇḍūkya) is the self in its own nature: the witness of all three states, the pure light of consciousness.",
shk:"Śaṅkara: the deep sleep analysis is decisive for Advaita. In deep sleep, the apparent divisions of waking life (subject-object, this-that, I-other) dissolve, and only pure consciousness remains. On waking, the person reports 'I knew nothing; I was happy' — a memory of contentlessness and bliss. This demonstrates that the self's essential nature is blissful, contentless consciousness — brahman. The three states are like waves on the ocean of turīya; turīya is not a fourth state but the substratum of all three.",
rmj:"Rāmānuja: the three states are modes of the jīva's (individual self's) experience, not of brahman. Brahman (Īśvara) is the witness of the jīva's experiences in all three states — the antaryāmin who is permanently awake within. Deep sleep is a state of non-experience for the jīva, not a state of brahman-realisation. Rāmānuja's critique of Advaita: if deep sleep were genuine brahman-experience, everyone would awaken from sleep as a jñānī.",
mdv:"Madhva: the four states are modes of the individual jīva, entirely distinct from Viṣṇu who is beyond all states. The 'I knew nothing' report of deep sleep does not indicate brahman-experience — it indicates the jīva's temporary dissolution into a subtle state of consciousness maintained by Viṣṇu's sustaining presence."}},
{n:"Neti Neti — The Via Negativa",r:"BAU 3.9.26 / 4.2.4",d:"The self is 'not this, not this' — beyond all affirmative characterisation",
det:{skt:"नेति नेति — न ह्येतस्मादिति नेत्यन्यत्परम् अस्ति",tr:"'Not this, not this' — for there is nothing higher than this 'not this, not this.'",
c:"The famous neti neti (not this, not this) formula is Yājñavalkya's ultimate characterisation of brahman/ātman. Every positive characterisation ('brahman is consciousness,' 'brahman is bliss') points toward brahman but necessarily falls short — for brahman is not any of its attributes but the substratum of all of them. The only adequate characterisation is the via negativa: systematically negating every possible object or quality, until what remains cannot be negated — the pure witnessing awareness.",
shk:"Śaṅkara: neti neti is the method of adyāsa-apavāda — the systematic removal of superimposed attributes. Brahman is not form, not sound, not thought, not bliss (as an experience), not any of the 25 Sāṃkhya tattvas — for it is the witness of all these. What remains after all negations is not nothing but the pure, self-luminous awareness that was doing the negating. This is the famous anvaya-vyatireka method: whatever is present in all experiences (the awareness) and absent in no experience is the true self.",
rmj:"Rāmānuja's critique: neti neti does not mean that brahman/Īśvara has no attributes. It means that Īśvara transcends all limiting or defective attributes — all that is finite, dependent, or conditioned. Īśvara's infinite, perfect attributes (omniscience, omnipotence, infinite bliss, etc.) are not denied by neti neti — they are affirmed. Neti neti denies finitude, not the infinite positive reality of Īśvara.",
mdv:"Madhva: neti neti points to Viṣṇu's transcendence of all creaturely categories. Viṣṇu cannot be grasped by negation alone — he is supremely positive reality (abhaya, ananda, jñāna, śakti). The negations clear away inadequate conceptions; what remains is not formless contentlessness but the supreme Person, Viṣṇu."}}
]},
{name:"Chāndogya Upaniṣad",ref:"Sāmaveda · 8 adhyāyas",color:C.teal,children:[
{n:"Udgītha Meditation — Oṃkāra",r:"ChU 1.1",d:"Oṃ is the udgītha; meditate on oṃ as the entire world",
det:{skt:"ॐ इत्येतदक्षरमुद्गीथमुपासीत। ओमिति ह्युद्गायति। तस्योपव्याख्यानम्।",tr:"One should meditate on the syllable Oṃ as the udgītha. For one sings beginning with Oṃ. This is the explanation of it.",
c:"The Chāndogya opens with the meditation on Oṃ as the udgītha — the first and most important syllable of Sāmavedic chanting. Oṃ is identified with the essence (rasa) of all beings: earth → water → plant → person → speech → Oṃ. Oṃ is the prāṇa of prāṇas — the breath of all breath — the life of all life.",
shk:"Śaṅkara: Oṃ is the name of brahman — but specifically as a meditation support (upāsanā-ālaṃbana). The meditator who contemplates Oṃ gradually dissolves the name-form distinctions into the nameless, formless brahman that Oṃ points to. The three syllables A-U-M correspond to waking, dream, and deep sleep; their combination and cessation points to turīya.",
rmj:"Rāmānuja: Oṃ is the primary name of Īśvara. Meditating on Oṃ is meditating on Īśvara in his most direct verbal form. The udgītha meditation is a form of nāmajapa — chanting the divine name — which purifies the antaḥkaraṇa (inner instrument) for bhakti.",
mdv:"Madhva: Oṃ directly means Viṣṇu — it is Viṣṇu's primary name, not a generic name of brahman. The 'a' in Oṃ is the ācārya who leads (Viṣṇu as teacher); the 'u' is the devotee; the 'm' is the world sustained by Viṣṇu. The meditation on Oṃ is an act of direct worship of Viṣṇu."}},
{n:"Ṣaṭpañcāśat Vidyās — Aśvapati's Teaching on Vaiśvānara",r:"ChU 5.11–5.24",d:"The five fires — Vaiśvānara is the self, the cosmic fire, the entire person",
det:{skt:"स य एवमेतद्वैश्वानरमात्मानं वेद — सर्वेष्वंगेषु अन्नमत्ति",tr:"He who knows this Vaiśvānara self thus — eats food in all his limbs.",
c:"Five great householders go to Uddālaka Āruṇi seeking knowledge of the self. He sends them to King Aśvapati Kaikeyī, who teaches the Vaiśvānara (cosmic fire/self) meditation: the cosmic fire is identified with the individual's body — its head is the heavenly realm, its eye is the sun, its breath is air, its body is space, its bladder is water, its feet are the earth. This totality is the Vaiśvānara ātman — the self as the entire cosmos.",
shk:"Śaṅkara: the Vaiśvānara teaching is a saguna upāsanā (meditation on brahman with attributes) — it does not teach the ultimate truth (brahman as pure consciousness without form) but prepares the mind for it. The student who perfects this meditation transcends it and arrives at the direct knowledge of nirguna brahman.",
rmj:"Rāmānuja: the Vaiśvānara is Īśvara in his aspect as the cosmic inner self of all the elements and all individuals. The meditation is an accurate cognition of the truth — Īśvara is genuinely the 'self' of all beings in the sense that he is their inner controller (antaryāmin) and the ground of their existence. This is not a pedagogical fiction but a direct teaching of Viśiṣṭādvaita.",
mdv:"Madhva: Vaiśvānara is one aspect or manifestation of Viṣṇu — the cosmic fire-form in which Viṣṇu pervades and sustains the material world. The meditation on Vaiśvānara is a form of Viṣṇu worship, not a philosophical speculation."}},
{n:"Mahāvākya — Tat Tvam Asi",r:"ChU 6.8.7",d:"The great saying: That (brahman) you are (Śvetaketu)",
det:{skt:"तत् त्वम् असि श्वेतकेतो",tr:"That you are, Śvetaketu.",
c:"The most celebrated mahāvākya (great saying) of the Upaniṣads. Uddālaka instructs his son Śvetaketu through a series of nine illustrations, each concluding with 'tat tvam asi' — 'That (the subtle essence that is the self of all) you are.' The nine illustrations: (1) The invisible self of the nyagrodha tree seed that produces the great tree. (2) Salt dissolved in water, present everywhere but invisible. (3) A man blindfolded and led away from home — untying the blindfold at each direction brings him home. (4) The dying man — what departs at death and what remains. (5) The convergence of rivers in the ocean. Etc.",
shk:"Śaṅkara: 'tat tvam asi' is the most direct expression of the non-dual truth (advaita). 'Tat' (that) refers to brahman — pure existence-consciousness-bliss (sat-cit-ānanda) — as it is in itself (without any upādhi — limiting adjunct). 'Tvam' (you) refers to the jīva (individual self) — as it is in itself, stripped of the limiting adjunct of the body-mind complex. When both are understood in their essential nature (not their appearances), they are identical — not similar, not related, but literally the same. The apparent difference is due to adhyāsa (superimposition) of the upādhis (limiting conditions) on the two sides of the equation.",
rmj:"Rāmānuja's major critique of Śaṅkara's reading: the identity in 'tat tvam asi' is not absolute numerical identity but qualified identity — the jīva and brahman are identical in the sense that the jīva is brahman's mode (prakāra), brahman's body (śarīra). The jīva is real and distinct (not illusory), but it depends entirely on brahman and cannot be understood apart from brahman — just as a body cannot be understood apart from its soul. 'That you are' means 'you are a real mode of That' — not 'you are That in the same undifferentiated sense.'",
mdv:"Madhva: 'tat tvam asi' does not assert identity of the jīva and brahman/Viṣṇu — this would contradict the fundamental distinction between the independent Viṣṇu and the dependent jīva. Madhva reads the sentence as: 'You are that (jīva that depends on Viṣṇu)' — an assertion of the jīva's dependent nature and Viṣṇu's independent reality. The sentence teaches subordination, not identity."}},
{n:"Sanatkumāra-Nārada Dialogue — Bhūman (the Infinite)",r:"ChU 7.23–7.25",d:"The bhūman — the infinite — is the only genuine happiness; the finite is sorrow",
det:{skt:"यो वै भूमा तत्सुखम् — नाल्पे सुखमस्ति — भूमैव सुखम्",tr:"The bhūman (Infinite) is happiness. In the finite there is no happiness. Only the Infinite is happiness.",
c:"Sanatkumāra leads Nārada through a hierarchy of meditations — from name (nāma) up through speech, mind, will, thought, contemplation, understanding, strength, food, water, fire, space, memory, hope, prāṇa — each identified as 'greater than the previous.' The culmination: the bhūman (Infinite, the uncountable, the boundless) — which sees nothing other than itself, hears nothing other than itself, knows nothing other than itself. This is brahman. The finite always needs an other — 'I am greater than this, I am less than that' — and this needing is sorrow. The Infinite needs no other and is therefore purely happy.",
shk:"Śaṅkara: the bhūman is the supreme brahman — nirguna, non-dual, self-luminous. The hierarchy of meditations (name, speech, mind, etc.) is a progressive purification of the concept of brahman, removing each successive identification until the pure infinite is reached. The phrase 'sees nothing other than itself' is Advaita's definition of liberation: the jñānī who has realised brahman no longer perceives duality — they 'see' brahman everywhere as the only reality.",
rmj:"Rāmānuja: the bhūman is Īśvara — infinitely real, infinitely blissful, infinitely self-sufficient. But Īśvara 'seeing nothing other than himself' does not mean that the world is unreal — it means that Īśvara sees the entire world as his own body (ātmabhāvena — as modes of himself). The devotee who realises Īśvara as the bhūman sees the entire world as Īśvara's body and Īśvara as the inner self of all.",
mdv:"Madhva: the bhūman is Viṣṇu in his supreme blissful nature. The teaching is that genuine, unlimited happiness exists only in Viṣṇu — all finite happiness is borrowed from him and returns to him. Liberation is the direct experience of Viṣṇu's infinite bliss — not a contentless void but the plenitude of devotional experience in Vaikuṇṭha."}},
{n:"Āruṇi's Teaching — Self as the Subtle Essence",r:"ChU 6.1–6.16",d:"All of this (the manifest world) is that subtle essence; that Self is this entire world; that you are, Śvetaketu",
det:{skt:"एतत्सर्वं ब्रह्म — अयमात्मा ब्रह्म — तत्त्वमसि",tr:"All this is brahman — this self is brahman — that you are.",
c:"Uddālaka Āruṇi's teaching to his son Śvetaketu begins with an observation: 'Before creation, all this was One Existence (sat) alone, without a second.' From that One Existence, the universe emerged — first heat (tejas), then water (āpas), then food/earth. Uddālaka then works through the subtle essence (the invisible reality underlying all manifest forms) — comparing it to salt dissolved in water, imperceptible yet real. The teaching culminates in the nine-fold 'tat tvam asi.'",
shk:"Śaṅkara: 'All this is brahman' (sarvam khalv idaṃ brahma — Chāndogya 3.14.1, cited here) is the positive form of the mahāvākya. The universe is not illusion in the sense of non-existence — it is brahman appearing through the medium of name-and-form (nāmarūpa). The salt-water analogy is perfect: the salt (brahman) is everywhere in the water (the universe) though imperceptible through ordinary means. Viveka (discrimination) tastes brahman in everything.",
rmj:"Rāmānuja: the 'One Existence without a second' does not mean that only one undifferentiated entity exists — it means that before creation, Īśvara existed alone, with the world and the jīvas in a potential (kāraṇāvasthā) state within him. 'Without a second' means without anything independent of Īśvara. The universe that emerges is a real transformation (pariṇāma) of brahman's śakti (power) — not an appearance (vivarta) of brahman as Advaita holds.",
mdv:"Madhva: 'One Existence' refers to Viṣṇu before creation — but the jīvas and the material world were always distinct from him, just in an unmanifest state. 'Without a second (independent reality)' means that nothing exists independently of Viṣṇu — not that nothing else exists at all. Madhva's distinction: Viṣṇu is svātantra (independent); everything else is paratantra (dependent). This is the fundamental Dvaita distinction."}}
]},
{name:"Taittirīya Upaniṣad",ref:"Kṛṣṇa Yajurveda · 3 valli",color:C.blue,children:[
{n:"Pañcakośa — Five Sheaths of the Self",r:"TaittU 2.1–2.9",d:"The self is enveloped in five sheaths: food, breath, mind, understanding, bliss",
det:{skt:"अन्नमयो मनोमयः प्राणमयः विज्ञानमयः आनन्दमयः",tr:"The self made of food, the self made of breath, the self made of mind, the self made of understanding, the self made of bliss.",
c:"The Taittirīya introduces the pañcakośa (five sheath) model — one of Vedānta's most influential frameworks: (1) <em>Annamaya kośa</em> (food sheath): the gross physical body, nourished by food. (2) <em>Prāṇamaya kośa</em> (breath sheath): the vital force animating the physical body. (3) <em>Manomaya kośa</em> (mental sheath): the emotional-perceptual mind. (4) <em>Vijñānamaya kośa</em> (intelligence sheath): the discriminating intellect. (5) <em>Ānandamaya kośa</em> (bliss sheath): the causal body in deep sleep — the innermost sheath, closest to the true self. The true self (ātman/brahman) is none of these sheaths but the witness of all five.",
shk:"Śaṅkara: the pañcakośa model is a tool of neti neti — it gives a precise method for the meditator to progressively disidentify from each sheath. 'I am not the food-body, not the breath-body, not the mind, not the intellect, not even the bliss of deep sleep' — what remains after all five negations is the pure, self-luminous ātman. The ānandamaya kośa is often confused with brahman (especially in Advaita-critical interpretations) because it is described as 'full of bliss' — Śaṅkara explicitly argues it is still a kośa (a sheath), not the ultimate self.",
rmj:"Rāmānuja: the five kośas are real aspects of the jīva (individual self), not illusions. The jīva is a conscious self distinct from brahman but entirely dependent on brahman. The ānandamaya kośa corresponds to the jīva's deepest nature — its participation in the bliss of brahman. The five kośas thus describe the jīva's embodied condition, moving from gross to subtle, pointing toward its innermost, spiritual nature.",
mdv:"Madhva: the five kośas are real layers of the jīva's embodied existence. The true self (jīva-ātman) is distinct from all five kośas but also distinct from the paramātman (Viṣṇu). Liberation is the jīva-ātman resting in its own nature of pure bliss — which is not Viṣṇu's bliss (which is infinite) but the jīva's own finite but pure bliss, freed from its covering by the five kośas."}},
{n:"Brahmananda Valli — Ānanda as Brahman",r:"TaittU 2.8",d:"From the bliss of food to the bliss of brahman — the hierarchy of bliss",
det:{skt:"ब्रह्मविद् आप्नोति परम् — यो वेद निहितं गुहायाम् — सत्यं ज्ञानमनन्तं ब्रह्म",tr:"The knower of brahman attains the highest. Brahman is truth, knowledge, infinite — hidden in the cave (of the heart).",
c:"The Taittirīya's definition of brahman: <em>satyaṃ jñānam anantaṃ brahma</em> — brahman is truth (satya — what is real without qualification), knowledge (jñāna — pure consciousness, not a cognitive act), and infinite (ananta — unlimited in all dimensions). This is one of the most philosophically precise definitions in the Upaniṣads. The text then describes brahman as hidden in the cave of the heart (guhā) — both the heart-space (dahara) and the metaphorical cave of the human spirit.",
shk:"Śaṅkara: 'satyaṃ jñānam anantaṃ brahma' is a tatpuruṣa compound analysis: these three terms are not three separate qualities of brahman (brahman is not 'truthful,' 'knowledgeable,' and 'unlimited' the way a person might be) — they are three indicators that collectively point to brahman's unique nature: it is what is real, it is what is knowing, it is what is unlimited. None of the three is a relational attribute; each is an identification. Brahman = reality = consciousness = infinity.",
rmj:"Rāmānuja: the three terms are real attributes (dharmabūtajñāna attributes) of Īśvara: Īśvara is genuinely truthful (never false), genuinely knowing (omniscient), and genuinely infinite (unbounded). These attributes are intrinsic to Īśvara's nature — they are not superimposed from outside. Rāmānuja insists that Śaṅkara's reading (three terms as bare identifications rather than attributes) dissolves the distinction between subject and predicate and makes the sentence uninformative.",
mdv:"Madhva: the three terms are positive attributes of Viṣṇu — his svarūpalakṣaṇas (essential characteristics). Viṣṇu is supremely real (the only truly independent reality), supremely knowing (omniscient), and infinite (unlimited in all respects). The 'cave of the heart' is Viṣṇu's dwelling in the devotee's heart — a real, devotional, intimate presence."}}
]},
{name:"Aitareya Upaniṣad",ref:"Ṛgveda · 3 adhyāyas",color:C.purple,children:[
{n:"Mahāvākya — Prajñānam Brahma",r:"AitU 3.3",d:"Consciousness is brahman — prajñāna is the one self of all",
det:{skt:"प्रज्ञानं ब्रह्म",tr:"Consciousness (prajñāna) is brahman.",
c:"The Aitareya's mahāvākya is the most epistemological of the four: 'Prajñānam brahma' — brahman is pure consciousness/intelligence (prajñāna). The context: after identifying the self with all the cosmic functions (breathing, speaking, seeing, hearing, thinking, understanding), the Upaniṣad asks 'What is that in which all of these depend? What is that one self?' Answer: prajñāna — the single intelligence that is the self of all divine and human functions. Then: 'Prajñānam brahma.'",
shk:"Śaṅkara: prajñāna here means pure, objectless, self-luminous consciousness — not the act of cognising any particular object. It is brahman in its aspect as cit (consciousness). The mahāvākya asserts that consciousness is not an attribute of brahman (the way redness is an attribute of a rose) but that brahman simply is consciousness. This is the foundation of Advaita's cit-svarūpa doctrine: consciousness is self-illuminating, self-referential, and self-certifying — it does not require an external illuminator.",
rmj:"Rāmānuja: prajñāna is an essential attribute of Īśvara — Īśvara is consciousness in the sense of being omniscient. The mahāvākya asserts that brahman/Īśvara is ultimately characterised by supreme consciousness — not that consciousness and brahman are numerically identical (as in Advaita) but that consciousness is brahman's most fundamental characteristic. The jīva also has prajñāna — but the jīva's prajñāna is finite and contracted by the body-mind complex.",
mdv:"Madhva: prajñāna is an intrinsic attribute of Viṣṇu — his jñāna-svarūpa (his essential nature as knowledge). 'Prajñānam brahma' asserts that brahman's nature is characterised supremely by knowledge — not that brahman is nothing but knowledge. Viṣṇu is also sat (being) and ānanda (bliss) — the three together constitute his svarūpalakṣaṇa."}}
]},
{name:"Muṇḍaka, Māṇḍūkya, Praśna",ref:"Atharvaveda tradition",color:C.green,children:[
{n:"Māṇḍūkya Upaniṣad — Four States and AUM",r:"MāṇḍU 1–12",d:"The twelve-verse Upaniṣad: waking, dream, deep sleep, and turīya as the four quarters of Oṃ",
det:{skt:"ॐ इत्येतदक्षरमिदं सर्वम् — जागरितस्थानो बहिष्प्रज्ञः — स्वप्नस्थानः — सुषुप्तस्थानः — नान्तःप्रज्ञं नान्तःप्रज्ञं नोभयतःप्रज्ञम्...",
tr:"Oṃ — this syllable is all this. The waking state — externally conscious. The dream state. The deep sleep state. (The fourth is) not inward-conscious, not outward-conscious, not both-conscious...",
c:"The Māṇḍūkya, the shortest of the principal Upaniṣads (12 verses), is considered by Gauḍapāda (Śaṅkara's paramaguru) and by Śaṅkara himself to be the most concentrated expression of the Advaita teaching. The four states (avasthās): (1) Viśva (waking) = A of AUM; (2) Taijasa (dream) = U of AUM; (3) Prājña (deep sleep) = M of AUM; (4) Turīya (the fourth) = the silence after AUM — not a fourth state but the ground of the other three, pure awareness. The 12th verse: 'Turīya is not inward-conscious, not outward-conscious, not both... not a cognitive mass, not conscious, not unconscious — unseen, unrelated, ungraspable, without inference, unthinkable, indescribable, the essence of the one-self-knowing, the cessation of the world, the peaceful, the auspicious, the non-dual — that is what is thought of as the fourth.'",
shk:"Śaṅkara's commentary on the Māṇḍūkya (together with Gauḍapāda's Kārikā) is the foundational Advaita text. Turīya is not a state one enters but the self in its own nature — the ever-present witness that has no analogue to the three states (which come and go) because it never comes or goes. The 'cessation of the world' (prapañcopaiśama) in turīya does not mean the world physically disappears but that its apparent independence from consciousness is recognised as false.",
rmj:"Rāmānuja: the Māṇḍūkya's turīya refers to Īśvara as the ground of the three states — the antaryāmin within the waking, dreaming, and sleeping jīva. The three states are real states of the real jīva; turīya is Īśvara's permanent, underlying presence within all three. Gauḍapāda's conclusion (in the Kārikā) that the world is like a dream is rejected by Rāmānuja: a dream is distinguished from waking by its being contradicted on waking; the waking world is never contradicted — therefore it is real.",
mdv:"Madhva: turīya refers to Viṣṇu's permanent presence as the witness and sustainer of the three states of the jīva. The four states are four modes of the dependent jīva; Viṣṇu is beyond all states, eternally self-sufficient. The equation of turīya with the cessation of all duality is rejected by Madhva: the distinction between jīva and Viṣṇu is real and eternal."}},
{n:"Muṇḍaka Upaniṣad — Higher and Lower Knowledge",r:"MuṇḍU 1.1.4–1.1.5",d:"Lower knowledge is the Vedas and their auxiliaries; higher knowledge is that by which the imperishable is known",
det:{skt:"परा चैवापरा च — अपरा ऋग्वेदो यजुर्वेदः... परा तु यया तदक्षरमधिगम्यते",
tr:"Two kinds of knowledge are to be known — the lower and the higher. The lower is the Ṛgveda, Yajurveda, Sāmaveda, Atharvaveda (and the six auxiliaries). The higher is that by which the imperishable (akṣara) is known.",
c:"The Muṇḍaka's two-knowledge distinction is foundational for Vedānta's understanding of the Vedas and their purpose. The lower knowledge (aparā vidyā) comprises the entire Vedic ritual and social system — the four Vedas, the six vedāṅgas (grammar, phonetics, metre, etc.), and all the sciences. This knowledge produces finite results within saṃsāra. The higher knowledge (parā vidyā) is brahman-knowledge — the direct, non-conceptual recognition of the imperishable (akṣara = brahman/ātman). From it the entire universe is known 'as a spider knows its web from within,' since brahman is the inner cause of all.",
shk:"Śaṅkara: the distinction is between saguna-upāsanā (meditation on brahman with attributes — producing finite, heavenly results) and nirguna-jñāna (non-dual knowledge of brahman — producing liberation). The lower knowledge is not invalid — it serves its own purposes — but it does not produce liberation. This is Śaṅkara's basis for subordinating the Karmakāṇḍa (ritual portion of the Vedas) to the Jñānakāṇḍa (knowledge portion = Upaniṣads).",
rmj:"Rāmānuja: the two knowledges are not of different ontological levels (real vs illusory) but of different cognitive contents. The lower knowledge concerns worldly and ritual matters; the higher concerns the ultimate nature of Īśvara and the jīva's relation to him. Both are necessary — ritual knowledge (dharma) is the foundation on which brahman-knowledge is built. Rāmānuja rejects Śaṅkara's claim that brahman-knowledge and karma (ritual) are incompatible.",
mdv:"Madhva: the two knowledges correspond to knowledge of the manifested world (vikāra) and knowledge of Viṣṇu (the immutable reality). The lower knowledge is valid and necessary for the devoted life; the higher knowledge is the direct experience of Viṣṇu — possible only through Viṣṇu's grace and not achievable by any mere intellectual effort."}}
]}
]},
