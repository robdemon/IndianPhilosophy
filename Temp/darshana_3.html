builders.yoga=function(){
const yogaSections=[
{tab:"Samādhi Pāda",title:"Samādhi Pāda",sub:"Chapter 1 · 51 sūtras · Nature of yoga and samādhi",
intro:"Patañjali opens with the most direct teaching: yoga is the stilling of mental fluctuations. This chapter addresses the advanced practitioner whose mind already has some steadiness. It defines yoga, classifies the five vṛttis, prescribes abhyāsa and vairāgya as the twin means, and maps the entire ladder of samādhi from gross object-absorption up to seedless liberation.",
legend:[{c:C.purple,t:"Philosophy/Metaphysics"},{c:C.teal,t:"Practice"},{c:C.coral,t:"Kriyā"},{c:C.red,t:"Obstacles"},{c:C.blue,t:"Samādhi"},{c:C.green,t:"Liberation"}],
branches:[
{name:"Definition of Yoga",ref:"1.1–1.4",color:C.purple,children:[
{n:"Atha yogānuśāsanam",r:"1.1",d:"Now begins the instruction on yoga",det:{skt:"अथ योगानुशासनम्",tr:"Now the teaching of yoga begins.",c:"The opening word <em>atha</em> is auspicious and marks a formal beginning, implying prior preparation — the student has cultivated readiness through ethical living. <em>Anuśāsana</em> is teaching in the tradition of a lineage, not novel speculation.",ex:"A student who arrives at the guru's threshold after years of preliminary practice is the implied recipient. 'Now' means the inner conditions are ripe.",vy:"Vyāsa opens noting that yoga is defined as samādhi and this text is authoritative teaching within a living tradition (āgama). The word atha functions as a maṅgala and a qualification marker.",vm:"Anuśāsana distinguishes this text from mere philosophical speculation — it is practical instruction with a lineage. The yoga described is the Sāṃkhya-informed system of Hiraṇyagarbha.",vb:"The word 'now' connects to prior study of Vedic ethics and Sāṃkhya metaphysics without which yoga cannot take root."}},
{n:"Yogaś citta-vṛtti-nirodhaḥ",r:"1.2",d:"Yoga is the cessation of the modifications of mind",det:{skt:"योगश्चित्तवृत्तिनिरोधः",tr:"Yoga is the restraint of the fluctuations of consciousness.",c:"<em>Citta</em> is the entire inner instrument — buddhi, ahaṃkāra and manas taken together. <em>Vṛtti</em> means a turning or wave, a mode in which citta takes shape around an object. <em>Nirodha</em> is restraint — not destruction of mind but stilling of its tendency to morph into objects. When a lake stops rippling, the moon is reflected truly; when citta stops churning, puruṣa stands revealed.",ex:"Watching a sunset until the watcher and the watching merge — thoughts, plans, judgments all subside. That progressive thinning of waves toward stillness is yoga.",vy:"Vyāsa explains that yoga is samādhi, a property of citta in five stages: kṣipta (scattered), mūḍha (dull), vikṣipta (oscillating), ekāgra (one-pointed), niruddha (fully restrained). Only the last two qualify as yoga.",vm:"Sarva-vṛtti-nirodha — restraint of all fluctuations without exception — is intended. Partial cessation is mere concentration, not yoga proper.",vb:"Nirodha does not produce a void; citta returns to its causal state in prakṛti while consciousness rests as itself."}},
{n:"Tadā draṣṭuḥ svarūpe'vasthānam",r:"1.3",d:"Then the seer abides in its own nature",det:{skt:"तदा द्रष्टुः स्वरूपे'वस्थानम्",tr:"Then the seer is established in its own essential nature.",c:"When vṛttis cease, the <em>draṣṭā</em> (seer, puruṣa) no longer appears mixed with citta's modifications. Puruṣa was never actually changed — as long as the mind churned, consciousness appeared to take those shapes. With stillness, awareness rests as itself: pure, witnessing, contentless luminosity.",ex:"A clear mirror simply is itself once objects are removed. The self was always there; only borrowed forms drop away.",vy:"At the moment of nirodha, puruṣa is established as citi-mātra — pure awareness only. In other states it appears assimilated to vṛttis (sārūpya), as if it had become them.",sk:"Śaṅkara: 'abiding in own nature' is not a new attainment — puruṣa has never lost its nature. The phrase marks only the cessation of an apparent loss.",vb:"This is liberation even while embodied (jīvanmukti) — the seer's self-luminosity is no longer occluded by the colored mind."}},
{n:"Vṛtti-sārūpyam itaratra",r:"1.4",d:"Otherwise, identification with the modifications",det:{skt:"वृत्तिसारूप्यमितरत्र",tr:"At other times there is identification with the fluctuations.",c:"<em>Itaratra</em> means 'at other times' — outside nirodha. Puruṣa appears to assume the form (sārūpya) of whatever vṛtti is active. This is the diagnosis of bondage: not that the seer is actually transformed, but that it falsely appears to be, like a crystal seeming red beside a red flower.",ex:"Anger arises and you say 'I am angry' — sārūpya in action. The witnessing awareness is overlaid with the cognition.",vy:"The crystal analogy: as a clear crystal seems to take on the colour of objects placed near it, so puruṣa seems to take on the form of citta's vṛttis without itself changing.",vm:"The apparent identification arises from beginningless avidyā; it is not real but is experientially undeniable until viveka-khyāti dawns."}}
]},
{name:"Five Vṛttis — Mental Modifications",ref:"1.5–1.11",color:C.teal,children:[
{n:"Kliṣṭa / Akliṣṭa",r:"1.5",d:"Vṛttis are either afflicted or non-afflicted",det:{skt:"वृत्तयः पञ्चतय्यः क्लिष्टाक्लिष्टाः",tr:"The five kinds of fluctuations are either afflicted or non-afflicted.",c:"All five vṛttis are classed twofold: <em>kliṣṭa</em> (afflicted, fed by the five kleśas) and <em>akliṣṭa</em> (unafflicted, conducive to viveka). The same act of memory or inference can be either, depending on whether it strengthens or weakens the kleśas.",ex:"Remembering a slight and rehearsing the grievance — kliṣṭa smṛti. Remembering a teacher's instruction to apply it — akliṣṭa smṛti. Same vṛtti type; different alliance.",vy:"Kliṣṭa vṛttis are the field where afflictions grow; akliṣṭa vṛttis lead toward discrimination. Both arise even within a single mind."}},
{n:"Pramāṇa — Valid Knowledge",r:"1.7",d:"Pratyakṣa, Anumāna, Āgama — the three valid means",det:{skt:"प्रत्यक्षानुमानागमाः प्रमाणानि",tr:"Direct perception, inference, and authoritative testimony are the valid means of knowledge.",c:"<em>Pratyakṣa</em> grasps specific (viśeṣa) features via sense-contact. <em>Anumāna</em> grasps the general (sāmānya) through relation (smoke→fire). <em>Āgama</em> arises from the words of a trustworthy speaker conveying what cannot be perceived or inferred independently.",ex:"Pratyakṣa: seeing the cup. Anumāna: footprints inferring a person. Āgama: knowing subtle truths of liberation from the Upaniṣads.",vy:"Āgama is valid only when the speaker has direct knowledge and is free from intent to deceive — hence the special authority of the Veda and the lineage teacher.",vb:"Yogic perception (yogi-pratyakṣa) is included under pratyakṣa; it grasps even subtle and distant objects directly."}},
{n:"Viparyaya — Misconception",r:"1.8",d:"False knowledge not based on the real form of the object",det:{skt:"विपर्ययो मिथ्याज्ञानमतद्रूपप्रतिष्ठम्",tr:"Misconception is false knowledge based on a form other than what the object actually is.",c:"<em>Viparyaya</em> is mithyā-jñāna — knowledge that contradicts what is actually there. Patañjali later identifies the five kleśas as forms of viparyaya, making this vṛtti the cognitive root of bondage.",ex:"Seeing a rope in dim light and perceiving 'snake!' — vivid and real; the knowledge is false. Identifying the body as the self is the subtler, deeper viparyaya.",vy:"Viparyaya is the same as the five kleśas of chapter 2; it is dispelled by viveka, the true knowledge of the seer's distinction from the seen.",sk:"Śaṅkara: false cognition has positive content — it is a misplacement of one thing's identity onto another (adhyāsa), not mere absence of knowledge."}},
{n:"Vikalpa — Verbal Delusion",r:"1.9",d:"Knowledge from words without a corresponding object",det:{skt:"शब्दज्ञानानुपाती वस्तुशून्यो विकल्पः",tr:"Conceptual construction follows verbal cognition but has no corresponding reality.",c:"<em>Vikalpa</em> follows words and constructions but has no actual referent. Neither demonstrably true (no real object) nor demonstrably false (the words make sense). Meaningful conceptual play without ontological grounding.",ex:"'The consciousness of puruṣa' — grammatically coherent, but puruṣa is consciousness; there is no genuine relation. 'Barren woman's son,' 'hare's horns' — meaningful in language, vacant in reality.",vm:"Imagination, planning, hypotheticals, mathematics — all involve vikalpa. Useful in the world but to be transcended in the highest samādhi."}},
{n:"Nidrā — Sleep",r:"1.10",d:"The modification based on the experience of absence — tamas",det:{skt:"अभावप्रत्ययालम्बना वृत्तिर्निद्रा",tr:"Sleep is the fluctuation whose support is the cognition of absence.",c:"Sleep is itself a vṛtti — a mental modification whose content is the absence of waking content. On waking we recall 'I slept well, I knew nothing' — that recollection requires prior cognition. Sleep must therefore be a cognition of nothing-ness.",vy:"The sleep-vṛtti has tamas as its support. Yogis must transcend even sleep; otherwise deep sleep is confused with samādhi — a common error among beginners.",vm:"Sleep is the diagnostic test for saṃskāras: the content of dreams reveals the vāsanās closest to the surface of consciousness."}},
{n:"Smṛti — Memory",r:"1.11",d:"Non-stealing of experienced objects — retention of impressions",det:{skt:"अनुभूतविषयासंप्रमोषः स्मृतिः",tr:"Memory is the non-disappearance of experienced objects.",c:"<em>Smṛti</em> is the vṛtti that retrieves a past experience without distorting it. It is the substratum of all learning and the mechanism by which saṃskāras surface in consciousness. Both cause of bondage (rehearsing old patterns) and tool of liberation (remembering discriminative insight).",vy:"Memory is the most pervasive vṛtti; even inference and testimony depend on it. Controlling memory requires the deepest practice since smṛtis of countless lives lie stored in the unconscious."}}
]},
{name:"Abhyāsa and Vairāgya — Twin Means",ref:"1.12–1.22",color:C.coral,children:[
{n:"Abhyāsa-Vairāgyābhyāṃ tan-nirodhaḥ",r:"1.12",d:"Restraint of vṛttis is through practice and dispassion",det:{skt:"अभ्यासवैराग्याभ्यां तन्निरोधः",tr:"The restraint of those fluctuations is through sustained practice and dispassion.",c:"Patañjali gives the two co-equal means. <em>Abhyāsa</em> is the active cultivation — repeated effort to return the mind to stillness. <em>Vairāgya</em> is the passive releasing — withdrawal of thirst from all seen and revealed objects. Neither alone suffices.",vy:"Abhyāsa is the effort (yatna) toward citta-sthiti — steadying of consciousness. Vairāgya is the mastery (vaśīkāra) through which even the guṇas are no longer thirsted after.",vm:"The two means correspond to puruṣa's two aspects: its active luminosity (prakāśa) requires practice to manifest; its passive nature (the witness) requires dispassion to stop identifying with objects."}},
{n:"Tatra sthitau yatno'bhyāsaḥ",r:"1.13",d:"Practice is the effort toward stability",det:{skt:"तत्र स्थितौ यत्नोऽभ्यासः",tr:"Among these, practice is the continuous effort to be established in the steady state.",c:"<em>Abhyāsa</em> is a directed effort (yatna) specifically toward citta-sthiti — the unwavering steadiness of mind. Each effort plants a new saṃskāra of stillness that, over time, outweighs the saṃskāras of distraction.",vy:"Practice is a conscious, intentional, repeated turning of the mind back from its outward tendencies toward its own still centre — like turning a river upstream.",vb:"Every moment of genuine practice deposits a saṃskāra of yoga; these accumulate like drops filling a vessel, gradually shifting the mind's default orientation from outward to inward."}},
{n:"Sa tu dīrgha-kāla-nairantarya-satkārāsevitaḥ",r:"1.14",d:"Practice becomes firm when cultivated long, uninterruptedly, with devotion",det:{skt:"स तु दीर्घकालनैरन्तर्यसत्कारासेवितो दृढभूमिः",tr:"But practice becomes firmly grounded when cultivated for a long time, without interruption, and with sincere devotion.",c:"Three qualifications: <em>dīrgha-kāla</em> (long duration — years or lifetimes), <em>nairantarya</em> (unbroken continuity), <em>satkāra</em> (with reverence and full seriousness). Together they produce a dṛḍha-bhūmi — a firm foundation.",ex:"A daily meditation practice sustained for decades with genuine respect for the teaching is dṛḍhabhūmi. Weekend intensives without sustained daily commitment produce temporary results only.",vm:"Dīrgha-kāla must be understood across lifetimes for most practitioners; progress is cumulative across incarnations."}},
{n:"Dṛṣṭānuśravika-viṣaya-vitṛṣṇasya vairāgyam",r:"1.15",d:"Vairāgya is mastery in one free from thirst for seen and revealed objects",det:{skt:"दृष्टानुश्रविकविषयवितृष्णस्य वशीकारसंज्ञा वैराग्यम्",tr:"Dispassion is the awareness of mastery in one without thirst for objects that are seen or revealed.",c:"<em>Vairāgya</em> is not suppression of desire but its natural falling away (vitṛṣṇā — without thirst). It extends to worldly pleasures (dṛṣṭa) and heavenly rewards promised in the Vedas (anuśravika). The highest vairāgya even releases attachment to spiritual states and powers.",vy:"Vairāgya has lower form (aparā) — turning away from worldly objects — and higher form (parā) — release of thirst even for the guṇas themselves, arising only from viveka-khyāti.",vb:"The sign of true vairāgya is vaśīkāra — easy mastery, not strain. Desire simply does not arise."}},
{n:"Tat paraṃ puruṣakhyāteḥ guṇavaitṛṣṇyam",r:"1.16",d:"The supreme dispassion is freedom from thirst even for the guṇas, through knowledge of puruṣa",det:{skt:"तत्परं पुरुषख्यातेर्गुणवैतृष्ण्यम्",tr:"The highest dispassion is freedom from thirst even for the guṇas, arising from the knowledge of puruṣa.",c:"This is <em>para-vairāgya</em> — the apex of dispassion. The guṇas constitute all of phenomenal existence including the subtlest bliss-states of samādhi. Freedom from thirst for even these requires direct knowledge of puruṣa as eternally distinct from all guṇa-products.",vy:"Para-vairāgya arises naturally from viveka-jñāna; it is not practised but realised. When puruṣa is seen as distinct from all guṇa-products, the guṇas lose their grip entirely.",vm:"This corresponds to the final stage before kaivalya. The mind resting in sattva-predominant nirodha no longer finds even that sattva attractive — a radical self-erasure of the subtlest identification."}}
]},
{name:"Types of Samādhi",ref:"1.17–1.51",color:C.blue,sub:[
{label:"Samprajñāta — Cognitive Samādhi",children:[
{n:"Vitarka-Vicāra-Ānanda-Asmitā-rūpānugamāt samprajñātaḥ",r:"1.17",d:"The four stages of samprajñāta samādhi with seed",det:{skt:"वितर्कविचारानन्दास्मितारूपानुगमात् सम्प्रज्ञातः",tr:"Samprajñāta is accompanied by vitarka, vicāra, ānanda, and asmitā.",c:"The four levels correspond to increasingly subtle objects. <em>Savitarka</em>: absorption in a gross object with name/quality/relations still present. <em>Savicāra</em>: absorption in the subtle tanmātras, pure sensory essences beyond space and time. <em>Sānanda</em>: absorption in the sense-organs themselves, filled with bliss. <em>Sāsmitā</em>: absorption in pure ahaṃkāra alone, the bare sense of 'I am.'",vy:"These four form a hierarchy of refinement. Each purifies citta further by removing one layer of gross identification, until only the pure I-sense remains as the finest object.",vm:"The practitioner moves from knowing an object by its name and qualities (vitarka) to knowing it as pure vibratory essence beyond spatio-temporal determination (vicāra) — a radical shift in the mode of knowing.",vb:"Ānanda here is not hedonic pleasure but the sattvic bliss intrinsic to the sense-faculties when freed from the noise of their objects."}},
{n:"Savitarka / Nirvitarka",r:"1.42–1.43",d:"Gross absorption — with and without conceptual overlay",det:{skt:"तत्र शब्दार्थज्ञानविकल्पैः संकीर्णा सवितर्का समापत्तिः",tr:"Savitarka samāpatti is mixed with constructions of word, meaning, and knowledge; nirvitarka is when memory is purified and the object shines alone.",c:"<em>Savitarka</em>: the mind merges with a flame but the word, its known qualities, and the knowing are still present. <em>Nirvitarka</em>: the same flame, all conceptual overlay dropped; only the sheer reality of the flame shines, as if the flame knows itself through the mind.",vy:"In nirvitarka, the object shines of its own form (svarūpa-mātra) because conceptual vṛttis have become transparent and self-effacing.",vm:"Savitarka involves the object as linguistically constituted; nirvitarka reaches the object as it is prior to language — a direct ontological contact."}},
{n:"Savicāra / Nirvicāra",r:"1.44",d:"Subtle absorption — with and without conceptual overlay",det:{skt:"एतयैव सविचारा निर्विचारा च सूक्ष्मविषया व्याख्याता",tr:"By the same distinction, savicāra and nirvicāra are explained, with subtle objects as their domain.",c:"Same distinction applied to subtle objects (tanmātras, ahaṃkāra). <em>Savicāra</em>: absorbed in the subtle essence of sound with its space-time location present. <em>Nirvicāra</em>: pure essence of sound beyond all spatio-temporal determination — the tantric sound-as-such.",vy:"Nirvicāra is the threshold of the highest samprajñāta. Beyond it lies asamprajñāta — the seedless.",vb:"Nirvicāra cannot be reached by forcing, only by progressively subtler absorption through sustained practice."}}
]},
{label:"Asamprajñāta and Nirbīja — Seedless",children:[
{n:"Virāma-pratyayābhyāsa-pūrvaḥ saṃskāra-śeṣo'nyaḥ",r:"1.18",d:"The other samādhi follows practice of cessation; only saṃskāras remain",det:{skt:"विरामप्रत्ययाभ्यासपूर्वः संस्कारशेषोऽन्यः",tr:"The other samādhi is preceded by the practice of the awareness of cessation; only subliminal impressions remain.",c:"<em>Asamprajñāta</em> samādhi: even the subtle object of concentration has dissolved. Only the latent impressions (saṃskāras) of the practice remain — the mind is 'filled with emptiness.' This is the closest approach to nirbīja before liberation.",vy:"The saṃskāras of nirodha itself gradually burn away older saṃskāras of experience, like a controlled fire eliminating accumulated dry wood.",vm:"Asamprajñāta is not blankness — it is heightened, transparent wakefulness without an object. Pure witnessing with nothing witnessed."}},
{n:"Tasyāpi nirodhe sarva-nirodhān nirbījaḥ samādhiḥ",r:"1.51",d:"When even those saṃskāras are restrained, seedless samādhi arises",det:{skt:"तस्यापि निरोधे सर्वनिरोधान्निर्बीजः समाधिः",tr:"When even those (saṃskāras of nirodha) are restrained, seedless samādhi arises from the restraint of all.",c:"<em>Nirbīja samādhi</em> — without seed — is the final consummation. Even the subtle saṃskāras of the nirodha-practice are burned away. Nothing remains to generate a future experience. This is the gateway to kaivalya.",vy:"This is the highest samādhi. From it arises dharma-megha samādhi and then pratiprasava — the return of the guṇas to mūla-prakṛti — and kaivalya.",vm:"Nirbīja is not a state one enters and leaves; it is the irreversible recognition that puruṣa was never bound. The fire of citta subsides into its own ground."}}
]}
]},
{name:"Īśvara Praṇidhāna",ref:"1.23–1.29",color:C.green,children:[
{n:"Īśvara-praṇidhānād vā",r:"1.23",d:"Or samādhi comes through devotion to Īśvara",det:{skt:"ईश्वरप्रणिधानाद्वा",tr:"Or samādhi is attained through devotion and self-surrender to Īśvara.",c:"<em>Praṇidhāna</em> means full self-offering — total surrendering of one's fruits of action, ego, and will to Īśvara. This is both the highest bhakti within yoga and a powerfully efficient means to samādhi.",vy:"Praṇidhāna to Īśvara is the fastest path to samādhi because it uproots asmitā (the I-sense) directly, bypassing the slower analytical route.",vb:"Vijñānabhikṣu expands greatly: Īśvara-praṇidhāna is not merely technique but the recognition of the soul's essential relationship with the supreme puruṣa."}},
{n:"Kleśa-karma-vipākāśayair aparāmṛṣṭaḥ puruṣa-viśeṣa Īśvaraḥ",r:"1.24",d:"Īśvara is a special puruṣa untouched by afflictions, karma, fruition, or residues",det:{skt:"क्लेशकर्मविपाकाशयैरपरामृष्टः पुरुषविशेषः ईश्वरः",tr:"Īśvara is a special puruṣa, untouched by afflictions, actions, fruits of actions, or the reservoir of latent impressions.",c:"Within Patañjali's pluralist framework, Īśvara is not the creator-God of theistic systems but a <em>viśeṣa-puruṣa</em> — a special, eternally free puruṣa who has never been bound by prakṛti.",vy:"Īśvara is omniscient (sarvajña) because his citta, never clouded by kleśas, reflects all objects simultaneously. He is the eternal teacher whose knowledge has no beginning.",vm:"Vācaspati distinguishes Patañjali's Īśvara from the Vedāntic Brahman: Īśvara is not the material or efficient cause of the world — he is the super-eminent guide who assists bound puruṣas toward liberation.",vb:"Vijñānabhikṣu identifies Patañjali's Īśvara with the Vedāntic Brahman and with Viṣṇu, arguing yoga and Vedānta are ultimately reconcilable."}},
{n:"Tasya vācakaḥ praṇavaḥ",r:"1.27",d:"His designator is the praṇava (Oṃ)",det:{skt:"तस्य वाचकः प्रणवः",tr:"His designating symbol is the praṇava (Oṃ).",c:"The relationship between Oṃ and Īśvara is eternal and non-arbitrary, making repetition of Oṃ an actual communion with Īśvara's presence.",vy:"The relation of Oṃ to Īśvara is established eternally — not by convention but by the very structure of consciousness. Oṃ is the primordial sound from which all other sounds unfold.",vm:"Oṃ subsumes all Vedic utterance; contemplating Oṃ while surrendering to Īśvara combines jñāna, bhakti and mantra-yoga in a single practice."}},
{n:"Taj-japaḥ tad-artha-bhāvanam",r:"1.28",d:"Repetition of Oṃ with meditation on its meaning",det:{skt:"तज्जपस्तदर्थभावनम्",tr:"The repetition (japa) of it (Oṃ) and meditation on its meaning.",c:"The practice is twofold: <em>japa</em> at the level of sound and breath, combined with <em>artha-bhāvanā</em> — sustained contemplation on what Oṃ means and points to. The sound anchors the mind; the meaning lifts it toward Īśvara's nature.",ex:"Sitting in the early morning, breathing naturally, repeating Oṃ mentally while holding in awareness Īśvara as the eternal, free, omniscient puruṣa — this is the complete practice.",vy:"Japa alone (mechanical repetition) creates mental steadiness; bhāvanā removes intellectual obstacles. Both are necessary — sound without meaning is noise; meaning without sound is dry speculation."}}
]},
{name:"Nine Obstacles and Remedies",ref:"1.30–1.39",color:C.red,children:[
{n:"Nine Obstacles — Antarāyas",r:"1.30",d:"Disease, torpor, doubt, carelessness, laziness, dissipation, false views, non-attainment, instability",det:{skt:"व्याधिस्त्यानसंशयप्रमादालस्याविरतिभ्रान्तिदर्शनालब्धभूमिकत्वानवस्थितत्वानि चित्तविक्षेपास्तेऽन्तरायाः",tr:"Disease, mental torpor, doubt, carelessness, laziness, dissipation, erroneous perception, non-attainment of any stage, and instability — these nine are the obstacles that cause distraction.",c:"The nine <em>antarāyas</em> are internal tendencies interrupting the continuity of practice: (1) Vyādhi — physical disease. (2) Styāna — mental torpor. (3) Saṃśaya — doubt about the path. (4) Pramāda — carelessness. (5) Ālasya — laziness. (6) Avirati — dissipation. (7) Bhrānti-darśana — mistaken views. (8) Alabdha-bhūmikatva — failure to attain any stage. (9) Anavasthitatva — instability, slipping back after attainment.",vy:"The nine obstacles are sequentially ordered by subtlety: the first two are largely physical, the middle three motivational, the last four specifically yogic obstacles arising only once some practice is established.",vm:"These are not external misfortunes but internal tendencies in the practitioner's own citta. Each has its own antidote within the yoga system."}},
{n:"Eka-tattvābhyāsaḥ — Practice of a Single Principle",r:"1.32",d:"To counter all obstacles — practice of one chosen object",det:{skt:"तत्प्रतिषेधार्थमेकतत्त्वाभ्यासः",tr:"For the purpose of countering those obstacles, the practice of a single principle.",c:"Rather than a different antidote for each of nine obstacles, Patañjali recommends one unifying practice: <em>eka-tattva-abhyāsa</em> — sustained concentration on a single chosen object. The nine obstacles all share distraction as their common mechanism; single-pointed practice is their common antidote.",vy:"The single principle can be Īśvara, the breath, a mantra, or any object the practitioner's disposition naturally gravitates toward. Consistency matters more than which object is chosen.",vm:"This sūtra is the basis of the seven antidotes (1.33–1.39): each is one instantiation of eka-tattva-abhyāsa suited to different temperaments."}},
{n:"Maitrī-Karuṇā-Mudita-Upekṣā",r:"1.33",d:"Friendliness, compassion, joy, equanimity — for the four types of persons",det:{skt:"मैत्रीकरुणामुदितोपेक्षाणां सुखदुःखपुण्यापुण्यविषयाणां भावनातश्चित्तप्रसादनम्",tr:"The mind becomes clear through cultivation of friendliness toward the happy, compassion toward the suffering, sympathetic joy toward the meritorious, equanimity toward the non-meritorious.",c:"These four attitudes dissolve specific emotional obstructions to samādhi. Envy of the happy → maitrī. Callousness toward the suffering → karuṇā. Jealousy of the virtuous → muditā. Moral condemnation of the non-virtuous → upekṣā.",ex:"When a colleague receives praise and the practitioner feels envy, maitrī — cultivating genuine delight in their happiness — dissolves the envy and clears the mind for meditation.",vy:"Each wrong response (envy, aversion, schadenfreude, contempt) creates an agitating vṛtti; each right response dissolves it. The result is citta-prasāda — a clear, serene mind ready for samādhi.",vm:"Maitrī extends even to oneself: the practitioner harsh toward their own failures needs self-directed maitrī before they can stabilise in any samādhi."}},
{n:"Yathābhimata-dhyānād vā",r:"1.39",d:"Or by meditation on whatever is agreeable to one",det:{skt:"यथाभिमतध्यानाद्वा",tr:"Or through meditation on whatever is agreeable to a particular person.",c:"Patañjali's final, most open instruction: any object of meditation on which the particular practitioner's mind settles naturally and steadily is appropriate. Temperament is real and different objects suit different minds.",ex:"A musician finds inner sound (nāda) most natural; a visual person finds inner light; a devotee finds the form of their chosen deity; a philosopher finds the witness-consciousness itself. All valid.",vy:"Patañjali has listed specific objects across 1.33–1.38 but here opens the door to all objects. The criterion is not what the object is but whether it produces one-pointed steadiness in this particular practitioner.",vb:"This sūtra is an implicit acknowledgement of the guru's role: the teacher selects the practice that fits the student's temperament — not the other way around."}}
]}
]},
{tab:"Sādhana Pāda",title:"Sādhana Pāda",sub:"Chapter 2 · 55 sūtras · Practice, kleśas, and the eight limbs",
intro:"Where the first chapter addressed the advanced practitioner, the Sādhana Pāda begins at a more accessible entry-point: the suffering, distracted person still in the world. Patañjali introduces <em>kriyā-yoga</em> (tapas, svādhyāya, Īśvara-praṇidhāna) as a preliminary means, then diagnoses the five kleśas, and lays out the famous eight limbs (aṣṭāṅga) — yama, niyama, āsana, prāṇāyāma, and pratyāhāra in this chapter, with the inner three reserved for the Vibhūti Pāda.",
legend:[{c:C.coral,t:"Kriyā Yoga"},{c:C.red,t:"Kleśas"},{c:C.teal,t:"Eight Limbs"},{c:C.purple,t:"Philosophy"},{c:C.green,t:"Liberation"}],
branches:[
{name:"Kriyā Yoga — Action Yoga",ref:"2.1–2.2",color:C.coral,children:[
{n:"Tapaḥ-svādhyāyeśvara-praṇidhānāni kriyā-yogaḥ",r:"2.1",d:"Tapas, self-study, and devotion to Īśvara constitute kriyā-yoga",det:{skt:"तपःस्वाध्यायेश्वरप्रणिधानानि क्रियायोगः",tr:"Austerity, self-study, and devotion to Īśvara constitute kriyā-yoga.",c:"<em>Tapas</em>: disciplined endurance — bearing opposites without reaction; purifying the instrument. <em>Svādhyāya</em>: study of liberating texts and mantra repetition. <em>Īśvara-praṇidhāna</em>: total surrender of all action's fruits to Īśvara, dissolving the doer-sense. Together these three form a complete preliminary practice.",vy:"Kriyā-yoga is for those who cannot yet sustain full meditative absorption. It reduces the grosser kleśas, purifies the citta, and creates the foundation upon which the eight limbs can take root.",vm:"The three components correspond to three modes: tapas (karma — body and will), svādhyāya (jñāna — intellect), Īśvara-praṇidhāna (bhakti — heart). Together an integral yoga.",vb:"Kriyā-yoga is appropriate even for the most advanced practitioners; it is not merely preliminary but the living expression of the eight limbs in daily life."}},
{n:"Samādhi-bhāvanārthaḥ kleśa-tanūkaraṇārthaś ca",r:"2.2",d:"Kriyā-yoga is for cultivating samādhi and attenuating the kleśas",det:{skt:"समाधिभावनार्थः क्लेशतनूकरणार्थश्च",tr:"For bringing about samādhi and for the thinning of the afflictions.",c:"Kriyā-yoga does not produce samādhi directly but creates the conditions (bhāvana) in which samādhi can arise. Simultaneously it thins (tanū-karaṇa) the kleśas — reducing their gross active forms.",vy:"The kleśas exist in four states: dormant (prasupti), attenuated (tanū), alternating (vicchinna), fully active (udāra). Kriyā-yoga moves them from state 4 to state 2.",vm:"Continuous tapas-svādhyāya-praṇidhāna keeps kleśas thinned and prevents regression even in advanced practitioners."}}
]},
{name:"Five Kleśas — Root Afflictions",ref:"2.3–2.14",color:C.red,children:[
{n:"Avidyāsmitā-rāga-dveṣābhiniveśāḥ kleśāḥ",r:"2.3",d:"Ignorance, I-am-ness, attraction, aversion, and clinging-to-life are the five afflictions",det:{skt:"अविद्यास्मितारागद्वेषाभिनिवेशाः क्लेशाः",tr:"Ignorance, I-am-ness, attraction, aversion, and clinging to life are the five afflictions.",c:"The five kleśas form a cascade: <em>avidyā</em> generates <em>asmitā</em>, which generates <em>rāga</em> and <em>dveṣa</em>, culminating in <em>abhiniveśa</em>. They represent a logical derivation from one root error — misidentification of awareness with its passing contents.",vy:"Avidyā is the seed from which all others sprout. Burning off the branches through practice will not prevent their regrowth as long as the seed remains.",vm:"All human suffering, from grossest violence to subtlest existential unease, is traceable to this misidentification."}},
{n:"Avidyā — Root Ignorance",r:"2.5",d:"Taking the impermanent, impure, painful, and non-self as permanent, pure, pleasant, and self",det:{skt:"अनित्याशुचिदुःखानात्मसु नित्यशुचिसुखात्मख्यातिरविद्या",tr:"Avidyā is the cognition of the permanent in the impermanent, the pure in the impure, pleasure in pain, and the self in what is not self.",c:"Four specific inversions: (1) taking the body-mind (impermanent) as permanent; (2) taking the body as pure; (3) taking sense-experiences as intrinsically pleasant; (4) taking the body-mind complex as puruṣa. The fourth inversion is the deepest and most consequential.",vy:"The four inversions correspond to the four characteristics of liberation: permanence, purity, bliss, and self — which belong to puruṣa alone. Avidyā misattributes these to the wrong locus.",vm:"All yogic practice — from physical purification (śauca) to viveka-cultivation — is an attack on one or more of these four inversions."}},
{n:"Asmitā — I-am-ness",r:"2.6",d:"Identification of the power of the seer with the power of the instrument of seeing",det:{skt:"दृग्दर्शनशक्त्योरेकात्मतेवास्मिता",tr:"Asmitā is as-if-the-unity of the power of the seer and the power of the instrument of seeing.",c:"<em>Asmitā</em> is the primordial structural fusion of puruṣa's luminosity with buddhi's reflective capacity. It produces 'I am this particular experiencer.' The phrase 'as if one' (iva-ekatā) is crucial: they are not actually unified; it only appears so.",vy:"Asmitā is the subtlest form of the I-sense and hardest to dissolve. Even in advanced samādhi (sāsmitā), a refined form of it persists as the last trace of the subject-object structure.",vb:"Asmitā is the mechanism by which puruṣa seems to contract into an individual. Its dissolution does not destroy individuality but reveals that the 'individual' was never separate from the universal puruṣa."}},
{n:"Rāga — Attraction",r:"2.7",d:"Attachment is that which follows upon pleasure",det:{skt:"सुखानुशयी रागः",tr:"Attraction is that which follows as a residue of pleasure.",c:"<em>Rāga</em> is the specific mental tendency arising from a past experience of pleasure — a residue (anuśaya) that leans toward the pleasurable object and generates craving for its repetition.",ex:"Having enjoyed music, a residue of that pleasure remains, which when the music is mentioned manifests as rāga — a leaning, a craving for repetition. The rāga is not the pleasure itself but its shadow in the citta.",vy:"Rāga operates even during deep meditation: when pleasant states arise in samādhi, rāga toward those states can become a subtle obstacle."}},
{n:"Dveṣa — Aversion",r:"2.8",d:"Aversion is that which follows upon pain",det:{skt:"दुःखानुशयी द्वेषः",tr:"Aversion is that which follows as a residue of pain.",c:"The mirror of rāga: dveṣa is the mental leaning away from an object that has caused pain. Together rāga and dveṣa constitute the fundamental binary of saṃsāric psychology — approach and avoidance, desire and fear.",ex:"Having been humiliated socially, a residue remains generating dveṣa whenever similar situations arise — avoidance without necessarily understanding why.",vy:"The rāga-dveṣa pair keep citta in constant agitation: moving toward some objects, away from others, never resting. They are the psychological mechanism of all compulsive behaviour."}},
{n:"Abhiniveśa — Clinging to Life",r:"2.9",d:"The will to live flowing of its own accord even in the wise",det:{skt:"स्वरसवाही विदुषोऽपि तथारूढोऽभिनिवेशः",tr:"Clinging to life flows of its own accord and is established even in the wise.",c:"<em>Abhiniveśa</em> is the primal biological and psychological clinging to existence. Unlike rāga and dveṣa (which require prior experience), abhiniveśa is innate, flowing 'of its own accord' (sva-rasa-vāhin). Even jñānis who understand impermanence intellectually still feel its pull.",ex:"The organism recoils from threats to existence reflexively, before any cognition occurs — abhiniveśa operating at its most primal.",vy:"Abhiniveśa must be based on a memory of the fear of death from a previous life; otherwise there is no explanation for why a newborn already recoils from threats to existence.",vm:"Abhiniveśa is the kleśa that only parā-vairāgya and the experience of kaivalya can fully dissolve."}}
]},
{name:"Viveka-Khyāti — Discriminative Knowledge",ref:"2.15–2.26",color:C.purple,children:[
{n:"Sarvam duḥkham eva vivekinaḥ",r:"2.15",d:"For the discriminating person, all is indeed suffering — from change, anguish, saṃskāra, and conflict of guṇas",det:{skt:"परिणामतापसंस्कारदुःखैर्गुणवृत्तिविरोधाच्च दुःखमेव सर्वं विवेकिनः",tr:"For the person of discrimination, all is indeed suffering — through the suffering of change, anguish, saṃskāra, and the conflict of the guṇas.",c:"Three modes of pervasive duḥkha: <em>pariṇāma-duḥkha</em> (suffering inherent in all change), <em>tāpa-duḥkha</em> (anguish of craving), <em>saṃskāra-duḥkha</em> (suffering generated by activation of old painful impressions). Plus guṇa-conflict. Together they make every moment of saṃsāric existence intrinsically unsatisfactory to the discerning eye.",vy:"This is the Sāṃkhya-Yoga version of the First Noble Truth. Saṃsāra is structurally suffering — not because pleasant experiences do not occur but because even pleasure is contaminated by impermanence and seeds of future sorrow.",vm:"The viveki sees this not as pessimism but as clarity. The ordinary person is sustained by hope that the next pleasure will satisfy; the viveki sees that the mechanism of pleasure itself produces the next craving."}},
{n:"Heyaṃ duḥkham anāgatam",r:"2.16",d:"The suffering that has not yet come is to be avoided",det:{skt:"हेयं दुःखमनागतम्",tr:"The suffering that has not yet come is to be avoided.",c:"Yogic practice is prophylactic. Past suffering cannot be undone; present suffering must be borne with equanimity. But future suffering — generated by current kleśas and karma — can be prevented. This is the purpose of the entire yoga system.",vy:"The means of avoidance is the cessation of the apparent union of the seer and the seen. When viveka dissolves this union, the entire mechanism of suffering-generation is suspended.",vm:"This is Patañjali's medical model: disease (duḥkha), its cause (puruṣa-prakṛti confusion), its cessation (kaivalya), means of cessation (viveka-khyāti). It parallels the Buddhist four noble truths."}},
{n:"Viveka-khyātir aviplavā hāna-upāyaḥ",r:"2.26",d:"Uninterrupted discriminative knowledge is the means of removal",det:{skt:"विवेकख्यातिरविप्लवा हानोपायः",tr:"Uninterrupted discriminative knowledge is the means of removal of the afflictions.",c:"<em>Viveka-khyāti</em> — the clear, direct, sustained knowing of the distinction between puruṣa (unchanging consciousness) and prakṛti (the entire field of the seen) — is the sole means of dissolving the kleśas at their root. The word <em>aviplavā</em> (uninterrupted) is crucial: occasional insights do not suffice.",vy:"Before viveka-khyāti becomes stable, it alternates with avidyā like light and shadow. The practitioner must strengthen the viveka-side until avidyā has no more fuel.",vm:"Viveka-khyāti is not conceptual understanding but direct, immediate, non-inferential seeing of the puruṣa-prakṛti distinction — arising through the purified, steady citta of the advanced yogin."}}
]},
{name:"Aṣṭāṅga — Eight Limbs of Yoga",ref:"2.29–3.8",color:C.teal,sub:[
{label:"Yama — Ethical Restraints (2.30–2.31)",children:[
{n:"Ahiṃsā — Non-violence",r:"2.30",d:"Non-harming in thought, word, and deed toward all beings",det:{skt:"अहिंसासत्यास्तेयब्रह्मचर्यापरिग्रहा यमाः",tr:"Non-violence, truthfulness, non-stealing, continence, and non-possessiveness are the yamas.",c:"<em>Ahiṃsā</em> is the root yama from which all others derive. It extends across thought, speech, and action toward all beings. Its scope includes oneself — harsh self-criticism is a form of hiṃsā.",vy:"Ahiṃsā is the foundational ethical basis without which no samādhi is stable. A mind that has harmed others carries karmic residues that surface as disturbance in meditation.",vm:"The deeper meaning: true ahiṃsā includes a basic friendliness toward one's own existence."}},
{n:"Satya — Truthfulness",r:"2.30",d:"Correspondence of thought, word, and deed with reality",det:{c:"<em>Satya</em> is the alignment of inner experience with outer expression. It requires first being truthful with oneself (not rationalizing avidyā), then in speech. Satya is subordinate to ahiṃsā: if the truth would cause unnecessary harm, silence is preferred.",vy:"When truthfulness is established, what the practitioner says comes to pass — their speech begins to have the power of mantra.",vm:"Satya in inner practice means not constructing flattering narratives about one's progress in yoga; holding an honest, unadorned view of one's actual state."}},
{n:"Asteya, Brahmacarya, Aparigraha",r:"2.30",d:"Non-stealing, continence, non-possessiveness",det:{c:"<em>Asteya</em>: not taking what is not given — extending to credit, time, energy, and knowledge one does not actually possess. <em>Brahmacarya</em>: conservation and upward redirection of vital energy for the purpose of fuelling subtler practices. <em>Aparigraha</em>: not accumulating more than one genuinely needs — applied to material objects, relationships, roles, opinions, and self-concepts.",vy:"When asteya is established, all treasures present themselves. When brahmacarya is established, virya (vigour and luminous vitality) makes sustained practice effortless. When aparigraha is established, knowledge of past and future births arises.",vm:"Brahmacarya is the most contextual of the yamas: complete celibacy for the renunciant; fidelity and moderation within relationship for the householder."}}
]},
{label:"Niyama — Personal Observances (2.32)",children:[
{n:"Śauca — Purity",r:"2.32",d:"Internal and external purity of body and mind",det:{skt:"शौचसन्तोषतपःस्वाध्यायेश्वरप्रणिधानानि नियमाः",tr:"Purity, contentment, austerity, self-study, and devotion to Īśvara are the niyamas.",c:"<em>Śauca</em> has two dimensions: bāhya (external — bodily cleanliness, purity of food, environment) and ābhyantara (internal — purity of mind from jealousy, greed, hatred). The physical dimension supports the mental; the mental dimension is the true goal.",vy:"When śauca is established, the practitioner develops gentle detachment from the body — seeing it as a vehicle rather than an identity.",vm:"Internal śauca is the progressive clarification of citta from the staining of kleśas."}},
{n:"Santoṣa, Tapas, Svādhyāya, Īśvara-Praṇidhāna",r:"2.32",d:"Contentment, austerity, self-study, devotion — the four remaining niyamas",det:{c:"<em>Santoṣa</em>: stable acceptance of present circumstances without craving for their alteration — not passive resignation but absence of the agitating sense that something is missing. <em>Tapas</em>: willing endurance of discomfort for purification — generating the fire that burns off impurities in body and mind. <em>Svādhyāya</em>: study of liberating texts combined with japa, redirecting the mind from worldly constructs toward self-knowledge. <em>Īśvara-praṇidhāna</em>: total self-offering to Īśvara as the ground of all practice.",vy:"The fruit of santoṣa is unexcelled happiness — not the happiness of getting what one wants but the happiness of not needing anything to be different. Through tapas, impurities burned away, siddhis awaken. Through svādhyāya, union with iṣṭa-devatā arises. Through praṇidhāna, the karmaśaya is dissolved.",vb:"For the bhakti-inclined practitioner, Īśvara-praṇidhāna can replace most other practices: when the heart is fully surrendered, the kleśas thin rapidly and samādhi arises spontaneously."}}
]},
{label:"Āsana, Prāṇāyāma, Pratyāhāra (2.46–2.55)",children:[
{n:"Sthira-sukham āsanam",r:"2.46",d:"Āsana is steady and comfortable",det:{skt:"स्थिरसुखमासनम्",tr:"Āsana is that which is steady and comfortable.",c:"Patañjali defines āsana in two words. <em>Sthira</em>: stillness, steadiness — the ability to remain without restless movement. <em>Sukha</em>: ease, comfort — absence of strain or agitation. This definition is deliberately broad: any seated posture achieving these qualities is an āsana. Patañjali's concern is the seated meditation posture, not a movement sequence.",vy:"Vyāsa lists examples: padmāsana, vīrāsana, bhadrāsana, svastikāsana, daṇḍāsana — all seated postures for meditation.",vm:"Sthira indicates the mind's qualities projected onto the body (a restless mind cannot sustain a still posture), and sukha indicates absence of the pain that would interrupt meditation."}},
{n:"Prayatna-śaithilyānanta-samāpattibhyām",r:"2.47",d:"Āsana is perfected by relaxation of effort and absorption in the infinite",det:{skt:"प्रयत्नशैथिल्यानन्तसमापत्तिभ्याम्",tr:"Āsana is mastered by relaxation of effort and absorption in the infinite.",c:"Two means: (1) <em>prayatna-śaithilya</em> — deliberate relaxation of the effort that initially holds the posture; as mastery grows, effort dissolves and effortless stability remains. (2) <em>ananta-samāpatti</em> — absorption in the infinite (Śeṣa or infinite space), dissolving the sense of individual body-limitation into awareness of boundless space.",vy:"Meditating on the infinite while in posture removes the sense of body-boundary that creates strain — when there is no 'body as a bounded thing,' there is no effort in maintaining it.",vm:"The relaxation of effort is not collapse — it is the transition from muscular to structural support, the point at which the posture 'holds itself.'"}},
{n:"Tato dvandvānabhighātaḥ",r:"2.48",d:"Thence, freedom from the assault of the pairs of opposites",det:{skt:"ततो द्वन्द्वानभिघातः",tr:"From perfected āsana, there is no assault from the pairs of opposites.",c:"The fruit of mastered āsana is immunity to the assault (abhighāta) of the dvandvas — heat and cold, pleasure and pain, honour and dishonour. This immunity is not achieved by avoiding extremes but by inhabiting stillness so thoroughly that extremes cannot disturb fundamental equanimity.",vy:"The practitioner established in āsana inhabits a dimension of experience prior to the categorization of experience into pleasant/unpleasant — the bodily substrate of the witness-consciousness.",vm:"This explains why great sages are depicted meditating in extreme environments: the dvandvas simply fail to generate the reactive vṛttis that would disturb their samādhi."}},
{n:"Prāṇāyāma — Regulation of Breath",r:"2.49",d:"When āsana is established — regulation of inhalation-exhalation",det:{skt:"तस्मिन्सति श्वासप्रश्वासयोर्गतिविच्छेदः प्राणायामः",tr:"With āsana established, prāṇāyāma is the regulation of the movement of inhalation and exhalation.",c:"<em>Prāṇāyāma</em> is the regulation (āyāma) of prāṇa manifesting as breath. Three basic forms: bāhya-vṛtti (external retention — holding after exhalation), ābhyantara-vṛtti (internal retention — holding after inhalation), and stambha-vṛtti (suspended breath). A fourth form transcends ordinary movement entirely.",vy:"The correlation of prāṇa and citta is the fundamental insight of haṭha yoga: what cannot be achieved by directly restraining the mind can often be achieved indirectly through prāṇāyāma.",vm:"Patañjali measures the prāṇāyāma by its place (deśa), time-duration (kāla), and number (saṃkhyā) — this precision makes it a scientific practice rather than a casual exercise."}},
{n:"Pratyāhāra — Withdrawal of Senses",r:"2.54",d:"Withdrawal of senses following the mind's own inward nature",det:{skt:"स्वविषयासंप्रयोगे चित्तस्वरूपानुकार इवेन्द्रियाणां प्रत्याहारः",tr:"Pratyāhāra is the withdrawal of the senses, as if following the own-form of the mind, from their respective objects.",c:"<em>Pratyāhāra</em> is the bridge between the outer four limbs and the inner three. When the mind turns inward toward its own still nature, the sense-organs naturally follow — like bees following the queen bee into the hive. Not suppression of the senses but their natural withdrawal.",ex:"In deep meditation, sounds occur but are not registered as distracting; light changes but the meditator does not open their eyes. The senses have not been disabled — they have followed the mind's inward turn.",vy:"Pratyāhāra is the final preparation for dhāraṇā. Without it, every external stimulus triggers a new vṛtti that disrupts concentration.",vm:"'As if following the own-form of the mind' is precise: the senses do not actually merge with the mind but adopt its inward orientation — a coordination, not a fusion."}}
]}
]}
]},
{tab:"Vibhūti Pāda",title:"Vibhūti Pāda",sub:"Chapter 3 · 56 sūtras · Supernormal powers through saṃyama",
intro:"The Vibhūti Pāda introduces the three inner limbs — dhāraṇā, dhyāna, samādhi — and the technique of <em>saṃyama</em>: their combined, simultaneous application on a single object. This technique generates the vibhūtis (supernormal powers, siddhis). Patañjali catalogs these methodically but concludes with a stern warning: even the most sublime powers are obstacles to liberation unless transcended by the highest vairāgya.",
legend:[{c:C.blue,t:"Saṃyama/Samādhi"},{c:C.amber,t:"Siddhis/Powers"},{c:C.green,t:"Liberation"},{c:C.purple,t:"Pariṇāma/Change"}],
branches:[
{name:"The Inner Three Limbs and Saṃyama",ref:"3.1–3.8",color:C.blue,children:[
{n:"Dhāraṇā — Concentration",r:"3.1",d:"Binding the mind to a place is dhāraṇā",det:{skt:"देशबन्धश्चित्तस्य धारणा",tr:"Dhāraṇā is the binding of the mind to a place.",c:"<em>Dhāraṇā</em> is the sixth limb. The mind is 'bound' (bandha) to a specific locus — a point in the body, an external object, a deity, a concept. The binding is a sustained return to the chosen object whenever the mind wanders.",ex:"Holding attention on the tip of the nose — noticing sensations there — and returning each time the mind wanders, without frustration. This sustained act is dhāraṇā.",vy:"Dhāraṇā is distinguished from ordinary sustained attention by being preceded by pratyāhāra — the senses already withdrawn, making the mind's binding to the object much stronger.",vm:"The 'place' (deśa) can be internal (cakras, heart-space, the point between the eyebrows) or external (a flame, an image of a deity, a maṇḍala)."}},
{n:"Dhyāna — Meditation",r:"3.2",d:"The continuous flow of cognition toward that object is dhyāna",det:{skt:"तत्र प्रत्ययैकतानता ध्यानम्",tr:"Dhyāna is the unbroken flow of cognition toward that object.",c:"<em>Dhyāna</em> is the seventh limb. The difference from dhāraṇā: in dhāraṇā, the mind returns repeatedly to the object (there are gaps); in dhyāna, there is an unbroken (eka-tāna) continuous flow. The object has not changed; the quality of the mind's engagement has deepened into seamless continuity.",ex:"A musician fully absorbed in playing — not thinking about playing, not occasionally remembering the music, but continuously, seamlessly present — is experiencing something analogous to dhyāna.",vy:"The image of oil poured from one vessel to another — unbroken, without drops — is the classical image for dhyāna. The object is the second vessel; the pouring of awareness is dhyāna.",vm:"Dhyāna is not a state one forces; it is a deepening that occurs spontaneously when dhāraṇā has been sustained long enough."}},
{n:"Samādhi — Absorption",r:"3.3",d:"When the object shines alone, as if the mind has dissolved, that is samādhi",det:{skt:"तदेवार्थमात्रनिर्भासं स्वरूपशून्यमिव समाधिः",tr:"Samādhi is when that same meditation shines as the object alone, as if emptied of its own form.",c:"<em>Samādhi</em> is the eighth limb. The practitioner's mind 'empties of its own form' — it is as if the knowing-structure becomes transparent and only the object remains, shining of itself. Not unconsciousness but the highest form of consciousness — pure knowing without a knower.",vy:"In dhāraṇā, one looks at the flame with awareness of the looking; in dhyāna, the flame is the centre of uninterrupted attention; in samādhi, there is only the flame — even 'I am meditating' has dissolved.",vm:"Svarūpa-śūnya iva is key: 'as if emptied of own-form.' The mind's tendency to assert itself as the observer has become invisible within the absorption.",vb:"The meditator's selfhood has dissolved into the object's being. The 'subject' was always provisional; samādhi reveals this."}},
{n:"Trayam ekatra saṃyamaḥ",r:"3.4",d:"The three together on one object is saṃyama",det:{skt:"त्रयमेकत्र संयमः",tr:"The three together applied to one object is saṃyama.",c:"<em>Saṃyama</em> is the quintessential yogic technique: simultaneous application of concentration, meditation, and absorption to a single object, producing a complete, non-conceptual knowledge of that object's deepest nature.",vy:"Saṃyama is not available to the beginning practitioner. It requires that dhāraṇā, dhyāna, and samādhi have each been individually mastered; saṃyama is then their spontaneous combination.",vm:"The objects of saṃyama range from external things through subtle internal ones. The level of the object determines the level of insight produced."}}
]},
{name:"Selected Siddhis through Saṃyama",ref:"3.16–3.50",color:C.amber,children:[
{n:"Knowledge of Past and Future",r:"3.16",d:"By saṃyama on the three transformations — knowledge of past and future",det:{c:"Saṃyama on the three transformations (dharma, lakṣaṇa, avasthā pariṇāma) produces knowledge of past and future states of any object. Every object carries signatures of its past and seeds of its future; saṃyama reveals these directly.",vy:"This siddhi is the basis of the great seer's ability to know the past and future without inference — they read the causal structure of an object directly, as one reads a script.",vb:"The three pariṇāmas are: (1) change in the object's defining characteristics, (2) change in its temporal markers, (3) change in its momentary condition. Saṃyama on all three yields total temporal knowledge."}},
{n:"Knowledge of Another's Mind",r:"3.19",d:"Saṃyama on cognition — knowledge of another's mind",det:{c:"By performing saṃyama on the cognitions arising in another person's mind, the yogin knows the contents of that mind directly. Minds are not sealed-off individual containers — they are modifications of a shared citta-space. The yogin whose citta is sufficiently purified can resonate with another citta and read its vṛttis.",vy:"The knowledge is direct but not infallible regarding the deeper supporting saṃskāras — the siddhi yields knowledge of the vṛtti but not of the underlying saṃskāra.",vm:"The yogin who can read minds operates under a particularly strong obligation of ahiṃsā and right use of knowledge."}},
{n:"Omnipotence and Omniscience",r:"3.50",d:"From the knowledge of the sattva-puruṣa distinction alone — omnipotence and omniscience",det:{skt:"सत्त्वपुरुषान्यताख्यातिमात्रस्य सर्वभावाधिष्ठातृत्वं सर्वज्ञातृत्वं च",tr:"For one who has only the knowledge of the distinction between sattva and puruṣa — lordship over all states and omniscience.",c:"The highest siddhi: the clear, sustained recognition that puruṣa is eternally distinct from sattva produces two supreme capacities — omnipotence and omniscience. Not a power to be used but a natural consequence of standing at the summit of phenomenal existence.",vy:"At this threshold, the practitioner has achieved the maximum possible freedom within the phenomenal domain. The next step — turning even this over through parā-vairāgya — leads to kaivalya itself.",vm:"Omniscience here means the fully purified citta of sattva-dominance, reflecting the luminosity of puruṣa, becomes a perfect mirror of all that is knowable."}}
]},
{name:"Warning and Liberation",ref:"3.51–3.56",color:C.green,children:[
{n:"Tad-vairāgyād api doṣa-bīja-kṣaye kaivalyam",r:"3.51",d:"From dispassion even toward those powers — destruction of the seed of defect and kaivalya",det:{skt:"तद्वैराग्यादपि दोषबीजक्षये कैवल्यम्",tr:"From dispassion even toward those powers, the destruction of the seed of defects, and kaivalya.",c:"Even the extraordinary powers and insights of advanced saṃyama practice must be released through parā-vairāgya. Attachment to the siddhis is the 'seed of defect' (doṣa-bīja) that prevents final liberation. Kaivalya follows from the total release of even this final, subtle attachment.",vy:"The siddhas who stop at this point, marvelling at their powers, are described as having reached 'videha' or 'prakṛti-laya' states — high but not ultimate. True kaivalya requires complete release of even exalted positions.",vm:"The entire catalogue of powers in 3.16–3.50 is prefaced and concluded by warnings: these powers are obstacles to liberation if grasped at. The chapter is a map of the terrain to be released."}},
{n:"Sattva-puruṣayoḥ śuddhi-sāmye kaivalyam",r:"3.56",d:"Kaivalya arises when there is equality of purity between sattva and puruṣa",det:{skt:"सत्त्वपुरुषयोः शुद्धिसाम्ये कैवल्यम्",tr:"Kaivalya arises when the purity of sattva and the purity of puruṣa become equal.",c:"When citta in its sattvic state becomes as pure as puruṣa — when no distortion clouds the citta's reflection of puruṣa — then the apparent distinction between the reflected puruṣa (in citta) and the real puruṣa collapses. What remains is puruṣa alone, in its own nature.",vy:"The equality of purity does not mean sattva becomes puruṣa — it means sattva-citta has become so transparent it no longer produces any veil. The distinction between mirror and reflection becomes irrelevant when the mirror is perfectly transparent.",vm:"This definition completes the Vibhūti Pāda and prepares for the Kaivalya Pāda's deeper metaphysical analysis of what liberation actually is."}}
]}
]},
{tab:"Kaivalya Pāda",title:"Kaivalya Pāda",sub:"Chapter 4 · 34 sūtras · Liberation and the nature of consciousness",
intro:"The final chapter is the most philosophically demanding. Patañjali examines the nature of mind and consciousness from first principles, defends the doctrine of multiple puruṣas against Buddhist Vijñānavāda, analyzes karma and time, and culminates in the description of dharma-megha samādhi and the final liberation (kaivalya) — where puruṣa stands forever in its own nature.",
legend:[{c:C.purple,t:"Metaphysics"},{c:C.gray,t:"Karma/Mind"},{c:C.green,t:"Liberation"},{c:C.blue,t:"Samādhi"}],
branches:[
{name:"Sources of Siddhis",ref:"4.1",color:C.amber,children:[
{n:"Janma-oṣadhi-mantra-tapas-samādhi-jāḥ siddhayaḥ",r:"4.1",d:"Siddhis arise from birth, herbs, mantra, austerity, and samādhi",det:{skt:"जन्मौषधिमन्त्रतपःसमाधिजाः सिद्धयः",tr:"Powers arise from birth, herbs, mantra, austerity, and samādhi.",c:"Five sources: (1) Janma — born with powers from previous-life practice. (2) Oṣadhi — herbs/elixirs used in tantric and āyurvedic traditions. (3) Mantra — the power inherent in sacred sound-formulas. (4) Tapas — siddhis arising from extreme austerity. (5) Samādhi — the systematic siddhis produced through saṃyama.",vy:"Samādhi-born siddhis are distinguished by being reliable, progressive, and subject to the practitioner's will — unlike herb-born siddhis (temporary) or birth-siddhis (which may be uncontrolled).",vm:"This classification acknowledges the diversity of Indian spiritual traditions without ranking them hierarchically. All five produce genuine results."}}
]},
{name:"Karma and the Nature of Mind",ref:"4.7–4.24",color:C.gray,children:[
{n:"Karmāśuklākṛṣṇaṃ yoginas trividham itareṣām",r:"4.7",d:"The karma of the yogi is neither white nor black; for others it is threefold",det:{skt:"कर्माशुक्लाकृष्णं योगिनस्त्रिविधमितरेषाम्",tr:"The karma of the yogi is neither white nor black; for others it is of three kinds.",c:"Ordinary persons accumulate three types of karma: white (producing pleasurable results), black (producing painful results), and mixed. The accomplished yogi operates outside this triple schema — their actions are neither white nor black because they are not ego-driven. Actions performed without the sense of 'I am the doer' do not generate new karmic residues.",vy:"This is the yogic understanding of naiṣkarmya — actionlessness within action. The yogi acts fully but without the doer-sense; the action leaves no karmic deposit.",vm:"The householder yogi who dedicates all actions to Īśvara (karma-yoga) approximates this fourth type of karma even before full liberation."}},
{n:"Nature of Mind and Objects",r:"4.15",d:"The diversity of objects despite the identity of the mind reveals the independence of objects",det:{skt:"वस्तुसाम्ये चित्तभेदात्तयोर्विभक्तः पन्थाः",tr:"With the object being the same, there is a difference in the minds perceiving it — therefore the paths of the object and the mind are separate.",c:"A key anti-idealist argument: if objects were merely mental (as Buddhist Vijñānavāda holds), different minds perceiving the same object would not report the same object — but they do (within the limits of sensory variation). Therefore objects exist independently of any particular mind's perception.",vy:"Vyāsa uses this as evidence for the realist ontology of Sāṃkhya-Yoga. The external world of objects is real, not mind-constructed — though it is not independent of mūla-prakṛti.",vb:"Vijñānabhikṣu: the consistent intersubjective agreement about objects — that fire burns, water flows, the sun rises — cannot be explained if objects are merely mental projections. It requires a real, trans-personal prakṛti."}}
]},
{name:"Dharma-Megha Samādhi and Kaivalya",ref:"4.26–4.34",color:C.green,children:[
{n:"Tadā viveka-nimnaṃ kaivalya-prāg-bhāraṃ cittam",r:"4.26",d:"Then the mind, inclined toward viveka, gravitates toward kaivalya",det:{skt:"तदा विवेकनिम्नं कैवल्यप्राग्भारं चित्तम्",tr:"Then the mind, inclined toward discrimination, has a natural gravitational pull toward kaivalya.",c:"When viveka-khyāti becomes the dominant orientation, a qualitative shift occurs: the mind no longer requires effort to sustain discrimination — it is naturally inclined toward it (nimna — sloping toward, as water toward its lowest point). Kaivalya is now the natural gravity of the system.",vy:"The yogi at this stage does not 'pursue' liberation — they simply stop obstructing what is already the natural inclination of a purified mind.",vm:"This describes the state just before dharma-megha samādhi: everything done; now only a matter of continuing vairāgya before the final dissolution occurs spontaneously."}},
{n:"Dharma-megha-samādhiḥ",r:"4.29",d:"Dharma-megha samādhi — the cloud of dharma — from complete discriminative insight",det:{skt:"प्रसङ्ख्यानेऽप्यकुसीदस्य सर्वथा विवेकख्यातेर्धर्ममेघसमाधिः",tr:"For one disinterested even in the highest knowledge, dharma-megha samādhi arises through complete discriminative insight.",c:"<em>Dharma-megha samādhi</em> — the 'cloud of dharma' samādhi. This is the ultimate samādhi before liberation, arising spontaneously when even the highest knowledge-state is released through dispassion (akusīda — no interest, no investment). It rains dharma on the entire field of consciousness.",vy:"Dharma-megha samādhi is the threshold state. It burns all accumulated karma and dissolves the final residue of the kleśas, leading directly to kaivalya.",vm:"As a monsoon cloud releases its water completely and then is gone, so this samādhi releases all the fruits of yoga completely — and then the very structure of 'the one who practises yoga' dissolves.",vb:"Vijñānabhikṣu identifies dharma-megha samādhi with the 'highest sattva' state — the citta at its most transparent, reflecting puruṣa's luminosity without any residual distortion."}},
{n:"Tataḥ kleśa-karma-nivṛttiḥ",r:"4.30",d:"Thence, the cessation of kleśas and karma",det:{skt:"ततः क्लेशकर्मनिवृत्तिः",tr:"From that, the cessation of afflictions and karma.",c:"The complete cessation (nivṛtti) of all kleśas — not their thinning or temporary suspension but their radical, irreversible extinction — and simultaneously the cessation of all karma-generation. With no kleśas, no new karma is created; with no new karma, the mechanism of saṃsāra has no more fuel.",vy:"This is the yogic equivalent of the Buddhist nirvāṇa: not a positive state but the cessation of the causes of suffering. The fire goes out.",vm:"The cessation of kleśas at dharma-megha is pradhvaṃsābhāva — the destruction of what previously existed. The seeds of kleśas have been completely burned; they cannot regenerate."}},
{n:"Pratiprasava-hetutvāt kaivalyam — Final Sūtra",r:"4.34",d:"Kaivalya is the return of the guṇas to their source; the power of consciousness established in its own nature",det:{skt:"पुरुषार्थशून्यानां गुणानां प्रतिप्रसवः कैवल्यं स्वरूपप्रतिष्ठा वा चितिशक्तिरिति",tr:"Kaivalya is the return of the guṇas — purposeless for the puruṣa — or the power of consciousness established in its own form.",c:"Two complementary definitions. From the side of prakṛti: <em>pratiprasava</em> — the guṇas, having completed their purpose, return to their original undifferentiated state in mūla-prakṛti. From the side of puruṣa: <em>svarūpa-pratiṣṭhā</em> — the power of consciousness is established in its own form — puruṣa abides as itself.",vy:"Kaivalya literally means 'aloneness' — not loneliness but the absolute uniqueness and self-sufficiency of puruṣa. It requires nothing; it excludes nothing; it is complete in itself.",vm:"The two definitions mirror the Sāṃkhya-Yoga's dual perspective: the metaphysical resolution (guṇas return to prakṛti) and the phenomenological resolution (puruṣa rests as itself). From outside, the world continues; from inside the liberated being, only puruṣa's eternal self-luminosity.",vb:"The final word iti ('thus') marks a formal closure — not just of the text but of the entire chain of inquiry. The question 'what is yoga?' has been answered at every level: from the practical to the metaphysical. Iti."}}
]}
]}
];

// SĀṂKHYA — Sāṃkhyakārikā of Īśvarakṛṣṇa (c. 350 CE)
// Commentaries: Gauḍapāda Bhāṣya, Vācaspati Miśra Tattvakaumudī,
