<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ṣaḍdarśana — Six Orthodox Systems of Indian Philosophy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Warm parchment palette */
  --bg:#F5EDDC;
  --bg-card:#EFE3CC;
  --bg-panel:#E8D9BC;
  --bg-deep:#FBF6EA;
  --text-primary:#2A1D0E;
  --text-secondary:#4F3D26;
  --text-muted:#8A7553;
  --border:#C9B587;
  --border-light:#DCCBA3;
  --gold:#9C6F2A;
  --gold-light:#C49344;
  --shadow:0 1px 3px rgba(120,80,30,.08), 0 4px 12px rgba(120,80,30,.04);
  --shadow-lg:0 4px 16px rgba(120,80,30,.10), 0 12px 32px rgba(120,80,30,.06);
  --radius:7px;--radius-lg:12px;
  --font-body:'Lora',Georgia,'Times New Roman',serif;
  --font-display:'Cormorant Garamond',Georgia,serif;
  --font-mono:'JetBrains Mono','Inconsolata','Courier New',monospace;

  /* System accents — each system gets its own warm hue */
  --sys-yoga:#B8501F;        /* terracotta */
  --sys-yoga-bg:#F8E6D4;     /* yoga panel tint */
  --sys-yoga-deep:#9F4218;
  --sys-samkhya:#8C5A2B;     /* burnt sienna */
  --sys-samkhya-bg:#F2E1C8;
  --sys-samkhya-deep:#73471F;
  --sys-nyaya:#6B6428;       /* olive gold */
  --sys-nyaya-bg:#EDE6C5;
  --sys-nyaya-deep:#534D1D;
  --sys-vaisheshika:#5C7048; /* sage */
  --sys-vaisheshika-bg:#E5E8CF;
  --sys-vaisheshika-deep:#445335;
  --sys-mimamsa:#A03E3E;     /* deep red-clay */
  --sys-mimamsa-bg:#F5DCD4;
  --sys-mimamsa-deep:#7E2E2E;
  --sys-vedanta:#7A4980;     /* aubergine */
  --sys-vedanta-bg:#EDDDE6;
  --sys-vedanta-deep:#5C3563;
  --sys-vedas:#9C6F2A;       /* warm gold */
  --sys-vedas-bg:#F3E4C2;
  --sys-vedas-deep:#7A551E;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1B140A;
  --bg-card:#251B0E;
  --bg-panel:#2E2213;
  --bg-deep:#15100A;
  --text-primary:#F2EAD8;
  --text-secondary:#D5C7A9;
  --text-muted:#9A876A;
  --border:#4A3920;
  --border-light:#352818;
  --gold:#D4A152;
  --gold-light:#9C6F2A;
  --shadow:0 1px 3px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.25);
  --shadow-lg:0 4px 16px rgba(0,0,0,.5), 0 12px 32px rgba(0,0,0,.3);

  --sys-yoga:#E07A45;        --sys-yoga-bg:#2D1B0E;       --sys-yoga-deep:#F0996B;
  --sys-samkhya:#C18A50;     --sys-samkhya-bg:#291C0E;    --sys-samkhya-deep:#D9A66B;
  --sys-nyaya:#B5A852;       --sys-nyaya-bg:#252210;      --sys-nyaya-deep:#D4C870;
  --sys-vaisheshika:#9CB07A; --sys-vaisheshika-bg:#1F2615;--sys-vaisheshika-deep:#B8CB94;
  --sys-mimamsa:#D86B6B;     --sys-mimamsa-bg:#2A1313;    --sys-mimamsa-deep:#E89090;
  --sys-vedanta:#B17BB8;     --sys-vedanta-bg:#241A26;    --sys-vedanta-deep:#CB9CCF;
  --sys-vedas:#D4A152;       --sys-vedas-bg:#291F0F;      --sys-vedas-deep:#E8BD70;
}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-body);
  background:var(--bg);
  background-image:
    radial-gradient(at 20% 10%, rgba(196,147,68,.08) 0%, transparent 50%),
    radial-gradient(at 80% 80%, rgba(156,111,42,.06) 0%, transparent 50%);
  background-attachment:fixed;
  color:var(--text-primary);
  min-height:100vh;
  font-feature-settings:"liga" 1,"kern" 1;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
}
#shell{max-width:880px;margin:0 auto;padding:32px 20px 100px}

/* HEADER */
.site-header{text-align:center;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border)}
.site-header .eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;font-weight:500}
.site-header h1{font-family:var(--font-display);font-size:2.4rem;font-weight:500;color:var(--text-primary);line-height:1.2;margin-bottom:6px;letter-spacing:-.01em}
.site-header .subtitle{font-family:var(--font-display);font-size:14px;color:var(--text-muted);font-style:italic;letter-spacing:.02em}

/* TOP NAV — systems */
.top-nav{
  display:flex;gap:4px;flex-wrap:wrap;
  background:var(--bg-card);
  padding:5px;
  border-radius:var(--radius-lg);
  border:1px solid var(--border);
  margin-bottom:28px;
  box-shadow:var(--shadow);
}
.top-nav button{
  flex:1;min-width:96px;
  padding:11px 8px;
  font-family:var(--font-mono);
  font-size:10px;letter-spacing:.06em;
  border:none;background:transparent;
  color:var(--text-muted);
  cursor:pointer;
  border-radius:8px;
  transition:all .18s ease;
  line-height:1.4;text-align:center;
  font-weight:500;
  border-bottom:2.5px solid transparent;
}
.top-nav button:hover{color:var(--text-secondary);background:var(--bg-deep)}
.top-nav button.active{
  background:var(--bg-deep);
  color:var(--text-primary);
  font-weight:600;
  box-shadow:0 1px 4px rgba(120,80,30,.15);
}
/* per-system accent color on active button */
.top-nav button[data-sys="yoga"].active        {border-bottom-color:var(--sys-yoga)}
.top-nav button[data-sys="samkhya"].active     {border-bottom-color:var(--sys-samkhya)}
.top-nav button[data-sys="nyaya"].active       {border-bottom-color:var(--sys-nyaya)}
.top-nav button[data-sys="vaisheshika"].active {border-bottom-color:var(--sys-vaisheshika)}
.top-nav button[data-sys="mimamsa"].active     {border-bottom-color:var(--sys-mimamsa)}
.top-nav button[data-sys="vedanta"].active     {border-bottom-color:var(--sys-vedanta)}
.top-nav button[data-sys="vedas"].active       {border-bottom-color:var(--sys-vedas)}

/* SYSTEM PANEL — each system has its own warm tinted backdrop */
.system-panel{display:none;padding:22px 22px 24px;border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.system-panel.active{display:block}
.system-panel#yoga        {background:var(--sys-yoga-bg);        --accent:var(--sys-yoga);        --accent-deep:var(--sys-yoga-deep)}
.system-panel#samkhya     {background:var(--sys-samkhya-bg);     --accent:var(--sys-samkhya);     --accent-deep:var(--sys-samkhya-deep)}
.system-panel#nyaya       {background:var(--sys-nyaya-bg);       --accent:var(--sys-nyaya);       --accent-deep:var(--sys-nyaya-deep)}
.system-panel#vaisheshika {background:var(--sys-vaisheshika-bg); --accent:var(--sys-vaisheshika); --accent-deep:var(--sys-vaisheshika-deep)}
.system-panel#mimamsa     {background:var(--sys-mimamsa-bg);     --accent:var(--sys-mimamsa);     --accent-deep:var(--sys-mimamsa-deep)}
.system-panel#vedanta     {background:var(--sys-vedanta-bg);     --accent:var(--sys-vedanta);     --accent-deep:var(--sys-vedanta-deep)}
.system-panel#vedas       {background:var(--sys-vedas-bg);       --accent:var(--sys-vedas);       --accent-deep:var(--sys-vedas-deep)}

/* SUB NAV — padas / books / adhyayas */
.sub-nav{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:22px}
.sub-nav button{
  padding:8px 14px;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;font-weight:500;
  border:1px solid transparent;
  background:rgba(255,255,255,.35);
  color:var(--text-muted);
  cursor:pointer;border-radius:var(--radius);
  transition:all .15s;
}
.sub-nav button:hover{color:var(--text-secondary);background:rgba(255,255,255,.6);border-color:var(--border-light)}
.sub-nav button.active{
  background:var(--accent,var(--gold));
  color:#FBF6EA;
  font-weight:600;
  border-color:var(--accent-deep,var(--gold));
  box-shadow:0 1px 3px rgba(120,80,30,.2);
}

/* SECTION TITLE */
.sec-title{
  font-family:var(--font-display);
  font-size:1.7rem;font-weight:500;
  color:var(--accent-deep,var(--text-primary));
  margin-bottom:3px;letter-spacing:-.005em;
}
.sec-sub{
  font-family:var(--font-mono);
  font-size:10.5px;color:var(--text-muted);
  letter-spacing:.06em;margin-bottom:18px;font-weight:500;
}

/* INTRO CARD */
.intro-card{
  padding:16px 20px;margin-bottom:22px;
  background:var(--bg-deep);
  border-radius:var(--radius-lg);
  font-size:14.5px;line-height:1.78;
  color:var(--text-secondary);
  border-left:3px solid var(--accent,var(--gold));
  box-shadow:var(--shadow);
}
.intro-card strong{font-weight:600;color:var(--text-primary)}
.intro-card em{color:var(--accent-deep,var(--text-primary));font-style:italic;font-weight:500}

/* LEGEND */
.legend{display:flex;gap:8px 18px;flex-wrap:wrap;margin-bottom:20px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);letter-spacing:.03em;font-weight:500;padding:10px 14px;background:rgba(255,255,255,.3);border-radius:var(--radius)}
.legend span{display:flex;align-items:center;gap:6px}
.legend .ld{width:9px;height:9px;border-radius:50%;flex-shrink:0;opacity:.9;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}

/* TREE */
.tree{display:flex;flex-direction:column;gap:6px;margin-bottom:24px}

/* BRANCH */
.branch{
  border-radius:var(--radius-lg);
  background:var(--bg-deep);
  border:1px solid var(--border-light);
  overflow:hidden;
  transition:all .18s;
  box-shadow:var(--shadow);
}
.branch:hover{border-color:var(--border)}
.branch-head{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;
  cursor:pointer;user-select:none;
  background:var(--bg-deep);
  transition:background .14s;
}
.branch-head:hover{background:var(--bg-card)}
.branch-head .dot{
  width:10px;height:10px;border-radius:50%;
  flex-shrink:0;opacity:.9;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);
}
.branch-head .label{
  font-family:var(--font-display);
  font-size:1.05rem;font-weight:600;
  color:var(--text-primary);flex:1;
  letter-spacing:.005em;
}
.branch-head .ref{
  font-family:var(--font-mono);
  font-size:10.5px;color:var(--accent-deep,var(--text-muted));
  letter-spacing:.05em;font-weight:500;
}
.branch-head .chev{
  font-size:10px;color:var(--text-muted);
  transition:transform .22s ease;flex-shrink:0;
}
.branch-head.open .chev{transform:rotate(90deg)}
.branch-body{
  display:none;
  padding:10px 16px 16px 36px;
  background:var(--bg-deep);
  border-top:1px solid var(--border-light);
}
.branch-body.open{display:block}

/* SUB-TREE */
.sub-tree{margin:9px 0 5px;padding-left:14px;border-left:2px solid var(--accent,var(--border))}
.sub-label{
  font-family:var(--font-mono);
  font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--accent-deep,var(--text-muted));
  margin:9px 0 5px;font-weight:600;
}

/* LEAF */
.leaf{
  display:flex;align-items:flex-start;gap:9px;
  padding:8px 10px 8px 6px;
  cursor:pointer;
  border-radius:var(--radius);
  transition:background .12s;
  margin:2px 0;
}
.leaf:hover{background:var(--bg-card)}
.leaf .lf-dot{
  width:6px;height:6px;border-radius:50%;
  flex-shrink:0;margin-top:9px;opacity:.65;
}
.leaf-content{flex:1;min-width:0}
.leaf .lf-name{
  font-family:var(--font-display);
  font-style:italic;
  font-size:1.05rem;font-weight:500;
  color:var(--text-primary);
}
.leaf .lf-ref{
  font-family:var(--font-mono);
  font-size:10.5px;color:var(--accent-deep,var(--text-muted));
  margin-left:7px;font-weight:500;
}
.leaf .lf-skt{
  font-family:var(--font-body);
  font-size:13px;color:var(--text-muted);
  font-style:italic;display:block;margin-top:2px;
}
.leaf .lf-desc{
  font-family:var(--font-body);
  font-size:13.5px;color:var(--text-secondary);
  line-height:1.65;margin-top:3px;
}
.leaf .lf-expand{
  font-family:var(--font-mono);
  font-size:9.5px;color:var(--text-muted);
  margin-top:5px;letter-spacing:.05em;
  opacity:.75;font-weight:500;
}

/* DETAIL PANEL */
.detail-panel{
  display:none;
  margin-top:11px;
  padding:16px 18px;
  background:var(--bg-deep);
  border-radius:var(--radius-lg);
  border-left:3px solid var(--accent,var(--gold));
  box-shadow:var(--shadow);
}
.detail-panel.open{display:block}
.detail-section{margin-bottom:13px}
.detail-section:last-child{margin-bottom:0}
.detail-label{
  font-family:var(--font-mono);
  font-size:9.5px;text-transform:uppercase;
  letter-spacing:.14em;color:var(--accent-deep,var(--text-muted));
  margin-bottom:5px;font-weight:600;
}
.detail-text{
  font-family:var(--font-body);
  font-size:14.5px;color:var(--text-primary);
  line-height:1.78;
}
.detail-text em{color:var(--accent-deep,var(--text-primary));font-style:italic;font-weight:600}
.skt-block{
  font-family:var(--font-body);
  font-size:14px;font-style:italic;
  color:var(--text-secondary);
  padding:11px 15px;
  background:var(--bg-card);
  border-radius:var(--radius);
  margin-bottom:10px;line-height:1.75;
  border-left:2px solid var(--accent,var(--border));
}
.commentaries-wrap{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.detail-commentary{
  padding:11px 14px;
  background:var(--bg-card);
  border-radius:var(--radius);
  border:1px solid var(--border-light);
  border-top:2px solid var(--accent,var(--gold));
}
.com-name{
  font-family:var(--font-mono);
  font-size:9.5px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent-deep,var(--gold));margin-bottom:4px;
}
.com-text{
  font-family:var(--font-body);
  font-size:13.5px;color:var(--text-secondary);
  line-height:1.72;
}
.com-text em{font-style:italic;font-weight:600;color:var(--text-primary)}

/* mobile tweaks */
@media (max-width:600px){
  html{font-size:16px}
  #shell{padding:20px 14px 80px}
  .system-panel{padding:16px 14px 18px}
  .site-header h1{font-size:1.9rem}
  .branch-body{padding:10px 12px 14px 22px}
  .top-nav button{min-width:70px;font-size:9.5px;padding:9px 5px}
}
</style>
</head>
<body>
<div id="shell">
<header class="site-header">
  <div class="eyebrow">Bādarāyaṇa · c. 200 BCE · with Principal Upaniṣads</div>
  <h1>Vedānta — Complete Map</h1>
  <div class="subtitle">Brahma Sūtras · Ten Principal Upaniṣads · Śaṅkara, Rāmānuja, Madhva</div>
</header>
<div id="vedanta" class="system-panel active"></div>
</div>
<script>
'use strict';
const C={
  purple:'#7F77DD',teal:'#1D9E75',coral:'#D85A30',pink:'#D4537E',
  blue:'#378ADD',amber:'#EF9F27',green:'#639922',red:'#E24B4A',
  gray:'#888780',indigo:'#5B6FBB',rose:'#C25B7A',ochre:'#B87333',
  sage:'#6B8A6B',slate:'#5E7080',plum:'#8B5A8B',sienna:'#A05030'
};

// ─── Shared render helpers ────────────────────────────────────────────────────
function safeHtml(s){return s||'';}

function renderDetail(d,color,id){
  if(!d)return'';
  let h=`<div class="detail-panel" id="d${id}" style="--accent:${color}">`;
  if(d.skt){h+=`<div class="skt-block">${safeHtml(d.skt)}</div>`;}
  if(d.tr){h+=`<div class="detail-section"><div class="detail-label">Translation</div><div class="detail-text">${safeHtml(d.tr)}</div></div>`;}
  if(d.c){h+=`<div class="detail-section"><div class="detail-label">Concept &amp; Meaning</div><div class="detail-text">${safeHtml(d.c)}</div></div>`;}
  if(d.ex){h+=`<div class="detail-section"><div class="detail-label">Example &amp; Application</div><div class="detail-text">${safeHtml(d.ex)}</div></div>`;}
  const comDefs=[
    {k:'vy', n:'Vyāsa · Yoga Bhāṣya'},
    {k:'vb', n:'Vijñānabhikṣu · Yoga-Vārttika'},
    {k:'vm', n:'Vācaspati Miśra · Tattva-Vaiśāradī'},
    {k:'sk', n:'Śaṅkara · Vivaraṇa'},
    {k:'gp', n:'Gauḍapāda · Bhāṣya'},
    {k:'tk', n:'Vācaspati Miśra · Tattvakaumudī'},
    {k:'mat',n:'Māṭhara · Māṭharāvṛtti'},
    {k:'vts',n:'Vātsyāyana · Nyāya Bhāṣya'},
    {k:'udd',n:'Uddyotakara · Nyāya Vārttika'},
    {k:'vmt',n:'Vācaspati Miśra · Tātparya-Ṭīkā'},
    {k:'uda',n:'Udayana · Nyāya-Pariśuddhi'},
    {k:'rgh',n:'Raghunātha Śiromaṇi · Bhāṣā-Pariccheda'},
    {k:'vis',n:'Viśvanātha · Nyāya-Sūtra-Vṛtti'},
    {k:'prs',n:'Praśastapāda · Padārthadharmasaṃgraha'},
    {k:'sbt',n:'Śabara · Mīmāṃsā Bhāṣya'},
    {k:'kum',n:'Kumārila Bhaṭṭa · Ślokavārttika'},
    {k:'prb',n:'Prabhākara · Bṛhatī'},
    {k:'shk',n:'Śaṅkara · Bhāṣya'},
    {k:'rmj',n:'Rāmānuja · Śrī-Bhāṣya'},
    {k:'mdv',n:'Madhva · Anuvyākhyāna'},
    {k:'nim',n:'Nimbārka · Vedānta-Pārijāta-Saurabha'},
    {k:'val',n:'Vallabha · Aṇubhāṣya'},
    {k:'syk',n:'Sāyaṇa · Commentary'},
    {k:'mhi',n:'Mahīdhara · Vedadīpa'},
    {k:'uvt',n:'Uvvaṭa · Commentary'},
  ];
  const present=comDefs.filter(x=>d[x.k]);
  if(present.length){
    h+=`<div class="detail-section"><div class="detail-label">Classical Commentaries</div><div class="commentaries-wrap">`;
    present.forEach(x=>{
      h+=`<div class="detail-commentary"><div class="com-name">${x.n}</div><div class="com-text">${safeHtml(d[x.k])}</div></div>`;
    });
    h+=`</div></div>`;
  }
  h+=`</div>`;return h;
}

function renderLeaf(l,color){
  const id='L'+Math.random().toString(36).slice(2,9);
  const has=!!l.det;
  const hint=has?`<div class="lf-expand">&#9654; tap for commentaries</div>`:'';
  const oc=has?`onclick="toggleDetail('${id}',event)"`:'';
  return`<div class="leaf" ${oc}>
    <div class="lf-dot" style="background:${color}"></div>
    <div class="leaf-content">
      <div><span class="lf-name">${l.n}</span><span class="lf-ref">${l.r||''}</span></div>
      ${l.sk?`<span class="lf-skt">${l.sk}</span>`:''}
      <div class="lf-desc">${l.d}</div>
      ${hint}
      ${has?renderDetail(l.det,color,id):''}
    </div>
  </div>`;
}

function renderBranch(b,idx){
  const id='B'+idx+'_'+Math.random().toString(36).slice(2,6);
  let body='';
  if(b.sub){b.sub.forEach(s=>{
    body+=`<div class="sub-tree">`;
    if(s.label)body+=`<div class="sub-label">${s.label}</div>`;
    s.children.forEach(c=>{body+=renderLeaf(c,b.color);});
    body+=`</div>`;
  });}
  if(b.children){b.children.forEach(c=>{body+=renderLeaf(c,b.color);});}
  return`<div class="branch">
    <div class="branch-head" onclick="toggleBranch('BB${id}',this)">
      <div class="dot" style="background:${b.color}"></div>
      <div class="label">${b.name}</div>
      <div class="ref">${b.ref||''}</div>
      <div class="chev">&#9654;</div>
    </div>
    <div class="branch-body" id="BB${id}">${body}</div>
  </div>`;
}

function renderSection(sec,containerEl){
  let h=`<div class="sec-title">${sec.title}</div>`;
  h+=`<div class="sec-sub">${sec.sub||''}</div>`;
  if(sec.intro)h+=`<div class="intro-card">${sec.intro}</div>`;
  if(sec.legend){
    h+=`<div class="legend">`;
    sec.legend.forEach(l=>{h+=`<span><div class="ld" style="background:${l.c}"></div>${l.t}</span>`;});
    h+=`</div>`;
  }
  h+=`<div class="tree">`;
  sec.branches.forEach((b,i)=>{h+=renderBranch(b,i);});
  h+=`</div>`;
  containerEl.innerHTML=h;
}

function buildSubNav(sections,panelId,renderFn){
  const panel=document.getElementById(panelId);
  if(!sections||sections.length===0)return;
  let nav=`<div class="sub-nav" id="sn_${panelId}">`;
  sections.forEach((s,i)=>{
    nav+=`<button ${i===0?'class="active"':''} onclick="switchSub('${panelId}',${i})">${s.tab||s.title}</button>`;
  });
  nav+=`</div><div id="sc_${panelId}"></div>`;
  panel.innerHTML=nav;
  renderFn(sections[0],document.getElementById(`sc_${panelId}`));
  panel._sections=sections;
  panel._renderFn=renderFn;
}

function switchSub(panelId,idx){
  const panel=document.getElementById(panelId);
  document.querySelectorAll(`#sn_${panelId} button`).forEach((b,i)=>b.classList.toggle('active',i===idx));
  panel._renderFn(panel._sections[idx],document.getElementById(`sc_${panelId}`));
}

function showSystem(id){
  document.querySelectorAll('.system-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.top-nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const btns=document.querySelectorAll('.top-nav button');
  const map={yoga:0,samkhya:1,nyaya:2,vaisheshika:3,mimamsa:4,vedanta:5,vedas:6};
  btns[map[id]].classList.add('active');
  if(!document.getElementById(id)._built){
    builders[id]();
    document.getElementById(id)._built=true;
  }
}

function toggleBranch(id,el){
  const body=document.getElementById(id);
  const open=body.classList.toggle('open');
  el.classList.toggle('open',open);
}
function toggleDetail(id,ev){
  ev.stopPropagation();
  const p=document.getElementById('d'+id);
  if(p)p.classList.toggle('open');
}

builders.vedanta=function(){
const secs=[
// ───────────────────────────────────────────────────────────────────

{tab:"Ten Principal Upaniṣads",title:"The Ten Principal Upaniṣads — Daśopaniṣad",sub:"The mukhya Upaniṣads commented upon by all three ācāryas",
intro:"Śaṅkara wrote bhāṣyas on ten Upaniṣads (with Nṛsiṃhapūrvatāpanīya and Māṇḍūkya-Kārikā sometimes added, giving 12–13). These are the foundational texts of all Vedāntic schools. Rāmānuja's Śrī-Bhāṣya on the Brahmasūtras extensively quotes and interprets the key passages of these Upaniṣads. Madhva wrote separate commentaries (bhāṣyas) on all ten plus several minor ones.",
legend:[{c:C.amber,t:"Śaṅkara·Advaita"},{c:C.teal,t:"Rāmānuja·Viśiṣṭādvaita"},{c:C.blue,t:"Madhva·Dvaita"},{c:C.purple,t:"Core Teaching"},{c:C.green,t:"Mahāvākya"}],
branches:[
{name:"Bṛhadāraṇyaka Upaniṣad",ref:"Śukla Yajurveda · Śatapatha Brāhmaṇa · 6 adhyāyas",color:C.amber,children:[
{n:"Aśvamedha Brāhmaṇa — The Horse Sacrifice Cosmogony",r:"BAU 1.1",d:"The horse sacrifice as cosmic symbol — the head is the dawn, the eye is the sun",
det:{skt:"उषा वा अश्वस्य मेध्यस्य शिरः। सूर्यश्चक्षुः।",tr:"The dawn indeed is the head of the sacrificial horse; the sun is its eye.",
c:"The Bṛhadāraṇyaka opens with an audacious move: it identifies every part of the sacrificial horse with a corresponding cosmic element, and then identifies the cosmic whole with brahman. This is the Upaniṣadic method of bandhu (binding, equivalence) — perceiving the identity of the ritual with the cosmos and the cosmos with consciousness.",
shk:"Śaṅkara: this opening section establishes that the entire manifest cosmos is to be understood as an expression of the one brahman. The horse-cosmos identification is not mythology but upāsanā (meditation instruction) — the practitioner is to meditate on the sacrifice as the cosmos and thereby transcend both. The purpose is to prepare the mind for the mahāvākya teaching that follows.",
rmj:"Rāmānuja: the horse-cosmos identification illustrates the Viśiṣṭādvaita principle that the world is the body (śarīra) of brahman/Īśvara. Just as the horse's parts are unified by one life, the cosmic parts are unified by the one Īśvara who is their inner self (antaryāmin).",
mdv:"Madhva: the identification is devotional, not ontological. The horse represents the manifest world which is entirely distinct from and dependent on Viṣṇu (= brahman). Meditating on this identity awakens devotion to the Lord who pervades and transcends his creation."}},
{n:"Ajātaśatru-Gārgya Dialogue — Meditation on Brahman",r:"BAU 2.1",d:"Gārgya's failed meditations and Ajātaśatru's teaching of the self as the inner witness of sleep",
det:{skt:"ब्रह्म वा अहमस्मीति — एष ते आत्मा सर्वान्तर इति",tr:"'I am brahman' — 'This is your self, the inner controller of all.'",
c:"Gārgya lists sixteen meditations (on the person in the sun, moon, lightning, etc.) — each rejected by the Kṣatriya king Ajātaśatru as incomplete because they identify brahman with a specific quality or object. Ajātaśatru then teaches the supreme teaching: the self in deep sleep — the prajñā (luminous awareness) that underlies all states — is the true brahman.",
shk:"Śaṅkara: this dialogue is a demonstration of adhikāra-parīkṣā — the teacher testing whether the student's meditation is based on a genuine understanding of the non-dual brahman or on partial, object-based meditation. Ajātaśatru's correction points to the self as pure, witnessing consciousness — not an object of meditation but the meditation itself.",
rmj:"Rāmānuja: the sixteen meditations are valid upāsanās of Īśvara in his various cosmic manifestations. Ajātaśatru's teaching adds the key insight: Īśvara is also the self of all individuals — the inner controller (antaryāmin). This is the foundation of Rāmānuja's śarīra-śarīrin (body-soul) relation between Īśvara and the world.",
mdv:"Madhva: the 'self within' (antaryāmin) is Viṣṇu — the supreme independent reality distinct from both the individual self (jīva) and the world. The deep sleep state (suṣupti) is not a state of brahman-experience but a state in which Viṣṇu's sustaining presence alone remains, all individual activity having been withdrawn."}},
{n:"Yājñavalkya-Maitreyī Dialogue — Ātman as the Essence of Love",r:"BAU 2.4 / 4.5",d:"Everything is dear not for its own sake but for the sake of the self",
det:{skt:"न वा अरे पत्युः कामाय पतिः प्रियो भवति, आत्मनस्तु कामाय पतिः प्रियो भवति",tr:"The husband is not dear for the sake of the husband; rather the husband is dear for the sake of the self.",
c:"Yājñavalkya, about to leave for a life of renunciation, divides his property between his two wives. Maitreyī asks whether wealth without the knowledge of immortality is worthwhile — a question that opens the dialogue to the deepest teaching. The sūtra (verse) that follows is one of the most cited in all of Vedānta: everything dear — husband, wife, children, wealth, gods, worlds — is dear not for its own sake but for the sake of the ātman. The ātman is the ultimate ground of all love.",
shk:"Śaṅkara: this passage reveals that the deepest motive of all human love is the ātman itself. We love objects because we unconsciously identify them with the ātman (brahman). When the ātman is known directly, the need to seek it through objects dissolves — not because love ends but because it finds its true object and rests there. The mahāvākya 'aham brahmāsmi' (I am brahman) is the direct expression of this realisation.",
rmj:"Rāmānuja: the passage teaches that Īśvara (as ātman-of-all) is the ultimate ground of all love. When we love any finite being, we are — without knowing it — reaching toward the infinite Īśvara who is the inner self of that being. Devotion (bhakti) is the conscious form of this natural movement of love toward its ultimate source.",
mdv:"Madhva: the ātman referred to is not one's personal self but the paramātman (Viṣṇu) who is the ātman of all. All love is ultimately love for Viṣṇu — who is independently real, supremely blissful, and the source of all joy. Liberation consists in consciously directing this love to its true object."}},
{n:"Yājñavalkya-Janaka Dialogue — Five Fires, Rebirth, and Liberation",r:"BAU 6.2",d:"The five fire doctrine (pañcāgnividyā) — the path of the gods and the path of the ancestors",
det:{skt:"देवयानः पितृयाण इति — तद्य इत्थं विदुः...अमृतत्वमश्नुते",tr:"The path of the gods and the path of the ancestors — those who know thus... they attain immortality.",
c:"The pañcāgnividyā (five fire teaching): the cosmos is a series of five 'fires' in which offerings are made and from which things emerge. The five fires are: heaven (sun as fire, faith as fuel, soma as offering, rain emerges); cloud (air/space as fire, rain as offering, food emerges); earth (fire/year as fire, food as offering, sperm emerges); man (fire as fire, sperm as offering, the embryo emerges); woman (fire as fire, the child emerges). After death: the person follows either the devayāna (path of the gods → non-return → liberation) or the pitṛyāna (path of the ancestors → moon → return to earth → rebirth). Only those who know the pañcāgnividyā and cultivate brahman attain the devayāna.",
shk:"Śaṅkara: the devayāna and pitṛyāna are described for those who have realised brahman with qualities (saguna brahman) and those who have accumulated merit through ritual. The supreme teaching is that direct knowledge of nirguna brahman (brahman without qualities) transcends both paths — the jñānī does not travel any path after death but simply dissolves into brahman immediately at death.",
rmj:"Rāmānuja: the devayāna is the path of those who have practised upāsanā of Īśvara (saguna brahman) with full knowledge. They travel to Brahmaloka (the abode of Brahmā/Hiraṇyagarbha) and from there attain liberation at the end of the cosmic cycle. The pitṛyāna is the path of those whose merit was accumulated through ritual only, without knowledge.",
mdv:"Madhva: the devayāna is the path of Viṣṇu-devotees who attain Vaikuṇṭha — the eternal abode of Viṣṇu — from which there is no return (no rebirth). The pitṛyāna is for those devoted to the ancestors — they attain the intermediate realm and eventually return. Liberation is exclusively Viṣṇu's grace."}},
{n:"Yājñavalkya at Janaka's Court — Supreme Self (paramātman)",r:"BAU 4.3–4.4",d:"The self in the three states — waking, dream, and deep sleep — and the fourth (turīya)",
det:{skt:"अत्रैव समृद्धो भवति। आत्मानमेव लोकमुपास्स्व।",tr:"In this alone is the self complete. Meditate on the self as the world.",
c:"Yājñavalkya's teaching to King Janaka in the lengthy court dialogue traces the self through its three states of experience: (1) In waking (jāgrat), the self takes the material body as its field and experiences external objects through the senses. (2) In dream (svapna), the self creates its own luminous world from the impressions of waking experience — demonstrating the self's creative power. (3) In deep sleep (suṣupti), the self rests in the pericardium, dissolved into prāṇa, free from all experience — 'as a child might sleep, or a great king, or a great brahmin, transcending good and evil, all the worlds.' The fourth state (implied but not named in BAU — named turīya in the Māṇḍūkya) is the self in its own nature: the witness of all three states, the pure light of consciousness.",
shk:"Śaṅkara: the deep sleep analysis is decisive for Advaita. In deep sleep, the apparent divisions of waking life (subject-object, this-that, I-other) dissolve, and only pure consciousness remains. On waking, the person reports 'I knew nothing; I was happy' — a memory of contentlessness and bliss. This demonstrates that the self's essential nature is blissful, contentless consciousness — brahman. The three states are like waves on the ocean of turīya; turīya is not a fourth state but the substratum of all three.",
rmj:"Rāmānuja: the three states are modes of the jīva's (individual self's) experience, not of brahman. Brahman (Īśvara) is the witness of the jīva's experiences in all three states — the antaryāmin who is permanently awake within. Deep sleep is a state of non-experience for the jīva, not a state of brahman-realisation. Rāmānuja's critique of Advaita: if deep sleep were genuine brahman-experience, everyone would awaken from sleep as a jñānī.",
mdv:"Madhva: the four states are modes of the individual jīva, entirely distinct from Viṣṇu who is beyond all states. The 'I knew nothing' report of deep sleep does not indicate brahman-experience — it indicates the jīva's temporary dissolution into a subtle state of consciousness maintained by Viṣṇu's sustaining presence."}},
{n:"Neti Neti — The Via Negativa",r:"BAU 3.9.26 / 4.2.4",d:"The self is 'not this, not this' — beyond all affirmative characterisation",
det:{skt:"नेति नेति — न ह्येतस्मादिति नेत्यन्यत्परम् अस्ति",tr:"'Not this, not this' — for there is nothing higher than this 'not this, not this.'",
c:"The famous neti neti (not this, not this) formula is Yājñavalkya's ultimate characterisation of brahman/ātman. Every positive characterisation ('brahman is consciousness,' 'brahman is bliss') points toward brahman but necessarily falls short — for brahman is not any of its attributes but the substratum of all of them. The only adequate characterisation is the via negativa: systematically negating every possible object or quality, until what remains cannot be negated — the pure witnessing awareness.",
shk:"Śaṅkara: neti neti is the method of adyāsa-apavāda — the systematic removal of superimposed attributes. Brahman is not form, not sound, not thought, not bliss (as an experience), not any of the 25 Sāṃkhya tattvas — for it is the witness of all these. What remains after all negations is not nothing but the pure, self-luminous awareness that was doing the negating. This is the famous anvaya-vyatireka method: whatever is present in all experiences (the awareness) and absent in no experience is the true self.",
rmj:"Rāmānuja's critique: neti neti does not mean that brahman/Īśvara has no attributes. It means that Īśvara transcends all limiting or defective attributes — all that is finite, dependent, or conditioned. Īśvara's infinite, perfect attributes (omniscience, omnipotence, infinite bliss, etc.) are not denied by neti neti — they are affirmed. Neti neti denies finitude, not the infinite positive reality of Īśvara.",
mdv:"Madhva: neti neti points to Viṣṇu's transcendence of all creaturely categories. Viṣṇu cannot be grasped by negation alone — he is supremely positive reality (abhaya, ananda, jñāna, śakti). The negations clear away inadequate conceptions; what remains is not formless contentlessness but the supreme Person, Viṣṇu."}}
]},
{name:"Chāndogya Upaniṣad",ref:"Sāmaveda · 8 adhyāyas",color:C.teal,children:[
{n:"Udgītha Meditation — Oṃkāra",r:"ChU 1.1",d:"Oṃ is the udgītha; meditate on oṃ as the entire world",
det:{skt:"ॐ इत्येतदक्षरमुद्गीथमुपासीत। ओमिति ह्युद्गायति। तस्योपव्याख्यानम्।",tr:"One should meditate on the syllable Oṃ as the udgītha. For one sings beginning with Oṃ. This is the explanation of it.",
c:"The Chāndogya opens with the meditation on Oṃ as the udgītha — the first and most important syllable of Sāmavedic chanting. Oṃ is identified with the essence (rasa) of all beings: earth → water → plant → person → speech → Oṃ. Oṃ is the prāṇa of prāṇas — the breath of all breath — the life of all life.",
shk:"Śaṅkara: Oṃ is the name of brahman — but specifically as a meditation support (upāsanā-ālaṃbana). The meditator who contemplates Oṃ gradually dissolves the name-form distinctions into the nameless, formless brahman that Oṃ points to. The three syllables A-U-M correspond to waking, dream, and deep sleep; their combination and cessation points to turīya.",
rmj:"Rāmānuja: Oṃ is the primary name of Īśvara. Meditating on Oṃ is meditating on Īśvara in his most direct verbal form. The udgītha meditation is a form of nāmajapa — chanting the divine name — which purifies the antaḥkaraṇa (inner instrument) for bhakti.",
mdv:"Madhva: Oṃ directly means Viṣṇu — it is Viṣṇu's primary name, not a generic name of brahman. The 'a' in Oṃ is the ācārya who leads (Viṣṇu as teacher); the 'u' is the devotee; the 'm' is the world sustained by Viṣṇu. The meditation on Oṃ is an act of direct worship of Viṣṇu."}},
{n:"Ṣaṭpañcāśat Vidyās — Aśvapati's Teaching on Vaiśvānara",r:"ChU 5.11–5.24",d:"The five fires — Vaiśvānara is the self, the cosmic fire, the entire person",
det:{skt:"स य एवमेतद्वैश्वानरमात्मानं वेद — सर्वेष्वंगेषु अन्नमत्ति",tr:"He who knows this Vaiśvānara self thus — eats food in all his limbs.",
c:"Five great householders go to Uddālaka Āruṇi seeking knowledge of the self. He sends them to King Aśvapati Kaikeyī, who teaches the Vaiśvānara (cosmic fire/self) meditation: the cosmic fire is identified with the individual's body — its head is the heavenly realm, its eye is the sun, its breath is air, its body is space, its bladder is water, its feet are the earth. This totality is the Vaiśvānara ātman — the self as the entire cosmos.",
shk:"Śaṅkara: the Vaiśvānara teaching is a saguna upāsanā (meditation on brahman with attributes) — it does not teach the ultimate truth (brahman as pure consciousness without form) but prepares the mind for it. The student who perfects this meditation transcends it and arrives at the direct knowledge of nirguna brahman.",
rmj:"Rāmānuja: the Vaiśvānara is Īśvara in his aspect as the cosmic inner self of all the elements and all individuals. The meditation is an accurate cognition of the truth — Īśvara is genuinely the 'self' of all beings in the sense that he is their inner controller (antaryāmin) and the ground of their existence. This is not a pedagogical fiction but a direct teaching of Viśiṣṭādvaita.",
mdv:"Madhva: Vaiśvānara is one aspect or manifestation of Viṣṇu — the cosmic fire-form in which Viṣṇu pervades and sustains the material world. The meditation on Vaiśvānara is a form of Viṣṇu worship, not a philosophical speculation."}},
{n:"Mahāvākya — Tat Tvam Asi",r:"ChU 6.8.7",d:"The great saying: That (brahman) you are (Śvetaketu)",
det:{skt:"तत् त्वम् असि श्वेतकेतो",tr:"That you are, Śvetaketu.",
c:"The most celebrated mahāvākya (great saying) of the Upaniṣads. Uddālaka instructs his son Śvetaketu through a series of nine illustrations, each concluding with 'tat tvam asi' — 'That (the subtle essence that is the self of all) you are.' The nine illustrations: (1) The invisible self of the nyagrodha tree seed that produces the great tree. (2) Salt dissolved in water, present everywhere but invisible. (3) A man blindfolded and led away from home — untying the blindfold at each direction brings him home. (4) The dying man — what departs at death and what remains. (5) The convergence of rivers in the ocean. Etc.",
shk:"Śaṅkara: 'tat tvam asi' is the most direct expression of the non-dual truth (advaita). 'Tat' (that) refers to brahman — pure existence-consciousness-bliss (sat-cit-ānanda) — as it is in itself (without any upādhi — limiting adjunct). 'Tvam' (you) refers to the jīva (individual self) — as it is in itself, stripped of the limiting adjunct of the body-mind complex. When both are understood in their essential nature (not their appearances), they are identical — not similar, not related, but literally the same. The apparent difference is due to adhyāsa (superimposition) of the upādhis (limiting conditions) on the two sides of the equation.",
rmj:"Rāmānuja's major critique of Śaṅkara's reading: the identity in 'tat tvam asi' is not absolute numerical identity but qualified identity — the jīva and brahman are identical in the sense that the jīva is brahman's mode (prakāra), brahman's body (śarīra). The jīva is real and distinct (not illusory), but it depends entirely on brahman and cannot be understood apart from brahman — just as a body cannot be understood apart from its soul. 'That you are' means 'you are a real mode of That' — not 'you are That in the same undifferentiated sense.'",
mdv:"Madhva: 'tat tvam asi' does not assert identity of the jīva and brahman/Viṣṇu — this would contradict the fundamental distinction between the independent Viṣṇu and the dependent jīva. Madhva reads the sentence as: 'You are that (jīva that depends on Viṣṇu)' — an assertion of the jīva's dependent nature and Viṣṇu's independent reality. The sentence teaches subordination, not identity."}},
{n:"Sanatkumāra-Nārada Dialogue — Bhūman (the Infinite)",r:"ChU 7.23–7.25",d:"The bhūman — the infinite — is the only genuine happiness; the finite is sorrow",
det:{skt:"यो वै भूमा तत्सुखम् — नाल्पे सुखमस्ति — भूमैव सुखम्",tr:"The bhūman (Infinite) is happiness. In the finite there is no happiness. Only the Infinite is happiness.",
c:"Sanatkumāra leads Nārada through a hierarchy of meditations — from name (nāma) up through speech, mind, will, thought, contemplation, understanding, strength, food, water, fire, space, memory, hope, prāṇa — each identified as 'greater than the previous.' The culmination: the bhūman (Infinite, the uncountable, the boundless) — which sees nothing other than itself, hears nothing other than itself, knows nothing other than itself. This is brahman. The finite always needs an other — 'I am greater than this, I am less than that' — and this needing is sorrow. The Infinite needs no other and is therefore purely happy.",
shk:"Śaṅkara: the bhūman is the supreme brahman — nirguna, non-dual, self-luminous. The hierarchy of meditations (name, speech, mind, etc.) is a progressive purification of the concept of brahman, removing each successive identification until the pure infinite is reached. The phrase 'sees nothing other than itself' is Advaita's definition of liberation: the jñānī who has realised brahman no longer perceives duality — they 'see' brahman everywhere as the only reality.",
rmj:"Rāmānuja: the bhūman is Īśvara — infinitely real, infinitely blissful, infinitely self-sufficient. But Īśvara 'seeing nothing other than himself' does not mean that the world is unreal — it means that Īśvara sees the entire world as his own body (ātmabhāvena — as modes of himself). The devotee who realises Īśvara as the bhūman sees the entire world as Īśvara's body and Īśvara as the inner self of all.",
mdv:"Madhva: the bhūman is Viṣṇu in his supreme blissful nature. The teaching is that genuine, unlimited happiness exists only in Viṣṇu — all finite happiness is borrowed from him and returns to him. Liberation is the direct experience of Viṣṇu's infinite bliss — not a contentless void but the plenitude of devotional experience in Vaikuṇṭha."}},
{n:"Āruṇi's Teaching — Self as the Subtle Essence",r:"ChU 6.1–6.16",d:"All of this (the manifest world) is that subtle essence; that Self is this entire world; that you are, Śvetaketu",
det:{skt:"एतत्सर्वं ब्रह्म — अयमात्मा ब्रह्म — तत्त्वमसि",tr:"All this is brahman — this self is brahman — that you are.",
c:"Uddālaka Āruṇi's teaching to his son Śvetaketu begins with an observation: 'Before creation, all this was One Existence (sat) alone, without a second.' From that One Existence, the universe emerged — first heat (tejas), then water (āpas), then food/earth. Uddālaka then works through the subtle essence (the invisible reality underlying all manifest forms) — comparing it to salt dissolved in water, imperceptible yet real. The teaching culminates in the nine-fold 'tat tvam asi.'",
shk:"Śaṅkara: 'All this is brahman' (sarvam khalv idaṃ brahma — Chāndogya 3.14.1, cited here) is the positive form of the mahāvākya. The universe is not illusion in the sense of non-existence — it is brahman appearing through the medium of name-and-form (nāmarūpa). The salt-water analogy is perfect: the salt (brahman) is everywhere in the water (the universe) though imperceptible through ordinary means. Viveka (discrimination) tastes brahman in everything.",
rmj:"Rāmānuja: the 'One Existence without a second' does not mean that only one undifferentiated entity exists — it means that before creation, Īśvara existed alone, with the world and the jīvas in a potential (kāraṇāvasthā) state within him. 'Without a second' means without anything independent of Īśvara. The universe that emerges is a real transformation (pariṇāma) of brahman's śakti (power) — not an appearance (vivarta) of brahman as Advaita holds.",
mdv:"Madhva: 'One Existence' refers to Viṣṇu before creation — but the jīvas and the material world were always distinct from him, just in an unmanifest state. 'Without a second (independent reality)' means that nothing exists independently of Viṣṇu — not that nothing else exists at all. Madhva's distinction: Viṣṇu is svātantra (independent); everything else is paratantra (dependent). This is the fundamental Dvaita distinction."}}
]},
{name:"Taittirīya Upaniṣad",ref:"Kṛṣṇa Yajurveda · 3 valli",color:C.blue,children:[
{n:"Pañcakośa — Five Sheaths of the Self",r:"TaittU 2.1–2.9",d:"The self is enveloped in five sheaths: food, breath, mind, understanding, bliss",
det:{skt:"अन्नमयो मनोमयः प्राणमयः विज्ञानमयः आनन्दमयः",tr:"The self made of food, the self made of breath, the self made of mind, the self made of understanding, the self made of bliss.",
c:"The Taittirīya introduces the pañcakośa (five sheath) model — one of Vedānta's most influential frameworks: (1) <em>Annamaya kośa</em> (food sheath): the gross physical body, nourished by food. (2) <em>Prāṇamaya kośa</em> (breath sheath): the vital force animating the physical body. (3) <em>Manomaya kośa</em> (mental sheath): the emotional-perceptual mind. (4) <em>Vijñānamaya kośa</em> (intelligence sheath): the discriminating intellect. (5) <em>Ānandamaya kośa</em> (bliss sheath): the causal body in deep sleep — the innermost sheath, closest to the true self. The true self (ātman/brahman) is none of these sheaths but the witness of all five.",
shk:"Śaṅkara: the pañcakośa model is a tool of neti neti — it gives a precise method for the meditator to progressively disidentify from each sheath. 'I am not the food-body, not the breath-body, not the mind, not the intellect, not even the bliss of deep sleep' — what remains after all five negations is the pure, self-luminous ātman. The ānandamaya kośa is often confused with brahman (especially in Advaita-critical interpretations) because it is described as 'full of bliss' — Śaṅkara explicitly argues it is still a kośa (a sheath), not the ultimate self.",
rmj:"Rāmānuja: the five kośas are real aspects of the jīva (individual self), not illusions. The jīva is a conscious self distinct from brahman but entirely dependent on brahman. The ānandamaya kośa corresponds to the jīva's deepest nature — its participation in the bliss of brahman. The five kośas thus describe the jīva's embodied condition, moving from gross to subtle, pointing toward its innermost, spiritual nature.",
mdv:"Madhva: the five kośas are real layers of the jīva's embodied existence. The true self (jīva-ātman) is distinct from all five kośas but also distinct from the paramātman (Viṣṇu). Liberation is the jīva-ātman resting in its own nature of pure bliss — which is not Viṣṇu's bliss (which is infinite) but the jīva's own finite but pure bliss, freed from its covering by the five kośas."}},
{n:"Brahmananda Valli — Ānanda as Brahman",r:"TaittU 2.8",d:"From the bliss of food to the bliss of brahman — the hierarchy of bliss",
det:{skt:"ब्रह्मविद् आप्नोति परम् — यो वेद निहितं गुहायाम् — सत्यं ज्ञानमनन्तं ब्रह्म",tr:"The knower of brahman attains the highest. Brahman is truth, knowledge, infinite — hidden in the cave (of the heart).",
c:"The Taittirīya's definition of brahman: <em>satyaṃ jñānam anantaṃ brahma</em> — brahman is truth (satya — what is real without qualification), knowledge (jñāna — pure consciousness, not a cognitive act), and infinite (ananta — unlimited in all dimensions). This is one of the most philosophically precise definitions in the Upaniṣads. The text then describes brahman as hidden in the cave of the heart (guhā) — both the heart-space (dahara) and the metaphorical cave of the human spirit.",
shk:"Śaṅkara: 'satyaṃ jñānam anantaṃ brahma' is a tatpuruṣa compound analysis: these three terms are not three separate qualities of brahman (brahman is not 'truthful,' 'knowledgeable,' and 'unlimited' the way a person might be) — they are three indicators that collectively point to brahman's unique nature: it is what is real, it is what is knowing, it is what is unlimited. None of the three is a relational attribute; each is an identification. Brahman = reality = consciousness = infinity.",
rmj:"Rāmānuja: the three terms are real attributes (dharmabūtajñāna attributes) of Īśvara: Īśvara is genuinely truthful (never false), genuinely knowing (omniscient), and genuinely infinite (unbounded). These attributes are intrinsic to Īśvara's nature — they are not superimposed from outside. Rāmānuja insists that Śaṅkara's reading (three terms as bare identifications rather than attributes) dissolves the distinction between subject and predicate and makes the sentence uninformative.",
mdv:"Madhva: the three terms are positive attributes of Viṣṇu — his svarūpalakṣaṇas (essential characteristics). Viṣṇu is supremely real (the only truly independent reality), supremely knowing (omniscient), and infinite (unlimited in all respects). The 'cave of the heart' is Viṣṇu's dwelling in the devotee's heart — a real, devotional, intimate presence."}}
]},
{name:"Aitareya Upaniṣad",ref:"Ṛgveda · 3 adhyāyas",color:C.purple,children:[
{n:"Mahāvākya — Prajñānam Brahma",r:"AitU 3.3",d:"Consciousness is brahman — prajñāna is the one self of all",
det:{skt:"प्रज्ञानं ब्रह्म",tr:"Consciousness (prajñāna) is brahman.",
c:"The Aitareya's mahāvākya is the most epistemological of the four: 'Prajñānam brahma' — brahman is pure consciousness/intelligence (prajñāna). The context: after identifying the self with all the cosmic functions (breathing, speaking, seeing, hearing, thinking, understanding), the Upaniṣad asks 'What is that in which all of these depend? What is that one self?' Answer: prajñāna — the single intelligence that is the self of all divine and human functions. Then: 'Prajñānam brahma.'",
shk:"Śaṅkara: prajñāna here means pure, objectless, self-luminous consciousness — not the act of cognising any particular object. It is brahman in its aspect as cit (consciousness). The mahāvākya asserts that consciousness is not an attribute of brahman (the way redness is an attribute of a rose) but that brahman simply is consciousness. This is the foundation of Advaita's cit-svarūpa doctrine: consciousness is self-illuminating, self-referential, and self-certifying — it does not require an external illuminator.",
rmj:"Rāmānuja: prajñāna is an essential attribute of Īśvara — Īśvara is consciousness in the sense of being omniscient. The mahāvākya asserts that brahman/Īśvara is ultimately characterised by supreme consciousness — not that consciousness and brahman are numerically identical (as in Advaita) but that consciousness is brahman's most fundamental characteristic. The jīva also has prajñāna — but the jīva's prajñāna is finite and contracted by the body-mind complex.",
mdv:"Madhva: prajñāna is an intrinsic attribute of Viṣṇu — his jñāna-svarūpa (his essential nature as knowledge). 'Prajñānam brahma' asserts that brahman's nature is characterised supremely by knowledge — not that brahman is nothing but knowledge. Viṣṇu is also sat (being) and ānanda (bliss) — the three together constitute his svarūpalakṣaṇa."}}
]},
{name:"Muṇḍaka, Māṇḍūkya, Praśna",ref:"Atharvaveda tradition",color:C.green,children:[
{n:"Māṇḍūkya Upaniṣad — Four States and AUM",r:"MāṇḍU 1–12",d:"The twelve-verse Upaniṣad: waking, dream, deep sleep, and turīya as the four quarters of Oṃ",
det:{skt:"ॐ इत्येतदक्षरमिदं सर्वम् — जागरितस्थानो बहिष्प्रज्ञः — स्वप्नस्थानः — सुषुप्तस्थानः — नान्तःप्रज्ञं नान्तःप्रज्ञं नोभयतःप्रज्ञम्...",
tr:"Oṃ — this syllable is all this. The waking state — externally conscious. The dream state. The deep sleep state. (The fourth is) not inward-conscious, not outward-conscious, not both-conscious...",
c:"The Māṇḍūkya, the shortest of the principal Upaniṣads (12 verses), is considered by Gauḍapāda (Śaṅkara's paramaguru) and by Śaṅkara himself to be the most concentrated expression of the Advaita teaching. The four states (avasthās): (1) Viśva (waking) = A of AUM; (2) Taijasa (dream) = U of AUM; (3) Prājña (deep sleep) = M of AUM; (4) Turīya (the fourth) = the silence after AUM — not a fourth state but the ground of the other three, pure awareness. The 12th verse: 'Turīya is not inward-conscious, not outward-conscious, not both... not a cognitive mass, not conscious, not unconscious — unseen, unrelated, ungraspable, without inference, unthinkable, indescribable, the essence of the one-self-knowing, the cessation of the world, the peaceful, the auspicious, the non-dual — that is what is thought of as the fourth.'",
shk:"Śaṅkara's commentary on the Māṇḍūkya (together with Gauḍapāda's Kārikā) is the foundational Advaita text. Turīya is not a state one enters but the self in its own nature — the ever-present witness that has no analogue to the three states (which come and go) because it never comes or goes. The 'cessation of the world' (prapañcopaiśama) in turīya does not mean the world physically disappears but that its apparent independence from consciousness is recognised as false.",
rmj:"Rāmānuja: the Māṇḍūkya's turīya refers to Īśvara as the ground of the three states — the antaryāmin within the waking, dreaming, and sleeping jīva. The three states are real states of the real jīva; turīya is Īśvara's permanent, underlying presence within all three. Gauḍapāda's conclusion (in the Kārikā) that the world is like a dream is rejected by Rāmānuja: a dream is distinguished from waking by its being contradicted on waking; the waking world is never contradicted — therefore it is real.",
mdv:"Madhva: turīya refers to Viṣṇu's permanent presence as the witness and sustainer of the three states of the jīva. The four states are four modes of the dependent jīva; Viṣṇu is beyond all states, eternally self-sufficient. The equation of turīya with the cessation of all duality is rejected by Madhva: the distinction between jīva and Viṣṇu is real and eternal."}},
{n:"Muṇḍaka Upaniṣad — Higher and Lower Knowledge",r:"MuṇḍU 1.1.4–1.1.5",d:"Lower knowledge is the Vedas and their auxiliaries; higher knowledge is that by which the imperishable is known",
det:{skt:"परा चैवापरा च — अपरा ऋग्वेदो यजुर्वेदः... परा तु यया तदक्षरमधिगम्यते",
tr:"Two kinds of knowledge are to be known — the lower and the higher. The lower is the Ṛgveda, Yajurveda, Sāmaveda, Atharvaveda (and the six auxiliaries). The higher is that by which the imperishable (akṣara) is known.",
c:"The Muṇḍaka's two-knowledge distinction is foundational for Vedānta's understanding of the Vedas and their purpose. The lower knowledge (aparā vidyā) comprises the entire Vedic ritual and social system — the four Vedas, the six vedāṅgas (grammar, phonetics, metre, etc.), and all the sciences. This knowledge produces finite results within saṃsāra. The higher knowledge (parā vidyā) is brahman-knowledge — the direct, non-conceptual recognition of the imperishable (akṣara = brahman/ātman). From it the entire universe is known 'as a spider knows its web from within,' since brahman is the inner cause of all.",
shk:"Śaṅkara: the distinction is between saguna-upāsanā (meditation on brahman with attributes — producing finite, heavenly results) and nirguna-jñāna (non-dual knowledge of brahman — producing liberation). The lower knowledge is not invalid — it serves its own purposes — but it does not produce liberation. This is Śaṅkara's basis for subordinating the Karmakāṇḍa (ritual portion of the Vedas) to the Jñānakāṇḍa (knowledge portion = Upaniṣads).",
rmj:"Rāmānuja: the two knowledges are not of different ontological levels (real vs illusory) but of different cognitive contents. The lower knowledge concerns worldly and ritual matters; the higher concerns the ultimate nature of Īśvara and the jīva's relation to him. Both are necessary — ritual knowledge (dharma) is the foundation on which brahman-knowledge is built. Rāmānuja rejects Śaṅkara's claim that brahman-knowledge and karma (ritual) are incompatible.",
mdv:"Madhva: the two knowledges correspond to knowledge of the manifested world (vikāra) and knowledge of Viṣṇu (the immutable reality). The lower knowledge is valid and necessary for the devoted life; the higher knowledge is the direct experience of Viṣṇu — possible only through Viṣṇu's grace and not achievable by any mere intellectual effort."}}
]}
]},

{tab:"Kena, Kaṭha, Īśā, Śveta",title:"Kena, Kaṭha, Īśā, and Śvetāśvatara Upaniṣads",sub:"Middle Upaniṣads — the paradox of knowing brahman, Yama's teaching on the self, the first verse of the Upaniṣads, and theistic Vedānta",
legend:[{c:C.amber,t:"Śaṅkara·Advaita"},{c:C.teal,t:"Rāmānuja·Viśiṣṭādvaita"},{c:C.blue,t:"Madhva·Dvaita"},{c:C.purple,t:"Core Teaching"}],
branches:[
{name:"Kena Upaniṣad",ref:"Sāmaveda · 4 adhyāyas",color:C.amber,children:[
{n:"By whom is the mind directed? — The paradox of brahman-knowledge",r:"KenaU 1.1–2.4",d:"That which is not thought by the mind but by which, they say, the mind thinks — know that alone as brahman",
det:{skt:"यन्मनसा न मनुते येनाहुर्मनो मतम् — तदेव ब्रह्म त्वं विद्धि",
tr:"That which is not thought by the mind, but by which, they say, the mind thinks — know that alone as brahman.",
c:"The Kena's opening question is the most paradoxical in all the Upaniṣads: 'By whom willed does the mind fall upon its objects? By whom directed does the first breath arise? By whom willed do men utter speech?' Each answer names something finer than the previous, until the text arrives at brahman — which is not grasped by the eye, not known by the mind, not attained by speech, but which is precisely that by which seeing, knowing, and speaking are possible. This is the 'unknown knower' paradox: brahman cannot be an object of knowledge because it is the ground of all knowing.",
shk:"Śaṅkara: 'yad manasā na manute' (not thought by the mind) does not mean that brahman is unknown — it means that brahman cannot be an object (viṣaya) of the mind the way any other known thing is an object. Brahman is the self (sva-svarūpa) of the knowing mind — the seer cannot be seen, the knower cannot be known, except as itself. The method: kena-jijñāsā — asking 'by whom?' recursively, until arriving at the one that asks without being able to be asked about.",
rmj:"Rāmānuja: brahman/Īśvara is indeed not grasped by the ordinary mind — not because Īśvara lacks qualities or is purely formless, but because Īśvara's infinite qualities transcend the finite mind's capacity. Devotional experience (bhakti prapatti) provides a mode of knowing Īśvara that transcends ordinary cognition without eliminating the distinction between the knower and the known.",
mdv:"Madhva: Viṣṇu is not grasped by the ordinary mind — only by the mind purified through devotion and by Viṣṇu's own grace (prasāda). The paradox of the Kena points to Viṣṇu's transcendence of all ordinary epistemic categories while remaining concretely knowable through bhakti."}},
{n:"Yakṣa Story — Brahman's power defeats the gods",r:"KenaU 3–4",d:"The gods are humbled when they cannot identify the brahman-yakṣa; Uma reveals: it is brahman",
det:{skt:"उमा हैमवती — तद्ब्रह्मेति होवाच — ब्रह्मणो वा एतद्विजये महीयध्वम्",
tr:"Umā Haimavatī said: 'That is brahman — in brahman's victory you were celebrating.'",
c:"After a cosmic victory, the gods (Agni, Vāyu, Indra) feel pride — they attribute the victory to themselves. A yakṣa (mysterious being) appears, which none of the gods can identify. Agni tries to burn a blade of grass placed before it — cannot. Vāyu tries to blow it away — cannot. Indra approaches — the yakṣa vanishes. Uma (the goddess, identified with brahman-śakti or with brahma-vidyā) appears and reveals: the mysterious power was brahman — the gods' victory was brahman's victory, not theirs.",
shk:"Śaṅkara: the story illustrates the paradox of the previous section: brahman cannot be grasped or demonstrated by any finite power (fire, wind, even the chief of the gods). Yet when the gods abandon their pride and seek knowledge, brahman is revealed — through Uma (identified with the tradition of brahman-knowledge itself). Liberation requires the dissolution of the pride that appropriates brahman's power as one's own.",
rmj:"Rāmānuja: Uma is the divine śakti of Īśvara — Lakṣmī, the consort and inseparable power of Viṣṇu. The story teaches that knowledge of Īśvara comes through Īśvara's śakti (grace mediated by Lakṣmī), not through the gods' own power. This is Rāmānuja's basis for prapatti (surrender to Lakṣmī-Nārāyaṇa as the means to liberation).",
mdv:"Madhva: Uma is Lakṣmī — Viṣṇu's śakti and the mediator of brahman-knowledge. The story teaches that even the great gods (Agni, Vāyu, Indra) are entirely dependent on Viṣṇu's power. The victory belongs to Viṣṇu (brahman), not to the gods — a foundational statement of Dvaita's hierarchy of realities."}}
]},
{name:"Kaṭha Upaniṣad",ref:"Kṛṣṇa Yajurveda · 2 adhyāyas",color:C.teal,children:[
{n:"Nachiketas and Yama — The Teaching on the Self",r:"KaṭhU 1.2.18–1.2.25",d:"The self is not born, does not die; it was not, will not be; it is unborn, eternal, ancient, not killed when the body is killed",
det:{skt:"न जायते म्रियते वा विपश्चित् — नायं हन्ति न हन्यते",
tr:"The wise self is not born, nor does it die. It is not that it will be or was. It is unborn, eternal, ancient — it is not killed when the body is killed.",
c:"Nachiketas chooses the third boon from Yama (the god of death): the knowledge of what happens after death. Yama first offers wealth, pleasure, and power — all refused. Then Yama teaches: the self (ātman) is neither born nor dies; it is eternal, unchanging, ancient. It does not kill and is not killed. Smaller than the smallest, greater than the greatest, it is hidden in the heart — known by the grace of the creator (not by mere effort or ritual). Only the self can know the self.",
shk:"Śaṅkara: this passage is the definitive Upaniṣadic statement of the ātman's absolute transcendence of birth and death. The 'wise self' (kavir maniṣī paribhūḥ svayambhūḥ) — the knowing, all-pervading, self-existent — is brahman itself. Liberation = direct knowledge of this teaching as one's own nature (sāhanta-pratyaya — the immediate sense 'I am this eternal reality').",
rmj:"Rāmānuja: the ātman described is the individual jīva, which is indeed eternal and unborn — it does not die with the body but continues. However, the jīva is not identical with brahman/Īśvara — it is a mode of Īśvara, eternally dependent on him. The jīva's eternity is derived from Īśvara, not inherent in isolation.",
mdv:"Madhva: the ātman is the individual jīva — eternal, distinct from the body, distinct from Viṣṇu. The jīva's eternality is Viṣṇu's gift — the jīva exists by Viṣṇu's constant sustaining act. The passage describes the jīva's dignity and eternal nature, not its identity with Viṣṇu."}},
{n:"Mahāvākya Context — Aṅguṣṭha-Mātra Puruṣa",r:"KaṭhU 2.1.12",d:"The self is the size of a thumb — the inner self in the heart of all beings",
det:{skt:"अङ्गुष्ठमात्रः पुरुषो मध्य आत्मनि तिष्ठति",tr:"A person the size of a thumb stands in the middle of the self.",
c:"The famous 'thumb-sized person' (aṅguṣṭha-mātra puruṣa) located in the heart is one of the Upaniṣads' most discussed images. It seems to describe the ātman as located in the heart and of a specific size — apparently contradicting the other descriptions of ātman as all-pervading and formless. Various reconciliations: the 'size of a thumb' refers to the heart-space (dahara ākāśa); the 'person' in the heart is the reflected consciousness (chidābhāsa) not the absolute ātman; the description is for meditation purposes (upāsanā), not an ontological statement.",
shk:"Śaṅkara: the thumb-sized person is a meditation support (pratīkopāsanā) — a way of focusing the mind on the ātman's presence in the heart. The true ātman is neither small nor large, neither located nor unlocated — all spatial qualifications are superimposed. The meditation on the heart-point is valuable as a preliminary practice that concentrates the mind before the final recognition of ātman as spaceless, sizeless awareness.",
rmj:"Rāmānuja: the thumb-sized person is Īśvara dwelling in the individual's heart — a real, personal presence of the infinite God within the finite jīva. This is the antaryāmin teaching: Īśvara, the inner controller, dwells in the heart of every being and is the true 'person' there. The jīva's heart is Īśvara's dwelling place — a deeply intimate relationship that is the foundation of bhakti.",
mdv:"Madhva: the thumb-sized person is Viṣṇu (or his form Aniruddha) dwelling in the heart of every jīva as the inner controller. The jīva-body is Viṣṇu's dwelling; Viṣṇu does not become small — his form appears thumb-sized relative to the heart-space while remaining infinite in his own nature."}}
]},
{name:"Īśā Upaniṣad",ref:"Śukla Yajurveda · 18 verses",color:C.blue,children:[
{n:"Īśāvāsyam Idaṃ Sarvam — The First Verse",r:"ĪśāU 1",d:"All this — whatever moves in this moving world — is clothed (enveloped) by the Lord",
det:{skt:"ईशावास्यमिदं सर्वं यत्किञ्च जगत्यां जगत् — तेन त्यक्तेन भुञ्जीथाः",
tr:"All this — whatever moves in this moving world — is enveloped by the Lord. Enjoy by renouncing; do not covet anyone's wealth.",
c:"The Īśā Upaniṣad opens with one of the most concentrated statements in Indian spiritual literature: the entire moving world (jagat) is pervaded (enveloped, clothed) by the Lord (Īśā). Therefore the proper attitude toward the world is <em>tena tyaktena bhuñjīthāḥ</em> — 'enjoy by renouncing' — taking what is given without grasping, using the world without appropriating it. The second line adds: 'do not covet anyone's wealth.' The double implication: the world belongs to the Lord, not to us; and the one who knows this lives in the world fully but without ownership.",
shk:"Śaṅkara: 'Īśā' (the Lord) refers to the supreme brahman as it appears when considered as the ruler/controller of the world. 'Enveloped by the Lord' means that brahman is the substratum of all — the world is brahman plus nāmarūpa (name-and-form superimposition). The verse is for the person who still perceives the world as real — they are to engage with it as brahman's domain, not as their own. For the jñānī who has realised brahman directly, the question of 'possessing' or 'renouncing' the world no longer arises.",
rmj:"Rāmānuja: 'Īśā' is Īśvara — the personal God, Viṣṇu — who pervades (vāsayati) the entire world because the world is his body. The verse teaches the proper devotional attitude: recognising that all belongs to Īśvara, the devotee accepts what is given as Īśvara's prasāda (grace-gift) and does not covet what belongs to others. This is the foundation of Rāmānuja's ethics of prasādabhojanam (eating what is given as grace).",
mdv:"Madhva: 'Īśā' is Viṣṇu — the supreme Lord who pervades the world and controls it from within. Everything in the world belongs to Viṣṇu; human beings are trustees (not owners) of the world's goods. The verse prescribes a life of dedicated service (sevā) — using the world's gifts in Viṣṇu's service, not hoarding them."}},
{n:"Avidyā and Vidyā — Both Must Be Known",r:"ĪśāU 9–11",d:"Those who worship avidyā enter blinding darkness; those who worship vidyā enter even greater darkness — both must be known together",
det:{skt:"अन्धं तमः प्रविशन्ति येऽविद्यामुपासते — ततो भूय इव ते तमो य उ विद्यायां रताः",
tr:"Those who worship avidyā enter blinding darkness — those who are devoted to vidyā enter even greater darkness.",
c:"One of the most paradoxical passages in the Upaniṣads, and the most debated: those who practise avidyā (usually rendered as ritual action, the karma-kāṇḍa) fall into one darkness; those who practise vidyā (usually rendered as meditation, upāsanā, or jñāna) fall into an even greater darkness. The key: both alone are insufficient. Only one who knows both avidyā AND vidyā and knows how they relate — crosses death through avidyā and attains immortality through vidyā.",
shk:"Śaṅkara: 'avidyā' here means karma (ritual action) — which is 'not-knowledge' in the sense of not being brahma-jñāna. 'Vidyā' means upāsanā (meditation on saguna brahman). Both alone are insufficient: karma alone leads only to rebirth in other realms (heavenly but not liberated); saguna upāsanā alone produces only a refined spiritual state without direct liberation. The combination: use karma to purify the mind; use upāsanā to cultivate the mind; then move to nirguna jñāna — liberation. However, Śaṅkara maintains that karma and jñāna cannot be practised simultaneously for the same purpose — they are ultimately sequential.",
rmj:"Rāmānuja: 'avidyā' means bhakti-devoid ritual action; 'vidyā' means upāsanā of Īśvara. The verse teaches the harmony of karma and jñāna-bhakti: ritual action (karma) performed as worship of Īśvara (integrated with bhakti) is not a mere path to heavenly birth but a path to Īśvara's proximity. The 'even greater darkness' of vidyā alone refers to dry philosophical knowledge divorced from devotional practice — which produces pride rather than liberation.",
mdv:"Madhva: 'avidyā' means ritual action not dedicated to Viṣṇu; 'vidyā' means philosophical knowledge about Viṣṇu without genuine bhakti. The verse condemns both as insufficient. What is required: both karma and jñāna fully integrated with bhakti-to-Viṣṇu. This is Madhva's complete path: jñāna-karma-bhakti as a triad."}}
]},
{name:"Śvetāśvatara Upaniṣad",ref:"Kṛṣṇa Yajurveda · 6 adhyāyas",color:C.green,children:[
{n:"Eko Devaḥ — One God in All Beings",r:"ŚvetU 6.11",d:"One God, hidden in all beings, all-pervading, the inner self of all, the witness",
det:{skt:"एको देवः सर्वभूतेषु गूढः — सर्वव्यापी सर्वभूतान्तरात्मा — कर्माध्यक्षः सर्वभूताधिवासः — साक्षी चेता केवलो निर्गुणश्च",
tr:"One God, hidden in all beings, all-pervading, the inner self of all beings, the overseer of all actions, the dweller in all beings, the witness, the conscious one, the absolute (kevala), and without qualities (nirguṇa).",
c:"The Śvetāśvatara Upaniṣad is the most theistic of the principal Upaniṣads and provides the foundational text for Śaiva Vedānta. The verse combines apparently contradictory attributes: nirguṇa (without qualities — the Advaita position) and yet the personal overseer of all actions, the witness, the conscious one (attributes that imply a qualified, personal God). This combination makes the Śvetāśvatara the primary battleground for the three Vedāntic schools.",
shk:"Śaṅkara: 'nirguṇa' is the primary characteristic — brahman has no guṇas (qualities) in the ontological sense of having accidental properties. The other descriptions (overseer, witness, conscious) are upādhi-relative (relative to the limiting adjuncts of individual beings). As the all-pervading substratum of all beings, brahman appears as their 'inner self' and 'overseer' — but these are phenomenal designations, not ultimate characterisations of nirguṇa brahman.",
rmj:"Rāmānuja: 'nirguṇa' means 'free from defects and limitations' (nirgata-heya-guṇa), not 'without positive qualities.' Īśvara is nirguṇa in the sense of being without any limiting, defective qualities — but he is infinitely qualified with positive attributes (omniscience, omnipotence, infinite bliss, etc.). The verse is a direct description of Īśvara's real nature as the antaryāmin-overseer of all beings.",
mdv:"Madhva: the verse is a direct description of Viṣṇu's nature and his relation to the world. 'Nirguṇa' means free from the guṇas of prakṛti (sattva, rajas, tamas) — not free from positive divine attributes. Viṣṇu's positive qualities (jñāna, bala, aiśvarya, śakti, vīrya, tejas) are infinite and eternal. The Śvetāśvatara is the Vedantic text most supportive of Madhva's theistic Dvaita."}},
{n:"Rudra Invocations — God as Creator, Preserver, Destroyer",r:"ŚvetU 3.1–3.8",d:"Thou art woman, thou art man; thou art youth and maiden; thou art the dark-blue bird, the green-eyed with red eyes",
det:{skt:"त्वं स्त्री त्वं पुमान् असि — त्वं कुमार उत वा कुमारी — त्वं नीलः पतङ्गो हरितो लोहिताक्षः",
tr:"You are woman, you are man; you are youth and maiden; you are the dark-blue butterfly, the green parrot with red eyes.",
c:"One of the most celebrated passages in the Śvetāśvatara: the entire variety of existence — all genders, ages, creatures, colours, forms — is identified as the manifestation of the one God (Rudra/Śiva in context, brahman in the Vedāntic reading). Every being is a face of the one divine reality. The specificity is striking: not abstract unity but the concrete multiplicity of a blue butterfly, a green parrot with red eyes, a season, a tree.",
shk:"Śaṅkara: the verse teaches the Upaniṣadic method of seeing brahman in all forms — not as a metaphor but as a real recognition. Since brahman is the one substance underlying all appearances, every appearance is, in essence, brahman. The diversity of forms is the play of māyā (creative power) on the one substratum.",
rmj:"Rāmānuja: the verse teaches that Īśvara pervades all beings as their inner self and takes all forms as his body. 'You are woman, you are man' means 'you are the inner self of all women and men.' The divine presence in all beings makes the world a sacred domain — every creature is, in Viśiṣṭādvaita terms, a 'body of Īśvara.'",
mdv:"Madhva: Viṣṇu pervades all beings as their inner controller (antaryāmin) — he is not identical with them but present within them, sustaining them at every moment. 'You are woman, you are man' means 'you dwell within woman and man as their sustaining self.' The diversity of beings is real; Viṣṇu's presence in all of them is also real."}}
]}
]},

{tab:"Sāmaveda Upaniṣads",title:"Sāmaveda Upaniṣads (Selected)",sub:"Kena, Chāndogya (covered above) + Kena variants and additional Sāmavedic texts",
legend:[{c:C.amber,t:"Śaṅkara"},{c:C.teal,t:"Rāmānuja"},{c:C.blue,t:"Madhva"},{c:C.purple,t:"Core Teaching"}],
branches:[
{name:"Jāminīya Upaniṣad Brāhmaṇa",ref:"Sāmaveda · Jaiminīya tradition",color:C.purple,children:[
{n:"The Breath as the Eternal — Prāṇa-Brahman Teaching",r:"JUB",d:"Prāṇa is brahman — through prāṇa all beings are connected to the cosmic self",
det:{c:"The Jāminīya Upaniṣad Brāhmaṇa is one of the oldest and most archaic Upaniṣadic texts. Its central teaching: prāṇa (the cosmic life-force) is brahman. All beings breathe; their breathing is an expression of the one cosmic prāṇa that pervades and sustains the entire universe. The transition from the Brāhmaṇa-level equation 'prāṇa = breath = life = sun = brahman' to the Upaniṣadic recognition of prāṇa as pure consciousness (cit-prāṇa) is visible within this text.",
shk:"Śaṅkara: the prāṇa-brahman identification is a saguna upāsanā — meditating on the cosmic breath as brahman prepares the mind for the recognition that brahman is also the witness of all breath — the pure consciousness that neither breathes nor is breathed.",
rmj:"Rāmānuja: the prāṇa of all beings is sustained by Īśvara's prāṇa — the cosmic life-force is Īśvara's expression within the world. Meditation on prāṇa-as-brahman is a meditation on Īśvara's pervading presence within all living things.",
mdv:"Madhva: prāṇa is a manifestation of Viṣṇu's śakti within the biological world. Meditating on prāṇa leads to the recognition of Viṣṇu as the source of all life-force."}}
]},
{name:"Mahānārāyaṇa Upaniṣad",ref:"Kṛṣṇa Yajurveda / Atharvaveda · Nārāyaṇa stotras",color:C.teal,children:[
{n:"Nārāyaṇa as Para-Brahman — The Supreme",r:"MahāNāU",d:"Nārāyaṇa is the highest brahman, the paramātman, the supreme goal",
det:{skt:"नारायण परो ब्रह्म — तत्त्वं नारायणः परः",tr:"Nārāyaṇa is the highest brahman — that reality is Nārāyaṇa, the supreme.",
c:"The Mahānārāyaṇa Upaniṣad is one of the most important texts for Vaiṣṇava Vedānta. It identifies Nārāyaṇa (Viṣṇu) explicitly as para-brahman — the highest reality — and as the creator, sustainer, and destroyer of the universe. It contains the famous Puruṣa Sūkta (from the Ṛgveda) and elaborates the cosmic body of Nārāyaṇa. The Śrī Sūkta (hymn to Lakṣmī) is often attached to this Upaniṣad.",
shk:"Śaṅkara: Nārāyaṇa is brahman in his personal, saguna form — a legitimate upāsanā object for those not yet ready for the nirguna brahman teaching. The Mahānārāyaṇa is primarily a ritual text with Vedāntic overlay; its philosophical weight is secondary to the direct mahāvākya-bearing Upaniṣads.",
rmj:"Rāmānuja: the Mahānārāyaṇa is a primary scriptural authority for Viśiṣṭādvaita. 'Nārāyaṇa is para-brahman' is not a saguna approximation but a direct ontological statement: Nārāyaṇa-Viṣṇu IS brahman — the personal, qualified, supremely blissful reality. Liberation is the jīva's eternal presence in Vaikuṇṭha in the proximity of Nārāyaṇa.",
mdv:"Madhva: the Mahānārāyaṇa is one of the definitive scriptural sources for Dvaita Vedānta. 'Nārāyaṇa is para-brahman' is taken at face value: Viṣṇu/Nārāyaṇa is the supreme independent reality, the creator and sustainer of all, and the goal of liberation. Madhva cites this Upaniṣad extensively in establishing Viṣṇu's supremacy over all other deities."}}
]}
]},
