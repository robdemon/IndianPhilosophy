<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samkhya Karika — Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inconsolata:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:            #FAF8F4;
  --bg-card:       #F4F1EB;
  --bg-panel:      #EDEAE2;
  --text-primary:  #1C1810;
  --text-secondary:#4A4235;
  --text-muted:    #8C7E6A;
  --border:        #D8D0C0;
  --border-light:  #E8E2D6;
  --gold:          #9A7B3C;
  --gold-light:    #C4A96B;
  --radius:        6px;
  --radius-lg:     10px;
  --font-body:     'EB Garamond', Georgia, serif;
  --font-display:  'Cormorant Garamond', Georgia, serif;
  --font-mono:     'Inconsolata', 'Courier New', monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:            #15120D;
    --bg-card:       #1E1A13;
    --bg-panel:      #252018;
    --text-primary:  #F0EBE0;
    --text-secondary:#BEB49E;
    --text-muted:    #7A6E58;
    --border:        #3A3328;
    --border-light:  #2E2820;
    --gold:          #C4A96B;
    --gold-light:    #9A7B3C;
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  padding: 0;
}

#app-shell {
  max-width: 800px;
  margin: 0 auto;
  padding: 32px 20px 80px;
}

/* ── Header ──────────────────────────────────────── */
.site-header {
  text-align: center;
  margin-bottom: 36px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}

.site-header .eyebrow {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 10px;
}

.site-header h1 {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 300;
  font-style: italic;
  color: var(--text-primary);
  line-height: 1.2;
  margin-bottom: 6px;
}

.site-header .subtitle {
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--text-muted);
  font-style: italic;
}

/* ── Legend ──────────────────────────────────────── */
.legend {
  display: flex;
  gap: 8px 16px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-muted);
  letter-spacing: 0.02em;
}

.legend span {
  display: flex;
  align-items: center;
  gap: 5px;
}

.legend .ld {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  opacity: 0.85;
}

/* ── Pada tab bar ────────────────────────────────── */
.section-bar {
  display: flex;
  gap: 3px;
  margin-bottom: 28px;
  background: var(--bg-card);
  padding: 4px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
}

.section-bar button {
  flex: 1;
  padding: 9px 6px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.04em;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: 7px;
  transition: all 0.18s ease;
  line-height: 1.3;
}

.section-bar button:hover {
  color: var(--text-secondary);
  background: var(--bg-panel);
}

.section-bar button.active {
  background: var(--bg);
  color: var(--text-primary);
  font-weight: 500;
  box-shadow: 0 1px 4px rgba(0,0,0,0.12);
}

/* ── Pada title ──────────────────────────────────── */
.pada-title {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 400;
  font-style: italic;
  color: var(--text-primary);
  margin-bottom: 3px;
}

.pada-sub {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-muted);
  letter-spacing: 0.05em;
  margin-bottom: 18px;
}

/* ── Intro card ──────────────────────────────────── */
.intro-card {
  padding: 14px 18px;
  margin-bottom: 22px;
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  font-size: 13.5px;
  line-height: 1.75;
  color: var(--text-secondary);
  border-left: 2px solid var(--gold);
  font-style: italic;
}

.intro-card strong {
  font-style: normal;
  font-weight: 600;
  color: var(--text-primary);
}

/* ── Tree ────────────────────────────────────────── */
.tree {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 24px;
}

/* ── Branch ──────────────────────────────────────── */
.branch {
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-light);
  overflow: hidden;
  transition: border-color 0.15s;
}

.branch:hover { border-color: var(--border); }

.branch-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  cursor: pointer;
  user-select: none;
  transition: background 0.12s;
  background: var(--bg-card);
}

.branch-head:hover { background: var(--bg-panel); }

.branch-head .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  opacity: 0.8;
}

.branch-head .label {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  flex: 1;
}

.branch-head .ref {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-muted);
  letter-spacing: 0.04em;
}

.branch-head .chev {
  font-size: 10px;
  color: var(--text-muted);
  transition: transform 0.2s ease;
  flex-shrink: 0;
}

.branch-head.open .chev { transform: rotate(90deg); }

.branch-body {
  display: none;
  padding: 8px 14px 14px 32px;
  background: var(--bg);
  border-top: 1px solid var(--border-light);
}

.branch-body.open { display: block; }

/* ── Sub-tree ────────────────────────────────────── */
.sub-tree {
  margin: 8px 0 4px;
  padding-left: 14px;
  border-left: 1.5px solid var(--border);
}

.sub-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin: 8px 0 4px;
}

/* ── Leaf ────────────────────────────────────────── */
.leaf {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 6px 8px 6px 4px;
  cursor: pointer;
  border-radius: var(--radius);
  transition: background 0.1s;
  margin: 1px 0;
}

.leaf:hover { background: var(--bg-card); }

.leaf .lf-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 7px;
  opacity: 0.55;
}

.leaf-content { flex: 1; min-width: 0; }

.leaf .lf-name {
  font-family: var(--font-body);
  font-style: italic;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text-primary);
}

.leaf .lf-ref {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-muted);
  margin-left: 6px;
}

.leaf .lf-desc {
  font-family: var(--font-body);
  font-size: 12.5px;
  color: var(--text-secondary);
  line-height: 1.55;
  margin-top: 2px;
}

.leaf .lf-expand {
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--text-muted);
  margin-top: 4px;
  letter-spacing: 0.02em;
  opacity: 0.7;
}

/* ── Detail panel ────────────────────────────────── */
.detail-panel {
  display: none;
  margin-top: 10px;
  padding: 14px 16px;
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  border-left: 2px solid var(--accent, var(--gold));
  font-size: 13px;
}

.detail-panel.open { display: block; }

.detail-section {
  margin-bottom: 12px;
}

.detail-section:last-child { margin-bottom: 0; }

.detail-label {
  font-family: var(--font-mono);
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
  margin-bottom: 5px;
  font-weight: 500;
}

.detail-text {
  font-family: var(--font-body);
  font-size: 13.5px;
  color: var(--text-secondary);
  line-height: 1.75;
}

.detail-text em {
  color: var(--text-primary);
  font-style: italic;
  font-weight: 500;
}

.commentaries-wrap {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.detail-commentary {
  padding: 10px 12px;
  background: var(--bg);
  border-radius: var(--radius);
  border: 1px solid var(--border-light);
}

.com-name {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 4px;
}

.com-text {
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.7;
  font-style: italic;
}

.com-text em {
  font-style: normal;
  font-weight: 500;
  color: var(--text-primary);
}

</style>
</head>
<body>
<div id="app-shell">
  <header class="site-header">
    <div class="eyebrow">Classical Indian Philosophy</div>
    <h1>Samkhya Karika — Map</h1>
    <div class="subtitle">Overview of Samkhya Philosophy</div>
  </header>
  <div id="app"></div>
</div>

<script>
const C={
  purple:'#7F77DD',
  teal:'#1D9E75',
  coral:'#D85A30',
  pink:'#D4537E',
  blue:'#378ADD',
  amber:'#EF9F27',
  green:'#639922',
  red:'#E24B4A',
  gray:'#888780'
};

const data=[
{pada:"Samkhya Karika",sub:"Sample · First 3 Verses",ref:"SK 1-3",
intro:"Īśvarakṛṣṇa's Sāṃkhyakārikā is the oldest surviving text of the Samkhya school. It outlines the dualistic philosophy of Puruṣa (consciousness) and Prakṛti (matter). This is a representative sample showing the structure.",
branches:[
{name:"Introduction & Purpose",ref:"SK 1-3",color:C.purple,children:[
{n:"Duḥkha-traya-abhighātāt",d:"From the torment of the threefold suffering...",r:"SK 1",
det:{
c:"Due to the torment of the threefold suffering (internal, external, and divine/celestial), an inquiry into the means of terminating it arises. If it is said that this inquiry is superfluous since visible means exist, we say no, because visible means are not absolute or final.",
ex:"Worldly remedies (medicine, wealth) cure suffering temporarily, but it always returns. Samkhya promises a final, irrevocable end to suffering through knowledge.",
v:"Vyāsa (Yoga Bhasya): Suffering is the starting point of all philosophy.",
vb:"Hariharananda Aranya: The threefold suffering is adhyatmika (bodily/mental), adhibhautika (from other beings), and adhidaivika (from planetary/supernatural forces)."
}},
{n:"Dṛṣṭavad ānuśravikaḥ",d:"The revealed (Vedic) means are like the visible ones...",r:"SK 2",
det:{
c:"The means revealed in the Vedas are like the visible means: they are linked with impurity, decay, and excess. A superior method is different from both: it is the discriminative knowledge of the Manifest (Vyakta), the Unmanifest (Avyakta), and the Knower (Jña/Puruṣa).",
ex:"Vedic rituals involve animal sacrifice (impurity) and yield temporary heavens (decay). Only pure philosophical discrimination provides eternal liberation."
}},
{n:"Mūlaprakṛtir avikṛtiḥ",d:"Root Prakṛti is not a modification...",r:"SK 3",
det:{
c:"Root Prakṛti (mūlaprakṛti) is not a product. The seven principles beginning with Mahat are both products and producers. The sixteen (senses, mind, elements) are only products. Puruṣa is neither a product nor a producer.",
ex:"This verse establishes the entire 25-principle ontology of Samkhya in one sweep."
}}
]}
]}
];

const colors=Object.values(C);


function safeHtml(s){
  if(!s) return '';
  // Allow <em> tags; the content is trusted internal data
  return s;
}

function renderDetail(d, color, leafId){
  if(!d) return '';
  let h = `<div class="detail-panel" id="d${leafId}" style="--accent:${color}">`;
  if(d.c){
    h += `<div class="detail-section">
      <div class="detail-label">Concept &amp; Meaning</div>
      <div class="detail-text">${safeHtml(d.c)}</div>
    </div>`;
  }
  if(d.ex){
    h += `<div class="detail-section">
      <div class="detail-label">Example &amp; Application</div>
      <div class="detail-text">${safeHtml(d.ex)}</div>
    </div>`;
  }
  const coms = [
    {key:'v',  name:'Vyāsa · Yoga Bhāṣya'},
    {key:'s',  name:'Śaṅkara · Vivaraṇa'},
    {key:'vm', name:'Vācaspati Miśra · Tattva-Vaiśāradī'},
    {key:'vb', name:'Vijñāna-Bhikṣu · Yoga-Vārttika'},
    {key:'bg', name:'Bhoja · Rāja-Mārtaṇḍa'}
  ];
  const present = coms.filter(c => d[c.key]);
  if(present.length){
    h += `<div class="detail-section">
      <div class="detail-label">Classical Commentaries</div>
      <div class="commentaries-wrap">`;
    present.forEach(c => {
      h += `<div class="detail-commentary">
        <div class="com-name">${c.name}</div>
        <div class="com-text">${safeHtml(d[c.key])}</div>
      </div>`;
    });
    h += `</div></div>`;
  }
  h += `</div>`;
  return h;
}

function renderLeaf(l, color){
  const id = 'l' + Math.random().toString(36).slice(2,8);
  const hasDet = !!l.det;
  const expandHint = hasDet
    ? `<div class="lf-expand">&#9654; tap for commentaries</div>`
    : '';
  const onclick = hasDet ? `onclick="toggleDetail('${id}',event)"` : '';
  return `<div class="leaf" ${onclick}>
    <div class="lf-dot" style="background:${color}"></div>
    <div class="leaf-content">
      <div>
        <span class="lf-name">${l.n}</span>
        <span class="lf-ref">${l.r}</span>
      </div>
      <div class="lf-desc">${l.d}</div>
      ${expandHint}
      ${hasDet ? renderDetail(l.det, color, id) : ''}
    </div>
  </div>`;
}

function renderBranch(b, i){
  const id = 'b' + i + '_' + Math.random().toString(36).slice(2,6);
  let body = '';
  if(b.sub){
    b.sub.forEach(s => {
      body += `<div class="sub-tree">`;
      if(s.label) body += `<div class="sub-label">${s.label}</div>`;
      s.children.forEach(c => { body += renderLeaf(c, b.color); });
      body += `</div>`;
    });
  }
  if(b.children){ b.children.forEach(c => { body += renderLeaf(c, b.color); }); }
  return `<div class="branch">
    <div class="branch-head" id="bh${id}" onclick="toggleBranch('bb${id}',this)">
      <div class="dot" style="background:${b.color}"></div>
      <div class="label">${b.name}</div>
      <div class="ref">${b.ref||''}</div>
      <div class="chev">&#9654;</div>
    </div>
    <div class="branch-body" id="bb${id}">${body}</div>
  </div>`;
}

function renderPada(idx){
  const p = data[idx];
  document.querySelectorAll('.section-bar button').forEach((b,i) => {
    b.classList.toggle('active', i === idx);
  });
  let h = '';
  h += `<div class="pada-title">${p.pada}</div>`;
  h += `<div class="pada-sub">${p.sub}</div>`;
  if(p.intro){
    h += `<div class="intro-card">${p.intro}</div>`;
  }
  h += `<div class="tree">`;
  p.branches.forEach((b,i) => { h += renderBranch(b, i); });
  h += `</div>`;
  document.getElementById('content').innerHTML = h;
}

function toggleBranch(id, el){
  const body = document.getElementById(id);
  const open = body.classList.toggle('open');
  el.classList.toggle('open', open);
}

function toggleDetail(id, ev){
  ev.stopPropagation();
  const panel = document.getElementById('d' + id);
  if(panel){ panel.classList.toggle('open'); }
}

// ── Init ─────────────────────────────────────────────────
const legend = [
  {color:C.purple, label:'Philosophy / Metaphysics'},
  {color:C.teal,   label:'Practice / Limbs'},
  {color:C.coral,  label:'Kriyā / Action'},
  {color:C.red,    label:'Afflictions / Obstacles'},
  {color:C.blue,   label:'Samādhi / Inner Limbs'},
  {color:C.amber,  label:'Siddhis / Powers'},
  {color:C.green,  label:'Liberation / Goal'},
  {color:C.gray,   label:'Karma'}
];

let html = `<div class="legend">`;
legend.forEach(l => {
  html += `<span><div class="ld" style="background:${l.color}"></div>${l.label}</span>`;
});
html += `</div>`;

html += `<div class="section-bar">`;
data.forEach((p, i) => {
  const parts = p.pada.split(' ');
  html += `<button ${i===0?'class="active"':''} onclick="renderPada(${i})">${parts[0]}<br>${parts[1]||''}</button>`;
});
html += `</div>`;

html += `<div id="content"></div>`;

document.getElementById('app').innerHTML = html;
renderPada(0);
</script>
</body>
</html>
