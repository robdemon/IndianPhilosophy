c:"<em>Nirodha-pariṇāma</em>: the transformation of citta in which the saṃskāra of vyutthāna (active outward state) is overcome by the rising saṃskāra of nirodha. Citta is colored momentarily by the dawning saṃskāra of cessation. This is the first of three pariṇāmas describing the gradual coming-to-rest of mind.",
ex:"In meditation, the busy mind subsides not all at once but in moments — a flash of stillness, then activity again, then a longer flash. Each flash of stillness is a moment of nirodha-pariṇāma; over time these moments grow.",
v:"Vyāsa: vyutthāna and nirodha are alternating moments of mind; nirodha-pariṇāma is the transformation by which moments of nirodha increase in frequency and duration. The yogi cultivates this by repeatedly returning to the practice.",
vm:"Vācaspati: this is the foundational transformation; without it, samādhi cannot stabilize. It is the gradual replacement of outward moments by stilling moments."
}},
{n:"Samādhi-pariṇāma",d:"One-pointed flow replaces scattered activity",r:"3.11",
det:{
c:"<em>Samādhi-pariṇāma</em>: the transformation in which the citta's all-pointedness (sarvārthatā) declines and one-pointedness (ekāgratā) arises. The citta no longer scatters across many objects; it tends naturally toward unity.",
ex:"Beyond the moment-by-moment alternation of nirodha-pariṇāma, here the very <em>tendency</em> of mind shifts — from a habitual scatter to a habitual gathering. Over weeks and months of sustained practice, this becomes one's default mental mode.",
v:"Vyāsa: this is the transformation that makes samādhi a stable property of citta rather than an isolated event. The mind acquires the disposition (saṃskāra) of one-pointedness.",
vb:"Vijñānabhikṣu: this transformation is the goal of dhāraṇā and dhyāna; once established, samādhi flows naturally without elaborate setup."
}},
{n:"Ekāgratā-pariṇāma",d:"Identical pratyayas arise and subside — steady single-pointedness",r:"3.12",
det:{
c:"<em>Ekāgratā-pariṇāma</em>: the transformation in which the rising pratyaya (cognition) and the subsiding pratyaya are identical (tulya), giving an unbroken single-pointedness. Each cognition that arises is the same as the one that just subsided; the flow is uninterrupted same-ness.",
ex:"In stable samādhi, the cognition of the chosen object continues moment by moment as the same cognition — like a steady flame fed by an unbroken oil supply. There is succession (it is not a frozen state) but the content is unchanging.",
v:"Vyāsa: this is the proper functioning of the citta in samādhi. Time still flows, cognition still arises and subsides, but the content remains the same — yielding the experience of unbroken absorption.",
vm:"Vācaspati: this clarifies that samādhi is not the cessation of mental movement absolutely, but movement reduced to identical succession — like a torch waved in a circle producing the appearance of a stationary ring."
}},
{n:"Dharma, lakṣaṇa, avasthā",d:"Property, character, and condition transformations of elements and senses",r:"3.13",
det:{
c:"By extension to all things: the same threefold pariṇāma (dharma, lakṣaṇa, avasthā — property, character/time, condition) applies to bhūtas (elements) and indriyas (senses). Every transformation is a change of property (a thing acquires a new property and loses an old one), of character (its time-mode shifts from future to present to past), or of condition (its present-state intensity varies).",
ex:"Clay becomes a pot: dharma-pariṇāma (form changes from lump to pot). The pot is now present rather than future: lakṣaṇa-pariṇāma. The pot is new vs. old vs. broken: avasthā-pariṇāma. All change in nature is some combination of these three.",
v:"Vyāsa elaborates: this analysis applies universally — to elements, senses, mind, and even to the saṃskāras of the yogi. It is the Sāṃkhya-Yoga theory of change, foundational to understanding pariṇāma in any context.",
vb:"Vijñānabhikṣu: this analytic of change underlies the entire siddhi-section that follows; powers arise by saṃyama on different aspects of these transformations."
}}
]},
{name:"Siddhis (powers via saṃyama)",ref:"3.16–3.49",color:C.amber,children:[
{n:"On pariṇāma-traya",d:"Knowledge of past and future",r:"3.16",
det:{
c:"By saṃyama on the three pariṇāmas (dharma, lakṣaṇa, avasthā) of any object, the yogi gains knowledge of its past and future. Since past and future are aspects of the lakṣaṇa-pariṇāma, perceiving the threefold transformation directly opens to the temporal extension of the object.",
ex:"Saṃyama on a tree's threefold transformation reveals what it was (sapling, sprout, seed) and what it will be (decay, fall, dust). The same applied to events, persons, civilizations gives prediction and retrocognition.",
v:"Vyāsa: past and future exist in their own form within the dharma — they are not absolute non-being. Yogic perception, free from the limitations of ordinary cognition, can directly contact them.",
vm:"Vācaspati: this is the yogic basis of the prophetic and historical knowledge attributed to great rishis."
}},
{n:"On śabda / artha / pratyaya",d:"Knowledge of all languages and sounds of creatures",r:"3.17",
det:{
c:"By saṃyama on the distinct separation (vibhāga) of word (śabda), object (artha), and idea (pratyaya) — which are normally confused as one — the yogi gains knowledge of the cries of all beings. Ordinary cognition mixes the three; the yogi separates them and so understands meaning in any vehicle of expression.",
ex:"A bird's call, a cow's lowing, a foreign tongue: where ordinary hearers grasp only sound, the yogi separates the sound from the meaning-intention (artha) and the cognition (pratyaya), and so understands the communication.",
v:"Vyāsa explains the linguistic philosophy at length: śabda is the vibration; artha is the referent; pratyaya is the cognition produced. The conflation of the three (called <em>saṃkara</em>) is what makes language puzzling. The yogi resolves the conflation by saṃyama.",
vb:"Vijñānabhikṣu: this siddhi underlies the legendary capacity of certain sages to converse with animals and to understand languages they had never learned."
}},
{n:"On saṃskāras",d:"Knowledge of previous births",r:"3.18",
det:{
c:"By saṃyama on saṃskāras (latent impressions in citta), the yogi gains knowledge of his previous births. Saṃskāras carry the deposits of all past experience, life after life; reading them directly opens the past.",
ex:"The yogi turns saṃyama on the deep deposits of his own citta and reads, as in an ancient library, the records of who he has been across many births.",
v:"Vyāsa: saṃskāras are of two kinds — those producing memory and those producing kleśa-vāsanā. Both can be read; together they yield full knowledge of the past life-sequence.",
vm:"Vācaspati: this knowledge serves the yogi by intensifying vairāgya — seeing the long, repetitive pattern of births strengthens the resolve to end the sequence."
}},
{n:"On pratyaya of another",d:"Knowledge of another's mind",r:"3.19",
det:{
c:"By saṃyama on the pratyaya (cognition) of another, the yogi gains knowledge of that other's mind. The yogi reads not the body language nor the words, but the inner cognition itself — what the other is actually thinking.",
ex:"The teacher who answers the disciple's unspoken question; the sage who knows the visitor's secret intention before he speaks. This is parā-citta-jñāna, knowledge of another's mind.",
v:"Vyāsa adds (3.20) that this gives knowledge of the cognition's content but not of the cognition's basis (ālambana) — that requires further saṃyama on the basis itself.",
vb:"Vijñānabhikṣu: this is one of the more famous siddhis; it explains the apparent telepathy of advanced yogis but is described as a specific outcome of a specific saṃyama, not a vague gift."
}},
{n:"On kāya-rūpa",d:"Invisibility — body form unseen",r:"3.21",
det:{
c:"By saṃyama on the body's form (rūpa) and on the suspension of its grasping power by another's eye, the yogi disconnects the perceiver from the perceived light. The body is present, but the conditions for its perception are blocked. The yogi becomes invisible.",
ex:"Light reflects off the body and meets the eye, producing perception. Saṃyama suspends this transmission. The yogi is not bodyless but unperceived — a yogic stealth.",
v:"Vyāsa: similarly (by extension) the yogi can become inaudible by suspending sound-transmission, untouchable by suspending touch-transmission, and so on. The principle is severance of the contact between sense-faculty and its object.",
vm:"Vācaspati: this is one of the more dramatic siddhis; tradition describes its use by yogis seeking to avoid disturbance from worldly attention."
}},
{n:"On sūrya (sun)",d:"Knowledge of the cosmic regions",r:"3.26",
det:{
c:"By saṃyama on the sun (sūrya), the yogi gains knowledge of all the cosmic regions (bhuvana-jñānam). The sun, as the central cosmic principle of light and life, is the gateway to knowledge of all the lokas — physical, subtle, and divine — described in traditional cosmology.",
ex:"In yogic cosmology, the sun is not merely a physical object but the focal point through which the structure of all worlds is intelligible. Saṃyama on it opens the entire map.",
v:"Vyāsa elaborates the seven lokas (bhū, bhuvar, svar, mahar, jana, tapas, satya) and the seven nether regions (atala through pātāla), all knowable through this saṃyama. The cosmology is detailed and traditional.",
vb:"Vijñānabhikṣu: the saṃyama can be on the physical sun (giving knowledge of physical worlds) or on the inner sun at the suṣumṇā (giving knowledge of subtle worlds)."
}},
{n:"On candra (moon)",d:"Knowledge of the arrangement of stars",r:"3.27",
det:{
c:"By saṃyama on the moon (candra), the yogi gains knowledge of the arrangement of the stars (tārā-vyūha). The moon, in its monthly traverse, marks the lunar mansions (nakṣatras); saṃyama on it opens knowledge of the stellar geography.",
ex:"The yogic astronomer (jyotiṣī) knows the heavens not from telescope but from inner perception developed by this saṃyama. The traditional jyotiṣa system has yogic roots.",
v:"Vyāsa: this is the basis of yogic astronomy; combined with saṃyama on dhruva (the pole star, 3.28), it gives knowledge of stellar motion and the cosmic clock.",
vm:"Vācaspati: the moon is also the inner principle of the manas; saṃyama on it has both outer (cosmic) and inner (psychological) fruits."
}},
{n:"On nābhi-cakra (navel)",d:"Knowledge of body's organization",r:"3.29",
det:{
c:"By saṃyama on the navel-cakra, the yogi gains knowledge of the body's organization (kāya-vyūha-jñānam). The navel is the metabolic center; from it the entire structure of the body — gross organs, subtle nāḍīs, vital fires — becomes intelligible.",
ex:"This is the basis of yogic anatomy: not dissection but inner perception of the body's functional architecture, the network of channels (72,000 nāḍīs) and centers (cakras).",
v:"Vyāsa lists the components of the body that become known: the seven dhātus (skin, blood, flesh, fat, bone, marrow, semen), the major organs, the network of channels.",
vb:"Vijñānabhikṣu: this saṃyama is the basis of yogic medicine and of the haṭha-yoga later developed by the Nāth tradition."
}},
{n:"On kaṇṭha-kūpa (throat)",d:"Cessation of hunger and thirst",r:"3.30",
det:{
c:"By saṃyama on the pit of the throat (kaṇṭha-kūpa), the yogi gains cessation of hunger and thirst. The throat is the gateway of food and water; saṃyama on it disconnects the chain of craving for sustenance.",
ex:"Yogis in long meditation can sustain themselves with little or no food and water — a phenomenon documented in tradition. This sūtra gives the technique: not suppression but a specific saṃyama.",
v:"Vyāsa: hunger and thirst are not merely physiological but rooted in the citta's attention to the throat-region. Withdrawing that attention severs the experience.",
vm:"Vācaspati: this is one of the more useful siddhis for the renunciate, freeing him from constant attention to food."
}},
{n:"On hṛdaya (heart)",d:"Knowledge of the mind (citta)",r:"3.34",
det:{
c:"By saṃyama on the heart (hṛdaya), the yogi gains knowledge of citta itself. The heart is the seat of citta; saṃyama on it reveals the mind's own structure, content, and tendencies.",
ex:"The yogi turns saṃyama inward on its own seat: what arises is direct knowledge of citta — its qualities, its saṃskāras, the play of guṇas within it. This is the basis of self-knowledge in the technical yogic sense.",
v:"Vyāsa: the heart-lotus is the primary seat of citta; the brahma-pura (city of brahman) of the Upaniṣads. Saṃyama here is one of the most fertile of all the saṃyamas.",
vb:"Vijñānabhikṣu: this saṃyama is the practical basis of self-inquiry within the yoga system; it is the means by which the yogi gains intimate knowledge of his own inner instrument."
}},
{n:"On prātibha (intuitive light)",d:"Knowledge of everything",r:"3.36",
det:{
c:"<em>Prātibha</em> is the spontaneous luminous insight that arises before the dawn of viveka-khyāti — like dawn light before sunrise. From it (or by saṃyama on it) arises knowledge of subtle, distant, hidden objects (3.25) and ultimately, in its highest form, knowledge of everything (sarva-jñātṛtva).",
ex:"As insight ripens in the advanced yogi, occasional flashes of comprehensive knowing arise — the answer to a problem comes whole, the situation of distant friends is suddenly known, the next event of the world is foreseen. These are prātibha.",
v:"Vyāsa: prātibha-jñāna is the immediate cognition that bypasses inference, perception, and testimony; it is the budding of pure prajñā that will fully bloom in viveka-khyāti.",
vm:"Vācaspati: when prātibha matures, it becomes itself an obstacle — for the yogi may rest in this attractive faculty rather than press on to kaivalya."
}},
{n:"Warning",d:"These are accomplishments but obstacles to samādhi",r:"3.38",
det:{
c:"Patañjali's stern warning (3.38): <em>te samādhāv upasargā vyutthāne siddhayaḥ</em> — these (siddhis) are obstacles in samādhi though accomplishments in the outward state. From the perspective of one engaged in worldly life, siddhis are powers; from the perspective of one seeking kaivalya, they are distractions that catch the mind and arrest its progress.",
ex:"A pilgrim on the way to a great mountain finds a fertile valley with all amenities. He could stop and live well there — but the mountain remains unreached. Siddhis are such valleys: pleasant, even spectacular, but not the destination.",
v:"Vyāsa: siddhis arise as side-effects of advanced practice; the wise yogi recognizes them as such and does not pursue them as goals. The yogi who pursues them stops at the level that produces them.",
vb:"Vijñānabhikṣu: this is the central ethical instruction of the chapter — Patañjali catalogs siddhis honestly so that the yogi will recognize them when they arise, but warns that they are not the path's culmination."
}}
]},
{name:"Higher attainments",ref:"3.50–3.56",color:C.green,children:[
{n:"Vairāgya from siddhis",d:"Non-attachment even to mastery destroys the seed of bondage",r:"3.50",
det:{
c:"<em>Tad-vairāgyād api doṣa-bīja-kṣaye kaivalyam</em>: by vairāgya even from those (the highest siddhis described in 3.49 — mastery over all states of being and omniscience) — when even the seed of defect is destroyed — kaivalya results. Even the supreme yogic powers must be released; clinging to them perpetuates the seed of bondage.",
ex:"The yogi who has mastered the elements and all knowing — supreme states by ordinary measure — recognizes that even these are products of prakṛti and not the seer. Releasing attachment to them, he passes to kaivalya.",
v:"Vyāsa: as long as any vāsanā remains, even toward exalted states, the seed of saṃsāra remains. Vairāgya from siddhis is the final purification before kaivalya.",
vm:"Vācaspati: this is para-vairāgya in operation at the highest level — desirelessness even of the most exalted attainments."
}},
{n:"Kaivalya approach",d:"Discriminative knowledge of puruṣa and sattva",r:"3.55",
det:{
c:"<em>Tāraka</em> is the highest discriminative knowledge — that which carries one across (tarati). It comprises everything in every way (sarva-viṣayam sarvathā-viṣayam) and is non-sequential (akrama-jam) — knowing all at once rather than object by object. This jñāna is the immediate forerunner of kaivalya.",
ex:"Where ordinary knowledge is partial and sequential ('first this, then that'), tāraka-jñāna is total and instantaneous — comprehending all objects of all categories at once. It is the cognitive aspect of viveka-khyāti at its full ripeness.",
v:"Vyāsa: this prajñā arises only at the highest stage; it is the boat that crosses the ocean of saṃsāra. From it kaivalya follows immediately.",
vb:"Vijñānabhikṣu: tāraka is the same as the jñāna that destroys kleśas in 4.30; the third and fourth chapters describe the same culmination from different angles."
}},
{n:"Sattva-puruṣayoḥ śuddhi-sāmye kaivalyam",d:"Liberation when sattva and puruṣa are equally pure",r:"3.56",
det:{
c:"<em>Sattva-puruṣayoḥ śuddhi-sāmye kaivalyam</em>: when sattva (the highest, purest mode of buddhi) and puruṣa become equal in purity, kaivalya results. Buddhi-sattva, refined to its utmost transparency, no longer distorts puruṣa's reflection — and the yogi knows the seer purely as itself, distinct from even the most refined buddhi.",
ex:"A perfectly polished mirror reflects without distortion. When buddhi-sattva is so polished, puruṣa is no longer mistaken for it; the discrimination is permanent; the apparent saṃyoga ends.",
v:"Vyāsa: this is the technical statement of kaivalya from the side of buddhi: when buddhi-sattva matches puruṣa in purity, their distinction becomes evident, and the misperception ends. Chapter 3 closes here; chapter 4 elaborates kaivalya itself.",
vm:"Vācaspati: equal purity does not mean buddhi becomes puruṣa — it means buddhi no longer obscures puruṣa. The two remain distinct; their purity, hitherto unequal, is now equalized."
}}
]}
]},
{pada:"Kaivalya Pāda",sub:"Chapter 4 · 34 sūtras · Liberation and the nature of consciousness",ref:"YS 4.1–4.34",
intro:"The fourth and final chapter is philosophical: Patañjali examines the nature of mind, the ontology of objects, the persistence of saṃskāras across lives, and the precise meaning of liberation. He defends the yoga doctrine of independent puruṣas against rivals (Vijñānavāda Buddhism in particular) and culminates in dharma-megha samādhi — the 'cloud of dharma' — and the final establishment of the seer in its own nature.",
branches:[
{name:"Sources of siddhis",ref:"4.1",color:C.amber,children:[
{n:"Janma (birth)",d:"Innate powers from previous lives",r:"4.1",
det:{
c:"Patañjali opens chapter 4 by listing five sources from which siddhis can arise — to forestall the misunderstanding that yoga is the only source. <em>Janma</em>: some beings are born with siddhis already developed, the fruit of intense practice in previous lives. Such siddhis appear without apparent effort in this life.",
ex:"Children who display extraordinary capacity from infancy — savants, prodigies, those with apparent past-life knowledge — are exhibiting janma-siddhis. The traditional examples include great yogis born with supernatural abilities.",
v:"Vyāsa: such beings, by the karma of past tapas, take birth in a body and lineage where their previous attainments manifest spontaneously. The siddhis are real but not freshly earned in this life.",
vm:"Vācaspati: this explains the apparent injustice that some beings effortlessly possess what others struggle for — the difference is past karma, not capricious gift."
}},
{n:"Oṣadhi (herbs)",d:"Plant-based substances",r:"4.1",
det:{
c:"<em>Oṣadhi</em> — herbs and substances — can also produce siddhis. Certain plants, minerals, and prepared substances can induce altered states, extended faculties, or specific powers. Patañjali catalogs the source without endorsing it as superior.",
ex:"The soma of the Vedas, the rasa of alchemical traditions, certain meditative herbs — all are oṣadhi-siddhis. The traditions warn that such siddhis are temporary and dependent on continued use of the substance.",
v:"Vyāsa: oṣadhi-siddhis arise in the houses of the asuras and certain mountain regions where particular substances grow. They are powerful but external — dependent on a continuing physical cause.",
vb:"Vijñānabhikṣu: these are the lowest of the five sources because they bring dependence; they should not be sought by the serious yogi."
}},
{n:"Mantra",d:"Sacred syllables",r:"4.1",
det:{
c:"<em>Mantra</em> — sacred sound-formulas — can produce siddhis when properly received from a qualified teacher and practiced according to specification. The mantra carries a specific power; correct application releases it.",
ex:"Specific mantras associated with particular deities are said to confer their characteristic powers — protection, eloquence, healing, vision. The tradition is highly regulated; mantras taken without lineage are considered ineffective or harmful.",
v:"Vyāsa: mantra-siddhis follow correct repetition (japa) with appropriate disposition; they are well attested in the Vedic and Tantric traditions.",
vm:"Vācaspati: mantras work because the sound-form is the natural designator of the corresponding power; the relation is not arbitrary."
}},
{n:"Tapas (austerity)",d:"Ascetic practices",r:"4.1",
det:{
c:"<em>Tapas</em> — sustained austerity — produces siddhis through the heat it generates. The tapasvī, by enduring extremes (heat, cold, fast, silence), purifies the body-mind and accumulates a kind of stored potency that manifests as power.",
ex:"The traditional ascetics of India undertook tapas of remarkable severity and were credited with corresponding powers. Patañjali acknowledges this as a real source while noting it is not the supreme one.",
v:"Vyāsa: tapas-siddhis are well attested in the Purāṇic literature — the rishis whose curses came true, the sages whose blessings produced kingdoms.",
vb:"Vijñānabhikṣu: tapas alone, without samādhi, produces siddhis but not liberation; this is why Patañjali distinguishes the two."
}},
{n:"Samādhi",d:"Meditative absorption — the highest source",r:"4.1",
det:{
c:"<em>Samādhi</em> is the supreme source of siddhis — and uniquely, it leads also to kaivalya. The siddhis of samādhi are not isolated powers but expressions of the yogi's penetration into the structure of reality. Listed last but ranked first.",
ex:"Where janma-siddhi is inherited, oṣadhi-siddhi is purchased, mantra-siddhi is borrowed, and tapas-siddhi is forced — samādhi-siddhi is grown from the very root of one's being. It alone integrates with the path to liberation.",
v:"Vyāsa: of all five sources, only samādhi continues to produce both siddhis and the higher fruit of kaivalya. The others give powers but not the final freedom.",
vm:"Vācaspati: this list is given to clarify and rank — Patañjali does not deny the lower sources but establishes samādhi as the path that includes everything."
}}
]},
{name:"Karma theory (expanded)",ref:"4.7–4.12",color:C.gray,children:[
{n:"Karma-aśukla-akṛṣṇam",d:"Yogi's karma is neither white nor black — beyond duality",r:"4.7",
det:{
c:"<em>Karmāśuklākṛṣṇaṃ yoginas trividham itareṣām</em>: the yogi's karma is neither white nor black; for others it is threefold (white, black, mixed). The yogi acts but the action does not deposit binding saṃskāras because it is free of kleśas; ordinary action, driven by attachment or aversion, deposits puṇya, pāpa, or both.",
ex:"The yogi performs his duties — eating, teaching, walking, breathing — but no 'mine' attaches; no fruit is grasped; no saṃskāra of doership is deposited. The same act in an ordinary person would mark the karmāśaya; in the yogi, it leaves no trace.",
v:"Vyāsa: white karma comes from acts like service, charity, study; black from harm, lying, theft; mixed from worldly action that combines benefit and harm. The yogi's action stands outside this triple — it is colorless because no kleśa colors it.",
vb:"Vijñānabhikṣu: this echoes the Bhagavad Gītā's teaching of niṣkāma karma; the same insight in different vocabulary."
}},
{n:"Vāsanā",d:"Latent impressions manifest only in matching conditions",r:"4.8",
det:{
c:"<em>Tatas tad-vipāka-anuguṇānām eva-abhivyaktir vāsanānām</em>: from those (the threefold karmas) only the vāsanās appropriate to the resulting birth manifest. The vast storehouse of vāsanās accumulated across many lives is selectively activated — only those compatible with the present birth's circumstances come forward; the rest remain latent.",
ex:"Born as a human in a particular culture, only vāsanās compatible with this body, mind, and environment manifest. The vāsanās of past animal lives lie dormant; the vāsanās of incompatible cultures sleep. Each birth is a specific filtering of the total karmic inheritance.",
v:"Vyāsa: even though vāsanās are countless and accumulated over endless past, only the matching ones bear fruit in any given life. The yogi can know any vāsanā by saṃyama (3.18) but only the matching ones operate.",
vm:"Vācaspati: this explains the apparent inconsistency between the doctrine of karma's totality and the limited character of any actual life — the totality remains, but only a subset is active."
}},
{n:"Smṛti-saṃskāra continuity",d:"Memory and impressions are beginningless — persist across births",r:"4.9–10",
det:{
c:"Memory (smṛti) and the saṃskāras (saṃskāra) producing it have a single form (rūpa) despite separation by birth, place, time. The continuity is unbroken: a saṃskāra deposited a thousand lives ago can produce a memory in the present life when its conditions ripen. And these saṃskāras have no beginning (anāditvam) — for the will-to-live (āśīs) underlying them is itself eternal.",
ex:"A child's spontaneous fear of fire, with no learned cause; a sudden inexplicable affinity for a particular language or place — these are smṛti-saṃskāras from past lives surfacing in this one. The thread is unbroken even when consciously forgotten.",
v:"Vyāsa: this is the yoga proof that saṃsāra is beginningless. Saṃskāras have always existed; they have no first origin in time. Their end is achievable (in kaivalya), but their beginning is not findable.",
vb:"Vijñānabhikṣu: this argument refutes the Buddhist position that saṃskāras are momentary; here they have continuity across lives, providing the substrate of identity over time."
}},
{n:"Past-future existence",d:"Past and future exist in their own form within dharmas",r:"4.12",
det:{
c:"<em>Atīta-anāgataṃ svarūpato'sty adhva-bhedād dharmāṇām</em>: past and future exist in their own form (svarūpa); they are not absolute non-being. The difference is only in adhva — the path or condition (the time-mode) of the dharmas. Patañjali defends a realist view of time against momentarist or illusionist alternatives.",
ex:"The seed exists before the sprout (as future); the seed exists after the plant (as past, in the form of dust and continued lineage). Different time-modes; same underlying reality. Past and future are not nothing — they are present in different conditions.",
v:"Vyāsa: this is the yoga answer to the question 'do past and future exist?' Yes — but in different conditions. The present is the manifest condition; past and future are unmanifest but real conditions of the same dharmas.",
vm:"Vācaspati: this realism about time grounds the possibility of yogic knowledge of past and future (3.16) — were they utterly non-being, no knowledge of them would be possible."
}}
]},
{name:"Nature of mind and objects",ref:"4.15–4.24",color:C.purple,children:[
{n:"Objects are independent of mind",d:"The same object is perceived differently by different minds",r:"4.15",
det:{
c:"<em>Vastu-sāmye citta-bhedāt tayor vibhaktaḥ panthāḥ</em>: while the object is the same, minds differ; therefore the paths of the two (mind and object) are distinct. Patañjali defends the realist position: objects exist independently of any particular mind. If they were mind-projections, all minds would perceive them identically — but minds differ, and the same object appears differently to each.",
ex:"A piece of music: the trained musician hears structure; the casual listener hears mood; the bored child hears noise. The music is the same; the minds differ. The realist conclusion: the music has its own being independent of any of these perceptions.",
v:"Vyāsa: Patañjali here refutes the Vijñānavāda Buddhist position that objects are nothing but mental projection. If objects were merely citta-projections, then when one citta is in nirodha (no projection), the world should disappear for that yogi — but it does not.",
vm:"Vācaspati elaborates this refutation extensively, arguing that the realist position is required to explain shared experience and inter-subjective agreement."
}},
{n:"Citta is not self-luminous",d:"Mind is known by another — puruṣa",r:"4.19",
det:{
c:"<em>Na tat svābhāsam dṛśyatvāt</em>: citta is not self-luminous, because it is itself an object (dṛśya) — that is, it is something seen, something witnessed. What is seen requires a seer; the citta cannot be both seen and seer simultaneously. Therefore puruṣa, the eternal seer, is required.",
ex:"The lamp illuminates the room and is itself seen by its own light. But the citta is not such a lamp — it is the medium by which objects are known, but it does not illuminate itself; it is illuminated by puruṣa, who never himself becomes an object.",
v:"Vyāsa: this is a crucial argument against Vijñānavāda. If citta were self-luminous, it would not need puruṣa; but the very fact that we know our own mind (we say 'I noticed my anger') shows the mind is known by something other — by the seer.",
vb:"Vijñānabhikṣu: this argument is the cornerstone of yoga's dualism: puruṣa and prakṛti (including its highest evolute, citta) must remain distinct because the relation of seer-and-seen requires their distinctness."
}},
{n:"Mind cannot know itself",d:"This would require infinite regress or memory confusion",r:"4.21",
det:{
c:"<em>Cittāntara-dṛśye buddhi-buddher atiprasaṅgaḥ smṛti-saṅkaraś ca</em>: if one citta were known by another citta, infinite regress (atiprasaṅga) would result, and memories would be confused (saṅkara). For citta-A to know itself would require citta-B to know citta-A; then citta-B would require citta-C; and so on without end. And memories would jumble across these layered cittas. Hence the only escape is to posit puruṣa — pure consciousness that knows without itself being known by another.",
ex:"You cannot lift yourself by your own bootstraps. The mind cannot witness itself without an external witness. Either you accept an infinite regress (untenable) or you accept a self-luminous principle outside the chain (puruṣa). Patañjali takes the second.",
v:"Vyāsa: this argument is decisive against the Buddhist sva-saṃvedana doctrine (that consciousness witnesses itself). The yoga insists on a fundamental subject-object structure that puruṣa alone resolves.",
vm:"Vācaspati develops this into a full philosophical defense of yoga dualism against monistic alternatives."
}},
{n:"Citta serves puruṣa",d:"Mind, colored by seer and seen, serves the purpose of puruṣa",r:"4.24",
det:{
c:"<em>Tad asaṅkhyeya-vāsanābhiś citram api parārthaṃ saṃhatya-kāritvāt</em>: although citta is variegated by countless vāsanās, it acts for another's purpose — for it acts in combination (saṃhatya). Whatever acts in combination acts for the sake of something other than itself (the parts of a chariot serve the rider, not themselves). Citta with all its vāsanās exists for puruṣa's sake — to bring puruṣa's recognition of its own nature, hence kaivalya.",
ex:"The eyes do not see for themselves; they see for the seer. The mind, however complex its vāsanās, ultimately serves puruṣa — providing experience that culminates in puruṣa's recognition of its distinction from prakṛti. This is the teleology of yoga.",
v:"Vyāsa: even the most variegated citta of an ordinary person is serving puruṣa, however unwittingly. Saṃsāra itself is puruṣa's instrument for self-recognition; kaivalya is the goal of even the most apparently lost being.",
vb:"Vijñānabhikṣu: this is the yogic theodicy — the existence of suffering and bondage is for the sake of liberation; prakṛti's whole evolution serves puruṣa's eventual freedom."
}}
]},
{name:"Path to kaivalya",ref:"4.25–4.34",color:C.teal,children:[
{n:"Viveka-nimnaṃ",d:"Mind inclines toward discrimination — flows toward kaivalya",r:"4.26",
det:{
c:"<em>Tadā viveka-nimnaṃ kaivalya-prāgbhāraṃ cittam</em>: when (the distinction of seer from seen is grasped, 4.25), citta inclines toward discrimination (viveka-nimnam) — its current flows downward toward kaivalya (kaivalya-prāgbhāraṃ). Where before the citta flowed outward toward objects, now its very gradient is reversed: it flows naturally toward the discriminative knowledge that is the gateway to liberation.",
ex:"A river that previously flowed east now flows west — the same water, but a fundamental reorientation. The advanced yogi finds that the mind no longer needs to be pushed toward discrimination; it goes there of itself, as water seeks the lowest point.",
v:"Vyāsa: just as water flows naturally to the low place, the citta of the discerning yogi flows naturally to viveka. This is the inflection point of the path; from here, kaivalya is no longer uphill.",
vm:"Vācaspati: this slope toward kaivalya is the natural fruit of all the prior practice; the yogi must now only protect the slope from new obstructions (the next sūtra)."
}},
{n:"Tac-chidreṣu pratyaya-antarāṇi saṃskārebhyaḥ",d:"In gaps of discrimination, other pratyayas arise from saṃskāras",r:"4.27",
det:{
c:"<em>Tac-chidreṣu pratyaya-antarāṇi saṃskārebhyaḥ</em>: in the gaps of viveka, other cognitions arise from saṃskāras. Even in this advanced state, when discrimination wavers for a moment, latent saṃskāras can sprout into thoughts — 'I am,' 'this is mine,' 'I want.' These are remnants from the long history of bondage that have not yet been burnt.",
ex:"The yogi, established in viveka for hours, has a momentary lapse — a flash of self-reference, a brief desire. This is not failure but the inevitable manifestation of remaining saṃskāras until they too are dissolved.",
v:"Vyāsa: even on the threshold of kaivalya, old saṃskāras may sprout in the gaps. The yogi must continue to weed them out by continued vairāgya and viveka until none remain.",
vb:"Vijñānabhikṣu: this sūtra prevents premature claims of liberation — until saṃskāras are wholly dissolved, the slope toward kaivalya is real but the journey is not yet complete."
}},
{n:"Hānam eṣāṃ kleśavat",d:"Their removal is like removal of kleśas",r:"4.28",
det:{
c:"<em>Hānam eṣāṃ kleśavad uktam</em>: the removal of these (remaining cognitions from saṃskāras) is described as similar to the removal of kleśas. As the kleśas are dissolved by viveka and the burning of seeds, so these residual pratyayas yield to the same method. The technique is consistent: viveka illuminates, vairāgya releases, and the seeds are progressively burnt.",
ex:"The same method that worked at the gross level continues to work at the subtle level. There is no new technique for the final stretch; only the same viveka, applied with continued steadiness to ever-finer remnants.",
v:"Vyāsa: as in 2.10–11, where kleśas in subtle form are dissolved by their resorption into prakṛti, so here the residual pratyayas are dissolved by the same fundamental method.",
vm:"Vācaspati: this consistency simplifies the final stages — no new doctrine is required, only the patient continuation of what has already been working."
}},
{n:"Dharma-megha samādhi",d:"'Cloud of dharma' samādhi — highest realization, when even interest in discrimination ceases",r:"4.29",
det:{
c:"<em>Prasaṅkhyāne'py akusīdasya sarvathā viveka-khyāter dharma-meghaḥ samādhiḥ</em>: for one who has no interest even in the highest discrimination (prasaṅkhyāna) — for one whose viveka-khyāti is complete in every way — there arises <em>dharma-megha samādhi</em>, the 'cloud of dharma.' The metaphor is rich: like a cloud raining liberation, this samādhi pours forth the dharma of supreme freedom.",
ex:"The yogi has reached the point where even the desire for liberation is gone — not because he doesn't value it, but because he has nothing left to attain. From this state, dharma-megha samādhi rains down: the highest fruit of the entire path. The 'cloud' suggests both the immensity and the gentle outpouring.",
v:"Vyāsa: when the yogi is akusīda (without selfish interest, like one who refuses interest on a loan) even regarding viveka itself, the dharma-megha samādhi arises. This is the supreme samādhi — the same as nirbīja of 1.51 and the goal of the entire path.",
vb:"Vijñānabhikṣu: dharma-megha samādhi is the technical name of the ultimate samādhi; it is what 1.51, 3.55, and 4.29 each describe from different angles. From this samādhi, kaivalya immediately follows."
}},
{n:"Tataḥ kleśa-karma-nivṛttiḥ",d:"Then afflictions and karma cease entirely",r:"4.30",
det:{
c:"<em>Tataḥ kleśa-karma-nivṛttiḥ</em>: from that (dharma-megha samādhi) follows the cessation of kleśas and karma. The fivefold afflictions (avidyā, asmitā, rāga, dveṣa, abhiniveśa) and the entire karmic apparatus they fuel are extinguished at the root. Past karma may still play out (in the ongoing body), but no new karma is generated.",
ex:"A fire whose fuel supply has been cut: the existing fuel burns out, but no new fire arises. The jīvanmukta (one liberated while embodied) lives out the prārabdha karma already in motion; no future karma is being created.",
v:"Vyāsa: with kleśas destroyed, the engine of new karma has no fuel. The remaining body and its experiences continue by inertia (prārabdha) until the body falls away; with that, the cycle is wholly ended.",
vm:"Vācaspati: this is the technical statement of jīvanmukti — liberation while embodied — followed by videhamukti when the body finally falls."
}},
{n:"Puruṣārtha-śūnyānāṃ guṇānām pratiprasavaḥ",d:"Guṇas, having fulfilled their purpose, return to source",r:"4.34",
det:{
c:"<em>Puruṣārtha-śūnyānāṃ guṇānām pratiprasavaḥ</em>: the guṇas, now empty of any purpose for puruṣa (because puruṣa has been fully served), return to their source (pratiprasava). The whole evolved manifestation of prakṛti collapses back into its unmanifest cause — for this particular puruṣa. The guṇas, having staged the entire drama for puruṣa's recognition, take their bow.",
ex:"A teacher who has finished teaching, having given the student everything needed, retires. The student now stands on his own. So too the guṇas: their service complete, they return to mūla-prakṛti, and puruṣa stands forth alone.",
v:"Vyāsa: this is the dissolution of prakṛti for this puruṣa. Other beings continue their journeys; this one is free. The cosmic drama continues, but this seer has exited the stage.",
vb:"Vijñānabhikṣu: pratiprasava is the reverse of sarga (manifestation); for this liberated puruṣa, the cosmos has 'unhappened.' This is liberation in its full ontological sense."
}},
{n:"Kaivalyam — svarūpa-pratiṣṭhā",d:"Pure consciousness established in its own nature — liberation",r:"4.34",
det:{
c:"<em>Kaivalyaṃ svarūpa-pratiṣṭhā vā citi-śaktir iti</em>: kaivalya is the establishment in its own nature; or, the power of consciousness itself. Patañjali ends as he began — yoga is the seer abiding in its own nature (1.3), now realized fully and finally. The 'or' (vā) offers two equivalent definitions: standing in own nature (from puruṣa's side); pure power of consciousness (from the side of citi-śakti). Both name the same single reality.",
ex:"The journey ends where it began: the seer was always in its own nature; only avidyā made it appear otherwise. Now that appearance is gone, what is is what always was — but now <em>known</em> as it is. This is kaivalya: not a new state but the recognition of the eternal one.",
v:"Vyāsa closes his commentary with reverent silence — there is nothing more to say. The puruṣa stands as itself, free of all that was never truly other. The yoga has done its work; the seer is the seer; nothing remains to be done.",
vm:"Vācaspati: kaivalya is final, irrevocable, and absolute. There is no falling back; no new bondage; the journey is complete. The yoga sūtras themselves end here, having brought the practitioner — by understanding — to the threshold of what only practice can finally cross.",
vb:"Vijñānabhikṣu: with this sūtra, the entire teaching is sealed. Citi-śakti — the power of consciousness — was never bound; that very unbound consciousness, now recognized as such, is kaivalya. The seeker discovers that he was the sought."
}}
]}
]}
];
